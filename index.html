  .splash{ display:none }
  html[data-authed="1"] .splash{
    position:fixed;inset:0;z-index:290;
    background:var(--ink);   /* .lock 과 같은 이유 — 상태 표시줄 띠 색의 출처 */
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:13px;                    /* ★CSS 값 ≠ 보이는 값. 판 안쪽 여백(5.4)과 글꼴 위 여백(2.7)이
                                    이미 깔려 있어 여기 적는 수보다 8.1px 이 더해진다 → 보이는 21.1px.
                                    ★마크를 건드리면 판 여백이 변하니 반드시 다시 잴 것. */
    padding-bottom:var(--sbcut, 0px);   /* standalone 상태바 보정 (위 head 스크립트). 가운데 락업만
                                           그 절반만큼 올라간다 — 회사명은 absolute 라 하단 고정 유지 */
    /* padding-bottom 에는 일부러 트랜지션을 걸지 않는다 — 한때 걸어봤더니 --sbcut 이
       뒤늦게 고쳐질 때 락업이 위로 스르륵 미끄러지는 게 그대로 보여서 「로고가 올라온다」는
       새 증상이 됐다. 보정은 순간 스냅이라야 눈에 안 띈다. */
    /* 들어올 때도 페이드 — 첫 로그인(키패드)에서 잠금이 걷힌 뒤 명단이 늦으면 이 화면이 «툭» 나타났다
       (실기기 재현 2026-09-12). 바탕이 --ink 로 같아 실제로 나타나는 건 마크·이름뿐이고, 다시 열 때는
       첫 프레임부터 바탕이 깔려 있어 흰 화면이 비치지 않는다. 이미 걷힌 뒤(.out)면 to 값이 0 이라 그대로 안 보인다. */
    animation:fadeIn var(--tMove) var(--ease);
    transition:opacity var(--tMove) var(--ease);
  }
  .splash.out{opacity:0;pointer-events:none}
  /* 스플래시는 「홈화면 아이콘」이 아니라 마크만 보여준다 (카카오·네이버·KT 등 통용되는 방식).
     타일·테두리 없음 — 색은 토큰이라 두 테마에서 같은 그림이 된다. */
  /* viewBox 를 «그림에 딱» 맞췄다(19.1 19.1 61.8 61.8 = 실루엣 그대로) — 예전 14 14 72 72 는 상자에
     여백이 있어 width:100px 이라 적어도 실제로는 85px 만 보였다. 이제 적은 값이 곧 보이는 크기다.
     96px = 화면폭의 24.4%(393 기준. 375 에서 25.6 · 430 에서 22.3) — 실측한 심볼형 스플래시 대역
     (카카오 24%·초록앱 23%) 한가운데. 간격 토큰 8 의 배수. */
  /* viewBox 를 «그림에 딱» 맞춘 정사각(12.36 12.45 75.43 75.43 = 그림 + 여백 4)으로 크롭하고,
     그 안에 같은 크기의 어두운 판을 깐다. 공유 마크(#mkIksuni)에는 판이 없다 —
     잠금·서랍은 CSS 의 background 가 판 노릇을 하고, 스플래시만 여기서 제 판을 그린다.
     ★상자는 그림 bbox 가 아니라 «잉크 무게중심(x 48.88)» 에 맞춘다 — 하트가 오른쪽으로 튀어나와
     bbox 중심(50.08)에 맞추면 정작 곰이 화면 중심에서 3.5px 왼쪽으로 간다(실기기 실측 2026-09-14).
     ★크기는 «곰»으로 잰다 — 기준 대역(카카오 24%·초록앱 23%)은 부유 장식 없는 심볼을 잰 값이고,
     하트는 곁다리다. 119px → 곰 94.4px = 화면폭의 24.0% (옛 마크의 얼굴 96px 과 같은 무게).
     107 로 뒀을 땐 그림 전체를 기준 삼아 곰이 21.6% 까지 작아졌다(오너 지적 2026-09-14).
     판은 다크에선 배경과 같아 안 보이고 라이트에선 대비를 만든다 — 라이트 바탕 위 금색은 1.70:1. */
  .splashMark{ display:block;width:140px;height:auto }
  /* ── 하트 등장 ─────────────────────────────────────────────────────────────
     보이는 것 = 하트가 «곰 오른쪽 귀에서 태어나 제자리로 자란다». 원점을 귀 바깥선에
     두고 크기만 키운다 — 이동 좌표를 따로 안 써서 값이 하나뿐이다.
     원점 (79.03, 25.45) = 하트에서 가장 가까운 곰 픽셀 = 오른쪽 귀 바깥선(실측).
     이동거리는 결과적으로 23.6px — 하트 제 크기(28.6px)보다 작다(「거리를 요소 크기에
     맞춘다」는 위 등장 규칙과 같은 결).

     하트는 마크 안에서 곰 «뒤»에 깔린다 — 아래 마크업에서 <use> 보다 먼저 그린다.
     안착 상태에서 하트와 곰은 한 픽셀도 겹치지 않아(실측 0) 순서를 바꿔도 완성된
     그림은 diff 0 이다. ★뒤에 두는 값은 시작 순간뿐이다 — scale .05 짜리 하트가 귀
     «위»에 분홍 점으로 찍히는 걸 막는다. 그 뒤로는 하트가 곰 밖에 있어 앞/뒤가 그림을
     바꾸지 않는다(전 구간 대조: 외곽선 안티에일리어싱 차이뿐). 그러니 「가려졌다
     나온다」가 아니다 — 실제로 가려지는 구간은 20ms 다(실측).
     ★버린 안 둘, 다시 시도하지 말 것:
       · 원점을 귀 안쪽·한가운데로 → 가려지는 시간은 20→30ms 로만 늘고 이동은
         23.6→32.2px 로 커진다. 손해다.
       · 전신을 머리 뒤에 숨겼다 이동으로 빼내기(45.6px) → 빠져나오는 중간 프레임이
         «귀에 붙은 분홍 혹»으로 보인다. 크기 변화를 섞으면 보이는 면적이 들쭉날쭉해져 더 나쁘다.

     ★곡선이 --ease 가 아닌 세 번째 예외다 (잠금 흔들림 .32s · 확인 중 맥동 .9s 에 이어).
       --ease 는 앞이 가팔라서 시간을 아무리 줘도 «보이는 성장»이 40ms 뿐이다 — 태어나는
       게 아니라 번쩍인다. 이 앱이 scale 을 0 근처에서 시작하는 데가 한 군데도 없는
       이유이기도 하다(확인창 .96 · 체크 .8 — 폭이 좁아 앞이 가팔라도 티가 안 난다).
       감속곡선에선 같은 일이 80ms 에 걸쳐 읽힌다. 실측으로 고른 값이다.
     ★시작 크기는 .05 가 아니라 0 이다. .05 로 두면 축소된 하트가 5픽셀쯤 남는데, 원점
       (79.03, 25.45)이 곰 실루엣의 «오목한» 자리라 그중 4픽셀이 곰 밖으로 삐져나온다
       (실측 2026-09-16). 3배 화면에선 분홍 점으로 또렷이 보여서, 하트가 «안 보이다가
       태어나는» 게 아니라 «점이 있다가 자라는» 것으로 읽혔다(오너). 0 이면 어디에 있든
       안 그려지므로 원점 정확도에 기대지 않는다 — 곡선상 .05 와 0 의 차이는 눈에 안 띈다.
     ★투명도는 건드리지 않는다. 다크 바탕에서 분홍을 페이드하면 중간 프레임이 탁한
       적갈색 덩어리가 되는데, 스플래시는 «명단이 도착하면» 걷혀서 하필 그 프레임이
       마지막 인상이 될 수 있다. 변형만 쓰면 어느 순간 잘려도 중간 상태가 다 멀쩡한 그림이다.
     ★will-change 는 일부러 안 건다 — 층으로 올리면 scale .05 에서 구운 픽셀을 늘려
       흐려질 수 있다. 29x25 짜리라 매 프레임 다시 그려도 값이 안 나간다.
     지연 --tMove = 마크가 다 들어온 뒤에 시작(스플래시 제 fadeIn 이 --tMove) — 두 박자로 읽힌다.
     ★그래서 스플래시가 200ms 안에 걷히는 실행(첫 로그인 직후 unlock → 210ms 뒤 data-authed)
       에선 하트가 아예 안 나온다. 200ms 를 사람이 «빠졌다»로 읽지는 못해 그대로 둔다 —
       지연을 줄이면 스플래시 제 페이드와 겹쳐 둘 다 탁해진다(그쪽이 더 나쁘다).
     reduced-motion 이면 전역 animation:none 에 걸려 처음부터 안착 상태다(검증 diff 0). */
  @keyframes heartOut{
    from{ transform:translate(79.03px,25.45px) scale(0) translate(-79.03px,-25.45px) }
    62% { transform:translate(79.03px,25.45px) scale(1.07) translate(-79.03px,-25.45px) }
    to  { transform:translate(79.03px,25.45px) scale(1) translate(-79.03px,-25.45px) }
  }
  /* 0.3초는 «보이는 성장»이 120ms 뿐이라 태어나는 게 아니라 나타나는 쪽으로 읽혔다.
     0.45초면 240ms 에 걸쳐 자란다. 끝나는 시각이 500 → 650ms 로 늦어지지만 마지막 15%는
     1px 짜리 오버슈트 가라앉기라 «보이기에는» 480ms 에 이미 끝난다 — 잘릴 위험은 거의 안 는다.
     ★지연은 --tMove 그대로 둔다. 앞당기면(0.12초) 마크가 들어오는 중에 하트가 나와 둘 다 탁해진다. */
  /* ★JS 로 «SDK 를 다 읽은 뒤» 시작시켜 봤다가 되돌렸다(2026-09-16). 부팅이 바쁜 동안 앞
     프레임이 떨어지는 걸 피하려던 건데, 시작이 예전(파싱+200ms)보다 늦어져 스플래시가 0.3초에
     걷히는 실행에서는 하트가 아예 안 나왔다 — 고치려던 것보다 나쁜 결과였다(오너 확인). */
  .splashHeart{ animation:heartOut .45s cubic-bezier(.5,1,.89,1) var(--tMove) backwards }
  /* line-height:1 — 줄상자가 글자를 딱 감싸야 위 gap 이 «보이는 간격»과 맞는다(기본 줄간격은 위에 8px 를 더 얹었다).
     크기 25 는 활자 사다리 최상단 그대로 — 곰(94) : 이름 잉크(21.5) = 4.4:1 로 락업 통상 범위 안이다.
     (「마크 96」은 얼굴만이던 옛 마크 값이라 2026-09-15 에 곰 실측으로 고쳤다 — 비율 결론은 그대로.) */
  .splashName{font-family:'IksuniMark',-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-size:25px;line-height:1;font-weight:400;color:var(--text)}
  /* 만든 곳 — 화면 아래 작게. 제품 이름(익순이)과 만든 회사(Jumin Labs)가 다를 때 적는
     통용 방식 (Claude→ANTHROPIC, 요기요→Delivery Hero, 타다→VCNC 와 같은 자리·크기).
     가운데 락업과 겹치지 않게 absolute — 마크·이름의 세로 중앙 정렬에 영향을 주지 않는다. */
  .splashBy{
    position:absolute;left:0;right:0;text-align:center;
    bottom:calc(env(safe-area-inset-bottom) + 34px);
    /* --off(가장 흐린 토큰)로는 대비가 다크 3.7:1 · 라이트 3.3:1 이라 「공식 표기」로 넣은 줄이
       배경에 묻혔다. --dim 은 5.9:1 · 5.3:1 로 읽히면서도, 이름(25px·16:1)과는 크기·밝기
       양쪽으로 충분히 벌어져 위계가 그대로다. */
    font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--dim);
  }

  .scrim{
    position:fixed;inset:0;z-index:63;    /* 서랍(61)·룰렛막(62) 위 — 로그아웃 확인창이 서랍에서 바로 뜬다 */
    display:grid;place-items:center;
    padding:22px;
  }
  .dialog{
    width:100%;max-width:330px;
    background:var(--panel);
    border-radius:var(--radius);padding:19px 16px 16px;
    /* 세로 위치는 .scrim 의 place-items:center 가 잡는다. 입력칸이 없어 키보드가 안 뜨므로
       예전의 --kb 이동은 필요 없다. */
  }
  .dialog h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35;white-space:pre-line}
  /* 같은 막에 뜨는 형제 창(룰렛)의 안내 줄(.rltresult)과 같은 크기·색. 아래 여백은 안 준다
     — 인접 마진 상쇄로 .dbtn 의 margin-top 에 먹혀 무의미하다. */
  .dialog .dlgnote{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}   /* 보조 설명 = 13 (시트 안내문과 같은 크기) */
  .dbtn{display:flex;gap:8px;margin-top:14px}
  .dbtn button{
    flex:1;height:48px;padding:0;border-radius:999px;
    border:0;background:var(--btn);
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  }
  .dbtn #dlgNo:active, .dbtn #rltClose:active, .dbtn #dlgNo.dn, .dbtn #rltClose.dn{background:var(--btnPress)}   /* 취소·닫기 = 면이 밝아짐 */
  .dbtn #rltGo:active, .dbtn #rltGo.dn{background:var(--waitHover)}                           /* 채운 버튼 눌림 = --waitHover */
  /* 「초기화」는 한 번 눌러서가 아니라 「길게 눌러」 실행된다.
     예전엔 '예' 를 타이핑하게 했는데, 그 키보드가 뜨면 아이폰이 화면(비주얼 뷰포트)을
     밀어 올려 팝업이 위로 잘려 나갔다. 키보드를 아예 없애되 8/31 실수 방지 장치는
     남기려고, 한 번의 탭·주머니 오작동으로는 안 되는 이 제스처로 바꿨다.
     색은 취소된 예약 태그와 같은 --warn 계열 (경보가 아니라 '주의'). */
  .dbtn #dlgYes{
    --holdms:1000ms;                       /* 길게 누르기 시간 — JS 의 HOLD_MS 와 같아야 한다 */
    position:relative;overflow:hidden;
    background:var(--btnWarn);color:var(--onWarn);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .dbtn #dlgYes.holdmode{ touch-action:none }            /* 길게 누르기 제스처를 스크롤로 뺏기지 않게 */
  .dbtn #dlgYes:not(.holdmode):active, .dbtn #dlgYes:not(.holdmode).dn{background:var(--btnWarnPress)}   /* 탭 모드 눌림 = 붉은 면이 한 단 짙어짐 (행 메뉴 삭제와 같음) */
  /* 누르는 동안 버튼 전체가 왼쪽부터 차오른다. 글자는 --onWarn 이라 채움 위에서도 읽힌다
     (다크 4.68:1 / 라이트 4.62:1) — 글자색을 안 바꾸면 여기서 3.65 / 2.90 으로 묻혔다. */
  .dbtn #dlgYes .hf{
    position:absolute;inset:0;background:var(--warn);opacity:.42;
    transform:scaleX(0);transform-origin:left;transition:transform var(--tState) var(--ease);
  }
  .dbtn #dlgYes.hold .hf{transform:scaleX(1);transition:transform var(--holdms) linear}
  .dbtn #dlgYes .ht{position:relative}
  /* reduced-motion 예외는 스타일시트 맨 아래(전역 차단 규칙 바로 뒤)에 둔다 — 여기 두면
     전역의 !important 에 밀려 죽는다. 왜 예외인지는 그 자리 주석 참고. */

  /* ---------- 룰렛 ----------
     ★이모지는 «룰렛 안에만», 제목의 🚽 하나다. 결과 글자엔 안 붙인다(오너 2026-09-17) — 🚽 는 제목과 같은 그림이
       두 번 보였고, 날벼락 결과의 ⚡ 는 한쪽에만 붙어 좌우가 안 맞았다. 날벼락은 맞은 칸의 «탄 자국»이 표시한다. 본 화면의 온기는 곰이 지고
       글은 이모지를 안 쓰는데, 룰렛만 예외다 — 위 「룰렛은 놀이라 제 곡선」과 같은 갈래의 예외이고
       일부러 둔 것이다. 「이모지가 튄다」고 지우지 말 것(2026-09-16 점검에서 명시). */
  /* 서랍(61) 위 — 롱프레스로 열 때 빠져나가는 서랍이 룰렛 위를 스치지 않게 */
  #rltScrim{ z-index:62 }
  .rlt{
    /* 확인창(.dialog)과 «같은 판»이다 — 같은 막(.scrim) 위에 가운데 뜨는 형제라 값이 달라질 이유가 없다.
       폭 340/패딩 20/제목 아래 3 으로 각자 떠다니던 것을 확인창 값(330·19·4)에 맞췄다(2026-09-16).
       340 은 이 파일에서 짝 없이 혼자 쓰이던 유일한 폭이었다(겹창은 640·520·330 셋뿐).
       ※제목 아래 여백만 확인창(4)과 다르게 12 다 — 확인창은 제목 밑에 설명이 붙지만, 룰렛은 안내문이
         아래 상태 줄로 내려가 입력칸이 제목에 바로 붙는다. */
    width:100%;max-width:330px;
    background:var(--panel);border-radius:var(--radius);
    padding:19px 16px 16px;
    transition:transform var(--tMove) var(--ease),opacity var(--tFade) var(--ease);
    transform:translateY(clamp(calc(120px - 50vh), calc(50vh - var(--kb, 0px) - 150px), 0px));
  }
  .rlt h3{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35}   /* 크기·줄높이는 .dialog h3 와 한 값 */
  /* 이름 자리 — 입력칸과 이름 카드 줄이 «같은 칸»에 겹쳐 있다가 서로 자리를 바꾼다 (오너 2026-09-17).
     칠 때는 글자 입력칸만, 돌리면 입력칸이 사라지고 그 자리가 이름 카드 줄이 된다. 카드 줄을 누르면 다시 입력칸.
     ★예전엔 입력칸 «밑에» 칩 줄이 따로 있어 첫 글자를 치는 순간 카드가 58pt 늘어났다. 칩을 입력칸 안에 넣어도
       봤지만(칩이 되는 입력칸) 알약 안에 알약이 빽빽해 조잡했다 — 둘 다 되돌렸다.
     카드 줄 높이 = 입력칸 높이 44 라, 2~5명이면 치는 동안에도 돌릴 때도 카드 높이가 한 치도 안 바뀐다.
     둘 다 grid 한 칸(1/1)에 두고 visibility 로만 바꾼다 — 안 보이는 쪽도 자리를 지켜 바뀌는 순간 높이가 안 흔들린다.
     바뀌는 모습은 JS(morph)가 그린다 — 아래 .rltface 참고. */
  /* --morph · --morphEase = 입력칸 ↔ 카드 줄 전환의 시간·곡선. JS(morph)도 여기서 읽는다 — 값은 이 한 곳.
     ★--tMove · --ease 의 예외다(룰렛 갈래). --ease 는 첫 프레임에 이미 32% 를 가 버려, 글자가 «미끄러지지» 않고
       «튀었다»(시뮬레이터 영상 프레임). 옮겨 가는 게 보여야 하는 전환이라 천천히 출발하는 표준 곡선에 조금 더 길게. */
  .rltslot{display:grid;position:relative;--morph:.28s;--morphEase:cubic-bezier(.4,0,.2,1)}
  .rltslot > *{grid-area:1/1}
  .rltslot > input{align-self:start}                 /* 카드가 드물게 두 줄이 돼도 입력칸은 44 그대로 */
  .rltslot > .rltnames{position:relative;z-index:1}   /* 전환 때 면(.rltface) 위에 글자 */
  .rltslot.board > input, .rltslot:not(.board) > .rltnames{visibility:hidden;pointer-events:none}
  .rlt input{
    width:100%;background:var(--field);color:var(--text);
    border:1px solid var(--line);border-radius:999px;
    padding:11px 16px;font-family:inherit;font-size:16px;font-weight:600;
    -webkit-appearance:none;appearance:none;
  }
  .rlt input::placeholder{color:var(--ph);font-weight:400}
  .rlt input:focus{outline:0;border-color:color-mix(in srgb, var(--text) 30%, transparent)}
  /* 카드 줄 — 입력칸이 «이름 수만큼 쪼개진» 꼴이다: 같은 바탕(--field)·같은 선(--line)·같은 높이(44)·같은 폭.
     버튼(면 --btn)과 꼴이 갈려 눌러야 할 것처럼 안 보인다. 모서리 12 = 44 짜리 사각 면(칩 8 은 작은 표식용).
     칸 수(--cols)는 JS 가 정한다 — 한 줄 최대 5, 줄 수 최소, 줄마다 고르게. 이름이 칸보다 길면 칸을 줄인다. */
  .rltnames{
    display:grid;grid-template-columns:repeat(var(--cols, 5), minmax(0, 1fr));gap:8px;align-content:start;   /* 8 = 버튼 줄(.dbtn) 간격 — 2명이면 카드 경계와 「닫기|돌리기」 경계가 맞는다 */
    cursor:pointer;
  }
  .rltchip{
    height:44px;line-height:22px;padding:10px 6px;border-radius:12px;min-width:0;   /* 10 + 22 + 10 + 선 2 = 44 */
    background:var(--field);border:1px solid var(--line);
    font-size:16px;font-weight:600;color:var(--text);   /* 입력칸 글자와 같은 16·600 — 전환 때 «같은 글자»가 옮겨 가야 한다 */
    text-align:center;white-space:nowrap;overflow:hidden;
    transition:background .03s linear,color .03s linear,border-color .03s linear,transform .26s cubic-bezier(.34,1.56,.64,1);
  }
  .rltchip.lit,.rltchip.win{ background:var(--wait);border-color:var(--wait);color:var(--onWait) }
  /* 안착 크기는 비율이 아니라 pt 로 맞춘다 — 칸 폭이 이름 수에 따라 55~146 으로 달라, 같은 1.09 면 넓은 칸이 옆 칸에 닿는다.
     --win = 좌우 4pt씩(간격 8 의 절반). drawChips 가 칸 폭을 재서 넣는다. */
  .rltchip.win{ transform:scale(var(--win, 1.09)) }   /* 감속 뒤 살짝 튕기며 안착 (back-out) */
  /* 이름 글자는 카드 안의 한 덩어리(span) — 전환 때 이것이 입력칸 글자 자리에서 미끄러져 온다(JS morph). 길면 … */
  .rltchip > span{display:inline-block;max-width:100%;vertical-align:top;overflow:hidden;text-overflow:ellipsis}
  /* 전환 중(.morphing) — 이름 글자가 입력칸에서 빠져나와 자기 카드 자리로 미끄러지고, 면은 «입력칸이 먼저 흐려진 뒤
     카드가 짙어진다»(앞 절반·뒤 절반). 글자는 끊김 없이 움직이므로 눈은 글자를 따라가고, 면은 겹치는 순간이 없다.
     ★두 번 바꿨다(시뮬레이터 영상 프레임):
       ① 입력칸과 카드 면을 «동시에» 엇갈려 바꿨더니 중간에 알약 테두리와 카드 테두리가 이중으로 겹쳐 보였다.
       ② 입력칸 면을 카드 모양으로 «오려» 쪼개 봤더니(clip-path) 웹킷이 오림을 글자보다 늦게 그려 둘이 어긋났다.
       그래서 움직임은 전부 아이폰이 따로 그리는 위치·투명도로만 한다.
     카드 면은 JS 가 카드 자리에 따로 깐다(.rltface) — 카드 자체를 흐리면 글자까지 흐려진다.
     입력칸은 글자만 비우고(.morphing) opacity 로 흐린다 — visibility 로 숨기면 되돌아갈 때 포커스가 안 들어가 키보드가 안 뜬다. */
  .rltslot.morphing > input{visibility:visible;color:transparent;-webkit-text-fill-color:transparent;caret-color:transparent}
  .rltslot.morphing:not(.board) > .rltnames, .rltslot.morphing > .rltnames{visibility:visible}   /* 앞 것은 위 :not(.board) 숨김을 이기려고 */
  .rltslot.morphing .rltchip{background:transparent;border-color:transparent;overflow:visible;transition:none}   /* 카드 점멸용 .03s 전환이 여기 걸리면 첫 프레임에 카드 테두리가 비쳤다 */
  .rltface{position:absolute;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--field);pointer-events:none}
  .rltmirror{position:absolute;top:0;height:44px;line-height:44px;white-space:pre;visibility:hidden;pointer-events:none}   /* 입력칸 글자 위치를 재는 그림자 */
  .rltscar{position:absolute;z-index:2;pointer-events:none}   /* 번개 맞은 칸의 탄 자국 — JS scarChip. 카드 줄(z 1) 위 */
  /* 상태 줄 — 안내 → 경고 → 「돌리는 중…」 → 「○○ 당첨!」이 «한 자리»에서 바뀐다(날벼락도 같은 글 — 칸의 탄 자국이 구분한다).
     ★예전엔 안내문이 제목 아래 있고 결과는 당첨 순간 새 줄로 생겨, 카드가 위아래로 21pt 씩 벌어졌다
       (iOS 시뮬레이터 실측, 오너 2026-09-16 「당첨 글자 나타나면서 위아래로 넓어진다」). 결과 자리를 미리
       잡되 «빈칸»으로 보이지 않게 안내문이 그 자리를 채운다(오너가 고른 안 — 원래 배치는 그대로).
     안내(13)와 결과(20)는 글자 크기가 달라 줄 높이를 28 로 «고정»해야 바뀔 때 한 치도 안 움직인다.
     한 줄을 넘지 않게 nowrap — 넘치면 높이가 늘어 카드가 다시 벌어진다. */
  .rltresult{ margin:14px 2px 2px;height:28px;display:flex;align-items:center;justify-content:center;
              text-align:center;white-space:nowrap;font-size:13px;font-weight:400;color:var(--dim) }
  .rltresult.warn{ color:var(--warn) }
  .rltresult.won{ font-size:20px;font-weight:800;color:var(--wait) }
  /* 날벼락 결과 — 맞은 칩과 «같이» 흰빛으로 달궈졌다가 금색으로 식는다(아래 boltHit 과 같은 색·시간·곡선).
     사람 눈은 결국 결과 글자로 가는데, 번쩍임 한가운데서 조용히 바뀌면 빛이 걷혔을 때 «이미 바뀌어 있을 뿐»
     뒤집히는 순간이 없었다. 크기는 안 바꾼다 — 아래 ★정리 참고. */
  .rltresult.hit{animation:resultHit .5s cubic-bezier(.45,0,.55,1)}
  /* 날벼락 때 이름이 «바뀌는 순간»을 보이게 — 번쩍임(0.52초) 한가운데서 바꾸면 빛이 걷혔을 때
     이미 바뀌어 있을 뿐이라 뒤집힌 순간이 없다. 번쩍임이 걷히고 흔들림이 잦아든 0.3초에 바뀐다.
     ★한 줄을 흐렸다 되살리면(opacity 1→0→1) «깜빡임»이 된다 — 글자가 아주 사라지는 구간이 생기기 때문(오너 2026-09-19).
       그래서 두 겹으로 겹친다: 옛 이름은 위로 빠지며 흐려지고, 새 이름은 아래서 떠오르며 진해진다. 동시에 일어나
       비는 순간이 없다. 9px 은 줄 높이(28)의 1/3 — 넘치면 잘리므로 줄에 overflow:hidden 을 준다. */
  /* 결과 줄은 «이름» 조각과 「 당첨!」로 나뉜다 — 날벼락 때 이름만 사그라들고 「당첨!」은 남아
     빈 자리가 보인다(오너 2026-09-19 「감질맛」). 줄 전체를 지우면 기다릴 자리가 없어진다. */
  /* 옛 이름은 «전구 꺼지듯» 깜빡이며 나가고, 새 이름은 장식 없이 딱 들어온다.
     ★글자를 한 자씩 360° 로 흩뜨리는 안도 만들어 봤지만 반려(오너 2026-09-19) — 요란하기만 했다. 재시도 금지.
       (그때 알아낸 것: 키프레임 안 transform 에 var(--dx) 를 쓰면 크롬·웹킷이 그 변환을 통째로 버린다.
        방향을 글자마다 달리하려면 WAAPI 로 돌려야 한다.)
     ★길이는 «정점 밝기»로 정했다(2026-09-19 실기기 실측). 0.8초 판은 정점이 193→161→117→83 으로
       무너져 뒤쪽 280ms 가 깜빡임이 아니라 흐릿한 웅얼거림이었고, 정점 간격도 194→201ms 로 «느려졌다»
       — 꺼져가는 전구는 반대로 빨라져야 한다. 그래서 0.62초로 꼬리를 자르고, 정점은 높게 끌고 가다가
       마지막 10%(62ms)에 딱 떨어뜨린다. 간격도 99→137→124→111→87ms 로 조여진다. */
  @keyframes nmFlick{0%{opacity:1}9%{opacity:.15}16%{opacity:1}30%{opacity:.1}38%{opacity:.95}
                     50%{opacity:.08}58%{opacity:.85}68%{opacity:.06}76%{opacity:.6}
                     84%{opacity:.05}90%{opacity:.35}100%{opacity:0}}
  .rltnmin.gone{animation:nmFlick .62s linear forwards;opacity:0}
  /* 이름 자리는 «처음 뜬 이름»의 폭으로 잡고, 이름은 그 자리의 오른쪽 끝에 붙는다 —
     뒤에 더 긴 이름이 와도 왼쪽으로 넘칠 뿐 「당첨!」은 안 밀린다. 가장 긴 이름에 맞추면 처음 결과부터
     이름이 왼쪽으로 치우쳐 보인다(오너 2026-09-19). 글자는 흩어질 때 자리 밖으로 나가야 하므로 안 자른다. */
  .rltnm{display:inline-block;position:relative;height:1.2em;vertical-align:middle}
  .rltnmin{position:absolute;right:0;top:0;line-height:1.2em;white-space:nowrap}
  @keyframes resultHit{0%{color:var(--rltHeat)}100%{color:var(--wait)}}
  /* 달궈진 색 — 다크는 번개 심 색(흰빛). 라이트는 흰 카드 위라 흰빛이면 결과 글자가 통째로 사라졌다(시뮬레이터 영상) —
     강조색을 흰색 쪽으로 반쯤 옮긴 «밝은 테라코타»에서 식게 한다. */
  .rlt{--rltHeat:#fff6e0}
  html[data-theme="light"] .rlt{--rltHeat:color-mix(in srgb, var(--wait) 45%, #fff)}
  /* ── 날벼락 (25%) ── 번개 · 번쩍임 · 카드 흔들림 · 맞은 칩(달궈짐 + 탄 자국)이 한 순간(번쩍임 정점)에 친다.
     시각은 JS strike() 에, 탄 자국은 scarChip() 에 모여 있다. 가라앉는 차례: 빛 0.42초 → 흔들림·식음 0.56초 → 불씨 0.7초 → 연기 1.3초.
     번개는 카드 위를 지난다 — 뒤로 보내면 칩에 안 닿아 「누가 맞았나」가 흐려진다. 0.5초라 글자를 읽는 데는 지장이 없다. */
  /* 번쩍임: screen · 금색 · «두 번»(정점 .75 → 번개가 다시 켜질 때 .55). screen 은 어두운 화면을 «빛이 비추듯»
     밝히고 뒤의 윤곽을 살려 둔다. 섞지 않고 덮으면 금색 판이 된다.
     ★한 번(.62) → 두 번(2026-09-17, 오너 「역동성이 부족하다」). 흔들림·번쩍임·번개를 하나씩만 키운 시안을
       시뮬레이터 영상으로 비교하니, 한 번은 «밝아졌다 식는 조명»으로 읽혔다. 진짜 번개처럼 줄기가 다시 켜질 때
       빛도 한 번 더 번쩍인다 — 줄기와 «같이» 깜빡여야 번개 하나로 읽힌다(따로 놀면 상관없는 깜빡임).
       흰빛(.85)도 다시 찍어 봤는데 아래 ★색 이유 그대로 안개였다.
     ★색이 금색인 이유 — 따뜻한 흰빛(.62 · .46)과 iOS 시뮬레이터 사파리에서 정점 순간을 나란히 찍었다
       (2026-09-16). 흰빛은 «빛»이 아니라 «안개»로 읽혔고, 바탕이 흰 번개 심 쪽으로 밝아져 번개가 묻혔다.
     ★원칙(라이트 쪽 주석과 같은 한 줄): 번쩍임은 바탕을 «번개 심의 색 쪽으로» 옮기면 안 된다.
       다크 = 흰 쪽이 아닌 금색으로 밝힌다 · 라이트 = 밝히지 않고 색 없이 어둡게 한다. 흰빛으로 바꾸고
       싶어지면 이 줄부터 볼 것.
     ★내력: .13(밋밋) → .78·혼합없음(금색 판) → .62·screen(2026-09-16) → .75·.55 두 번(09-17). 중간의 .78 은 두 시안 파일을
       헷갈려 «다른 시안»의 값(.92·혼합없음)을 기준으로 삼은 착각이었다. 다시 바꾸려면 그 파일부터 열 것.
     라이트는 screen 이 흰 바탕에서 아무것도 안 해서 multiply 로 — 대신 훨씬 세게 먹어 절반으로.
     ★라이트의 번쩍임 색은 강조색이 아니라 «색 없는 어둠»(--text = 막과 같은 가족)이다. 라이트에서 번쩍임이
       하는 일은 밝히기가 아니라 «흰 번개가 설 하늘을 어둡게» 하는 것인데, 테라코타로 multiply 하면 화면
       전체가 분홍 필터를 쓴 듯 탁해지고 당첨 칩·결과 글자까지 그 색에 섞여 누가 맞았는지 흐려졌다
       (iOS 시뮬레이터 사파리로 나란히 비교, 2026-09-16). 어둠만 깔면 강조색이 제 색을 지킨다.
     번쩍임은 «두 번»까지다 — 넓은 면이 1초에 3회 넘게 번쩍이면 광과민성 발작 위험(WCAG 2.3.1). 더 늘리지 말 것. */
  .rltflash{position:absolute;inset:0;background:var(--wait);opacity:0;pointer-events:none;z-index:64;mix-blend-mode:screen}
  html[data-theme="light"] .rltflash{mix-blend-mode:multiply;--flashK:.5;background:var(--text)}
  .rltsky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:65;opacity:0;will-change:opacity}
  .rltsky path{stroke:none}          /* 선이 아니라 «채운 띠» — 굵기가 변해야 끝이 뾰족해진다 */
  /* 세 겹: 어두운 윤곽 → 색 번짐 → 밝은 심.
     ★윤곽은 «라이트 전용»이다. 번개의 대부분은 어두운 막 위를 지나가지만 마지막 구간이 흰 카드
       위를 지나는데, 거기서 거의 흰 심이 바탕에 묻혀 «어디를 때렸는지»가 사라졌다(실기 확인).
       심을 어둡게 바꾸면 반대로 막 위에서 안 보인다 — 그래서 심은 그대로 두고 윤곽만 깐다.
       다크에서는 어두운 바탕 위 어두운 선이라 있어도 안 보이므로 아예 끈다. */
  /* ★번짐은 CSS filter:blur() 가 아니라 SVG <feGaussianBlur> 다(필터는 drawBolt 가 <defs> 에 만든다).
       웹킷(아이폰 사파리)은 SVG «안쪽» 요소에 CSS filter 를 적용하지 않는다 — iOS 시뮬레이터 사파리
       26.5 에서 path 에도 g 에도 안 번지고 딱딱한 띠로 나왔다(2026-09-16). 크롬은 번져서 한동안 몰랐다.
     불투명도·번짐은 «묶음»에 건다 — 가지가 본줄기와 겹치는 자리가 두 번 칠해져 진해지지 않고 한 덩어리로 번진다. */
  .rltsky .bhl{opacity:.20}                 /* 넓게 퍼지는 후광 — 있고 없고가 «존재감»을 가른다 */
  .rltsky .bgl{opacity:.45}
  .rltsky .bhalo, .rltsky .bglow{fill:var(--wait)}
  .rltsky .bshade{fill:#1a1208;opacity:0}
  html[data-theme="light"] .rltsky .bshade{opacity:.72}
  .rltsky .bcore{fill:#fff6e0}
  html[data-theme="light"] .rltsky .bcore{fill:#fffaf2}
  /* 맞은 칩: 흰빛으로 «달궈졌다가 금색으로 식는다». 크기는 안 바꾼다.
     ★정리(2026-09-17, 오너 「애니메이션이 덕지덕지」): 전엔 칩이 1.2~1.4배로 튀었다 .98 로 줄고 다시 커졌고
       결과 글자도 1.3배에서 줄었다 — 18px 흔들리는 카드 «안에서» 크기 움직임이 두 겹 더 겹쳤고, 시작·끝도
       흩어졌다(0.44~0.64초). 5명이면 튄 칩이 옆 칩 절반을 덮었다. 이제 움직임은 카드 흔들림 하나, 칩·글자는
       색으로만 「맞았다」를 보이고, 셋이 같은 순간(번쩍임 정점)에 시작해 같은 0.5초·같은 곡선으로 끝난다.
     ★한때 둘레에 빛을 번지게(box-shadow) 했다가 뺐다(오너 2026-09-16 「촌스럽다」) — 보기에 싸구려였고,
       그때 이름 상자가 스크롤 상자라 번진 빛이 잘려 「이름 카드가 잘린 것처럼」 보였다.
     ★곡선은 출발이 급하면(--ease) 흰 달궈짐이 첫 한두 프레임에 식어 맞은 게 안 보였다(시뮬레이터 영상 흰색 2프레임).
       천천히 출발·도착하는 곡선이라 흰 칩이 약 0.2초 남는다.
     transition:none — 칩의 글자색 .03s 전환이 남으면 흰 칩 첫 프레임에 밝은 글자가 묻혀 이름이 안 보였다. */
  .rltchip.hit{animation:boltHit .5s cubic-bezier(.45,0,.55,1);transition:none}
  /* 처음 당첨자 칸: 번개가 친 순간부터 금색이 «눈에 보이게» 빠져나간다(0.3초).
     ★전엔 번쩍임 정점에 0.08초 만에 꺼져(빛 속에 숨김) 빛이 걷히면 새 당첨자만 보였다 — 「동희가 맞았다」는 읽혀도
       「동현에게서 동희로 뒤집혔다」가 약했다(2026-09-17 오너 「결과가 정해졌는데 뒤바뀌는 느낌인가」). 불이 옆 칸으로
       «옮겨 가면» 룰렛이 덜 돈 것처럼 보이지만, 제자리에서 «꺼지는» 건 그렇게 안 읽힌다.
     ★곡선은 맞은 칩과 달리 «급히 빠지고 천천히 꺼지는» --ease. 맞은 칩과 같은 곡선(천천히 출발)이었을 땐 첫 번쩍임이 걷힌
       순간(0.13초) 처음 당첨자가 아직 «완전한 금색»이었고, 0.27초에 두 칸의 금색이 똑같아져(영상 픽셀 실측 100 대 95)
       당첨이 어느 쪽인지 흐려지는 순간이 생겼다. 급히 빠지면 두 칸이 같아지는 순간이 첫 번쩍임 «속»으로 들어간다.
     ★0.5초 → 0.3초: 라이트는 맞은 칩이 «밝은 테라코타»(--rltHeat)에서 식는데, 빠지는 칸도 테라코타 → 흰색 사이에서 같은 색을
       지나, 첫 번쩍임이 걷힌 0.13초에 두 칸이 똑같은 연분홍이었다(시뮬레이터 영상). 0.3초면 그때 이미 거의 빠져 있다.
       빠지는 게 보이는 시간은 번쩍임 사이(0.07~0.15초)로 충분하다. */
  /* 처음 당첨칸의 불은 «번쩍임이 걷힌 뒤에» 빠진다 — 0.24초 기다렸다 0.34초에 걸쳐(both = 기다리는 동안 금색 유지).
     ★지연이 없을 땐 0.1초 만에 꺼졌는데 그 0.1초는 번쩍임이 제일 셀 때라, 넘겨주는 장면이 통째로 안 보였다.
       화면이 읽히는 0.3초엔 이미 다른 칸들과 구분이 안 됐고, 뒤바뀜은 «기억으로만» 알 수 있었다(2026-09-18).
     ★곡선도 --ease(cubic-bezier(.2,.8,.2,1))에서 바꿨다 — 앞에 몰린 곡선이라 지연을 줘도 보이기 시작할 땐 이미
       대부분 빠진 뒤였다. 타격 곡선(boltHit·resultHit 과 같은 값)이라 오르는 쪽과 빠지는 쪽이 한 박자로 움직인다.
     ★크기는 «바로» 되돌린다(boltDeflate). --win 은 좌우 4pt씩 키우는 값이고 칸 간격은 8pt라, 이웃한 두 칸이 동시에
       커지면 간격이 정확히 0 이 되어 «두 칸이 붙어» 보인다(오너 2026-09-18).
       금색만 늦게 빠지고, 크기는 번쩍임 속에서 빠진다.
     ★번쩍임이 «다 걷힌 뒤»(300ms)에 빠지기 시작해 번쩍임이 «끝나는 순간» 같이 끝난다 — 300 + 220 = 520.
       그래야 빠져나가는 과정이 통째로 맨눈에 든다. 240+280(=520)도 재 봤지만 구분되는 시간이 0.18 → 0.20초로 이쪽이 길다.
       예전엔 240+340 = 580ms 라 혼자 늦게 정리됐다.
       곡선도 타격 곡선 하나로 통일했다(번개 순간에 도는 것 전부: 흔들림·달아오름·결과 글자·크기·금색). */
  .rltchip.lose{animation:boltDeflate .22s cubic-bezier(.45,0,.55,1), boltLose .22s cubic-bezier(.45,0,.55,1) .30s both;transition:none}
  @keyframes boltDeflate{ 0%{transform:scale(var(--win, 1.09))} 100%{transform:none} }
  @keyframes boltLose{
    0%  {background:var(--wait); border-color:var(--wait); color:var(--onWait)}
    100%{background:var(--field); border-color:var(--line); color:var(--text)}
  }
  @keyframes boltHit{
    0%  {background:var(--rltHeat); border-color:var(--rltHeat)}
    100%{background:var(--wait); border-color:var(--wait)}
  }
  /* 카드 흔들림: 맞는 «순간» 18px 내려앉았다가(번개가 위에서 온다) 상하좌우로 잦아든다. 0.5초 — 칩·결과 글자가
     식는 시간과 같다(위 ★정리).
     .rlt 의 평소 transform(키보드 올림)을 덮지만, 돌리기 시작에 입력칸을 blur 하므로 이 순간 --kb 는 0 이다.
     ★예전엔 최대에 닿는 데 58ms 걸려 타격이 아니라 흔들거림이었다 — 그래서 0% 가 최대다.
     ★세로 7px·0.42초 → 18px 상하좌우(2026-09-17). 흔들림만 키운 시안 · 세로만 12px · 화면 전체 흔들기를 시뮬레이터
       영상으로 나란히 보고 오너가 골랐다. 좌우 떨림은 잠금화면 «비밀번호 틀림»(lockshake)과 닮았다는 걱정이
       있었지만, 번개·번쩍임과 함께 크게 흔들리니 「틀렸다」가 아니라 「맞았다」로 읽혔다.
     ★곡선은 키프레임 «구간마다» 걸린다. 출발이 급한 곡선이면 매 흔들림이 한 프레임 안에 지나가 내려앉음이 영상에
       안 잡혔다. 끝점에서 잠깐 머무는 곡선이라야 흔들림 하나하나가 보인다. */
  .rlt.jolt{animation:boltJolt .5s cubic-bezier(.45,0,.55,1)}
  @keyframes boltJolt{
    0%{transform:translate(0,18px)} 14%{transform:translate(-8px,-10px)} 28%{transform:translate(7px,7px)} 42%{transform:translate(-5px,-5px)}
    58%{transform:translate(3px,3px)} 74%{transform:translate(-2px,-1px)} 88%{transform:translate(1px,1px)} 100%{transform:translate(0,0)}
  }
  .dbtn #rltGo{background:var(--wait);color:var(--onWait)}
  .dbtn #rltGo:disabled{opacity:.55;cursor:default}

  .toast{
    position:fixed;left:50%;bottom:calc(max(10px, env(safe-area-inset-bottom) - 6px) + 48px + 12px + var(--kb, 0px));transform:translateX(-50%) translateY(8px);   /* 알약 바(48) 위 12 */
    background:var(--btnPress);box-shadow:0 4px 14px rgba(0,0,0,.35);
    padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity var(--tMove) var(--easeEven),transform var(--tMove) var(--easeEven);z-index:200;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);transition:opacity var(--tFade) var(--ease),transform var(--tMove) var(--ease)}   /* 겹쳐 뜨는 것은 먼저 불투명해진다 — 아래 명단이 알약을 뚫고 비치지 않게 */
  .hide{display:none !important}
  /* 겹창(막·시트·대화상자·예약 추가) 등장과 퇴장 — 같은 길·같은 시간(--tMove). 곡선만 방향을 탄다: 들어올 때 --ease, 나갈 때 --easeEven.
     서랍·토스트·잠금·스플래시는 이미 transition 으로 오갔는데 시트·대화상자만 등장은 animation, 퇴장은 즉시였다(2026-09-12 통일).
     .hide 는 전역이 display:none 이라 여기선 «보이는 값 + visibility» 로 바꿔 둔다(막은 배경색, 판은 투명도·위치) — JS 는 여전히 .hide 만 켜고 끈다.
     visibility 는 숨길 때만 --tMove 뒤에 걸려 다 사라진 뒤 꺼지고, 보일 땐 즉시 켜진다.
     시트 = 아래서 24px, 대화상자 = .96 에서, 막 = 배경색이 깔렸다 빠짐, 행 메뉴 = 짧은 페이드(DOM 에서 빠지므로 등장만). */
  /* ★어둠은 «배경색»으로 깔았다 뺀다(opacity 가 아니라). 막의 opacity 를 움직이면 그 안의 판까지
     같이 흐려져(그룹 투명도) 판이 늦게 불투명해지고, 그동안 뒤 내용이 판을 뚫고 보인다 — 오너 「잔상」(2026-09-19).
     배경색만 바꾸면 판은 제 속도(--tFade)로 혼자 불투명해진다.
     ★::before 에 어둠을 얹는 방법도 해 봤지만 크롬·웹킷 둘 다 «클래스가 빠져도 가상요소 투명도가 0 에 머물러» 못 썼다. */
  .scrim, .sheetScrim, .panelScrim{background:var(--scrim);transition:background-color var(--tMove) var(--easeEven),visibility 0s}
  .scrim.hide{display:grid !important}
  .sheetScrim.hide{display:flex !important}
  .panelScrim.hide{display:block !important}
  .scrim.hide, .sheetScrim.hide, .panelScrim.hide{background:transparent;visibility:hidden;pointer-events:none;transition:background-color var(--tMove) var(--easeEven),visibility 0s var(--tMove)}
  /* 판의 투명도는 «들어올 때만» 빠르다(--tFade .1s) — 반투명한 동안 뒤가 비치기 때문.
     나갈 때는 --tMove — 여기서 --tFade 를 쓰면 판이 100ms 만에 사라져 「툭 꺼짐」이 되살아난다(재 봤다).
     자리를 잡는 움직임(미끄러짐 24px · 축소 .96)은 양쪽 다 --tMove.
     측정(시트 열림, 뒤비침): 고치기 전 40ms 37% · 73ms 14% · 106ms 5% · 173ms 0
                              고친 뒤   10ms 50% · 53ms  2% · 85ms  0%  (--tFade 100ms 일 때)
                              1/4(50ms)로 줄인 뒤엔 첫 프레임부터 거의 0. */
  .sheet, .dialog{transition:transform var(--tMove) var(--ease),opacity var(--tFade) var(--ease)}
  .sheetScrim.hide .sheet{opacity:0;transform:translateY(24px);transition:transform var(--tMove) var(--easeEven),opacity var(--tMove) var(--easeEven)}
  .scrim.hide .dialog{opacity:0;transform:scale(.96);transition:transform var(--tMove) var(--easeEven),opacity var(--tMove) var(--easeEven)}
  .scrim.hide .rlt{opacity:0;transform:translateY(clamp(calc(120px - 50vh), calc(50vh - var(--kb, 0px) - 150px), 0px)) scale(.96);transition:transform var(--tMove) var(--easeEven),opacity var(--tMove) var(--easeEven)}
  .panel.asSheet.hide{display:flex !important;opacity:0;visibility:hidden;pointer-events:none;
    transform:translateX(-50%) translateY(calc(24px - var(--kb, 0px)));transition:transform var(--tMove) var(--easeEven),opacity var(--tMove) var(--easeEven),visibility 0s var(--tMove)}
  @keyframes fadeIn{from{opacity:0}}
  /* 하단 알약(토스트·업데이트 알약) 등장 — 8px. 이름이 sheetIn 이었는데 정작 시트는 안 쓰고
     업데이트 알약 하나만 썼고, 값도 시트와 같은 24px 이라 «같은 크기·같은 자리»인 토스트(8px)와 어긋났다.
     둘은 한 식구다(바 위 40 높이 알약) → 8px 로 맞추고 이름도 사실대로 고쳤다. 2026-09-14. */
  @keyframes pillIn{from{opacity:0;transform:translateY(8px)} 50%{opacity:1}}   /* 절반(=--tFade)에 불투명해진다 — 토스트·시트와 같은 규칙 */
  .menu{animation:fadeIn var(--tFade) var(--ease)}   /* 겹쳐 뜨는 것은 --tFade 에 불투명 — 토스트·시트와 같은 규칙 */
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    /* 단 하나의 예외 — 「길게 눌러 초기화」의 차오르는 면.
       이건 장식이 아니라 «얼마나 더 붙잡고 있어야 하는지»를 알려주는 유일한 표시다.
       전역 규칙에 같이 쓸려 나가면 누르는 순간 통째로 꽉 찬 것처럼 보이는데, 실행은 JS 의
       HOLD_MS(1초) 뒤라 손을 먼저 떼게 되고 「눌러도 안 된다」가 된다.
       그래서 되살리되 24칸으로 끊어 올린다 — 미끄러지는 움직임이 아니라 눈금이 차는 것에 가깝다. */
    .dbtn #dlgYes.hold .hf{transition:transform var(--holdms) steps(24) !important}
  }
</style>
</head>
<body>


<div class="shell" id="topShell"><!-- 상단 셸: 헤더·업데이트 띠·검색창을 한 유리 판에 — 명단이 이 밑으로 지나간다 -->
<header>
    <div class="toprow">
      <div class="nav">
        <button type="button" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="date num" id="dateLabel"></span>
      </div>
      <div class="tools">
        <span class="offtag">연결 안 됨</span><!-- 진행도와 같은 자리 — 끊기면 진행도가 접히고 이것이 선다 (2026-09-15) -->
        <span class="dayprog num hide" id="dayProg"></span>
      </div>
    </div>
    <div class="lead hide">
      <div class="leadrow">
        <span class="slottime num" id="slotTime"></span>
        <span class="leadmain num" id="leadMain"></span>
        <div class="seg viewseg" role="group" aria-label="예약 표시">
          <button type="button" id="viewAllBtn" aria-pressed="true">전체</button>
          <button type="button" id="viewPendBtn" aria-pressed="false">대기</button>
        </div>
      </div>
      <span class="leadsub num" id="leadSub"></span>
    </div>
  </header>


<div class="searchbar hide" id="searchbar">
  <button type="button" id="qBack" aria-label="검색 닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button>
  <input type="search" id="q" placeholder="이름 검색" autocomplete="off" autocorrect="off" spellcheck="false">
  <span class="qcount hide" id="qCount"></span>
  <button type="button" id="qClear" class="hide" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
</div>
</div><!-- /shell -->

<div class="wrap">
  <div id="list"></div>

  <div class="panel hide" id="pastePanel">
    <h2>오늘 예약 명단 붙여넣기</h2>
    <p id="pasteHint">양식에 맞게 붙여넣어 주세요</p>
    <div class="tawrap">
      <div class="hl" id="hl" aria-hidden="true"></div>
      <textarea id="ta" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-label="예: 14:00 임동현 2명"></textarea>
    </div>
    <div class="btns">
      <!-- 주동작은 오른쪽 (iOS·Android 공통 관습, 오른손 엄지 쪽) — 앱의 모든 버튼 쌍이 [보조][주] 순서 -->
      <button type="button" class="btn ghost hide" id="cancelPaste">취소</button>
      <button type="button" class="btn primary" id="loadBtn">명단 등록</button>
    </div>
  </div>

  <div class="empty hide" id="emptyMsg"></div>
</div>

<div class="foot empty">
  <button type="button" class="updbar hide" id="updBar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>새 버전으로 업데이트</button>
  <div class="inner">
    <div class="frow">
      <!-- 가운데 = 가장 자주 쓰는 「명단 복사」. 아이콘 16px·획 2 로 통일(크기는 CSS .foot button svg) -->
      <button id="addBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>예약 추가</span>
      </button>
      <button id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>명단 복사</span>
      </button>
      <button id="foldBtn" type="button">
        <!-- 접기 = 화살표가 가운데 선으로 모임 / 펼치기 = 선에서 밖으로 벌어짐. 모양이 위아래 대칭이라
             «뒤집기»로는 안 바뀐다 — render() 가 경로(d)를 통째로 갈아 끼운다 -->
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="foldp" d="M6 10l6-6 6 6M6 20l6-6 6 6"/></svg>
        <span class="foldlbl">전체 접기</span>
      </button>
    </div>
  </div>
</div>

<div class="panel asSheet hide" id="addPanel">
  <h2 id="addTitle">예약 추가</h2>
  <div>
    <div class="erow">
      <label>시<select id="a-hour"></select></label>
      <label>분<select id="a-min"></select></label>
      <label class="grow">이름<input type="text" id="a-name" autocomplete="off" autocorrect="off" spellcheck="false"></label>
      <label>인원<select id="a-pax"></select></label>
    </div>
    <div class="erow memorow">
      <label class="grow">메모<input type="text" id="a-memo" autocomplete="off" placeholder="창가석 요청, 인플루언서 …"></label>
    </div>
  </div>
  <div class="btns">
    <button type="button" class="btn ghost" id="addNo">취소</button>
    <button type="button" class="btn primary" id="addOk">추가</button>

<script type="module">
// ---------- Firebase 연결 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, get, set, update, remove, onValue, off, goOffline, goOnline }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
         setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA62A2jtIE77DgOcJ17Jb6S9gH4oTeNeKw",
  authDomain: "ikseon-reserve.firebaseapp.com",
  databaseURL: "https://ikseon-reserve-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ikseon-reserve",
  storageBucket: "ikseon-reserve.firebasestorage.app",
  messagingSenderId: "456621961785",
  appId: "1:456621961785:web:a2ba82fb70d6f198b5d3e8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// dev/prod 판정 — 실제 배포 주소일 때만 prod, 그 외 전부 dev(roster-dev).
// 실배포: songtudy.github.io/reserve/   테스트: songtudy.github.io/reserve-dev/
// localhost·파일·미리보기·폴더 복사본·남의 fork = 전부 dev. 실명단을 건드리지 않는다.
// (아래 IIFE 의 computeDev 와 같은 판정 — 둘 다 고쳐야 함)
const DEV = !(location.hostname === 'songtudy.github.io'
  && /^\/reserve(\/|$)/.test(location.pathname));
const ROOT = DEV ? 'roster-dev' : 'roster';
// Firebase 규칙이 허용하는 명단 영역 안에 변경 내역 전용 가지를 둔다.
const LOGROOT = ROOT + '/__logs__';
// 예약 id 를 Firebase 키로 (id 엔 ':' '|' 가, 이름엔 '.' 이 들어갈 수 있어 해시한다)
const k32 = s => {
  let a = 5381, b = 52711;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); a = (Math.imul(a,33) ^ c) >>> 0; b = (Math.imul(b,63689) ^ c) >>> 0; }
  const f = n => ('0000000' + n.toString(36)).slice(-7);
  return 'k' + f(a) + f(b);
};
const ipath = (ds, id) => ROOT + '/' + ds + '/items/' + k32(id);
const itemsRef = ds => ref(db, ROOT + '/' + ds + '/items');

// Firebase 서버 시계와 이 기기 시계의 차이(ms). "지금 몇 시/며칠이냐" 를 이 값으로 보정한다
// (serverNow = Date.now() + __skewMs). 기기 시계가 틀려도 자동취소·자정넘어감·지금시간대·백업이
// 서버 시계를 따르게. 서버 시계는 구글 인프라(NTP)라 실제 시각과 사실상 일치한다.
let __skewMs = 0, __skewKnown = false;
onValue(ref(db, '.info/serverTimeOffset'), s => { __skewMs = Number(s.val()) || 0; __skewKnown = true; });

// 공유 로그인 계정 — 이메일은 앱에 고정, 비밀번호만 직원이 입력한다.
// (실제로 메일이 오가지 않는 주소. 비번 재설정은 Firebase 콘솔에서만 가능.)
const STAFF_EMAIL = 'staff@iksuni.app';
const auth = getAuth(app);

window.__fb = {
  serverSkew: () => __skewMs,
  serverSkewKnown: () => __skewKnown,
  // ---- 명단: 예약별 노드 (roster/<날짜>/items/<해시>) ----
  // 읽기는 구 형식(items 가 배열)도 그대로 처리된다. legacy=true 면 앱이 1회 변환해 쓴다.
  itemsGet: ds => get(itemsRef(ds)).then(s => {
    const v = s.exists() ? s.val() : null;
    return { items: v ? Object.values(v) : [], legacy: Array.isArray(v) };
  }),
  itemsWatch: (ds, cb) => {
    const r = itemsRef(ds);
    const h = onValue(r, s => {
      const v = s.exists() ? s.val() : null;
      cb({ items: v ? Object.values(v) : [], legacy: Array.isArray(v) });
    });
    return () => off(r, 'value', h);
  },
  itemDel: (ds, id) => remove(ref(db, ipath(ds, id))),
  // 한 예약 노드를 반영한다 (오프라인 쓰기 큐 재생용). 현재 값을 get 으로 확인하고 조건부로 쓴다.
  //  - data: patch(부분 필드) 또는 item(통짜, create=true)
  //  - minTs: 서버 값이 이보다 새 것이면 건드리지 않는다 (오래된 큐가 최신 값 못 덮게)
  //  - create: true 면 없을 때 새로 만든다(예약 추가). false(patch) 면 삭제된 노드는 되살리지 않는다.
  // patch 는 update() 로 지정한 필드만 서버에서 병합 → 다른 기기가 딴 필드를 동시에 바꿔도 안 날린다.
  // (트랜잭션은 cold 캐시에서 null 로 오판해 patch 를 통째로 잃으므로 쓰지 않는다.)
  // 반환 true = 반영됐거나 더는 필요 없음 → 큐에서 제거.
  itemMerge: (ds, id, data, minTs, create) => {
    var r = ref(db, ipath(ds, id));
    return get(r).then(s => {
      if (!s.exists()) return create ? set(r, data).then(() => true) : true;
      if ((s.val().ts || 0) >= (minTs || 0)) return true;       // 서버가 더/같이 최신 → 유지
      return (create ? set(r, data) : update(r, data)).then(() => true);
    });
  },
  // items 서브트리 통째 교체 (붙여넣기·명단 초기화 = 의도적 리셋). arr 비면 노드 삭제.
  itemsReplace: (ds, arr) => set(itemsRef(ds), (arr && arr.length) ? arr.reduce((o, it) => (o[k32(it.id)] = it, o), {}) : null),
  // 오래된 날짜 정리용 (날짜 노드 목록·삭제)
  dayList: () => get(ref(db, ROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  dayRemove: ds => remove(ref(db, ROOT + '/' + ds)),
  // 명단 백업 — roster/__backup__/<날짜>/<키> = {at, n, items:[...]}
  // 무료 요금제라 Firebase 자동 백업이 없어서 앱이 스스로 스냅샷을 남긴다.
  backupPut: (ds, key, data) => set(ref(db, ROOT + '/__backup__/' + ds + '/' + key), data),
  // 이 시간 슬롯 백업이 이미 있나 — at 필드 하나만 읽는다 (덮어쓰기 전 확인용).
  backupHas: (ds, key) => get(ref(db, ROOT + '/__backup__/' + ds + '/' + key + '/at')).then(s => s.exists()),
  backupList: ds => get(ref(db, ROOT + '/__backup__/' + ds)).then(s => s.exists() ? s.val() : {}),
  backupDates: () => get(ref(db, ROOT + '/__backup__')).then(s => s.exists() ? Object.keys(s.val()) : []),
  backupDelDate: ds => remove(ref(db, ROOT + '/__backup__/' + ds)),
  // 변경 내역 — 날짜별로 따로 쌓는다. id 를 앱이 정하므로(logSet) 같은 이벤트를 여러 대가
  // 써도 같은 자리에 덮여 한 줄로 합쳐진다 (상태 변경 이벤트는 id 가 결정적).
  logSet: (ds, id, entry) => set(ref(db, LOGROOT + '/' + ds + '/' + id), entry),
  logGet: ds => get(ref(db, LOGROOT + '/' + ds)).then(s => s.exists() ? Object.values(s.val()) : []),
  logWatch: (ds, cb, fail) => { const r = ref(db, LOGROOT + '/' + ds); const h = onValue(r, s => cb(s.exists() ? Object.values(s.val()) : []), fail); return () => off(r, 'value', h); },
  logList: () => get(ref(db, LOGROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  logRemove: ds => remove(ref(db, LOGROOT + '/' + ds)),
  // Firebase가 알려주는 실제 연결 상태
  onConnected: cb => onValue(ref(db, '.info/connected'), s => cb(s.val() === true)),
  // 연결이 죽었을 때 소켓을 끊었다 다시 붙인다
  reconnect: () => { try { goOffline(db); } catch(e){} setTimeout(() => { try { goOnline(db); } catch(e){} }, 150); },

  // ---- 공유 비밀번호 로그인 ----
  // 직원 전원이 계정 하나를 함께 쓴다. 이메일은 여기 고정하고 직원은 비밀번호만 친다.
  // 세션은 기기에 저장(browserLocalPersistence)되므로 기기당 한 번만 입력하면 되고,
  // 다음부터는 오프라인으로 켜도 로그인 상태가 복원된다.
  authWatch: cb => onAuthStateChanged(auth, u => cb(!!u)),
  signIn: pw => setPersistence(auth, browserLocalPersistence)
                  .catch(() => {})                       // 저장 실패해도 로그인은 시도
                  .then(() => signInWithEmailAndPassword(auth, STAFF_EMAIL, pw)),
  signOut: () => signOut(auth)
};
window.dispatchEvent(new Event('fb-ready'));
</script>

  // 모듈 스크립트의 DEV 와 반드시 같은 판정 (둘 다 고쳐야 함). localStorage 스코프만 여기서 분리.

  //   붙여넣기 창이 열리고 거기서 등록하면, 연결되는 순간 서버의 진짜 명단을 통째로

  var listFresh = false;
  function stageBackgroundState(next){

    renderWhenIdle();
    return true;
  }

  // 접힘 규칙은 하나뿐이다 — 대기 중인 팀이 있으면 펼침, 없으면 접힘.
  // 시계는 관여하지 않는다. 보고 있는데 시간이 지났다는 이유로 접히면 곤란하니까.
  // 손으로 접거나 편 것은 그대로 두되, 대기 여부가 바뀌면 기본 규칙으로 돌아간다.

  // (항목 ts 와 touched 는 둘 다 서버 시계다 — 같은 자라야 아래 유예 계산이 맞는다. 2026-09-16)

  function slotChangedAt(time){

    if (state) state.items.forEach(function(x){ if (x.time === time && (x.ts || 0) > t) t = x.ts; });
    // ★«미래»가 찍혀 있으면 «처음 본 시각»부터 잰다. ts 는 앞 값보다 반드시 커야 해서(stampTs)

    //   5초가 아니라 어긋난 만큼 늘어나고(2분 어긋내면 2분), 매번 «지금»으로 깎으면 차이가 늘
    //   0 이라 영영 안 접힌다 — 둘 다 실측으로 당했다(2026-09-16). 처음 본 시각을 붙들어야
    //   거기서부터 5초가 흐른다. 시계가 정상이면(거의 언제나) 이 가지는 안 탄다.
    var now = serverNow();

  function armSlotCollapse(time){

      delete collapseTimers[time];
      if (!slotHasWork(time)) renderWhenIdle();
    }, wait);
  }
  function keepSlotOpenForId(id){
    var it = id && find(id);

      armSlotCollapse(it.time);
    }
  }
  function slotHasWork(time){
    var it = openMenu && find(openMenu);
    return !!it && it.time === time;
  }
  function isCollapsed(time, pendCount){
    var done = (pendCount === 0);
    if (done && slotHasWork(time)) return false;
    var o = collapsed[time];
    if (o){
      if (o.done === done) return o.v;   // 대기 상태가 그대로면 손으로 정한 대로
      delete collapsed[time];            // 대기가 생기거나 사라지면 기본 규칙으로
    }
    if (!done) return false;

  /* ---------- 날짜 · 시간 ---------- */
  var KEEP_DAYS = 1; // roster 는 오늘+어제만 (어제만 「지난 명단」에 보임). 로그·백업은 오늘만.

  var WEEKDAYS = ['일','월','화','수','목','금','토'];
  function pad(n){ return (n<10?'0':'') + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  // "2026-08-29" → 그 날 자정의 Date (로컬)
  function parseYmd(ds){ var p = ds.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

  // "지금" 을 Firebase 서버 시계로 보정한 epoch(ms). 서버 시계를 아직 모르면 기기 시계 그대로.
  //  → 자동취소·자정넘어감·지금시간대·백업시간대·로그시각 이 전부 이걸 쓴다.
  //
  //  ★★ 시계는 둘뿐이고, 둘을 «절대 섞지 않는다». 새 코드를 넣을 땐 어느 쪽인지부터 정할 것.

  //   ① serverNow()  — «여러 기기가 같이 보는 시각»
  //      항목 ts(누가 최신인가) · touched · 시간대 접힘 유예 · 자동취소 · 자정 넘어감 ·
  //      지금 시간대 · 백업 시간대 · 로그 시각
  //      → 폰마다 시계가 달라도 같은 답이 나와야 하는 것들. 하나라도 기기 시계로 찍으면
  //        시계가 빠른 폰의 «오래된» 조작이 다른 폰의 «나중» 조작을 이긴다(2026-09-16 고침).
  //
  //   ② Date.now()   — «한 기기 안에서 경과만 재는 것»
  //      누름 팝(popUntil) · 정리 스로틀(lastPurgeAt) · 유령 클릭·롱프레스 · 눌림 애니메이션 ·
  //      uniqueId 의 잡음(시각이 아님)
  //      → 늘 자기 짝(같은 Date.now())하고만 뺀다. 밖으로 안 나간다.
  //
  //   ★두 부류를 빼면 시계 오차만큼 틀린다. 2026-09-16 에 접힘 유예에서 그걸 당했다 —
  //    ts 만 ①로 옮기고 touched 를 ②에 두는 바람에, 시계를 2분 어긋내니 유예가 2분이 됐다.
  function serverNow(){
    return Date.now() + (typeof fb === 'function' && fb() && fb().serverSkew ? fb().serverSkew() : 0);
  }
  // 예약 한 줄의 «마지막으로 바뀐 시각». 서버는 이 값이 큰 쪽을 남기고 작은 쪽을 버린다
  // (itemMerge 의 minTs 규칙) — 그래서 «누가 이기나»가 이 한 값으로 갈린다.
  // ★기기 시계로 찍으면 시계가 빠른 폰의 «오래된» 조작이 다른 폰의 «나중» 조작을 이긴다.
  //   특히 끊겼다 연결될 때, 큐에 쌓인 옛 조작이 그 사이의 최신 조작을 덮는다. 그래서 서버 시계다.
  // ★앞 값보다 반드시 커야 한다. 서버에 있는 ts 가 (이 고침 전에 찍힌) 미래 값이면, 그냥
  //   serverNow() 로 찍었다가는 «서버가 더 최신»으로 판정돼 내 수정이 조용히 버려진다.
  function stampTs(it){ return Math.max(serverNow(), ((it && it.ts) || 0) + 1); }
  // epoch(ms) → 한국시간(KST=UTC+9, 서머타임 없음) 벽시계 조각.

  function kstParts(ms){
    var d = new Date(ms + 9 * 3600 * 1000);
    return { y: d.getUTCFullYear(), mon: d.getUTCMonth(), day: d.getUTCDate(),

  }
  function nowParts(){ return kstParts(serverNow()); }

  // 오늘의 영업일 (KST). DAY_ROLLOVER=0 이라 자정에 넘어간다.
  // (마감이 자정을 넘기게 되면 그 시각으로 올려 그때까지는 전날로 잡는다)
  function bizDate(){
    var sn = serverNow(), t = sn + 9 * 3600 * 1000;
    if (kstParts(sn).h < DAY_ROLLOVER) t -= 86400000;   // 마감이 자정 넘길 때만 (지금은 DAY_ROLLOVER=0)
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function shiftDate(ds, n){
    var d = parseYmd(ds);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function dayGap(ds){ // ds 가 오늘(bizDate)로부터 며칠 떨어져 있나 (음수 = 과거)
    return Math.round((parseYmd(ds).getTime() - parseYmd(bizDate()).getTime()) / 86400000);
  }

  // viewDate 는 늘 오늘(bizDate). 날짜 전환 UI 없음 — 지난 날은 「지난 명단」 시트에서 읽기만.
  var viewDate = bizDate();

  // '9월 3일 (수)' 한 조각. 오늘밖에 없으니 '· 오늘' 같은 꼬리표는 안 붙인다.
  // 「9월 11일 (금)」 — 가운데 제목이 되면서 짧게(2026-09-11 오너 선택). 요일은 회색 괄호로 보조.
  function paintDate(){
    var p = viewDate.split('-');
    var w = WEEKDAYS[parseYmd(viewDate).getDay()];
    // 테스트판이면 날짜 뒤에 붙인다 — 날짜가 «가운데 절대 배치»라 밖에 두면 그 뒤에 못 선다.
    document.getElementById('dateLabel').innerHTML = (+p[1]) + '월 ' + (+p[2]) + '일 <span class="wday">(' + w + ')</span>'

  }

  // 순수: 날짜 키 목록에서 '지워도 되는' 것만 고른다.
  //  - 날짜 형식(YYYY-MM-DD)이 아닌 키는 무시(안 지움)
  //  - '가장 최근 날짜' 는 절대 안 지운다 (누군가의 '오늘' 일 수 있으므로 — 시계 오류 방어)
  //  - limit 보다 오래됐거나, futureLimit 이 주어졌는데 그보다 미래면 지움
  function stalePurgeDates(keys, limit, futureLimit){
    var ds = (keys || []).filter(function(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort();
    var newest = ds[ds.length - 1];
    return ds.filter(function(k){

    });
  }
  // 오래된 날짜 정리
  var lastPurgeAt = 0;
  function purgeOld(){
    var limit = shiftDate(bizDate(), -KEEP_DAYS);   // bizDate 는 서버 시계 기준
    purgeOldLocalLogs(limit);   // 이 기기 로컬 캐시만 — 다른 기기엔 영향 없음
    wqPurge();
    if (!hasStore()) return;
    // ↓ 여기서부터는 서버(모든 기기 공용) 데이터를 지운다. 세 겹으로 막는다:
    //  (1) 서버 시계를 아직 모르면(부팅 직후) 지우지 않는다 — bizDate 가 아직 기기 시계라서.
    //      연결되면 onConnected 에서 purgeOld 를 다시 부르므로 이때 미뤄도 곧 처리된다.
    //  (2) 서버 시계를 알아도 '가장 최근 날짜' 는 절대 안 지운다 (stalePurgeDates) — 어떤 버그든 방어.
    //  (3) 10분 내 이미 서버 정리를 했으면 건너뛴다 — 재연결이 잦아도 큰 읽기를 반복하지 않게.
    if (fb().serverSkewKnown && !fb().serverSkewKnown()) return;
    if (Date.now() - lastPurgeAt < 10 * 60000) return;
    lastPurgeAt = Date.now();
    fb().dayList().then(function(keys){
      stalePurgeDates(keys, limit).forEach(function(ds){ fb().dayRemove(ds).catch(function(){}); });
    }).catch(function(){});
    if (fb().logList){
      // 변경 내역은 「오늘」만 화면에 뜬다 → 어제 것은 안 보이는 죽은 데이터. 오늘 것만 남긴다.
      fb().logList().then(function(keys){
        stalePurgeDates(keys, bizDate(), bizDate()).forEach(function(ds){ fb().logRemove(ds).catch(function(){}); });
      }).catch(function(){});
    }
    if (fb().backupDates){
      // 백업은 오늘 것만. 자정 넘어가면 rolloverIfNeeded 가 어제 것을 바로 지우고,
      // 여기서는 놓친 경우까지 훑는다 (stalePurgeDates 가 '가장 최근 날짜' 는 남기므로,
      // 오늘 첫 백업 전이면 어제 것이 잠깐 남을 수 있다 — rollover 쪽이 이미 처리).
      fb().backupDates().then(function(keys){
        stalePurgeDates(keys, bizDate()).forEach(function(ds){ fb().backupDelDate(ds).catch(function(){}); });
      }).catch(function(){});
    }
  }

  /* ---------- 파싱 ---------- */
  function parse(text){
    var lines = String(text).split(/\r?\n/);
    var out = [], bad = [], seen = {};
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+/g,' ').trim();
      if (!line) continue;
      var m = line.match(/^(\d{1,2})\s*[:.시]\s*(\d{1,2})?\s*분?\s+(.+?)\s+(\d+)\s*명\s*(.*)$/);
      if (!m){ bad.push({ no: i+1, text: line }); continue; }
      var time = pad(+m[1]) + ':' + pad(+(m[2]||0));
      var name = m[3].trim();
      var pax  = parseInt(m[4],10);
      var tail = (m[5]||'').trim();
      var memo = '';
      var mm2 = tail.match(/^(.*?)\s*\((.+)\)$/);   // 뒤에 붙은 (메모)
      if (mm2){ tail = mm2[1].trim(); memo = mm2[2].trim(); }
      var status = 'pending';
      if (tail === '취소') status = 'cancelled';
      else if (tail === '방문') status = 'arrived';
      else if (tail){ bad.push({ no: i+1, text: line }); continue; }  // 뒤에 붙은 알 수 없는 말
      var hh = +m[1], mm = +(m[2]||0);
      if (hh > 23 || mm > 59 || pax < 1){ bad.push({ no: i+1, text: line }); continue; }
      var base = time + '|' + name + '|' + pax;
      seen[base] = (seen[base]||0) + 1;
      out.push({ id: base + '|' + seen[base], time:time, name:name, pax:pax, memo:memo, status:status, ts:0, seq: out.length });
    }
    out.bad = bad;
    return out;
  }

  function sortItems(a,b){
    if (a.time !== b.time) return a.time < b.time ? -1 : 1;
    return (a.seq||0) - (b.seq||0);
  }

  // 지금 상태에서 그 시간대에 속한 예약들.
  function itemsAt(time){
    return state ? state.items.filter(function(x){ return x.time === time; }) : [];
  }
  // 예약을 시간대별로 묶는다 (입력은 이미 sortItems 로 정렬돼 있어야 한다).
  function groupByTime(items){
    var gs = [], gi = {};
    (items || []).forEach(function(it){
      if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({ time: it.time, items: [] }); }
      gs[gi[it.time]].items.push(it);
    });
    return gs;
  }
  // 「지금 시간대」 — 아직 안 지났고(slotLive) 대기 팀이 남은 첫 시간대.
  function liveNowTime(groups){
    var now = nowMin();
    for (var i = 0; i < groups.length; i++){
      if (!slotLive(groups[i].time, now)) continue;
      if (groups[i].items.some(function(x){ return x.status === 'pending'; })) return groups[i].time;
    }
    return null;
  }

  /* ---------- 저장소 (Firebase Realtime Database) ---------- */
  function fb(){ return window.__fb; }
  function hasStore(){ return !!fb(); }

  /* 명단은 예약별 노드(roster/<날짜>/items/<해시>)로 저장한다. 각 변경은 그 노드 하나만
     즉시 쓴다 — 두 기기가 다른 예약을 동시에 바꿔도 서로 안 겹치고, 같은 예약이면
     itemMerge 가 get→조건부 update() 로 필드 단위로 합친다(트랜잭션 아님 — 콜드 캐시에서
     abort). 하루치를 통째로 읽고-합치고-덮어쓰던 merge/rosterTs/staging 은 없앴다. */
  var unwatch = null;
  var rosterLoadEpoch = 0;
  function loadTicket(){ return { epoch: ++rosterLoadEpoch, date: viewDate }; }
  function ticketCurrent(ticket){
    return ticket.epoch === rosterLoadEpoch && ticket.date === viewDate;
  }
  function stopWatch(){
    if (unwatch){ unwatch(); unwatch = null; }
  }
  function itemsToState(ds, res){
    var arr = (res.items || []).filter(function(it){ return it && it.id && it.time; });
    return { date: ds, items: arr.slice().sort(sortItems) };
  }
  var migratedDates = {};   // 구→신 형식 변환은 날짜당 한 번만 시도
  // 화면에 영향 주는 필드만으로 비교 (ts 는 쓸 때마다 바뀌고 표시엔 무관 → 제외)
  function itemsSig(items){
    return (items || []).map(function(it){
      return [it.id, it.time, it.name, it.pax, it.memo || '', it.status, it.seq || 0].join('');
    }).join('');
  }
  function applyRemoteItems(ds, res){
    listKnown = true;                                       // 실시간 수신도 «읽었다»
    if (ds !== viewDate) return;
    listFresh = true;   // «지금 보는 날짜»의 명단을 이번 연결에서 받았다 — 자동 취소가 이걸 본다
    var next = itemsToState(ds, res);
    // 구 형식(items 가 배열)이면 신 형식(해시 키 객체)으로 1회 변환해 둔다.
    if (res.legacy && next.items.length && hasStore() && !migratedDates[ds]){
      migratedDates[ds] = 1;
      fb().itemsReplace(ds, next.items).catch(function(){ migratedDates[ds] = 0; });
    }
    // 서버가 기준. 단 두 가지는 내 쪽을 유지한다:
    //  1) 서버에도 있는 항목인데 내가 방금 바꾼 게 더 최신(ts 비교)
    //  2) 아직 서버로 못 간 내 변경 — 큐(wqMap)에 put 이면 화면에 유지, del 이면 화면에서 뺀다.
    //     (왕복 사이에 다른 기기 변경이 끼어들어도, 방금 추가/삭제한 예약이 깜빡이지 않게)
    if (state && state.date === ds){
      var srv = {}; next.items.forEach(function(it){ srv[it.id] = it; });
      state.items.forEach(function(loc){
        var s = srv[loc.id];
        var q = wqMap[wqk(ds, loc.id)];
        if (s && (loc.ts || 0) > (s.ts || 0)) srv[loc.id] = loc;
        else if (!s && q && q.op === 'put') srv[loc.id] = loc;
      });
      Object.keys(wqMap).forEach(function(k){
        var q = wqMap[k];
        if (q && q.date === ds && q.op === 'del') delete srv[q.id];
      });
      next.items = Object.keys(srv).map(function(k){ return srv[k]; }).sort(sortItems);

  function watchRemote(){

    });

  function sync(){
    var syncDate = viewDate;
    if (!hasStore()) return Promise.resolve();
    return fb().itemsGet(syncDate).then(function(res){

    }).catch(function(){});
  }

  /* ---------- 오프라인 쓰기 큐 (예약 노드) ----------
     Firebase RTDB 웹 SDK 는 오프라인 쓰기를 메모리에만 큐잉 → 새로고침·앱 종료를 못 버틴다.
     예약 변경(방문·취소·메모·추가·삭제)을 localStorage 에도 남겨, 다시 떴을 때 서버보다
     새 것만(ts 비교) 재적용한다. 붙여넣기·초기화 같은 통짜 교체는 큐에 넣지 않고 큐만 비운다.
     변경 내역 log 는 별도 아웃박스가 담당하고 재적용 시 다시 기록하지 않으므로,
     여러 기기가 겹쳐도 「최근 변경 내역」이 중복되지 않는다. */
  var WQ_KEY = 'ix-wq-v1:' + (IS_DEV ? 'dev' : 'prod');
  var WQ_OP_TIMEOUT = 10000;
  var WQ_MAX_IDLE_RETRY = 20;   // 이만큼 연속으로 한 건도 못 보내면 자동 재시도만 멈춘다.
  var wqMap = wqRead();          // 큐는 그대로 둔다 — 앱 복귀·재연결·새 변경 때 wqWake 가 다시 시도한다.
  var wqTimer = null, wqDelay = 3000, wqBusy = false, wqIdleFails = 0;

  function wqRead(){
    try {
      var v = JSON.parse(localStorage.getItem(WQ_KEY) || '{}');
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch(e){ return {}; }
  }
  function wqSave(){
    try {
      if (Object.keys(wqMap).length) localStorage.setItem(WQ_KEY, JSON.stringify(wqMap));
      else localStorage.removeItem(WQ_KEY);
    } catch(e){
      try { localStorage.removeItem(LOG_CACHE_KEY); localStorage.setItem(WQ_KEY, JSON.stringify(wqMap)); }
      catch(e2){}
    }
  }
  function wqk(date, id){ return date + '|' + id; }
  function wqMerge(a, b){ var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; }

  // prev(없으면 null)에 새 변경을 얹은 큐 엔트리 (순수 — 저장·전송 안 함).
  // 객체는 항상 복사해 담는다 (state.items 의 항목과 참조를 공유하지 않게).
  function wqEntry(prev, date, id, op, payload){
    var ts = (payload && payload.ts) || serverNow();   // 되돌림 값도 서버 시계 — ts 는 한 자로만 잰다
    var pts = Math.max(ts, (prev && prev.ts) || 0);
    if (op === 'del') return { date: date, id: id, op: 'del', ts: ts };
    if (op === 'put') return { date: date, id: id, op: 'put', item: wqMerge(payload.item, {}), ts: pts };
    var patch = payload.patch;                              // op === 'patch'
    if (prev && prev.op === 'del') return prev;             // 삭제가 걸려 있으면 삭제 유지 (put 만 덮음)
    if (prev && prev.op === 'patch')
      return { date: date, id: id, op: 'patch', patch: wqMerge(prev.patch, patch), ts: pts };
    if (prev && prev.op === 'put')
      return { date: date, id: id, op: 'put', item: wqMerge(prev.item, patch), ts: pts };

  var wqHolding = 0;
  function wqPush(id, op, payload){

    // 담아 버리면 연결됐을 때 «명단을 본 적도 없는 상태에서 만든 변경»이 서버로 올라간다.
    if (!listKnown){ errLog('쓰기', '명단 미수신 상태의 쓰기 차단', op); return; }
    var date = viewDate, k = wqk(date, id);
    wqMap[k] = wqEntry(wqMap[k] || null, date, id, op, payload);

  // 하나씩 보내면 del 의 로컬 이벤트가 put 이 큐에 오르기 전에 도착해 applyRemoteItems 가 새 행을
  // 「서버에 없고 큐에도 없음」으로 보고 지운다 → 재전송(3초 백오프)까지 행이 사라졌다 나타났다.
  function wqBatch(fn){

  }
  function wqValid(e){
    // 큐는 늘 오늘 것만 만든다. 자정 직전 오프라인 쓰기가 자정 직후 올라오는 경우까지
    // (어제로) 받아주되, 그보다 오래됐거나 미래면 버린다.
    return e && /^\d{4}-\d{2}-\d{2}$/.test(e.date)
      && e.date >= shiftDate(bizDate(), -1)
      && e.date <= bizDate();
  }
  function wqPurge(){
    var changed = false;
    Object.keys(wqMap).forEach(function(k){ if (!wqValid(wqMap[k])){ delete wqMap[k]; changed = true; } });
    if (changed) wqSave();
  }
  function wqClearDate(date){
    var changed = false;
    Object.keys(wqMap).forEach(function(k){ if (wqMap[k] && wqMap[k].date === date){ delete wqMap[k]; changed = true; } });
    if (changed) wqSave();
  }
  function wqSchedule(){
    if (wqTimer || !hasStore() || !Object.keys(wqMap).length) return;

    wqDelay = Math.min(wqDelay * 2, 60000);
    wqTimer = setTimeout(function(){ wqTimer = null; wqFlush(); }, wait);
  }
  function wqWake(){
    if (wqTimer){ clearTimeout(wqTimer); wqTimer = null; }
    wqDelay = 3000;
    wqIdleFails = 0;   // 앱 복귀·재연결·다른 탭 변경 — 다시 보낼 만한 계기가 생겼다
    wqFlush();
  }
  function wqOnce(p){          // 각 쓰기에 시한을 둬 오프라인에서 매달리지 않게
    return new Promise(function(res){
      var t = setTimeout(function(){ res(false); }, WQ_OP_TIMEOUT);
      p.then(function(v){ clearTimeout(t); res(v !== false); }, function(){ clearTimeout(t); res(false); });
    });

  function wqFlush(){

    var okCount = 0;
    Promise.all(keys.map(function(k){
      var e = wqMap[k];
      if (!wqValid(e)){ delete wqMap[k]; return Promise.resolve(); }
      var call;
      try {
        call = e.op === 'del' ? wqOnce(fb().itemDel(e.date, e.id).then(function(){ return true; }))
             : e.op === 'put' ? wqOnce(fb().itemMerge(e.date, e.id, e.item, e.ts, true))
             :                  wqOnce(fb().itemMerge(e.date, e.id, e.patch, e.ts, false));

      return call.then(function(applied){
        if (!applied) return;
        okCount++;
        // 보내는 사이 같은 예약에 새 변경이 얹혔으면(wqEntry 가 새 객체 반환) 그건 다음 flush 로.
        if (wqMap[k] === e) delete wqMap[k];

    })).then(done, done);   // Promise.all 은 여기서 거부되지 않지만(각 항목이 늘 resolve), 대비해 같은 마무리
    function done(){
      wqBusy = false;
      wqSave();
      var left = Object.keys(wqMap).length;
      if (okCount){ wqDelay = 3000; wqIdleFails = 0; }   // 하나라도 나갔으면 정상으로 본다
      else if (left) wqIdleFails++;                      // 한 건도 못 보냄 = 연속 실패 누적
      // 큐가 남았고 아직 포기 문턱 전이면 백오프 재시도를 건다.
      // 문턱을 넘으면 타이머만 멈춘다 — 큐는 유지되고 wqWake(복귀·재연결·새 변경)가 다시 연다.
      if (left && wqIdleFails < WQ_MAX_IDLE_RETRY) wqSchedule();

  // 다른 탭이 큐에 얹었을 수 있다. 큐는 키 하나에 map 전체라, 통째로 갈아치우면 두 탭이
  // 거의 동시에 얹을 때 한쪽이 사라질 수 있다 → 들어온 것을 병합만 한다(ts 큰 쪽 우선).
  // 다른 탭이 지운 항목은 우리한테 남지만, 재전송해도 itemMerge 가 ts 로 걸러 무해하다.
  window.addEventListener('storage', function(e){

    Object.keys(incoming).forEach(function(k){
      var mine = wqMap[k], theirs = incoming[k];
      if (!mine || (theirs.ts || 0) >= (mine.ts || 0)){ wqMap[k] = theirs; touched = true; }
    });
    if (touched){ wqSave(); wqWake(); }
  });

  // 한 예약 노드에 부분 변경(상태·메모 등)을 반영한다. 실제 전송은 큐가 맡는다.
  function writeItem(id, patch){ wqPush(id, 'patch', { patch: patch, ts: patch && patch.ts }); }
  // 예약 하나를 통째로 쓴다 (새 예약 추가).
  function putItem(item){ wqPush(item.id, 'put', { item: item, ts: item.ts }); }
  function delItem(id){ wqPush(id, 'del', { ts: stampTs(find(id)) }); }
  // 명단을 통째로 새로 쓴다 (붙여넣기·초기화). 개별 대기분은 이 교체가 덮으니 큐에서 버린다.
  // ★끊긴 동안에는 통째 교체를 하지 않는다. 낱개 변경(방문·취소·추가·삭제)은 쓰기 큐가
  //   합쳐 주지만 이건 set 이라 «서버에 뭐가 있든 이걸로 바꿔라» 가 된다. 못 읽은 상태에서
  //   보내면 남의 명단을 지운다. 부르는 쪽이 false 를 보고 사용자에게 알린다.
  function replaceItems(arr){
    if (!connReady()) return false;
    wqClearDate(viewDate);
    if (!hasStore()) return false;
    var ds = viewDate;
    fb().itemsReplace(ds, arr).catch(function(){});
    return true;
  }

  /* ---------- 명단 백업 ----------
     roster/__backup__/<날짜>/<키> 에 명단 스냅샷을 남긴다. 매시간 :20 (자동취소 :15 뒤).
     한 시간 슬롯(h12..h19)은 한 번 만들어지면 안 건드린다 — 첫 저장이 그 시간의 기록.
     앱을 껐다 켜거나 다른 폰이 붙어도, 있던 스냅샷을 지금 상태로 덮어쓰지 않는다.
     하루 최대 8개. 자정 넘어가면 rolloverIfNeeded 가 어제 백업을 지운다 (오늘 것만 유지).
     되돌리기는 없다 — 「지난 명단」에서 그 시점 명단을 단톡방 양식으로 복사해 붙여넣으면 된다. */
  var BACKUP_MAX_TRIES = 3;                                        // 한 시간 안에서 재시도(확인·쓰기) 한도
  var backupState = { hour: -1, tries: 0, triesHour: -1 };         // hour = 이번 세션에서 처리 끝난 시간

  function doBackup(key, done){
    if (!connReady() || !state || !state.items.length){ if (done) done(false); return; }
    var ds = viewDate;
    var snap = {
      at: serverNow(),   // 어느 폰이 남겼든 시트에 같은 시각으로 보이게
      n: state.items.length,
      items: state.items.map(function(it){ return wqMerge(it, {}); })
    };
    // wqOnce = 10초 시한. 오프라인에서 set() 프로미스가 매달려 콜백이 안 풀리는 걸 막는다.
    wqOnce(fb().backupPut(ds, key, snap).then(function(){ return true; })).then(function(ok){
      if (done) done(ok);
    });
  }
  // 5초 인터벌에서 autoCancel 다음에 부른다
  function maybeHourlyBackup(){
    if (!connReady() || !state || !state.items.length) return;  // 빈 명단은 백업 안 함
    var p = nowParts(), h = p.h;                            // KST · 서버 시계
    if (h < 12 || h > 19 || p.min < 20) return;             // 영업 12~19시대, 매시 :20 이후 한 번
    if (backupState.hour === h) return;                     // 이 시간엔 이미 처리(서버 확인 중 포함)
    if (backupState.triesHour !== h){ backupState.tries = 0; backupState.triesHour = h; }  // 새 시간 = 카운터 리셋
    backupState.hour = h;                                   // 확인 끝날 때까지 재진입 막기
    // 이 시간 백업이 서버에 이미 있으면 그대로 둔다. 없을 때만 새로 만든다.
    fb().backupHas(viewDate, 'h' + h).then(function(exists){
      if (exists) return;                                   // 이미 있음 → 이 시간 끝
      doBackup('h' + h, function(ok){
        if (ok) return;
        // 쓰기 실패 — 이 시간 안에서 BACKUP_MAX_TRIES 번까지만 재시도 (hour=-1 → 다음 틱).
        if (++backupState.tries < BACKUP_MAX_TRIES) backupState.hour = -1;
      });
    }).catch(function(){
      // 확인 실패 — 마찬가지로 몇 번만 다시 (계속 실패해도 5초마다 무한히 두드리지 않게).
      if (++backupState.tries < BACKUP_MAX_TRIES) backupState.hour = -1;
    });
  }
  // 백업은 오늘 것만 보관하므로(purgeOld) 시각만 보인다. at 은 serverNow() 라 KST 로 읽는다.
  function backupWhen(at){
    var p = kstParts(at);
    return pad(p.h) + ':' + pad(p.min);
  }

  // 연결 표시는 Firebase가 알려주는 실제 상태만 반영한다.
  // 개별 읽기·쓰기 실패로는 켜지 않는다 — 잠깐 끊겼다 붙는 동안 계속 떠 있게 되므로.
  var online = false;
  /* ---------- 인터넷이 끊겼을 때 — 규칙 한 자리 ----------
     ★말은 하나로 — 「인터넷이 연결되지 않았습니다」. 빈 화면·잠금화면·막힌 동작 토스트가
       전부 이 한 문장을 쓴다. 예전엔 「연결되면 쓸 수 있습니다」(언제 되나)와 「연결이 끊겨
       지금은 …할 수 없습니다」(왜 안 되나)가 섞여 다섯 가지였다 — 조건이 하나인데 말이
       다섯이면 읽는 쪽이 매번 새로 해석해야 한다(오너 2026-09-15).
       예외는 하나뿐이다 — 「명단을 아직 불러오지 못했습니다」. 온라인인데 명단이 안 온
       경우라 인터넷 탓이 아니다. 잠금화면의 「연결을 확인해 주세요」와 지난 명단의
       「연결되면 볼 수 있습니다」도 2026-09-15 에 이 한 문장으로 흡수했다 — 조건이 하나인데
       말이 셋이면 볼 때마다 새로 해석해야 한다(오너).
     사례마다 따로 판단하다 보니 앞뒤가 흔들렸다(오너 2026-09-15). 기준을 셋으로 못 박는다.

     ① listKnown — «서버 명단을 이 세션에서 한 번이라도 읽었나»
        읽은 적 없으면 화면의 빈 명단은 «비었다»가 아니라 «모른다»다. 모르는 상태에서 뭘 쓰면
        연결됐을 때 남의 명단을 지운다. → 못 읽었으면 «쓰기 전부 금지».
     ② connReady() — «지금 서버와 통하나»
        소켓 상태만 본다. 사람이 명단을 바꾸는 동작은 전부 이것 하나로 막는다.
     ③ listFresh — «화면의 명단이 이번 연결에서 받은 것인가»
        ②가 참이어도 붙은 직후 몇 백 ms 는 옛 명단이다. 사람이 누르는 동작은 그 사이에도
        안전하지만(누른 값이 곧 최신), 앱이 «대기로 남아 있다»를 근거로 스스로 판단하는
        자동 취소는 옛 명단으로 돌면 남의 체크를 덮는다. → 자동 취소만 이것까지 본다.

     표 (A = 켤 때부터 끊김 · B = 쓰는 중 끊김)

       동작                    A            B           근거
       앱 열기                 열림          —          서비스워커가 껍데기·SDK 를 들고 있다
       로그인(비번)             금지          —          서버에서만 확인 가능. 비번을 «치기 전에» 알린다
       명단 보기               «모른다» 안내   그대로 보임   A 는 못 읽은 것이지 빈 게 아니다
       방문·취소 체크           금지          금지         ★2026-09-15 오너: 명단을 바꾸는 건 전부 막는다
       예약 추가·수정·삭제        금지          금지         〃
       명단 복사               (명단 없음)    허용         화면에 있는 것을 그대로 옮길 뿐
                                                    ※한때는 «낱개 변경(update)은 큐가 합쳐 주니 B 에서
                                                      허용»이었다. 오너가 뒤집었다(2026-09-15) — 끊길
                                                      일 자체가 드문 나라에서, 드물게 끊긴 동안 쓴 것이
                                                      나중에 남의 변경을 덮을 위험을 지고 갈 이유가 없다.
                                                      지금 기준은 «명단을 바꾸면 금지, 안 바꾸면 허용».
       명단 등록·초기화          금지          금지         통째 교체 — 남의 변경을 지운다
       로그아웃                금지          금지         다시 들어올 방법이 없어진다
       지난 명단               금지          금지         서버에만 있다
       최근 변경 내역           로컬만        로컬만       서버 것이 빠진 채로도 쓸모가 있다
       자동 백업               안 함         안 함        connReady 가드가 이미 있다
       자동 취소               안 함         안 함        ★체크를 막았으니 같이 멈춘다 — 안 그러면
                                                      체크 못 한 손님이 15분 뒤 취소로 찍힌다.
                                                      «붙은 직후»도 아직 안 한다(③ listFresh) —
                                                      옛 명단으로 돌면 남의 체크를 덮는다
       룰렛                   허용          허용         서버와 무관
       끊김 알림               (안내문)      칩 하나       ★토스트·띠까지 넣었다가 전부 뺐다
                                                      (2026-09-15). 끊길 일 자체가 드문데 네 겹은
                                                      과했다 — 상태는 칩, 건수는 서랍 한 줄.

     ★새 기능을 붙일 땐 이 표에 줄을 먼저 추가하고 구현할 것. 「그때그때」가 흔들림의 원인이었다. */
  function connReady(){ return online && hasStore(); }
  // 서랍 하단의 연결 표시 한 줄. setSync·openDrawer 가 부른다.
  // ★끊긴 동안의 «체크·추가·수정·삭제»는 막지 않는다. 막으면 직원이 「누가 왔는지」를 머리에
  //   들고 있어야 하는데, 영업 중엔 그게 큐보다 훨씬 위험하다. 이 셋은 update(한 칸만 고침)라
  //   다른 폰 것과 합쳐진다 — 쓰기 큐가 바로 이 경우를 위해 만든 물건이다.
  //   막는 건 «합칠 수 없는 것»뿐: 명단 등록·초기화(set — 통째로 덮어씀), 로그아웃(다시 못 들어옴).
  // ★「몇 건이 안 올라갔나」를 여기 띄웠다가 뺐다(2026-09-15). 서랍을 열어야 보이니 미리
  //   알려주지도 못하고, 숫자를 봐도 할 수 있는 게 없고(인터넷 고치는 건 「연결 안 됨」이 이미
  //   말한다), 무엇보다 이 앱의 「대기」는 «손님이 아직 안 왔다»는 뜻이라 말이 겹쳤다.
  //   「연결 안 됨」이 떠 있는 동안 한 일은 아직 안 나갔다 — 그것만 알면 된다.
  function paintConn(){
    var ready = connReady();
    var cf = document.getElementById('dwConn');
    if (!cf) return;
    cf.className = 'dwfoot' + (ready ? '' : ' off');
    // 여기엔 연결 상태 한 마디만 둔다 — 빌드 도장을 붙여 봤다가 뺐다(오너 2026-09-16).
    cf.innerHTML = '<span class="dot' + (ready ? '' : ' stale') + '"></span>'
      + (ready ? '연결됨' : '연결 안 됨');
  }
  function setSync(ok){
    if (ok === false) listFresh = false;   // 끊긴 순간부터 화면의 명단은 «옛 것»이다
    if (ok !== undefined) online = ok;
    var d = document.documentElement;
    if (connReady()) d.removeAttribute('data-off');
    else d.setAttribute('data-off', '');
    paintConn();
  }

  /* ---------- 렌더 ---------- */
  // 상단 시간이 다음으로 넘어가는 기준
  //  - 정각(00분) 예약: 11분 지나면
  //  - 비정각 예약   : 그 시각이 되면 (5초)
  // 어느 쪽이든 그 시간대를 다 체크하면 그 즉시 넘어간다.
  var GRACE_ON_HOUR = 11, GRACE_OFF_HOUR = 5/60;
  var CLOSE_HM = '21:00';      // 퇴근 시각 — 상단 카드의 퇴근 타이머 기준 (KST · 서버 시계)
  var AUTO_CANCEL_MIN = 15;    // 예약 시각에서 이만큼 지나도 체크가 없으면 취소 (직원 :10 컷의 백스톱)
  var AUTO_CANCEL_WINDOW = 5;  // +15~+20분 사이에만. 지나간 시간대를 뒤늦게 훑지 않는다
                               // (1분이면 그 1분 동안 앱이 닫혀·끊겨 있을 때 영영 놓친다)

  // 예약 시간 선택 범위 — 예약 추가·수정 폼 공용. (영업 11:45–21:00, 예약 12–19시,
  // 변경으로 20시까지 받을 수 있음). 범위 밖의 기존 예약은 수정 폼이 그 값을 따로 넣어준다.
  var HOUR_MIN = 12, HOUR_MAX = 20;
  function hourOptions(){
    var s = '';
    for (var h = HOUR_MIN; h <= HOUR_MAX; h++) s += '<option value="' + pad(h) + '">' + pad(h) + '</option>';
    return s;
  }

  // 지금이 그 날의 몇 분째인가 (KST, 서버 시계 기준). 자동취소·지금시간대 판정에 쓴다.
  function nowMin(){
    var p = nowParts();
    return p.h * 60 + p.min + p.s / 60 + p.ms / 60000;
  }
  function slotMin(hm){
    var p = hm.split(':');
    return (+p[0])*60 + (+p[1]);
  }
  function slotLive(hm, now){
    var m = slotMin(hm);
    var grace = (m % 60 === 0) ? GRACE_ON_HOUR : GRACE_OFF_HOUR;
    return now < m + grace;
  }

  // 방문·취소·대기 팀 수를 센다. 여러 곳에서 같은 계산을 한다.
  function tallyStatus(items){
    var came = 0, off = 0;
    (items || []).forEach(function(x){
      if (x.status === 'arrived') came++;
      else if (x.status === 'cancelled') off++;
    });
    return { came: came, off: off, pend: (items ? items.length : 0) - came - off, total: items ? items.length : 0 };
  }

  // 하루가 끝났을 때 방문 / 취소가 각각 몇 팀이었는지.
  // 「17/17」만으로는 몇 팀이 실제로 왔는지 알 수 없다.
  function dayTally(items){
    var t = tallyStatus(items);
    var out = ['<span class="pc">방문 ' + t.came + '</span>'];
    if (t.off) out.push('<span class="pc">취소 ' + t.off + '</span>');
    return out.join('<span class="pcsep"> · </span>');
  }
  // 시간대 머리글 오른쪽 — 열린 칸은 「처리/전체」, 끝난 칸은 「방문 n · 취소 n」 (맨 끝 = 행의 ⋯ 열 쪽).
  // render 와 patchStatus 가 같이 쓴다.
  function slotMetaHtml(items){
    var t = tallyStatus(items);
    // 열린 시간대 = 진행도 「처리/전체」 하나. 다 처리된 시간대 = 내역 「방문 n · 취소 n」 하나 (0인 쪽은 안 쓴다).
    // 둘을 같이 쓰면 「취소 1  1/4」처럼 숫자가 겹치고, 「방문 0」 같은 빈 정보가 생겼다(2026-09-12 정리).
    var done = t.total > 0 && (t.came + t.off) >= t.total;
    if (!done) return '<b>' + (t.came + t.off) + '/' + t.total + '</b>';
    var parts = [];
    if (t.came) parts.push('방문 ' + t.came);
    if (t.off) parts.push('취소 ' + t.off);
    return '<span class="gbreak">' + parts.join(' · ') + '</span>';
  }


  // 상단 요약과 진행도만 다시 그린다 (목록은 건드리지 않는다)
  // 퇴근 타이머 — 1초마다 숫자만 갈아 끼운다(render 없음). 끝난 상태에서만 돌고, 다른 상태로 바뀌면 멈춘다.
  // 초 단위까지만: 소수점은 읽히지 않는 잔상이 되고 iOS 가 백그라운드·저전력에서 타이머를 조이니 의미가 없다.
  function closeLeftSec(){ return Math.max(0, Math.round((slotMin(CLOSE_HM) - nowMin()) * 60)); }
  // 다 처리한 화면에서 곰이 하는 말. 퇴근 전엔 남은 시간, 퇴근 뒤엔 인사.
  // 남은 시간은 「2시간 30분 07초」 꼴. 콜론꼴(2:31:07)이었는데 끝으로 갈수록 죽은 0 이 앞에
  // 붙어 「0:00:58」 처럼 어색해졌다(오너 2026-09-16) — 빈 단위는 아예 뗀다.
  function doneSay(){
    var left = closeLeftSec();
    if (!left) return '오늘 하루 고생하셨어요!';
    // .num = 고정폭 숫자. 없으면 1초마다 숫자 폭이 달라져 말풍선이 들썩인다(오너 2026-09-16).
    return '퇴근까지 <span id="doneCd" class="num">' + fmtLeft(left) + '</span> 남았어요!';
  }
  function doneBearHtml(){
    return '<div class="donebear"><div class="dbwrap">'
      + '<svg class="mk" viewBox="0 0 100 100" aria-hidden="true">'
      +   '<use href="#mkHeart"/><use href="#mkIksuni"/>'
      + '</svg>'
      + '<div class="say">' + doneSay() + '</div></div></div>';
  }
  // ★앞 단위는 그대로, 뒤 단위만 0 을 채운다(「2시간 30분 07초」).
  //   안 채우면 초가 10→9 로 떨어질 때마다 글자가 하나 줄어 말풍선이 1분에 두 번 들썩인다.
  //   앞 단위는 채우지 않는다 — 「09초 남았어요」는 뻣뻣하다. 앞 단위가 자릿수를 잃는 건
  //   저녁 내내 세 번뿐이고(시간이 빠질 때·분이 빠질 때·10초→9초), 그건 흔들림이 아니라 내용이
  //   실제로 바뀌는 자리다.
  function fmtLeft(s){
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    if (h) return h + '시간 ' + p(m) + '분 ' + p(x) + '초';
    if (m) return m + '분 ' + p(x) + '초';
    return x + '초';
  }
  var cdTimer = null;
  function cdTick(){
    var el = document.getElementById('doneCd');   // 이제 카드가 아니라 곰 말풍선 안의 숫자다
    // ★곰 화면이 내려갔으면 멈춘다. 전체 보기로 가면 이 칸은 숨겨질 뿐 지워지지는 않아서,
    //   id 만 보고 돌면 «안 보이는 숫자»를 하루 종일 1초마다 고친다(폰 배터리). 예전엔 카드가
    //   카운트를 들고 있어 paintHead 의 cdStop() 이 잡아 줬는데, 곰에게 옮기며 그 고리가 끊겼다.
    var em = document.getElementById('emptyMsg');
    if (!el || !em || !em.classList.contains('bear')){ cdStop(); return; }
    var s = closeLeftSec();
    if (!s){ cdStop(); render(); return; }   // 0 이 되면 곰이 「오늘 하루 고생하셨어요!」로 바뀐다
    el.textContent = fmtLeft(s);
  }
  function cdStart(){ if (!cdTimer) cdTimer = setInterval(cdTick, 1000); }
  function cdStop(){ if (cdTimer){ clearInterval(cdTimer); cdTimer = null; } }

  function paintHead(){
    paintDate();
    var all = state ? state.items.slice().sort(sortItems) : [];
    var gs = groupByTime(all);
    var nowTime = liveNowTime(gs);
    var slotPend = [];
    if (nowTime){
      gs.forEach(function(g){
        if (g.time === nowTime) slotPend = g.items.filter(function(x){ return x.status === 'pending'; });
      });
    }
    var leadRow = document.querySelector('.lead');
    var st = document.getElementById('slotTime');
    var lm = document.getElementById('leadMain');
    var ls = document.getElementById('leadSub');

    if (slotPend.length){
      cdStop();
      // 첫 줄 = 시각  팀 수 (+ 오른쪽 토글). 둘째 줄 = 몇인 몇팀 글자가 한 줄을 다 쓴다.
      // 「지금/다음」 라벨은 없다(오너, 2026-09-11) — 이 박스는 늘 «다음에 처리할 시간대»다.
      // 팀 수를 둘째 줄에 넣어 봤더니 구성 자리가 줄어 첫 줄로 되돌림(오너).
      st.textContent = nowTime;
      lm.className = 'leadmain num';
      lm.textContent = slotPend.length + '팀';
      var byPax = {};
      slotPend.forEach(function(x){ byPax[x.pax] = (byPax[x.pax] || 0) + 1; });
      ls.className = 'leadsub num comp';
      ls.innerHTML = Object.keys(byPax).map(Number).sort(function(a, b){ return a - b; })
        .map(function(p){ return '<span class="pc">' + p + '인<b>' + byPax[p] + '</b>팀</span>'; })
        .join('<span class="pcsep">·</span>');   // 「5인 1팀 · 7인 1팀」 — 짝이 한 덩어리로 읽히게(시간바 「방문 n · 취소 n」과 같은 구분)
    } else {
      // 처리할 시간대가 없으면 퇴근 타이머. 지난 시간대에 남은 대기는 대기 토글이 보여주므로 여기선 말하지 않는다.
      st.textContent = '';
      var left = closeLeftSec();
      // ★카드는 «상태»만 말한다(① 명사형). 퇴근까지 남은 시간과 인사는 곰 말풍선이 맡는다
      //   (2026-09-16 오너). 여기 있던 「퇴근까지 h:mm:ss」와 「오늘도 고생하셨습니다」를 옮긴 것이다.
      //   ※「남은 예약 없음」은 2026-09-12 에 한 번 뺐던 문구다(대기 토글이 이미 그 상태를 보여줘서).
      //     그땐 옆에 퇴근 카운트가 있어 군더더기였는데, 카운트가 곰에게 가면서 주 줄이 비어 되돌렸다.
      lm.className = 'leadmain num done';
      lm.textContent = all.length ? '남은 예약 없음' : '';
      ls.className = 'leadsub num';
      ls.innerHTML = all.length ? dayTally(all) : '';
    }

    var t = tallyStatus(all), done = t.came + t.off;
    var dp = document.getElementById('dayProg');

    dp.className = 'dayprog num' + (all.length ? '' : ' hide')
      ;   // 다 끝나도 색을 바꾸지 않는다 — 상태색은 체크 원에만(2026-09-12)

  // 스플래시 걷기 — 첫 render() 에서(명단이든 붙여넣기 화면이든 「보여줄 게 준비됨」) 페이드.
  // 무슨 일이 있어도 12초 뒤엔 걷는다 (연결이 영영 안 될 때 스플래시에 갇히지 않게).
  var splashEl = document.getElementById('splash');
  function hideSplash(){
    if (!splashEl || hideSplash._done) return;
    hideSplash._done = true;
    splashEl.classList.add('out');
    setTimeout(function(){ splashEl.classList.add('hide'); }, 300);
  }
  setTimeout(hideSplash, 12000);

  function render(){
    hideSplash();
    if (!interactionActive() && deferredState){
      state = deferredState;
      deferredState = null;
    }
    backgroundRenderPending = !!deferredState;
    var list = document.getElementById('list');   // 날짜 라벨은 아래 paintHead() 가 그린다
    var all = state ? state.items.slice().sort(sortItems) : [];
    var q = (query || '').trim().toLowerCase();
    var items = q
      ? all.filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; })
      : all;

    var qc = document.getElementById('qCount');
    if (q){
      qc.className = 'qcount' + (items.length ? '' : ' zero');
      qc.textContent = items.length + '건';
    } else {
      qc.classList.add('hide');
    }

    var groups = groupByTime(items);
    var allGroups = q ? groupByTime(all) : groups;
    var nowTime = liveNowTime(allGroups);

    paintHead();

    // 명단이 없으면 하단 메뉴와 검색은 할 일이 없다
    var allCount = all.length;
    var footEl = document.querySelector('.foot');
    if (footEl) footEl.classList.toggle('empty', !allCount);   // 명단이 없으면 바(.inner)만 숨긴다 — 업데이트 알림 알약은 그대로 떠 있어야 한다
    listEmpty = !allCount;   // 서랍 「이름 검색」이 읽는다 — 명단이 없으면 검색할 게 없다

    var em = document.getElementById('emptyMsg');
    em.classList.remove('bear');   // 곰 화면을 지나온 뒤의 「검색 결과 없음」이 곰 여백(0)을 물려받지 않게
    if (!items.length){
      if (q){
        em.classList.remove('hide');

      } else if (!listKnown){

        // 껐다 켜거나 명단을 다시 등록하려 들까 봐」 넣은 안전문이었는데, 그 사이 명단 등록을
        // 코드로 막았으니 «일어날 수 없는 일»을 말로 막고 있던 셈이다. 연결되면 된다는 건
        // 굳이 안 적어도 안다.

    // 방금 들어온 명단을 통째로 덮는다 — 그 사이 저쪽에서 누른 방문 체크가 사라진다.
    // 지킬 값어치가 있는 타이핑도 아니다: 둘 다 같은 단톡방 글을 붙여넣는 중이고,
    // 정말 다른 명단을 올릴 거면 「명단 초기화」(길게 누르기)를 거치는 게 맞는 길이다.

    var pendRows = 0;   // 「대기」 보기에서 보여줄 행 수 — 접혀 있어도 센다 (접힘 ≠ 없음)
    // 검색 중엔 groups 가 «걸린 사람만»이다. 머리글 숫자·끝남 판정은 시간대 «전체» 기준이어야
    // 체크 직후 부분 갱신(patchStatus — 전체 기준)과 숫자가 어긋나지 않는다 (0/1 → 3/9 로 튀던 것).

    allGroups.forEach(function(ag){ fullAt[ag.time] = ag.items; });

    //   「+20분」 같은 상수로 잘랐더니 10:23 에 10:00 대기가 사라졌다 — 방금 지난 시간대는
    //   아직 처리할 일이다. 가게가 실제로 다음 시간대로 넘어갔는지가 기준이라야 성급하지 않다.
    var nowM = nowMin(), lastStarted = -1;

      var rows = (viewMode === 'pending')
        ? g.items.filter(function(it){ return it.status === 'pending' || leaveTimers[it.id]; })

      var shut = q ? false : isCollapsed(g.time, pendN);
      // 완료됐는데 아직 5초 유예 중이면, 유예가 끝나는 시점에 접히도록 타이머를 걸어둔다.
      // (직접 체크한 폰은 keepSlotOpenForId 가 이미 걸었고, 다른 폰·자동취소는 여기서 건다)
      if (!q && !pendN && !shut && !collapseTimers[g.time] && !slotHasWork(g.time)
          && serverNow() - slotChangedAt(g.time) <= COLLAPSE_DELAY){
        armSlotCollapse(g.time);
      }

      var sec = document.createElement('section');
      sec.className = 'group' + (g.time === nowTime ? ' now' : (pendN ? '' : ' done')) + (shut ? ' shut' : '');
      sec.setAttribute('data-time', g.time);

      var head = document.createElement('button');
      head.className = 'ghead';
      head.type = 'button';
      head.innerHTML = '<span class="chev">' + CHEV_SVG + '</span>'
        + '<span class="gtime num">' + g.time + '</span>'
        + '<span class="gmeta num">' + slotMetaHtml(slotAll) + '</span>';
      head.setAttribute('aria-expanded', String(!shut));
      head.setAttribute('data-time', g.time);
      head.addEventListener('click', function(e){
        if (takeGhostClick(e)) return;
        toggleSlot(g.time);
      });
      sec.appendChild(head);

      if (!shut) rows.forEach(function(it){ sec.appendChild(rowEl(it)); });
      list.appendChild(sec);
      openCount += shut ? 0 : 1;
    });

    // 대기 모드인데 대기 중인 예약이 하나도 없으면 — 다 확인했다는 뜻.
    // (화면에 «그려진» 행이 아니라 «있는» 행으로 판정 — 전체 접기로 다 접혀 있어도 명단은 있다)
    if (viewMode === 'pending' && !pendRows && !q){
      list.innerHTML = '';
      em.classList.remove('hide');
      // 글자 한 줄 대신 곰이 말을 건다 (.donebear 주석 참고). 남은 시간은 1초마다 cdTick 이 고친다.
      em.className = 'empty bear';
      em.innerHTML = doneBearHtml();
      if (closeLeftSec()) cdStart(); else cdStop();
    }

    var foldBtnEl = document.getElementById('foldBtn');
    if (foldBtnEl){
      // 시간대가 하나도 안 그려졌으면(대기 모드에서 다 처리됨) 접을 것도 펼칠 것도 없다 — 기본 라벨로 두고 꺼 둔다.
      // 숨기면 알약이 2칸이 되어 모양이 바뀌므로 자리는 지킨다(iOS 툴바의 비활성 항목과 같은 처리).
      var noGroups = !list.querySelector('.group');
      var showFold = noGroups || openCount;
      var fl = foldBtnEl.querySelector('.foldlbl'), fp = foldBtnEl.querySelector('.foldp');
      if (fl) fl.textContent = showFold ? '전체 접기' : '전체 펼치기';
      if (fp) fp.setAttribute('d', showFold ? 'M6 10l6-6 6 6M6 20l6-6 6 6'    // 겹화살 위 = 접기 (시간바 .chev 와 같은 어휘)
                                            : 'M6 4l6 6 6-6M6 14l6 6 6-6');   // 겹화살 아래 = 펼치기
      foldBtnEl.disabled = noGroups;
    }

    // paste-open 은 붙여넣기 화면 여부. 창 상태와 어긋나 헤더가 계속 숨는 걸 막는다.
    document.body.classList.toggle('paste-open', !panel.classList.contains('hide'));
  }

  // 스크롤해 보이게 한다. (상·하단 바는 스크롤러 밖이라 높이를 손으로 뺄 필요가 없다.)

  // 중간에 엉뚱한 스크롤 위치가 프레임에 안 보인다.
  // smooth=true 는 사용자가 ⋯·수정·시간대펼치기로 가려진 걸 여는 경우 — 부드럽게 미끄러진다.
  // 아주 짧은 이동(SMOOTH_MIN 미만)만 즉시. 예전엔 44 였는데 시간바에 반쯤 가린 행(20~40px)이 전부 «점프»가 돼
  // 「부드럽게 됐다 안 됐다」로 보였다(오너 2026-09-11). ⋯ 메뉴는 통째 render 없이 붙이므로 짧아도 부드럽게 굴려도 된다.

    var wr = wrapEl.getBoundingClientRect();

    // 리뉴얼 전엔 둘 다 스크롤러 밖의 고정 띠라 wr.top/bottom 이 곧 경계였는데, 지금은 그 안에 떠 있어 따로 뺀다(2026-09-11).
    // .ghead 는 sticky 라 셸 밑 한 줄을 늘 덮는다. 그만큼 여유를 둔다
    var group = el.closest && el.closest('.group');
    var gh = group && group.querySelector('.ghead');
    var isGroup = el.classList && el.classList.contains('group');
    var pad = (gh && !isGroup ? gh.offsetHeight : 0);
    var shell = document.getElementById('topShell');
    var shellB = shell ? shell.getBoundingClientRect().bottom : wr.top;
    var footEl = document.querySelector('.foot'), footIn = footEl && footEl.querySelector('.inner');
    var footTop = footEl ? (footEl.querySelector('.updbar:not(.hide)') || (!footEl.classList.contains('empty') ? footIn : null)) : null;   // 업데이트 알약이 떠 있으면 그 윗면
    var footT = footTop ? footTop.getBoundingClientRect().top : wr.bottom;
    // 행: 도킹된 시간바(pad) «바로 밑» — 8 을 더하면 시간바가 도킹에서 8 밀려 내려와 앞 시간대 밑선이 비쳤다(오너 스크린샷 2026-09-11).
    // 시간대(펼침): 카드 밑 8 = 쉴 때와 같은 자리.
    var topEdge = Math.max(wr.top, shellB) + (isGroup ? 8 : pad);
    var bottomEdge = Math.min(wr.bottom, footT) + 2;   /* 행 밑 구분선이 알약 림 «밑에» 딱 숨는 지점(+2) — 0 이면 선이 1pt 삐져나와 「살짝 보인다」(오너 2026-09-11). 여백은 레이아웃(.menu 10) 그대로 */
    // 「딱 맞게」 — 가려진 만큼만 움직인다(여백 위·아래 8, 오너 2026-09-11). 아래가 가려졌을 땐 필요한 만큼만 올리되
    // 위(시간바)가 경계를 넘어가는 지점에서 멈춘다 — 화면보다 긴 시간대를 펼치면 결과적으로 시간바가 맨 위에 서고, 그게 가장 많이 보여주는 자리다.
    var move = 0;

    else if (erBottom > bottomEdge) move = Math.min(erBottom - bottomEdge, er.top - topEdge);
    if (Math.abs(move) <= 1) return;
    if (smooth && Math.abs(move) >= SMOOTH_MIN && wrapEl.scrollTo) wrapEl.scrollTo({ top: wrapEl.scrollTop + move, behavior: 'smooth' });
    else wrapEl.scrollTop += move;
  }

  function rowForId(id){

  var CHEV_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg>';   // 시간바·FAQ·지난 명단 공용 셰브론

    + ' stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>';

  /* 애플 공유 기호 — 위로 나가는 화살표 + 아래가 열린 상자. iOS 가 공유 시트를 여는 버튼에 쓰는 그 모양이다.

       사파리 배치 설정에 따라 공유 버튼이 도구막대에 바로 나오기도 하고 ⋯ 안에 들어가 있기도 해서,
       «어디를 눌러라»보다 «이 기호를 찾아라»가 어느 쪽에서나 맞는 말이다.
     획 굵기 2 — 세 점(dots3)은 채운 원이라 굵기가 없고, 이건 선 아이콘이라 앱의 선 아이콘들과 같은 2를 쓴다.
     크기 18 — 같은 .key 상자(26)에 들어가는 세 점과 같은 값. 17 이었는데 한 칸만 1px 작았다(2026-09-21). */
  var SHARE_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M12 3.5 V14"/><path d="M8.6 6.9 L12 3.5 L15.4 6.9"/>'
    + '<path d="M8 10H6.5A1.5 1.5 0 0 0 5 11.5v7A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 17.5 10H16"/></svg>';
  // 세 점 — 가로(⋯)는 행 메뉴 버튼, 세로(⋮)는 설치 안내. 같은 모양으로.
  function dots3(vertical){

  function tapMore(id){
    keepSlotOpenForId(id);

    if (openMenu && openMenu !== id) keepSlotOpenForId(openMenu);
    openMenu = (openMenu === id) ? null : id;
    if (openMenu){
      openRowMenu(id);
    } else {
      closeRowMenu();
      if ((deferredState || backgroundRenderPending) && !interactionActive()) render();   // 메뉴 닫히면 밀려 있던 상태 반영

  function runMenuAction(id, action, status){
    var it = find(id);
    if (!it) return;
    keepSlotOpenForId(id);
    if (action === 'status'){

      return;
    }
    if (action === 'edit'){
      if (!canWrite()){ openMenu = null; closeRowMenu(); render(); return; }

      openEdit(id);
