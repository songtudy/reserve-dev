<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- 매장 내부용 — 검색 색인 차단 (robots.txt 와 함께) -->
<meta name="theme-color" content="#0f1319">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="익순이">
<script>
// 테마에 딸린 것(속성·색)을 한 번에 바꾼다. 페인트 전 1회 + 서랍에서 바꿀 때(applyTheme)
// 둘 다 이 함수를 써서 상태가 갈라지지 않게 한다.
//
// 아이폰 노치: status-bar-style="black" 고정, theme-color 만 바꾼다. iOS 홈화면 앱은
// 이 앱셸(body position:fixed)에서 테마를 바꿔도 노치 색을 다음 실행 전까지 다시 안 칠한다
// (iOS 한계 — black-translucent·문서 스크롤 트릭 등 여러 방법 시도했으나 실기기에서 안 됨).
// 앱 켤 때는 정확하고, iOS 가 PWA 를 자주 종료해 대개 저절로 보정된다.
window.setThemeChrome = function(t){
  var d = document.documentElement;
  d.setAttribute('data-theme', t);
  d.style.colorScheme = t;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.content = (t === 'light') ? '#f4f6f9' : '#0f1319';
};
// 화면이 그려지기 전에 정한다. 나중에 바꾸면 어두운 화면이 한 번 번쩍인다.
(function(){
  var t = 'dark';
  try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch(e){}
  window.setThemeChrome(t);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>익순이</title>
<style>
  :root{
    --radius:14px;
    /* 바탕 */
    --ink:#0f1319;      --panel:#161b22;    --panel2:#1c222b;
    --line:#252c36;     --press:#26313d;
    --text:#f0f3f6;     --dim:#8792a0;      --off:#646f84;
    --ph:#7b8695;
    --scrim:rgba(6,9,13,.72);   --scrimLite:rgba(6,9,13,.6);
    /* 대기 — 금색. 다크는 한 값, 라이트만 칠/글자/큰글자를 나눈다 (대비 때문에) */
    --wait:#e8b757;     --waitTx:var(--wait);  --waitBig:var(--wait);
    --onWait:#241a05;   --mark:#463a13;
    /* 방문 — 초록 */
    --go:#5fb08a;       --goTx:var(--go);      --onGo:#08241a;
    --goBg:#141d19;     --goTag:#1b2f27;
    --goTagTx:#7fc9a5;  --goName:#94a49c;
    /* 취소·경고 — 붉은색 */
    --warn:#c9736a;     --warnBg:#1a1618;   --warnTag:#332323;  --warnTagTx:#d2938c;
    --warnName:#b8938e; --warnPax:#a8837e;  --warnPaxBg:#241c1d;
    /* 붙여넣기 오류 (줄 강조 + 안내문) */
    --errRow:rgba(201,115,106,.16);   --errTx:#e0a49d;
  }
  html[data-theme="light"]{
    --ink:#f4f6f9;      --panel:#ffffff;    --panel2:#eef1f6;
    --line:#dfe4ec;     --press:#e2e7ef;
    --text:#161a20;     --dim:#5c6772;      --off:#7e8899;
    --ph:#676f7d;
    --scrim:rgba(20,26,34,.44); --scrimLite:rgba(20,26,34,.34);
    /* 큰 글씨(상단 시간)는 대비 기준이 느슨해 더 밝은 금색을 쓸 수 있다 */
    --wait:#f5aa14;     --waitTx:#996100;   --waitBig:#c27400;
    --onWait:#2a1d02;   --mark:#fdf1d8;
    --go:#2f9c6e;       --goTx:#1d7a54;     --onGo:#ffffff;
    --goBg:#eefaf3;     --goTag:#d9f2e5;
    --goTagTx:#176b49;  --goName:#4a6a5b;
    --warn:#b43f36;     --warnBg:#fdf1ef;   --warnTag:#fadedb;  --warnTagTx:#a2463c;
    --warnName:#855c55; --warnPax:#7a4f48;  --warnPaxBg:#f6e7e5;
    --errRow:rgba(192,72,60,.12);   --errTx:#9e4438;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 앱 셸 구조 — body 는 화면 전체를 덮는 고정 틀. 절대 크기가 안 변한다.
     키보드는 그 위에 얹혀 올라오고(일반 앱처럼 뒤가 비침), 스크롤은 .wrap 안에서만.
     하단 바가 position:fixed 가 아니라 flex 항목이라 옛날처럼 뜨지 않는다. */
  html{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;
    overscroll-behavior:none;
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
    font-size:16px;
    line-height:1.4;
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;        /* 두 번 탭 확대 방지 */
    -webkit-text-size-adjust:100%;
    /* 탭이 잦은 매장용 앱 — 길게 눌러도 텍스트 선택·복사·조회 팝업이 안 뜨게 한다.
       입력칸과 Wi-Fi 정보만 예외로 선택을 허용한다(아래). */
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
  }
  input, textarea{ -webkit-user-select:text;user-select:text }
  .wnet .v{ -webkit-user-select:text;user-select:text;-webkit-touch-callout:default }
  /* 키보드가 올라오면 하단 바를 숨긴다 (어차피 키보드 뒤라 못 쓴다).
     상단 헤더는 늘 유지 — 숨겼다 되살리면 화면이 튄다. */
  body.keyboard-open > .foot{display:none}
  /* 붙여넣기 화면(명단이 비었을 때)은 카드 하나짜리 폼이다. 명단 관리 화면과 달리
     '고정'하지 않는다 — .wrap 이 (--kb 만큼 여유를 두고) 정상 스크롤되게 두고,
     openPaste 에서 scrollIntoView 로 부드럽게 이동한다. 키보드가 올라오면 iOS 가
     .wrap 을 네이티브 관성으로 스크롤해 입력칸을 드러낸다 (1.4.0 방식, iOS 에 맡김).
     입력칸 높이는 taFixedH 로 열 때 한 번만 정한다 (오류가 떠도 안 움직임 = 버튼 씹힘 방지). */
  body.paste-open #list{ display:none }        /* 붙여넣기 땐 명단이 비어 있다 */
  /* 예시 문구는 .hl 오버레이에 그린다 (iOS textarea 여러 줄 placeholder 버그 회피) */
  .hl .ln.ph{ color:var(--ph); -webkit-text-fill-color:var(--ph) }
  .wrap{
    flex:1 1 auto;min-height:0;
    width:100%;max-width:640px;margin:0 auto;
    /* 키보드가 올라오면 그만큼 아래 여백 → 아무 입력칸이나 키보드 위로 스크롤 가능.
       iOS 는 이 .wrap 을 스스로 스크롤해 포커스 칸을 드러내고, 화면 전체를 밀지 않는다. */
    padding:0 14px calc(18px + var(--kb, 0px));
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* header */
  header{
    flex:0 0 auto;z-index:20;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 8px;
  }
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
  .nav{display:flex;align-items:center;gap:0;margin-left:-10px;min-width:0}
  .nav button{
    width:40px;height:40px;flex:0 0 auto;padding:0;
    display:grid;place-items:center;
    background:none;border:0;color:var(--dim);
    line-height:0;cursor:pointer;border-radius:9px;
  }
  .nav button svg{display:block}
  .nav button:active{background:var(--press)}
  .nav button:disabled{opacity:.22}
  .date{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:15px;color:var(--text);font-weight:600;letter-spacing:.01em;
  }
  .dayprog{
    display:flex;align-items:center;line-height:1;
    font-size:14px;font-weight:800;color:var(--text);
    background:var(--panel);border:1px solid var(--line);
    padding:5px 10px;border-radius:8px;
  }
  .dayprog.full{color:var(--goTx);border-color:var(--goTx)}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .tools button.off{visibility:hidden;pointer-events:none}
  .tools button{
    width:40px;height:40px;flex:0 0 auto;
    display:grid;place-items:center;
    background:none;border:0;border-radius:9px;
    color:var(--dim);cursor:pointer;margin-right:-8px;
  }
  .tools button:active{background:var(--press)}
  .tools button.on{color:var(--waitTx);background:var(--panel2)}
  /* 실사용이 아닌 곳(테스트·로컬·복사본)에서만 뜨는 빨간 경고 배지.
     실DB 격리는 computeDev 라우팅이 담당 — 이건 "실사용 아님" 을 못 놓치게 하는 표시. */
  .devtag{
    flex:0 0 auto;padding:5px 11px;border-radius:7px;
    background:#e5484d;color:#fff;
    font-size:13px;font-weight:800;letter-spacing:.01em;line-height:1.2;
  }
  .offtag{
    display:none;align-items:center;flex:0 0 auto;
    padding:4px 9px;border-radius:8px;
    background:var(--warnBg);border:1px solid var(--warn);
    color:var(--warn);font-size:12px;font-weight:700;white-space:nowrap;line-height:1.2;
  }
  html[data-off] .offtag{display:inline-flex}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--go);opacity:.9}
  .dot.stale{background:var(--warn)}

  /* 인라인 흐름 — 자리가 모자란 조각만 다음 줄로 넘어간다 */
  .lead{display:block;margin-top:8px;line-height:1.5}
  .lead.hide{display:none}
  /* 「12:00 예약」과 「3팀 2인 1팀…」 두 덩어리로 읽히게 여백을 나눈다 */
  .slotlab{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-right:14px}
  .slottime{font-size:22px;font-weight:800;color:var(--waitBig);letter-spacing:-.03em;margin-right:2px}
  .leadmain{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-right:1px}
  /* 「남은 예약 없음」은 상태 설명이라 본문색. 초록은 옆의 방문 집계에만 쓴다 */
  .leadmain.done{font-size:16px;font-weight:600;color:var(--text)}
  /* 인원 요약은 자리가 모자란 조각만 다음 줄로 내린다 */
  .leadsub{font-size:13px;font-weight:600;color:var(--dim);display:inline}
  .leadsub .pc{white-space:nowrap}
  .leadsub.tally{margin-left:11px}
  .leadsub .tally-go{color:var(--goTx);font-weight:700}
  .leadsub .tally-off{color:var(--warn);font-weight:700}
  .leadsub .pcsep{color:var(--off)}

  /* 새 버전 알림 띠 — 헤더와 목록 사이의 안내 줄(순수 표시, 안 눌림). 동작은 하단
     「새로고침」→「업데이트」 버튼. flex 항목이라 목록을 아래로 밀 뿐 안 겹친다. */
  .updbar{
    flex:0 0 auto;display:block;width:100%;
    padding:8px 14px;text-align:center;
    background:var(--wait);color:var(--onWait);
    border-bottom:1px solid var(--line);
    font-size:13px;font-weight:600;letter-spacing:.01em;
  }

  /* search */
  .searchbar{
    flex:0 0 auto;position:relative;z-index:19;
    padding:10px 14px;background:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .searchbar.hide{display:none}
  .searchbar input{
    width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:11px;
    padding:11px 74px 11px 42px;font-family:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;
  }
  #qBack{
    position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;display:grid;place-items:center;
    background:none;border:0;color:var(--dim);cursor:pointer;
  }
  #qBack:active{color:var(--text)}
  .qcount{
    position:absolute;right:40px;top:50%;transform:translateY(-50%);
    font-size:12px;font-weight:700;color:var(--dim);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .qcount.zero{color:var(--warn)}
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar input:focus{outline:2px solid var(--waitTx);outline-offset:-1px}
  .searchbar input::-webkit-search-cancel-button{display:none}
  .searchbar button{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border:0;border-radius:9px;
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .searchbar button svg{display:block}
  .searchbar button:active{background:var(--press)}
  mark{background:var(--mark);color:var(--waitTx);-webkit-text-fill-color:var(--waitTx);border-radius:3px;padding:0 1px}

  /* time group */
  .group{margin-top:10px}

  .ghead{
    position:sticky;top:0;z-index:10;
    background:var(--ink);
    display:flex;align-items:center;gap:7px;
    width:calc(100% + 28px);margin:0 -14px;padding:9px 16px 8px;
    border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  .ghead:active{background:var(--press)}
  .chev{
    color:var(--dim);flex:0 0 auto;
    display:grid;place-items:center;width:14px;height:14px;line-height:0;
    transform:rotate(90deg);transition:transform .15s;
  }
  .chev svg{display:block}
  .group.shut .chev{transform:rotate(0)}
  /* 19px 굵게 = 큰 글씨 기준이 적용돼 밝은 금색을 쓸 수 있다 */
  .gtime{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--dim)}
  .gline{flex:1;height:1px;background:var(--line)}
  .gmeta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .gmeta b{font-weight:800;color:var(--text)}
  .gbreak{color:var(--dim);font-size:12px}
  .group.now .gtime{color:var(--waitBig)}
  .group.now .row{border-left-color:var(--waitBig)}
  .group.done .gtime{color:var(--off)}
  .group.done .gmeta b{color:var(--goTx)}

  /* row */
  .row{
    display:flex;align-items:stretch;gap:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
    transition:border-color .15s,opacity .15s,background .15s;
  }
  /* 눌리는 곳은 여기뿐. 60x60 이라 손가락에 넉넉하다 */
  .main{
    width:60px;flex:0 0 auto;display:grid;place-items:center;
    min-height:60px;cursor:pointer;padding:0;
    background:none;border:0;border-right:1px solid var(--line);
    color:inherit;font:inherit;
  }
  .main:active{background:var(--press)}
  .info{
    flex:1;min-width:0;display:flex;align-items:center;gap:12px;
    padding:14px 12px;
  }
  /* min-width:0 이 없으면 긴 이름이 있을 때 행이 화면 밖으로 넘친다 */
  .rbody{flex:1;min-width:0;display:flex;flex-direction:column}
  .rtop{display:flex;align-items:stretch;min-width:0}
  .check{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    border:2.5px solid var(--off);
    display:grid;place-items:center;line-height:0;color:transparent;
    transition:.15s;
  }
  .check svg{display:block}
  /* 누르는 요소에는 직접 지정한다. body 에만 걸면 아이폰에서 두 번 탭 판정이 남는다 */
  .main, .more, .ghead, .foot button, .menu button, .tools button, .nav button{
    touch-action:manipulation;
  }
  /* stretch 로 두어야 이름이 칸 폭에 맞춰 «...» 로 줄어든다.
     flex-start 면 글자 길이만큼 늘어나 인원칸이 화면 밖으로 밀려난다 */
  .who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
  .memo{
    margin-top:2px;font-size:12px;font-weight:600;line-height:1.3;
    color:var(--waitTx);text-align:left;
    word-break:break-all;
  }
  .row.arrived .memo, .row.cancelled .memo{color:var(--dim)}
  .erow.memorow{margin-top:6px}
  #addPanel .edit{padding:0}
  #addPanel h2{margin-bottom:12px}
  .name{
    display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;
    color:var(--text);-webkit-text-fill-color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 태그·인원칸·체크박스를 28px 한 줄에 맞춘다 */
  .tag{
    height:28px;display:inline-flex;align-items:center;
    font-size:12px;font-weight:800;letter-spacing:.04em;
    padding:0 9px;border-radius:8px;flex:0 0 auto;white-space:nowrap;
  }
  .tag.arrived{background:var(--goTag);color:var(--goTagTx);-webkit-text-fill-color:var(--goTagTx)}
  .tag.cancelled{background:var(--warnTag);color:var(--warnTagTx);-webkit-text-fill-color:var(--warnTagTx)}
  .pax{
    height:28px;display:inline-flex;align-items:center;
    font-size:15px;font-weight:700;color:var(--text);
    background:var(--panel2);border-radius:8px;padding:0 10px;flex:0 0 auto;
  }
  .more{
    width:44px;flex:0 0 auto;border:0;border-left:1px solid var(--line);
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .more svg{display:block}
  .more:active{background:var(--press)}

  .row.arrived{border-left-color:var(--go);background:var(--goBg)}
  .row.arrived .check{background:var(--go);border-color:var(--go);color:var(--onGo);-webkit-text-fill-color:var(--onGo)}
  .row.arrived .name{color:var(--goName);-webkit-text-fill-color:var(--goName);font-weight:600}
  .row.arrived .pax{color:var(--goTx);-webkit-text-fill-color:var(--goTx)}

  .row.cancelled{border-left-color:var(--warn);background:var(--warnBg)}
  .row.cancelled .name{color:var(--warnName);-webkit-text-fill-color:var(--warnName);font-weight:600}
  .row.cancelled .pax{color:var(--warnPax);-webkit-text-fill-color:var(--warnPax);background:var(--warnPaxBg)}
  .row.cancelled .check{border-color:var(--warn);color:var(--warn)}


  .edit{padding:0 10px 11px}
  .erow{display:flex;gap:6px}
  .erow label{
    display:flex;flex-direction:column;gap:4px;
    font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--dim);
  }
  .erow label.grow{flex:1;min-width:0}
  .erow input, .erow select{
    background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:11px;
    padding:10px 9px;font-family:inherit;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;width:100%;min-width:0;height:44px;
    -webkit-appearance:none;appearance:none;
  }
  .erow input:focus, .erow select:focus{outline:2px solid var(--waitTx);outline-offset:-1px}
  .erow select{
    text-align:center;text-align-last:center;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 20px, calc(100% - 9px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:22px;
  }
  .erow #e-hour, .erow #e-min{width:64px}
  .erow #e-pax{width:80px}
  .ebtn{display:flex;gap:6px;margin-top:7px}
  .ebtn button{
    flex:1;padding:10px 0;border-radius:11px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .ebtn #e-ok{background:var(--wait);color:var(--onWait);border-color:var(--wait)}
  .ebtn button:active{filter:brightness(.9)}

  .menu{display:flex;gap:6px;padding:0 10px 10px}
  .menu button{
    flex:1;padding:10px 0;border-radius:11px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .menu button:active{background:var(--press)}
  .menu .del{color:var(--warn)}

  /* 바텀시트 (예약 추가) — --kb 만큼 위로 올려 키보드에 안 가리게 한다 */
  .panel.asSheet{
    position:fixed;left:50%;bottom:0;
    transform:translateX(-50%) translateY(calc(-1 * var(--kb, 0px)));
    transition:transform .2s ease;
    z-index:71;width:100%;max-width:520px;margin:0;
    border-radius:18px 18px 0 0;border-bottom:0;
    display:flex;flex-direction:column;
    max-height:calc(100dvh - var(--kb, 0px) - 8px);overflow-y:auto;
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
  }
  .panel.asSheet.kb{ padding-bottom:14px }
  .panelScrim{position:fixed;inset:0;z-index:70;background:var(--scrim)}
  .panelScrim.hide{display:none}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:10px;overflow:hidden;
  }
  .panel h2{margin:0 0 4px;font-size:16px;font-weight:700}
  .panel p{margin:0 0 10px;font-size:12px;color:var(--dim);line-height:1.5}

  /* 명단 붙여넣기 — 명단이 비었을 때의 화면. .panel 카드 모양 그대로, 내용만큼만 크다.
     입력칸 높이는 창을 열 때 JS 가 한 번 고정하고 키보드와 무관하게 유지한다.
     경고문이 뜨면 입력칸을 그만큼만 줄여 등록 버튼 위치가 안 변한다 (버튼 씹힘 방지). */
  #pastePanel{ margin-top:10px }
  #pastePanel h2{font-size:17px}

  /* .tawrap 은 높이 고정 + overflow:hidden 인 '틀'이다 (스크롤러 아님). 그 안에서 <textarea>
     가 내부 스크롤을 갖고, .hl(빨간줄 레이어)은 textarea.scrollTop 에 맞춰 안쪽 .hlmove 를
     transform 으로 따라 움직인다. 명단이 길든 짧든 textarea 의 '외부' 크기가 항상 273px 로
     같아서 → iOS 의 키보드 포커스 처리(Visual Viewport pan)가 두 경우 동일하게 동작한다. */
  .tawrap{
    position:relative;height:273px;overflow:hidden;
    border:1px solid var(--line);border-radius:11px;
    background:var(--ink);
  }
  .tawrap:focus-within{outline:2px solid var(--waitTx);outline-offset:-1px}
  .tawrap textarea, .hl{
    font-family:inherit;font-size:16px;line-height:1.65;
    font-variant-numeric:tabular-nums;
    border:0;
    letter-spacing:0;
    white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;
  }
  textarea{
    position:absolute;inset:0;z-index:1;box-sizing:border-box;
    padding:11px;
    resize:none;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:transparent;color:var(--text);
    -webkit-appearance:none;appearance:none;
  }
  .hl{
    position:absolute;inset:0;z-index:0;overflow:hidden;
    color:transparent;-webkit-text-fill-color:transparent;
    pointer-events:none;
  }
  .hlmove{padding:11px 0;will-change:transform}
  .hl .ln{display:block;padding:0 11px}
  .hl .ln.err{
    background:var(--errRow);
    box-shadow:inset 3px 0 0 var(--warn);
  }
  /* 오류 안내는 위 안내문이 빨갛게 바뀌는 것뿐. 레이아웃은 전혀 안 움직인다 */
  #pasteHint.bad{ color:var(--errTx);font-weight:700 }

  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{
    flex:1;padding:13px 0;border-radius:11px;border:0;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--wait);color:var(--onWait)}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:active{filter:brightness(.9)}
  textarea::placeholder{ color:var(--ph) }

  /* footer — 앱 셸의 고정 항목. 스크롤은 위 .wrap 안에서만 일어난다 */
  .foot.hide{display:none}
  .foot{
    flex:0 0 auto;z-index:30;
    background:var(--ink);
    border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  }
  .foot .inner{max-width:640px;margin:0 auto}
  .frow{display:flex;gap:7px}
  .frow + .frow{margin-top:6px}
  .foot button{
    flex:1;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  }
  .foot .frow.sub button{
    padding:9px 0;font-size:12px;font-weight:600;
    background:none;color:var(--dim);border-color:transparent;
  }
  .foot button:active{background:var(--press)}
  /* 새 버전이 감지되면 「새로고침」이 「업데이트」(금색)로 — 이 앱의 주동작 버튼 색 (flagUpdate) */
  .foot button.upd{background:var(--wait);color:var(--onWait);border-color:var(--wait);font-weight:700}
  .foot button.upd:active{filter:brightness(.92);background:var(--wait)}

  .empty{text-align:center;color:var(--dim);font-size:13px;padding:36px 10px;line-height:1.7;white-space:pre-line}
  /* ---------- 메뉴 서랍 ---------- */
  .drawerScrim{
    position:fixed;inset:0;z-index:60;background:var(--scrimLite);
    opacity:1;transition:opacity .2s;
  }
  /* 전역 .hide는 display:none이라 페이드가 안 된다 — 서랍 막은 따로 둔다 */
  .drawerScrim.off{opacity:0;pointer-events:none}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:61;
    width:min(68vw, 258px);
    background:var(--panel);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateX(-101%);transition:transform .2s ease;
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0)}
  .dwtitle{display:flex;align-items:center;gap:11px;padding:0 18px 16px}
  .dwico{
    width:36px;height:36px;flex:0 0 auto;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  .dwnames{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dwname{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .dwsubtitle{font-size:12px;font-weight:600;color:var(--dim)}
  .dwsep{height:1px;background:var(--line);margin:10px 18px}
  .dwitem{
    display:flex;align-items:center;gap:8px;
    padding:13px 18px;border:0;background:none;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:600;text-align:left;
  }
  .dwitem:active{background:var(--press)}
  /* 세그먼트 토글 — 테마 다크/라이트, Wi-Fi 본관/별관 공용.
     강조색(--wait)은 두 테마 모두 「켜짐」으로 읽힌다. .wide 는 시트 안에서 꽉 차게. */
  .seg{display:flex;gap:6px}
  .seg button{
    padding:7px 15px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  }
  .seg button:active{background:var(--press)}
  .seg button.on{background:var(--wait);border-color:var(--wait);color:var(--onWait)}
  .seg.wide{gap:8px;margin:-2px 0 14px}
  .seg.wide button{flex:1;padding:11px 0;font-size:15px}
  .dwtheme{display:flex;align-items:center;gap:10px;padding:6px 18px 2px}
  .dwthlab{font-size:13px;font-weight:600;color:var(--dim)}
  .dwtheme .seg{margin-left:auto}
  .dwsep.push{margin-top:auto}
  .dwfoot{
    padding:12px 18px 0;
    font-size:12px;font-weight:600;color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  .dwfoot.off{color:var(--warn)}

  /* ---------- 안내 시트 ---------- */
  .sheetScrim{
    position:fixed;inset:0;z-index:70;background:var(--scrim);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheetScrim.hide{display:none}
  /* 메인 앱셸처럼 — 제목·버튼은 고정, 가운데(#sheetBody)만 세로 스크롤.
     긴 FAQ·명단에서도 제목·닫기가 안 사라지고 좌우 스크롤도 안 생긴다. */
  .sheet{
    width:100%;max-width:520px;
    background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;
    padding:20px 0 calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* 좌우 여백은 .sheet 가 아니라 안쪽 요소에 준다 — #sheetBody 가 시트 가장자리까지
     닿아, 스크롤바가 (내용 사이가 아니라) 시트 모서리에 붙는다. 내용은 좌우 대칭 18px. */
  .sheet h3{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin:0 18px 8px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  #sheetBody{
    flex:1 1 auto;min-height:0;min-width:0;padding:0 18px;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .sheetBtns{flex:0 0 auto;display:flex;gap:8px;margin:8px 18px 0}  /* 위 8px = 스크롤 목록과 버튼이 안 붙게 */
  .sheetBtns .sheetClose{flex:1}
  .sheetNever{
    flex:1;padding:13px 0;border-radius:11px;
    border:1px solid var(--line);background:none;
    color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .sheetNever:active{color:var(--text)}
  .faq{padding-bottom:8px}  /* margin 아님 — 스크롤 끝에서 margin-bottom 은 iOS 에서 안 보임 */
  .qa{border-bottom:1px solid var(--line)}
  .qa:last-child{border-bottom:0}
  .qa .q{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:14px 0;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--text);
    text-align:left;letter-spacing:-.02em;line-height:1.35;
  }
  .qa:first-child .q{padding-top:6px}   /* 첫 질문은 제목에 붙인다 (다른 시트 제목↔내용 간격에 맞춤) */
  .qa .qchev{margin-left:auto;flex:0 0 auto;color:var(--off);transition:transform .15s}
  .qa.open .q{color:var(--waitTx)}
  .qa.open .qchev{transform:rotate(90deg);color:var(--waitTx)}
  .qa .a{
    display:none;padding:0 0 15px;
    font-size:13px;line-height:1.7;color:var(--dim);white-space:pre-line;
  }
  .qa.open .a{display:block}
  .qa .a em{font-style:normal;color:var(--text);font-weight:600}
  /* 설치 안내 — 기기별 카드 */
  .plat{
    background:var(--panel2);border:1px solid var(--line);
    border-left:3px solid var(--off);border-radius:12px;
    padding:12px 14px 11px;margin:0 0 10px;
  }
  .plat:last-child{margin-bottom:0}   /* 마지막 카드 밑 여백 안 쌓임 */
  .plat.ios{border-left-color:var(--wait)}
  .plat.and{border-left-color:var(--go)}
  .plat .ph{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .plat .pn{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .plat.ios .pn{color:var(--waitTx)}
  .plat.and .pn{color:var(--goTx)}
  .step{
    display:flex;align-items:center;gap:9px;min-height:32px;
    padding:3px 0;font-size:13px;color:var(--dim);line-height:1.35;
  }
  .step .n{
    width:17px;height:17px;flex:0 0 auto;border-radius:50%;
    background:var(--line);color:var(--text);
    font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;
  }
  .step b{color:var(--text);font-weight:700}
  .key{
    display:inline-grid;place-items:center;
    width:26px;height:26px;margin:0 1px;
    border:1px solid var(--line);border-radius:7px;background:var(--ink);
    color:var(--text);line-height:0;vertical-align:middle;
  }
  .key svg{display:block}
  .sheetNote{font-size:13px;line-height:1.6;color:var(--dim);margin:0 0 14px}
  /* 변경 내역 */
  .lgrow{
    display:flex;align-items:baseline;gap:10px;padding:9px 0;
    border-top:1px solid var(--line);font-size:14px;
  }
  .lgrow:first-child{border-top:0;padding-top:2px}
  .lgt{flex:0 0 42px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .lgk{flex:0 0 auto;font-weight:700;color:var(--text)}
  .lgk.go{color:var(--goTx)}
  .lgk.off{color:var(--warn)}
  .lgs{flex:1;min-width:0;color:var(--dim);font-size:13px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheetMsg{font-size:14px;color:var(--dim);padding:6px 0 14px}

  /* 「지난 명단」 시트 — 목록은 「최근 변경 내역」(.lgrow) 처럼 한 줄(시각·요약·›), 행을 누르면 상세.
     요약 배색·굵기는 상단 「방문 n · 취소 n」(.leadsub) 과 맞춘다. */
  .bklist{padding-top:2px}   /* 다른 시트처럼 제목 밑 선 없이 — 8px 뒤 바로 내용 */
  .bkrow{
    display:flex;align-items:center;gap:10px;
    padding:12px 0;border-top:1px solid var(--line);cursor:pointer;
  }
  .bkrow:first-child{border-top:0}
  .bkrow:active{background:var(--press)}
  .bkt{flex:0 0 46px;font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .bksum{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 방문 초록 · 취소 빨강 — 「지난 명단」 목록의 요약(.bksum) 용. 상단 「방문 n·취소 n」과 같은 색.
     (상세 명단은 .bkvrow.go/.off 로 따로 처리) */
  #sheetBody em.go, #sheetBody em.off{font-style:normal;font-weight:700}
  #sheetBody em.go{color:var(--goTx)}
  #sheetBody em.off{color:var(--warn)}
  .bksep{color:var(--off);margin:0 5px}
  .bkchev{flex:0 0 auto;color:var(--off);display:flex;align-items:center}  /* FAQ 화살표와 같은 아이콘 */
  /* 구역 라벨(오늘/어제) · 상세 시간 헤더 — 완전히 같은 서체·크기 */
  .bkgroup,.bkvt{
    font-size:13px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--dim);
  }
  .bkgroup{padding:15px 0 7px;border-top:1px solid var(--line);margin-top:4px}
  .bkgroup + .bkrow{border-top:0;padding-top:4px}  /* 라벨 바로 밑 행은 라벨에 붙인다 (상세 .bkvt→.bkvrow 간격과 맞춤) */
  .bklist > .bkgroup:first-child{border-top:0;margin-top:0;padding-top:6px}  /* 첫 라벨: 제목과 숨 쉴 틈 */
  /* 상세: 그 시점 명단을 읽기 전용으로 (본 화면처럼 시간대로 묶고 방문·취소 색 구분) */
  .bkback{  /* 목록으로 — 화살표만. 제목 글자와 어울리게 (같은 색, 제목 높이에 맞춘 크기) */
    flex:0 0 auto;display:inline-flex;align-items:center;
    margin-left:-2px;padding:3px 5px 3px 0;
    color:var(--text);cursor:pointer;line-height:1;
  }
  .bkback::before{content:"‹";font-size:23px;font-weight:400;position:relative;top:-1px}
  .bkback:active{opacity:.4}
  /* 하단 버튼 위 공백은 margin 이 아니라 padding — 스크롤 컨테이너(#sheetBody) 안에서
     마지막 자식의 margin-bottom 은 iOS 에서 스크롤 끝까지 안 보인다. */
  .bkvlist{padding:2px 0 8px}
  /* 시간대 헤더 — 구분선은 헤더에 붙는다(위 여백 margin-top, 선 아래 살짝) */
  .bkvt{border-top:1px solid var(--line);margin-top:13px;padding:4px 0 6px}
  .bkvt:first-child{border-top:0;margin-top:0;padding-top:2px}
  /* 시간대별 읽기 전용 명단. 상태는 본 화면처럼 이름 색으로 (방문 초록 / 취소 빨강) + 작은 글자.
     칸(태그) 없이 — 밀도 높은 목록이라 색만으로 충분하고 더 깔끔하다. */
  .bkvrow{display:flex;align-items:baseline;gap:7px;padding:5px 0;font-size:14px;line-height:1.3}
  .bkvrow .nm{min-width:0;color:var(--text);font-weight:600;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bkvrow .px{flex:0 0 auto;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .bkvrow .st{flex:0 0 auto;font-size:12px;font-weight:700}
  .bkvrow.go .st{color:var(--goTx)}
  .bkvrow.off .nm{color:var(--dim)}   /* 취소는 흐리게 — 안 올 손님 */
  .bkvrow.off .st{color:var(--warn)}
  /* 상세 화면에서 시트 기본 하단바에 「명단 복사」를 하나 더 끼운다.

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
