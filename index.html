<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="익순이">
<script>
// 화면이 그려지기 전에 테마를 정한다. 나중에 바꾸면 어두운 화면이 한 번 번쩍인다.
(function(){
  var t = 'dark';
  try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch(e){}
  var d = document.documentElement;
  d.setAttribute('data-theme', t);
  d.style.colorScheme = t;
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = (t === 'light') ? '#f4f6f9' : '#0f1319';
  // 아이폰 앱 모드 상태바.
  // black-translucent 는 화면을 상태바 높이만큼 깎아 아래에 빈 띠를 남긴다. 쓰지 않는다.
  // 다크는 black(검정 바 + 흰 글씨), 라이트는 default(밝은 바 + 검은 글씨).
  var b = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (b) b.content = (t === 'light') ? 'default' : 'black';
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>익순이</title>
<style>
  :root{
    --radius:14px;
    /* 바탕 */
    --ink:#0f1319;      --panel:#161b22;    --panel2:#1c222b;
    --line:#252c36;     --press:#26313d;
    --text:#f0f3f6;     --dim:#8792a0;      --off:#5a657a;
    --ph:#7b8695;       --disTx:#626d7c;
    --headBg:rgba(15,19,25,.96);
    --scrim:rgba(6,9,13,.72);   --scrimLite:rgba(6,9,13,.6);
    /* 대기 — 금색. 칠할 때와 글자일 때를 나눈다 (밝은 테마에서 대비가 달라서) */
    --wait:#e8b757;     --waitTx:#e8b757;   --waitBig:#e8b757;
    --onWait:#241a05;   --mark:#463a13;
    /* 방문 — 초록 */
    --go:#5fb08a;       --goTx:#5fb08a;     --onGo:#08241a;
    --goBg:#141d19;     --goLine:#26382f;   --goTag:#1b2f27;
    --goTagTx:#7fc9a5;  --goName:#94a49c;
    /* 취소·경고 — 붉은색 */
    --warn:#c9736a;     --warnBg:#1a1618;   --warnTag:#332323;  --warnTagTx:#d2938c;
    --warnName:#b8938e; --warnPax:#a8837e;  --warnPaxBg:#241c1d;
    /* 붙여넣기 오류 */
    --errBg:#1e1618;    --errLine:#4a2e2c;  --errTx:#e0a49d;
    --errRow:rgba(201,115,106,.16);
  }
  html[data-theme="light"]{
    --ink:#f4f6f9;      --panel:#ffffff;    --panel2:#eef1f6;
    --line:#dfe4ec;     --press:#e2e7ef;
    --text:#161a20;     --dim:#5c6772;      --off:#a9b3c0;
    --ph:#a3acb9;       --disTx:#a8b0bb;
    --headBg:rgba(244,246,249,.96);
    --scrim:rgba(20,26,34,.44); --scrimLite:rgba(20,26,34,.34);
    /* 큰 글씨(상단 시간)는 대비 기준이 느슨해 더 밝은 금색을 쓸 수 있다 */
    --wait:#f5aa14;     --waitTx:#996100;   --waitBig:#c27400;
    --onWait:#2a1d02;   --mark:#fdf1d8;
    --go:#2f9c6e;       --goTx:#1d7a54;     --onGo:#ffffff;
    --goBg:#eefaf3;     --goLine:#b9e3ce;   --goTag:#d9f2e5;
    --goTagTx:#1c7853;  --goName:#4a6a5b;
    --warn:#b43f36;     --warnBg:#fdf1ef;   --warnTag:#fadedb;  --warnTagTx:#a2463c;
    --warnName:#855c55; --warnPax:#7a4f48;  --warnPaxBg:#f6e7e5;
    --errBg:#fdf0ee;    --errLine:#f0c8c2;  --errTx:#9e4438;
    --errRow:rgba(192,72,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink)}
  /* 스크롤 막대를 감춘다. 페이지 전체가 스크롤되는 구조라
     막대가 상단·하단 바 위를 지나가서 지저분했다. 스크롤 자체는 그대로다 */
  html{min-height:100%;overscroll-behavior:none;scrollbar-width:none}
  html::-webkit-scrollbar{display:none}
  body{
    overscroll-behavior:none;
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
    font-size:16px;
    line-height:1.4;
    display:flex;flex-direction:column;
    /* 실제 높이는 아래 fitHeight() 가 픽셀로 다시 잡아준다.
       아이폰이 CSS 높이 단위를 상태바만큼 짧게 주는 경우가 있어서다. */
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;        /* 두 번 탭 확대 방지 */
    -webkit-text-size-adjust:100%;
  }
  body.keyboard-open{min-height:0!important}
  body.keyboard-open .wrap{flex:0 0 auto}
  /* 키보드 중에는 Safari의 자체 화면 이동과 경쟁하지 않도록 상단 고정을 해제한다. */
  body.keyboard-bars-free header,body.keyboard-bars-free .ghead{position:relative;top:auto}
  .wrap{flex:1 0 auto;width:100%;max-width:640px;margin:0 auto;padding:0 14px 18px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* header */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 0 8px;
  }
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
  .nav{display:flex;align-items:center;gap:0;margin-left:-10px;min-width:0}
  .nav button{
    width:40px;height:40px;flex:0 0 auto;padding:0;
    display:grid;place-items:center;
    background:none;border:0;color:var(--dim);
    line-height:0;cursor:pointer;border-radius:9px;
  }
  .nav button svg{display:block}
  .nav button:active{background:var(--panel2)}
  .nav button:disabled{opacity:.22}
  .date{
    display:flex;min-width:0;
    font-size:15px;color:var(--text);font-weight:600;letter-spacing:.01em;
  }
  /* 자리가 모자라면 날짜 숫자만 줄이고 「· 오늘」은 끝까지 남긴다 */
  .dmain{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dtail{flex:0 0 auto;white-space:pre}
  .offday .date{color:var(--waitTx);font-weight:700}
  .offday .nav button{color:var(--waitTx)}
  .dayprog{
    display:flex;align-items:center;line-height:1;
    font-size:14px;font-weight:800;color:var(--text);
    background:var(--panel);border:1px solid var(--line);
    padding:5px 10px;border-radius:8px;
  }
  .dayprog.full{color:var(--goTx);border-color:var(--goLine)}
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .tools button.off{visibility:hidden;pointer-events:none}
  .tools button{
    width:40px;height:40px;flex:0 0 auto;
    display:grid;place-items:center;
    background:none;border:0;border-radius:9px;
    color:var(--dim);cursor:pointer;margin-right:-8px;
  }
  .tools button:active{background:var(--panel2)}
  .tools button.on{color:var(--waitTx);background:var(--panel2)}
  /* 개발용 주소에서만 뜨는 표시 */
  .devtag{
    flex:0 0 auto;padding:4px 8px;border-radius:8px;
    background:var(--wait);color:var(--onWait);
    font-size:12px;font-weight:800;letter-spacing:.04em;line-height:1.2;
  }
  .offtag{
    display:none;align-items:center;flex:0 0 auto;
    padding:4px 9px;border-radius:8px;
    background:var(--warnBg);border:1px solid var(--warnTag);
    color:var(--warn);font-size:12px;font-weight:700;white-space:nowrap;line-height:1.2;
  }
  html[data-off] .offtag{display:inline-flex}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--go);opacity:.9}
  .dot.stale{background:var(--warn)}

  /* 인라인 흐름 — 자리가 모자란 조각만 다음 줄로 넘어간다 */
  .lead{display:block;margin-top:8px;line-height:1.5}
  .lead.hide{display:none}
  /* 「12:00 예약」과 「3팀 2인 1팀…」 두 덩어리로 읽히게 여백을 나눈다 */
  .slotlab{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-right:14px}
  .slottime{font-size:22px;font-weight:800;color:var(--waitBig);letter-spacing:-.03em;margin-right:2px}
  .leadmain{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-right:1px}
  /* 「남은 예약 없음」은 상태 설명이라 본문색. 초록은 옆의 방문 집계에만 쓴다 */
  .leadmain.done{font-size:16px;font-weight:600;color:var(--text)}
  /* 인원 요약은 자리가 모자란 조각만 다음 줄로 내린다 */
  .leadsub{font-size:13px;font-weight:600;color:var(--dim);display:inline}
  .leadsub .pc{white-space:nowrap}
  .leadsub.tally{margin-left:11px}
  .leadsub .tally-go{color:var(--goTx);font-weight:700}
  .leadsub .tally-off{color:var(--warn);font-weight:700}
  .leadsub .pcsep{color:var(--off)}

  /* search */
  .searchbar{position:relative;margin-top:12px}
  .searchbar.hide{display:none}
  .searchbar input{
    width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:11px;
    padding:11px 74px 11px 42px;font-family:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;
  }
  #qBack{
    position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;display:grid;place-items:center;
    background:none;border:0;color:var(--dim);cursor:pointer;
  }
  #qBack:active{color:var(--text)}
  .qcount{
    position:absolute;right:40px;top:50%;transform:translateY(-50%);
    font-size:12px;font-weight:700;color:var(--dim);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .qcount.zero{color:var(--warn)}
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar input:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .searchbar input::-webkit-search-cancel-button{display:none}
  .searchbar button{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border:0;border-radius:9px;
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .searchbar button svg{display:block}
  .searchbar button:active{background:var(--panel2)}
  mark{background:var(--mark);color:var(--waitTx);-webkit-text-fill-color:var(--waitTx);border-radius:3px;padding:0 1px}

  /* time group */
  .group{margin-top:10px}

  .ghead{
    position:sticky;top:var(--hh,84px);z-index:10;
    background:var(--ink);
    display:flex;align-items:center;gap:7px;
    width:calc(100% + 28px);margin:0 -14px;padding:9px 16px 8px;
    border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  .ghead:active{background:var(--panel2)}
  .chev{
    color:var(--dim);flex:0 0 auto;
    display:grid;place-items:center;width:14px;height:14px;line-height:0;
    transform:rotate(90deg);transition:transform .15s;
  }
  .chev svg{display:block}
  .group.shut .chev{transform:rotate(0)}
  /* 19px 굵게 = 큰 글씨 기준이 적용돼 밝은 금색을 쓸 수 있다 */
  .gtime{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--dim)}
  .gline{flex:1;height:1px;background:var(--line)}
  .gmeta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .gmeta b{font-weight:800;color:var(--text)}
  .gbreak{color:var(--dim);font-size:12px}
  .group.now .gtime{color:var(--waitBig)}
  .group.now .row{border-left-color:var(--wait)}
  .group.done .gtime{opacity:.6}
  .group.done .gmeta b{color:var(--goTx)}

  /* row */
  .row{
    display:flex;align-items:stretch;gap:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
    transition:border-color .15s,opacity .15s,background .15s;
  }
  /* 눌리는 곳은 여기뿐. 60x60 이라 손가락에 넉넉하다 */
  .main{
    width:60px;flex:0 0 auto;display:grid;place-items:center;
    min-height:60px;cursor:pointer;padding:0;
    background:none;border:0;border-right:1px solid var(--line);
    color:inherit;font:inherit;
  }
  .main:active{background:var(--panel2)}
  .info{
    flex:1;min-width:0;display:flex;align-items:center;gap:12px;
    padding:14px 12px;
  }
  /* min-width:0 이 없으면 긴 이름이 있을 때 행이 화면 밖으로 넘친다 */
  .rbody{flex:1;min-width:0;display:flex;flex-direction:column}
  .rtop{display:flex;align-items:stretch;min-width:0}
  .check{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;
    border:2.5px solid var(--off);
    display:grid;place-items:center;line-height:0;color:transparent;
    transition:.15s;
  }
  .check svg{display:block}
  /* 누르는 요소에는 직접 지정한다. body 에만 걸면 아이폰에서 두 번 탭 판정이 남는다 */
  .main, .more, .ghead, .foot button, .menu button, .tools button, .nav button{
    touch-action:manipulation;
  }
  /* stretch 로 두어야 이름이 칸 폭에 맞춰 «...» 로 줄어든다.
     flex-start 면 글자 길이만큼 늘어나 인원칸이 화면 밖으로 밀려난다 */
  .who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
  .memo{
    margin-top:2px;font-size:12px;font-weight:600;line-height:1.3;
    color:var(--waitTx);opacity:.85;text-align:left;
    word-break:break-all;
  }
  .row.arrived .memo, .row.cancelled .memo{color:var(--dim);opacity:1}
  .erow.memorow{margin-top:6px}
  #addPanel .edit{padding:0}
  #addPanel h2{margin-bottom:12px}
  .name{
    display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;
    color:var(--text);-webkit-text-fill-color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 태그·인원칸·체크박스를 28px 한 줄에 맞춘다 */
  .tag{
    height:28px;display:inline-flex;align-items:center;
    font-size:12px;font-weight:800;letter-spacing:.04em;
    padding:0 9px;border-radius:8px;flex:0 0 auto;white-space:nowrap;
  }
  .tag.arrived{background:var(--goTag);color:var(--goTagTx);-webkit-text-fill-color:var(--goTagTx)}
  .tag.cancelled{background:var(--warnTag);color:var(--warnTagTx);-webkit-text-fill-color:var(--warnTagTx)}
  .pax{
    height:28px;display:inline-flex;align-items:center;
    font-size:15px;font-weight:700;color:var(--text);
    background:var(--panel2);border-radius:8px;padding:0 10px;flex:0 0 auto;
  }
  .more{
    width:44px;flex:0 0 auto;border:0;border-left:1px solid var(--line);
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .more svg{display:block}
  .more:active{background:var(--panel2)}

  .row.arrived{border-left-color:var(--go);background:var(--goBg)}
  .row.arrived .check{background:var(--go);border-color:var(--go);color:var(--onGo);-webkit-text-fill-color:var(--onGo)}
  .row.arrived .name{color:var(--goName);-webkit-text-fill-color:var(--goName);font-weight:600}
  .row.arrived .pax{color:var(--goTx);-webkit-text-fill-color:var(--goTx)}

  .row.cancelled{border-left-color:var(--warn);background:var(--warnBg)}
  .row.cancelled .name{color:var(--warnName);-webkit-text-fill-color:var(--warnName);font-weight:600}
  .row.cancelled .pax{color:var(--warnPax);-webkit-text-fill-color:var(--warnPax);background:var(--warnPaxBg)}
  .row.cancelled .check{border-color:var(--warn);color:var(--warn)}


  .edit{padding:0 10px 11px}
  .erow{display:flex;gap:6px}
  .erow label{
    display:flex;flex-direction:column;gap:4px;
    font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--dim);
  }
  .erow label.grow{flex:1;min-width:0}
  .erow input, .erow select{
    background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:9px;
    padding:10px 9px;font-family:inherit;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;width:100%;min-width:0;height:44px;
    -webkit-appearance:none;appearance:none;
  }
  .erow input:focus, .erow select:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .erow select{
    text-align:center;text-align-last:center;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 20px, calc(100% - 9px) 20px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:22px;
  }
  .erow #e-hour, .erow #e-min{width:64px}
  .erow #e-pax{width:80px}
  .ebtn{display:flex;gap:6px;margin-top:7px}
  .ebtn button{
    flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .ebtn #e-ok{background:var(--wait);color:var(--onWait);border-color:var(--wait)}
  .ebtn button:active{filter:brightness(.9)}

  .menu{display:flex;gap:6px;padding:0 10px 10px}
  .menu button{
    flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .menu button:active{background:var(--press)}
  .menu .del{color:var(--warn)}

  /* paste panel */
  /* --kb = 키보드가 가리는 높이. 키보드가 올라오면 그만큼 시트를 띄운다 */
  .panel.asSheet{
    position:fixed;left:50%;bottom:0;
    transform:translateX(-50%) translateY(calc(-1 * var(--kb, 0px)));
    transition:transform .16s ease;
    z-index:71;width:100%;max-width:520px;margin:0;
    border-radius:18px 18px 0 0;border-bottom:0;
    max-height:calc(86vh - var(--kb, 0px));overflow-y:auto;
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
  }
  .panel.asSheet.kb{ padding-bottom:14px }
  .panelScrim{position:fixed;inset:0;z-index:70;background:var(--scrim)}
  .panelScrim.hide{display:none}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:10px;overflow:hidden;
  }
  .panel h2{margin:0 0 4px;font-size:16px;font-weight:700}
  .panel p{margin:0 0 10px;font-size:12px;color:var(--dim);line-height:1.5}
  .tawrap{position:relative}
  .tawrap textarea, .hl{
    font-family:inherit;font-size:16px;line-height:1.65;
    font-variant-numeric:tabular-nums;
    padding:11px;border:1px solid transparent;border-radius:10px;
    letter-spacing:0;
    white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;
  }
  textarea{
    position:relative;z-index:1;
    display:block;width:100%;box-sizing:border-box;
    resize:none;overflow:hidden;
    background:transparent;color:var(--text);
    border-color:var(--line);
    -webkit-appearance:none;appearance:none;
  }
  .hl{
    position:absolute;inset:0;z-index:0;
    background:var(--ink);border-radius:10px;
    color:transparent;-webkit-text-fill-color:transparent;
    overflow:hidden;pointer-events:none;
    padding:11px 0;
  }
  .hl .ln{display:block;padding:0 11px 0 11px}
  .hl .ln.err{
    background:var(--errRow);
    box-shadow:inset 3px 0 0 var(--warn);
  }
  textarea:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .badbox{
    margin-top:9px;padding:9px 11px;
    background:var(--errBg);border:1px solid var(--errLine);border-radius:9px;
    font-size:13px;line-height:1.5;color:var(--errTx);font-weight:600;
  }
  /* 오류가 사라져도 자리를 비워둔다 — 등록 버튼이 튀어오르면 오타 수정 중에 잘못 눌린다 */
  .badbox.off{visibility:hidden}
  .badbox.gone{display:none}

  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{
    flex:1;padding:13px 0;border-radius:11px;border:0;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  }
  .btn.primary{background:var(--wait);color:var(--onWait)}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:active{filter:brightness(.9)}
  textarea::placeholder{ color:var(--ph) }

  /* footer */
  .foot.hide{display:none}
  /* 화면에 붙여두되 문서 흐름 안에 둔다.
     position:fixed 는 아이폰에서 자리를 못 잡아 하단 바가 떠 있는 문제가 반복됐다.
     sticky 는 내용이 짧으면 흐름 맨 끝(= 화면 바닥), 길면 스크롤 중 화면 바닥에 붙는다. */
  .foot{
    position:sticky;bottom:0;z-index:30;
    /* 반투명 + 흐림 처리를 쓰면 아이폰에서 위치가 어긋난다. 불투명하게 둔다 */
    background:var(--ink);
    border-top:1px solid var(--line);
    padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  }
  /* 스크롤이 없는 화면에서는 sticky 를 쓰지 않는다.
     아이폰이 목록이 짧아진 뒤 sticky 위치를 다시 계산하지 않아 하단 바가 떠 있었다.
     스크롤이 없으면 흐름 맨 끝 = 화면 바닥이라 sticky 가 할 일도 없다. */
  .foot.flow{position:static}
  /* 키보드 중에는 전역 동작과 그 자리까지 제거해 목록 끝에 빈 공간을 남기지 않는다. */
  .foot.keyboard-covered{display:none}
  /* 복귀 보정 프레임 전까지는 레이아웃에도 넣지 않는다. */
  .foot.keyboard-returning{display:none;pointer-events:none}
  .foot .inner{max-width:640px;margin:0 auto}
  .frow{display:flex;gap:7px}
  .frow + .frow{margin-top:6px}
  .foot button{
    flex:1;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  }
  .foot .frow.sub button{
    padding:9px 0;font-size:12px;font-weight:600;
    background:none;color:var(--dim);border-color:transparent;
  }
  .foot button:active{background:var(--panel2)}

  .empty{text-align:center;color:var(--dim);font-size:13px;padding:36px 10px;line-height:1.7;white-space:pre-line}
  /* ---------- 메뉴 서랍 ---------- */
  .drawerScrim{
    position:fixed;inset:0;z-index:60;background:var(--scrimLite);
    opacity:1;transition:opacity .2s;
  }
  /* 전역 .hide는 display:none이라 페이드가 안 된다 — 서랍 막은 따로 둔다 */
  .drawerScrim.off{opacity:0;pointer-events:none}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:61;
    width:min(68vw, 258px);
    background:var(--panel);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateX(-101%);transition:transform .22s ease;
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0)}
  .dwtitle{display:flex;align-items:center;gap:11px;padding:0 18px 16px}
  .dwico{
    width:36px;height:36px;flex:0 0 auto;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);
  }
  .dwnames{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dwname{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .dwsubtitle{font-size:12px;font-weight:600;color:var(--dim)}
  .dwdays{display:flex;flex-direction:column}
  .dwday{
    display:flex;align-items:center;gap:10px;
    padding:13px 18px;border:0;background:none;cursor:pointer;
    color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;text-align:left;
  }
  .dwday:active{background:var(--panel2)}
  .dwday .d1{flex:1;min-width:0;white-space:nowrap}
  .dwday .d2{font-size:12px;font-variant-numeric:tabular-nums}
  .dwday.on{color:var(--text)}
  .dwday.on .d1{font-weight:800}
  .dwday .tick{width:14px;flex:0 0 auto;color:var(--waitTx)}
  .dwsep{height:1px;background:var(--line);margin:10px 18px}
  .dwitem{
    display:flex;align-items:center;gap:8px;
    padding:13px 18px;border:0;background:none;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:600;text-align:left;
  }
  .dwitem:active{background:var(--panel2)}
  .dwval{margin-left:auto;font-size:13px;font-weight:600;color:var(--dim)}
  .dwchev{flex:0 0 auto;color:var(--off);transition:transform .18s;margin-right:-2px}
  .dwitem.open .dwchev{transform:rotate(90deg);color:var(--waitTx)}
  /* 서랍 안에서 펼쳐지는 하위 목록 */
  .dwsub{display:flex;flex-direction:column;background:var(--panel2)}
  .dwsub button{
    display:flex;align-items:center;gap:10px;
    padding:11px 18px;border:0;background:none;cursor:pointer;
    color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;text-align:left;
  }
  .dwsub button:active{background:var(--press)}
  /* 달 / 해 — 두 줄이 한눈에 갈리게 */
  .dwsub .tico{
    width:27px;height:27px;flex:0 0 auto;display:grid;place-items:center;
    border-radius:9px;border:1px solid var(--line);
    background:none;color:var(--off);
  }
  /* 고른 줄은 강조색으로 칠한다.
     회색 계열로 칠하면 테마에 따라 밝기가 뒤집혀 반대쪽이 켜진 것처럼 보인다.
     강조색은 두 테마 모두 「켜짐」으로 읽힌다. */
  .dwsub button.on{
    background:var(--mark);color:var(--text);font-weight:700;
    box-shadow:inset 3px 0 0 var(--wait);
  }
  .dwsub button.on .tico{
    background:var(--wait);border-color:transparent;color:var(--onWait);
  }
  .dwsub .chk{margin-left:auto;color:var(--waitTx);font-weight:800;opacity:0}
  .dwsub button.on .chk{opacity:1}
  .dwsep.push{margin-top:auto}
  .dwfoot{
    padding:12px 18px 0;
    font-size:12px;font-weight:600;color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  .dwfoot.off{color:var(--warn)}

  /* ---------- 안내 시트 ---------- */
  .sheetScrim{
    position:fixed;inset:0;z-index:70;background:var(--scrim);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheetScrim.hide{display:none}
  .sheet{
    width:100%;max-width:520px;
    background:var(--panel);border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh;overflow-y:auto;
  }
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .sheetBtns{display:flex;gap:8px}
  .sheetBtns .sheetClose{flex:1}
  .sheetNever{
    flex:1;padding:13px 0;border-radius:12px;
    border:1px solid var(--line);background:none;
    color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .sheetNever:active{color:var(--text)}
  .faq{margin:-6px 0 14px}
  .qa{border-bottom:1px solid var(--line)}
  .qa:last-child{border-bottom:0}
  .qa .q{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:14px 2px;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--text);
    text-align:left;letter-spacing:-.02em;line-height:1.35;
  }
  .qa .qchev{margin-left:auto;flex:0 0 auto;color:var(--off);transition:transform .18s}
  .qa.open .q{color:var(--waitTx)}
  .qa.open .qchev{transform:rotate(90deg);color:var(--waitTx)}
  .qa .a{
    display:none;padding:0 2px 15px;
    font-size:13px;line-height:1.7;color:var(--dim);white-space:pre-line;
  }
  .qa.open .a{display:block}
  .qa .a em{font-style:normal;color:var(--text);font-weight:600}
  .qnew{
    flex:0 0 auto;font-size:10px;font-weight:800;color:var(--ink);
    background:var(--go);padding:2px 5px;border-radius:4px;letter-spacing:.02em;
  }
  /* 설치 안내 — 기기별 카드 */
  .plat{
    background:var(--panel2);border:1px solid var(--line);
    border-left:3px solid var(--off);border-radius:12px;
    padding:12px 14px 11px;margin:0 0 10px;
  }
  .plat.ios{border-left-color:var(--wait)}
  .plat.and{border-left-color:var(--go)}
  .plat .ph{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .plat .pn{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .plat.ios .pn{color:var(--waitTx)}
  .plat.and .pn{color:var(--goTx)}
  .step{
    display:flex;align-items:center;gap:9px;min-height:30px;
    padding:3px 0;font-size:13px;color:var(--dim);line-height:1.35;
  }
  .step .n{
    width:17px;height:17px;flex:0 0 auto;border-radius:50%;
    background:var(--line);color:var(--dim);
    font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;
  }
  .step b{color:var(--text);font-weight:700}
  .key{
    display:inline-grid;place-items:center;
    min-width:25px;height:22px;padding:0 5px;margin:0 1px;
    border:1px solid var(--line);border-radius:6px;background:var(--ink);
    color:var(--text);line-height:0;
    vertical-align:middle;
  }
  .key svg{display:block}
  .sheetNote{font-size:13px;line-height:1.6;color:var(--goTx);margin:0 0 14px;white-space:pre-line}
  .sheetNote.plain{color:var(--dim)}
  /* 변경 내역 */
  .lgrow{
    display:flex;align-items:baseline;gap:10px;padding:9px 0;
    border-top:1px solid var(--line);font-size:14px;
  }
  .lgrow:first-child{border-top:0}
  .lgt{flex:0 0 42px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .lgk{flex:0 0 auto;font-weight:700;color:var(--text)}
  .lgk.go{color:var(--goTx)}
  .lgk.off{color:var(--warn)}
  .lgs{flex:1;min-width:0;color:var(--dim);font-size:13px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lgempty{font-size:14px;color:var(--dim);padding:6px 0 14px}

  /* Wi-Fi 안내 */
  .wtab{display:flex;gap:8px;margin:-2px 0 14px}
  .wtab button{
    flex:1;padding:11px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--dim);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  }
  .wtab button.on{background:var(--wait);border-color:var(--wait);color:var(--onWait)}
  /* QR 은 어두운 배경에서 못 읽으니 테마와 무관하게 흰 바탕 */
  .qrcard{
    background:#fff;border-radius:16px;padding:16px;margin:0 auto 16px;
    width:236px;box-sizing:border-box;
  }
  .qrcard svg{display:block;width:100%;height:auto}
  .wnet{
    display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  }
  .wnet .k{font-size:12px;font-weight:700;color:var(--dim);flex:0 0 52px}
  .wnet .v{font-size:15px;font-weight:700;color:var(--text);flex:1;min-width:0;word-break:break-all}
  .about{font-size:14px;line-height:1.75;color:var(--dim);margin:0 0 12px}
  .about:last-of-type{margin-bottom:16px}
  .about b{color:var(--text);font-weight:700}
  .credit{
    border-top:1px solid var(--line);padding-top:12px;margin:16px 0 14px;
    font-size:12px;line-height:1.6;color:var(--off);letter-spacing:.01em;
  }
  .sheetClose{
    width:100%;padding:13px 0;margin-top:2px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  }

  .scrim{
    position:fixed;inset:0;z-index:50;
    background:var(--scrim);
    display:grid;place-items:center;
    padding:22px 22px calc(22px + var(--kb, 0px));
  }
  .scrim.hide{display:none}
  .dialog{
    width:100%;max-width:330px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:19px 18px 15px;
  }
  .dialog h3{margin:0 0 13px;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.45;white-space:pre-line}
  .dialog input{
    width:100%;background:var(--ink);color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;font-family:inherit;font-size:16px;font-weight:600;
    text-align:center;-webkit-appearance:none;appearance:none;
  }
  .dialog input::placeholder{color:var(--ph);font-weight:400}
  .dialog input:focus{outline:2px solid var(--wait);outline-offset:-1px}
  .dbtn{display:flex;gap:8px;margin-top:11px}
  .dbtn button{
    flex:1;padding:12px 0;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  }
  .dbtn #dlgYes{background:var(--wait);color:var(--onWait);border-color:var(--wait)}
  .dbtn #dlgYes:disabled{background:var(--panel2);color:var(--disTx);border-color:var(--line);cursor:default}
  .dbtn button:active{filter:brightness(.9)}

  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
    background:var(--panel2);border:1px solid var(--line);
    padding:9px 15px;border-radius:99px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none !important}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="toprow">
      <div class="nav">
        <button type="button" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="date num" id="dateLabel"></span>
      </div>
      <div class="tools">
        <span class="dayprog num hide" id="dayProg"></span>
        <span class="offtag">연결 안 됨</span>
        <span class="devtag hide" id="devTag">TEST</span>
        <button type="button" id="searchBtn" class="off" aria-label="이름 검색">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="lead hide">
      <span class="slottime num" id="slotTime"></span>
      <span class="slotlab"></span>
      <span class="leadmain num" id="leadMain"></span>
      <span class="leadsub num" id="leadSub"></span>
    </div>
  </header>

  <div class="searchbar hide" id="searchbar">
    <button type="button" id="qBack" aria-label="검색 닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <input type="search" id="q" placeholder="이름 검색" autocomplete="off" autocorrect="off" spellcheck="false">
    <span class="qcount hide" id="qCount"></span>
    <button type="button" id="qClear" class="hide" aria-label="검색어 지우기"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
  </div>

  <div id="list"></div>

  <div class="panel hide" id="pastePanel">
    <h2 id="pasteTitle">오늘 예약 명단 붙여넣기</h2>
    <p>양식에 맞게 붙여넣어 주세요.</p>
    <div class="tawrap">
      <div class="hl" id="hl" aria-hidden="true"></div>
      <textarea id="ta" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" placeholder="14:00 임동현 2명&#10;15:00 김동현 4명 방문&#10;15:00 박동현 2명&#10;17:00 Donghyun Lee 3명 취소&#10;19:00 송동현 5명"></textarea>
    </div>
    <div class="badbox off gone" id="badBox">&nbsp;</div>
    <div class="btns">
      <button class="btn primary" id="loadBtn">명단 등록</button>
      <button class="btn ghost hide" id="cancelPaste">취소</button>
    </div>
  </div>

  <div class="panel asSheet hide" id="addPanel">
    <h2>예약 추가</h2>
    <div class="edit">
      <div class="erow">
        <label>시<select id="a-hour"></select></label>
        <label>분<select id="a-min"></select></label>
        <label class="grow">이름<input type="text" id="a-name" autocomplete="off" autocorrect="off" spellcheck="false"></label>
        <label>인원<select id="a-pax"></select></label>
      </div>
      <div class="erow memorow">
        <label class="grow">메모<input type="text" id="a-memo" autocomplete="off" placeholder="창가석 요청, 인플루언서 …"></label>
      </div>
    </div>
    <div class="btns">
      <button class="btn primary" id="addOk">추가</button>
      <button class="btn ghost" id="addNo">취소</button>
    </div>
  </div>

  <div class="empty hide" id="emptyMsg"></div>
</div>

<div class="foot hide">
  <div class="inner">
    <div class="frow">
      <button id="refreshBtn">새로고침</button>
      <button id="copyBtn">명단 복사</button>
    </div>
    <div class="frow sub">
      <button id="resetBtn">명단 초기화</button>
      <button id="addBtn">예약 추가</button>
      <button id="foldBtn">전체 접기</button>
    </div>
  </div>
</div>

<div class="panelScrim hide" id="panelScrim"></div>
<div class="drawerScrim off" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-label="메뉴">
  <div class="dwtitle">
    <img class="dwico" src="apple-touch-icon.png" alt="" width="36" height="36">
    <span class="dwnames"><span class="dwname">익순이</span><span class="dwsubtitle">익선취향 예약 매니저</span></span>
  </div>
  <div class="dwdays" id="dwDays"></div>
  <div class="dwsep"></div>

// ---------- Firebase 연결 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, get, set, push, remove, onValue, off, goOffline, goOnline }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA62A2jtIE77DgOcJ17Jb6S9gH4oTeNeKw",
  authDomain: "ikseon-reserve.firebaseapp.com",
  databaseURL: "https://ikseon-reserve-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ikseon-reserve",
  storageBucket: "ikseon-reserve.firebasestorage.app",
  messagingSenderId: "456621961785",
  appId: "1:456621961785:web:a2ba82fb70d6f198b5d3e8"
};

const db = getDatabase(initializeApp(firebaseConfig));
// 주소에 -dev 가 들어 있으면 개발용. 명단 저장 위치를 따로 써서 실제 명단을 건드리지 않는다.
const DEV = /-dev(\/|$)/.test(location.pathname);
const ROOT = DEV ? 'roster-dev' : 'roster';
// Firebase 규칙이 허용하는 명단 영역 안에 변경 내역 전용 가지를 둔다.
const LOGROOT = ROOT + '/__logs__';
const path = k => ROOT + '/' + String(k).replace('roster:', '');

window.__fb = {
  get: k => get(ref(db, path(k))).then(s => s.exists() ? s.val() : null),
  set: (k, v) => set(ref(db, path(k)), v),
  remove: ds => remove(ref(db, ROOT + '/' + ds)),
  list: () => get(ref(db, ROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  watch: (k, cb) => {
    const r = ref(db, path(k));
    const h = onValue(r, s => cb(s.exists() ? s.val() : null));
    return () => off(r, 'value', h);
  },
  // 변경 내역 — 날짜별로 따로 쌓는다. push 라 여러 대가 동시에 써도 안 겹친다
  logPush: (ds, entry) => push(ref(db, LOGROOT + '/' + ds), entry),
  logSet: (ds, id, entry) => set(ref(db, LOGROOT + '/' + ds + '/' + id), entry),
  logGet: ds => get(ref(db, LOGROOT + '/' + ds)).then(s => s.exists() ? Object.values(s.val()) : []),
  logWatch: (ds, cb, fail) => { const r = ref(db, LOGROOT + '/' + ds); const h = onValue(r, s => cb(s.exists() ? Object.values(s.val()) : []), fail); return () => off(r, 'value', h); },
  logList: () => get(ref(db, LOGROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  logRemove: ds => remove(ref(db, LOGROOT + '/' + ds)),
  // Firebase가 알려주는 실제 연결 상태
  onConnected: cb => onValue(ref(db, '.info/connected'), s => cb(s.val() === true)),
  // 연결이 죽었을 때 소켓을 끊었다 다시 붙인다
  reconnect: () => { try { goOffline(db); } catch(e){} setTimeout(() => { try { goOnline(db); } catch(e){} }, 150); }
};
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
(function(){
  'use strict';

  var DAY_ROLLOVER = 0; // 자정에 날짜가 바뀐다 (마감이 자정을 넘기면 이 값을 올릴 것)
  var state = null;      // {date, rosterTs, items:[]}
  var openMenu = null;
  var editing = null;
  var collapsed = {}; // 시간대별 수동 접기 상태 (미설정이면 자동)
  var touched = {};   // 시간대별 마지막 체크 시각
  var collapseTimers = {};
  var COLLAPSE_DELAY = 5000;
  var query = '';
  var backgroundRenderPending = false;
  var deferredState = null;

  function interactionActive(){ return !!(editing || openMenu); }
  function renderWhenIdle(){
    if (interactionActive()){
      backgroundRenderPending = true;
      return false;
    }
    backgroundRenderPending = false;
    render();
    return true;
  }
  function stageBackgroundState(next){
    if (interactionActive()){
      deferredState = deferredState ? merge(next, deferredState) : next;
      backgroundRenderPending = true;
      return false;
    }
    state = next;
    renderWhenIdle();
    return true;
  }
  function discardEditing(){
    if (!editing) return false;
    var id = editing;
    keepSlotOpenForId(id);
    var row = rowForId(id);
    var active = document.activeElement;
    if (row && active && row.contains(active) && active.blur) active.blur();
    editing = null;
    openMenu = null;
    pendingKeyboardEditClose = null;
    followMenuId = null;
    keyboardRevealId = null;
    keyboardRevealSmooth = false;
    lastEditControlId = null;
    return true;
  }

  // 접힘 규칙은 하나뿐이다 — 대기 중인 팀이 있으면 펼침, 없으면 접힘.
  // 시계는 관여하지 않는다. 보고 있는데 시간이 지났다는 이유로 접히면 곤란하니까.
  // 손으로 접거나 편 것은 그대로 두되, 대기 여부가 바뀌면 기본 규칙으로 돌아간다.
  // collapsed[time] = { v: 접힘여부, done: 그때 대기가 비어 있었나 }
  function armSlotCollapse(time){
    if (!time) return;
    if (collapseTimers[time]) clearTimeout(collapseTimers[time]);
    collapseTimers[time] = setTimeout(function(){
      delete collapseTimers[time];
      if (!slotHasWork(time)) renderWhenIdle();
    }, COLLAPSE_DELAY + 100);
  }
  function keepSlotOpenForId(id){
    var it = id && find(id);
    if (it){
      touched[it.time] = Date.now();
      armSlotCollapse(it.time);
    }
  }
  function slotHasWork(time){
    return [editing, openMenu].some(function(id){
      var it = id && find(id);
      return !!it && it.time === time;
    });
  }
  function isCollapsed(time, pendCount){
    var done = (pendCount === 0);
    if (done && slotHasWork(time)) return false;
    var o = collapsed[time];
    if (o){
      if (o.done === done) return o.v;   // 대기 상태가 그대로면 손으로 정한 대로
      delete collapsed[time];            // 대기가 생기거나 사라지면 기본 규칙으로
    }
    if (!done) return false;
    // 마지막 하나를 체크한 직후에는 손가락 밑에서 사라지지 않게 잠깐 둔다
    return Date.now() - (touched[time] || 0) > COLLAPSE_DELAY;
  }
  function setCollapsed(time, v, done){ collapsed[time] = { v: v, done: done }; }
  var saving = false, dirty = false;

  /* ---------- 날짜 ---------- */
  var KEEP_DAYS = 2; // 오늘 기준 이보다 오래된 날짜는 삭제

  function pad(n){ return (n<10?'0':'') + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  // 오늘의 영업일 (새벽 5시 이전은 전날로 취급)
  function bizDate(){
    var d = new Date();
    if (d.getHours() < DAY_ROLLOVER) d.setDate(d.getDate() - 1);
    return ymd(d);
  }
  function shiftDate(ds, n){
    var p = ds.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function dayGap(ds){ // viewDate가 오늘로부터 며칠 떨어져 있나
    var a = bizDate().split('-'), b = ds.split('-');
    var t1 = new Date(+a[0], +a[1]-1, +a[2]).getTime();
    var t2 = new Date(+b[0], +b[1]-1, +b[2]).getTime();
    return Math.round((t2 - t1) / 86400000);
  }

  var viewDate = bizDate();
  function key(ds){ return 'roster:' + (ds || viewDate); }

  function prettyDate(){
    var p = viewDate.split('-');
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    var w = ['일','월','화','수','목','금','토'][d.getDay()];
    var g = dayGap(viewDate);
    var label = g === 0 ? '오늘' : g === -1 ? '어제' : g === 1 ? '내일' : '';
    return { full: (+p[1]) + '월 ' + (+p[2]) + '일 (' + w + ')', tail: label ? ' · ' + label : '' };
  }
  function paintDate(){
    var d = prettyDate();
    var el = document.getElementById('dateLabel');
    el.innerHTML = '';
    var a = document.createElement('span'); a.className = 'dmain'; a.textContent = d.full;
    var b = document.createElement('span'); b.className = 'dtail'; b.textContent = d.tail;
    el.appendChild(a); el.appendChild(b);
  }

  // 오래된 날짜 정리
  function purgeOld(){
    var limit = shiftDate(bizDate(), -KEEP_DAYS);
    purgeOldLocalLogs(limit);
    if (!hasStore()) return;
    fb().list().then(function(keys){
      (keys || []).forEach(function(ds){
        if (/^\d{4}-\d{2}-\d{2}$/.test(ds) && ds < limit) fb().remove(ds).catch(function(){});
      });
    }).catch(function(){});
    if (fb().logList){
      fb().logList().then(function(keys){
        (keys || []).forEach(function(ds){
          if (!validLogDate(ds) || ds < limit || ds > bizDate()) fb().logRemove(ds).catch(function(){});
        });
      }).catch(function(){});
    }
  }

  /* ---------- 파싱 ---------- */
  function parse(text){
    var lines = String(text).split(/\r?\n/);
    var out = [], bad = [], seen = {};
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+/g,' ').trim();
      if (!line) continue;
      var m = line.match(/^(\d{1,2})\s*[:.시]\s*(\d{1,2})?\s*분?\s+(.+?)\s+(\d+)\s*명\s*(.*)$/);
      if (!m){ bad.push({ no: i+1, text: line }); continue; }
      var time = pad(+m[1]) + ':' + pad(+(m[2]||0));
      var name = m[3].trim();
      var pax  = parseInt(m[4],10);
      var tail = (m[5]||'').trim();
      var memo = '';
      var mm2 = tail.match(/^(.*?)\s*\((.+)\)$/);   // 뒤에 붙은 (메모)
      if (mm2){ tail = mm2[1].trim(); memo = mm2[2].trim(); }
      var status = 'pending';
      if (tail === '취소') status = 'cancelled';
      else if (tail === '방문') status = 'arrived';
      else if (tail){ bad.push({ no: i+1, text: line }); continue; }  // 뒤에 붙은 알 수 없는 말
      var hh = +m[1], mm = +(m[2]||0);
      if (hh > 23 || mm > 59 || pax < 1){ bad.push({ no: i+1, text: line }); continue; }
      var base = time + '|' + name + '|' + pax;
      seen[base] = (seen[base]||0) + 1;
      out.push({ id: base + '|' + seen[base], time:time, name:name, pax:pax, memo:memo, status:status, ts:0, seq: out.length });
    }
    out.bad = bad;
    return out;
  }

  function sortItems(a,b){
    if (a.time !== b.time) return a.time < b.time ? -1 : 1;
    return (a.seq||0) - (b.seq||0);
  }

  /* ---------- 저장소 (Firebase Realtime Database) ---------- */
  function fb(){ return window.__fb; }
  function hasStore(){ return !!fb(); }

  function loadRemote(ds){
    if (!hasStore()) return Promise.resolve(null);
    return fb().get(key(ds)).catch(function(){ return null; });
  }

  function writeRemote(data, ds){
    if (!hasStore()) return Promise.resolve(data);
    return fb().set(key(ds), data).then(function(){ return data; });
  }

  // 다른 기기의 변경을 즉시 받아온다
  var unwatch = null;
  var rosterLoadEpoch = 0;
  function loadTicket(){ return { epoch: ++rosterLoadEpoch, date: viewDate }; }
  function ticketCurrent(ticket){
    return ticket.epoch === rosterLoadEpoch && ticket.date === viewDate;
  }
  function stopWatch(){
    if (unwatch){ unwatch(); unwatch = null; }
  }
  function watchRemote(){
    stopWatch();
    if (!hasStore()) return;
    var watchDate = viewDate;
    unwatch = fb().watch(key(watchDate), function(remote){
      if (watchDate !== viewDate) return;
      if (saving) return;
      // remote가 비어 있어도(명단 초기화) 그대로 반영해야 한다
      var merged = merge(remote || { date: viewDate, rosterTs: 0, items: [] }, state);
      if (JSON.stringify(merged) === JSON.stringify(state)) return;
      stageBackgroundState(merged);
    });
  }

  // Firebase는 빈 배열·빈 객체를 저장하지 않으므로 items가 사라져서 돌아올 수 있다.
  function norm(d){
    if (!d) return null;
    return { date: d.date, rosterTs: d.rosterTs || 0, items: Array.isArray(d.items) ? d.items : [] };
  }

  function merge(a, b){
    a = norm(a); b = norm(b);
    if (!a) return b;
    if (!b) return a;
    var base  = (a.rosterTs||0) >= (b.rosterTs||0) ? a : b;
    var other = base === a ? b : a;
    var map = {};
    other.items.forEach(function(it){ map[it.id] = it; });
    var items = base.items.map(function(it){
      var o = map[it.id];
      if (o && (o.ts||0) > (it.ts||0)) {
        var next = {};
        for (var k in it) if (Object.prototype.hasOwnProperty.call(it, k)) next[k] = it[k];
        next.status = o.status;
        next.ts = o.ts;
        return next;
      }
      return it;
    });
    return { date: base.date, rosterTs: base.rosterTs, items: items };
  }

  function sync(){
    var syncDate = viewDate;
    return loadRemote(syncDate).then(function(remote){
      if (syncDate !== viewDate) return;
      var merged = merge(remote, state);
      var changed = JSON.stringify(merged) !== JSON.stringify(state);
      if (changed) stageBackgroundState(merged);
    }).catch(function(){});
  }

  var saveTimer = null;
  var pendingWrites = {};
  var localDrafts = {};
  function copyState(data){ return JSON.parse(JSON.stringify(data)); }
  function save(){
    if (!state) return;
    var snapshot = copyState(state);
    localDrafts[viewDate] = snapshot;
    pendingWrites[viewDate] = snapshot;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 250);
  }
  function flush(){
    clearTimeout(saveTimer); saveTimer = null;
    if (saving) return;
    var dates = Object.keys(pendingWrites);
    if (!dates.length){ dirty = false; return; }
    var flushDate = dates[0];
    var localState = pendingWrites[flushDate];
    delete pendingWrites[flushDate];
    saving = true; dirty = true;
    var before = JSON.stringify(localState);
    loadRemote(flushDate).then(function(remote){
      var merged = merge(remote, localState);
      return writeRemote(merged, flushDate);
    }).then(function(merged){
      saving = false;
      // 같은 날짜의 더 최신 스냅샷이 기다리면 오래된 완료값은 화면에 적용하지 않는다.
      if (flushDate === viewDate && !pendingWrites[flushDate]
          && JSON.stringify(merged) !== before){
        stageBackgroundState(merged);
      }
      if (!pendingWrites[flushDate]) delete localDrafts[flushDate];
      dirty = Object.keys(pendingWrites).length > 0;
      if (dirty) flush();
    }).catch(function(){
      saving = false;
      // 성공하기 전까지 보존한 날짜별 최신 로컬본을 재시도해 날짜 왕복 중에도 앞선 변경을 잃지 않는다.
      pendingWrites[flushDate] = localDrafts[flushDate] || localState;
      dirty = true;
      toast('저장 실패 — 잠시 뒤 다시 시도합니다');
      setTimeout(flush, 3000);
    });
  }

  // 연결 표시는 Firebase가 알려주는 실제 상태만 반영한다.
  // 개별 읽기·쓰기 실패로는 켜지 않는다 — 잠깐 끊겼다 붙는 동안 계속 떠 있게 되므로.
  var online = false;
  function setSync(ok){
    if (ok !== undefined) online = ok;
    var ready = online && hasStore();
    if (ready) document.documentElement.removeAttribute('data-off');
    else document.documentElement.setAttribute('data-off', '');
    var cf = document.getElementById('dwConn');
    if (cf){
      cf.className = 'dwfoot' + (ready ? '' : ' off');
      cf.innerHTML = '<span class="dot' + (ready ? '' : ' stale') + '"></span>'
        + (ready ? '연결됨' : '연결 안 됨');
    }
  }

  /* ---------- 렌더 ---------- */
  // 상단 시간이 다음으로 넘어가는 기준
  //  - 정각(00분) 예약: 11분 지나면
  //  - 비정각 예약   : 그 시각이 되면 (5초)
  // 어느 쪽이든 그 시간대를 다 체크하면 그 즉시 넘어간다.
  var GRACE_ON_HOUR = 11, GRACE_OFF_HOUR = 5/60;
  var AUTO_CANCEL_MIN = 20;    // 예약 시각에서 이만큼 지나도 체크가 없으면 취소
  var AUTO_CANCEL_WINDOW = 1;  // 그 순간에만 한 번. 지나간 시간대를 뒤늦게 훑지 않는다

  function nowMin(){
    var d = new Date();
    return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60 + d.getMilliseconds()/60000;
  }
  function slotMin(hm){
    var p = hm.split(':');
    return (+p[0])*60 + (+p[1]);
  }
  function slotLive(hm, now){
    var m = slotMin(hm);
    var grace = (m % 60 === 0) ? GRACE_ON_HOUR : GRACE_OFF_HOUR;
    return now < m + grace;
  }

  // 하루가 끝났을 때 방문 / 취소가 각각 몇 팀이었는지.
  // 「17/17」만으로는 몇 팀이 실제로 왔는지 알 수 없다.
  function dayTally(items){
    var came = 0, off = 0;
    items.forEach(function(x){
      if (x.status === 'arrived') came++;
      else if (x.status === 'cancelled') off++;
    });
    var out = ['<span class="pc tally-go">방문 ' + came + '</span>'];
    if (off) out.push('<span class="pc tally-off">취소 ' + off + '</span>');
    return out.join('<span class="pcsep"> · </span>');
  }

  // 상단 요약과 진행도만 다시 그린다 (목록은 건드리지 않는다)
  function paintHead(){
    paintDate();
    var all = state ? state.items.slice().sort(sortItems) : [];
    var gap = dayGap(viewDate);
    var gs = [], gi = {};
    all.forEach(function(it){
      if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({ time: it.time, items: [] }); }
      gs[gi[it.time]].items.push(it);
    });
    var now = nowMin(), nowTime = null;
    if (gap === 0){
      for (var i = 0; i < gs.length; i++){
        if (!slotLive(gs[i].time, now)) continue;
        if (gs[i].items.some(function(x){ return x.status === 'pending'; })){ nowTime = gs[i].time; break; }
      }
    }
    var slotPend = [];
    if (nowTime){
      gs.forEach(function(g){
        if (g.time === nowTime) slotPend = g.items.filter(function(x){ return x.status === 'pending'; });
      });
    }
    var leadRow = document.querySelector('.lead');
    var st = document.getElementById('slotTime');
    var lb = document.querySelector('.slotlab');
    var lm = document.getElementById('leadMain');
    var ls = document.getElementById('leadSub');

    if (slotPend.length){
      st.textContent = nowTime;
      lb.textContent = '예약';
      lm.className = 'leadmain num';
      lm.textContent = slotPend.length + '팀';
      var byPax = {};
      slotPend.forEach(function(x){ byPax[x.pax] = (byPax[x.pax] || 0) + 1; });
      ls.className = 'leadsub num';
      ls.innerHTML = Object.keys(byPax).map(Number).sort(function(a, b){ return a - b; })
        .map(function(p){ return '<span class="pc">' + p + '인 ' + byPax[p] + '팀</span>'; })
        .join('<span class="pcsep"> · </span>');
    } else if (gap !== 0 && all.length){
      st.textContent = ''; lb.textContent = '';
      lm.className = 'leadmain num';
      lm.textContent = all.length + '팀';
      ls.className = 'leadsub num tally';
      ls.innerHTML = dayTally(all);
    } else {
      st.textContent = ''; lb.textContent = '';
      lm.className = 'leadmain num done';
      lm.textContent = all.length ? '남은 예약 없음' : '';
      ls.className = 'leadsub num tally';
      ls.innerHTML = all.length ? dayTally(all) : '';
    }
    if (leadRow) leadRow.classList.toggle('hide', !st.textContent && !lm.textContent);

    var doneN = 0, offN = 0;
    all.forEach(function(it){
      if (it.status === 'arrived') doneN++;
      else if (it.status === 'cancelled') offN++;
    });
    var dp = document.getElementById('dayProg');
    dp.textContent = (doneN + offN) + '/' + all.length;
    dp.className = 'dayprog num' + (all.length ? '' : ' hide')
      + (all.length && doneN + offN === all.length ? ' full' : '');
  }

  function render(){
    if (!interactionActive() && deferredState){
      state = merge(deferredState, state);
      deferredState = null;
    }
    backgroundRenderPending = !!deferredState;
    paintDate();
    var list = document.getElementById('list');
    var all = state ? state.items.slice().sort(sortItems) : [];
    var q = (query || '').trim().toLowerCase();
    var items = q
      ? all.filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; })
      : all;

    var qc = document.getElementById('qCount');
    if (q){
      qc.classList.remove('hide');
      qc.className = 'qcount' + (items.length ? '' : ' zero');
      qc.textContent = items.length + '건';
    } else {
      qc.classList.add('hide');
    }

    // 시간대 묶기 — 표시용은 검색 결과, 계산용(allGroups)은 전체
    function groupBy(arr){
      var gs = [], gi = {};
      arr.forEach(function(it){
        if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({time:it.time, items:[]}); }
        gs[gi[it.time]].items.push(it);
      });
      return gs;
    }
    var groups = groupBy(items);
    var allGroups = q ? groupBy(all) : groups;

    // 다음 시간대 — 아직 마감되지 않았고 남은 팀이 있는 첫 시간대 (오늘일 때만)
    var now = nowMin(), nowTime = null;
    if (dayGap(viewDate) === 0){
      for (var i=0;i<allGroups.length;i++){
        if (!slotLive(allGroups[i].time, now)) continue;
        if (allGroups[i].items.some(function(x){ return x.status==='pending'; })){ nowTime = allGroups[i].time; break; }
      }
    }

    paintHead();
    var gap = dayGap(viewDate);

    // 명단이 없으면 하단 메뉴와 검색은 할 일이 없다
    var allCount = all.length;
    var footEl2 = document.querySelector('.foot');
    if (footEl2) footEl2.classList.toggle('hide', !allCount);
    document.body.style.paddingBottom = allCount ? '' : '24px';
    searchBtn.classList.toggle('off', !allCount);
    if (!allCount && !searchbar.classList.contains('hide')) closeSearch(false);

    // 날짜 표시 / 이동 버튼
    document.body.classList.toggle('offday', gap !== 0);
    renderDrawerDays();

    // 목록
    list.innerHTML = '';
    var em = document.getElementById('emptyMsg');
    if (!items.length){
      if (q){
        em.classList.remove('hide');
        em.textContent = '「' + query.trim() + '」 검색 결과가 없습니다';
      } else {
        em.classList.add('hide');
        if (state && panel.classList.contains('hide')) openPaste(true);
      }
      return;
    }
    em.classList.add('hide');

    // 다른 기기에서 명단이 들어오면 이쪽 붙여넣기 창은 닫는다.
    // 단, 내가 직접 입력하던 중이면 건드리지 않는다.
    if (!panel.classList.contains('hide') && !ta.value.trim()) closePaste();

    var openCount = 0;
    groups.forEach(function(g, idx){
      var pend = g.items.filter(function(x){ return x.status==='pending'; });
      var came = g.items.filter(function(x){ return x.status==='arrived'; }).length;
      var off  = g.items.filter(function(x){ return x.status==='cancelled'; }).length;
      var tot  = g.items.length;
      var shut = q ? false : isCollapsed(g.time, pend.length);

      var wrap = document.createElement('section');
      wrap.className = 'group' + (g.time === nowTime ? ' now' : (pend.length ? '' : ' done')) + (shut ? ' shut' : '');
      wrap.setAttribute('data-time', g.time);

      var head = document.createElement('button');
      head.className = 'ghead';
      head.type = 'button';
      head.innerHTML = '<span class="chev"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg></span>'
        + '<span class="gtime num">' + g.time + '</span>'
        + '<span class="gline"></span>'
        + '<span class="gmeta num">'
        +   '<b>' + (came + off) + '/' + tot + '</b>'
        +   '<span class="gbreak">방문 ' + came + (off ? ' · 취소 ' + off : '') + '</span>'
        + '</span>';
      head.setAttribute('data-time', g.time);
      head.addEventListener('click', function(e){
        if (takeGhostClick(e)) return;
        toggleSlot(g.time);
      });
      wrap.appendChild(head);

      if (!shut) g.items.forEach(function(it){ wrap.appendChild(rowEl(it)); });
      list.appendChild(wrap);
      openCount += shut ? 0 : 1;
    });

    var fb = document.getElementById('foldBtn');
    if (fb) fb.textContent = openCount ? '전체 접기' : '전체 펼치기';

    var hd = document.querySelector('header');
    if (hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');

    if (typeof footMode === 'function') requestAnimationFrame(footMode);

  // 행이 아래로 펼쳐질 때 화면 밖으로 밀려나면 그만큼 스크롤을 내려준다.
  // 하단 바에 가려 잘리는 걸 막는다.
  // 펼쳐진 내용이 아래로 잘리면 그만큼만 스크롤한다.
  // 안전 영역 안에 들어오기 위한 최소 이동량. 큰 대상은 쓰임에 따라 위/아래를 우선한다.
  function roomMove(rect, topEdge, bottomEdge, tallPreference){
    if (!rect || bottomEdge <= topEdge) return 0;
    var height = Number(rect.height);
    if (!(height >= 0)) height = rect.bottom - rect.top;
    if (height > bottomEdge - topEdge){
      return tallPreference === 'bottom'
        ? rect.bottom - bottomEdge : rect.top - topEdge;
    }
    if (rect.top < topEdge) return rect.top - topEdge;
    if (rect.bottom > bottomEdge) return rect.bottom - bottomEdge;
    return 0;
  }

  // 한 화면에 다 안 들어가면 위쪽을 헤더 밑에 맞춘다 —
  // 시간대 제목은 sticky 라 더 내려도 화면에 계속 붙어 있다.
  function scrollIntoRoom(el){
    if (!el) return;
    requestAnimationFrame(function(){
      var r = el.getBoundingClientRect();
      var hd = document.querySelector('header');
      var headBottom = hd ? hd.getBoundingClientRect().bottom : 0;
      var group = el.closest && el.closest('.group');
      var groupHead = group && group.querySelector('.ghead');
      // 스크롤 도중 시간대 제목이 sticky 상태로 바뀌므로 현재 좌표가 아니라
      // 고정됐을 때 차지할 높이를 예약한다. 단, 시간대 자체를 맞출 때는
      // 그 제목이 목표물이므로 자신의 높이를 한 번 더 더하지 않는다.
      var groupIsTarget = el.classList && el.classList.contains('group');
      var visualTop = vv ? Math.max(0, Math.round(vv.offsetTop)) : 0;
      var barsFree = document.body.classList.contains('keyboard-bars-free');
      var coveredTop = barsFree ? visualTop : headBottom
        + (groupHead && !groupIsTarget ? groupHead.offsetHeight : 0);
      var visualBottom = vv
        ? Math.min(window.innerHeight, Math.round(vv.offsetTop + vv.height))
        : window.innerHeight;
      var footUsable = footEl && !footEl.classList.contains('hide')
        && !footEl.classList.contains('keyboard-covered');
      var footTop = footUsable
        ? Math.min(footEl.getBoundingClientRect().top, visualBottom) : visualBottom;
      var topEdge = coveredTop + 8;
      var bottomEdge = footTop - 10;
      var move = roomMove(r, topEdge, bottomEdge, 'top');
      if (Math.abs(move) > 1) window.scrollBy({ top: move, behavior: 'smooth' });
    });
  }

  function rowForId(id){
    var rows = document.querySelectorAll('.row');
    for (var i = 0; i < rows.length; i++){
      if (rows[i].getAttribute('data-id') === id) return rows[i];
    }
    return null;
  }

  // Android 계열이 사라진 메뉴 버튼의 포커스를 첫 입력칸으로 넘기지 않게 한다.
  function neutralFocusEdit(id){
    var active = document.activeElement;
    if (active && active.blur) active.blur();
    requestAnimationFrame(function(){
      var row = rowForId(id);
      var form = row && row.querySelector('.edit');
      if (!form) return;
      form.setAttribute('tabindex', '-1');
      try { form.focus({ preventScroll: true }); }
      catch(e){ form.focus(); }
    });
  }

  function ensureVisible(id){
    scrollIntoRoom(rowForId(id));
  }

  var ICON_GO = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"'
    + ' stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"'
    + ' stroke-width="3.4" stroke-linecap="round"><path d="M7 7 L17 17M17 7 L7 17"/></svg>';
  function statusTag(st){
    return st === 'arrived' ? '<span class="tag arrived">방문</span>'
         : st === 'cancelled' ? '<span class="tag cancelled">취소</span>' : '';
  }

  function tapMore(id){
    keepSlotOpenForId(id);
    if (editing === id){               // 같은 행이면 저장하지 않고 접는다
      if (keyboardOpen){ keyboardRevealId = id; keyboardRevealSmooth = false; }
      editing = null; openMenu = null; lastEditControlId = null; render();
      return;
    }
    if (editing){                       // 다른 행의 수정 창은 닫고 그 행을 새 기준으로 삼는다
      keepSlotOpenForId(editing);
      if (keyboardOpen){ keyboardRevealId = editing; keyboardRevealSmooth = false; }
      editing = null; lastEditControlId = null;
    }
    if (openMenu && openMenu !== id) keepSlotOpenForId(openMenu);
    openMenu = (openMenu === id) ? null : id;
    render();
    if (openMenu){
      // 수정 입력창을 없앤 직후에는 실제 키보드가 아직 내려가는 중일 수 있다.
      // 당장은 가능한 만큼만 드러내고, 종료가 확정되면 이 새 메뉴를 한 번 더 맞춘다.
      if (keyboardOpen){
        followMenuId = id;
        keyboardRevealId = null;
        keyboardRevealSmooth = false;
      }
      ensureVisible(id);
    } else if (followMenuId === id){
      followMenuId = null;
    }
  }

  function runMenuAction(id, action, status){
    var it = find(id);
    if (!it) return;
    keepSlotOpenForId(id);
    if (action === 'status'){
      setStatus(id, status);
      return;
    }
    if (action === 'edit'){
      if (typeof searchbar !== 'undefined' && !searchbar.classList.contains('hide')){
        closeSearch(false);
        backDone();
      }
      editing = id; openMenu = null; lastEditControlId = null; render();
      neutralFocusEdit(id);
      ensureVisible(id);
      return;
    }
    if (action === 'delete'){
      logAdd('삭제', it.time + ' ' + it.name);
      state.items = state.items.filter(function(x){ return x.id !== id; });
      state.rosterTs = Date.now();
      openMenu = null; render(); save();
    }
  }

    if (editing === it.id){

      form.innerHTML = '<div class="erow">'
        + '<label>시<select id="e-hour">' + hOpts + '</select></label>'
        + '<label>분<select id="e-min">' + mOpts + '</select></label>'
        + '<label class="grow">이름<input type="text" id="e-name"></label>'
        + '<label>인원<select id="e-pax">' + paxOpts + '</select></label>'
        + '</div>'
        + '<div class="erow memorow">'
        + '<label class="grow">메모<input type="text" id="e-memo" autocomplete="off" placeholder="창가석 요청, 인플루언서 …"></label>'
        + '</div>'

        + '<button type="button" id="e-no">취소</button></div>';
      body.appendChild(form);
      // 영업시간 밖이거나 5분 단위가 아닌 예약이면 그 값도 목록에 넣어준다

      function ensureOpt(sel, v){
        if ([].some.call(sel.options, function(o){ return o.value === v; })) return;

        o.value = v; o.textContent = v;
        sel.insertBefore(o, sel.firstChild);

      hSel.value = curH; mSel.value = curM;

      form.querySelector('#e-ok').addEventListener('click', function(){
        applyEdit(it.id,
          form.querySelector('#e-hour').value + ':' + form.querySelector('#e-min').value,

        if (e.key === 'Enter') form.querySelector('#e-ok').click();

    row.appendChild(body);
