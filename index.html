<!DOCTYPE html>
<!-- background 인라인 — 앱을 다시 열 때 아래 스타일시트가 파싱되기 전 한두 프레임이
     WKWebView 기본색(흰색)으로 보인다. 이 값은 그보다 먼저 먹으므로 그 틈이 앱 배경색으로 채워진다.
     여기 적힌 건 스크립트가 돌기 전의 씨앗값(다크 = 대개 맞는 쪽)이고, 바로 아래 head 스크립트의
     setThemeChrome 이 저장된 테마로 곧바로 덮어쓴다 — 고정값으로 두면 이 인라인이
     스타일시트(html,body{background:var(--ink)})를 이겨 라이트에서 루트만 어둡게 남는다. -->
<html lang="ko" style="background:#1c1c1e">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#1c1c1e"><!-- = --ink(다크). setThemeChrome 이 테마에 맞게 갱신 -->
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- 콜드 스타트 단축 — Firebase 모듈 다운로드와 서버 연결을 HTML 파싱 중에 미리 시작한다.
     (평소엔 문서 끝의 모듈 스크립트까지 파싱이 도달해서야 시작됐다.)
     로직은 하나도 안 바뀐다. 버전은 아래 import 문과 반드시 같아야 한다.
     ★Firebase 버전을 올릴 땐 «세 곳»을 같이 고쳐야 한다 — 이 preconnect · 문서 끝 import 문 ·
       sw.js 의 FB 상수. sw.js 가 어긋나면 오프라인에서 옛 SDK 가 나오거나 아예 안 열린다. -->

<link rel="preconnect" href="https://ikseon-reserve-default-rtdb.asia-southeast1.firebasedatabase.app">

<script>
// 테마에 딸린 것(속성·색·메타)을 한 번에 바꾼다. 페인트 전 1회 + 서랍에서 바꿀 때 둘 다 이 함수를
// 써서 상태가 갈라지지 않게 한다.
//
// ★ 아이폰 노치(상태바 띠) — 「앱을 켤 때는 테마대로, 켜 둔 채 테마를 바꾸면 다음 실행까지 그대로」.
//   고치려다 실패한 것이지 안 해 본 게 아니다. 2026-09-06 실기기로 넷 다 무효였다:
//     ① status-bar-style 테마 전환   ② 루트 캔버스 배경 덮어쓰기
//     ③ 메타를 노드째 교체           ④ 테마 바꿀 때 문서를 강제로 1px 스크롤
//   ④ 는 「문서가 스크롤되면 iOS 가 다시 칠한다」는 가설을 셸을 안 뜯고 확인한 탐침이다 —
//   스크롤이 실제로 일어났는데도(실측) 안 바뀌어 가설 기각 = 앱 셸을 v1.4 처럼 되돌려도 소용없다.
//   v1.4.0 head 와 전체 diff 도 떴고 지금 head 에 빠진 건 없다. 남은 수단은 black-translucent
//   (상태바를 웹 영역에 넣어 우리가 직접 칠하기) 하나뿐인데, --sbcut 보정과 스플래시·잠금
//   중앙정렬을 전부 다시 짜야 해서 접었다(오너 합의). ★ 다시 시도하지 말 것.
//
// 아래 두 줄은 노치와 별개로 각각 옳아서 남긴다:
//   · d.style.background — 루트(html)의 인라인 배경(흰 번쩍임 방지용)이 스타일시트를 이겨서
//     라이트 테마에서 루트만 어둡게 남던 것을 바로잡는다.
//   · status-bar-style — 이건 상태바 «글자» 색이다 (black=흰 글자 / default=검은 글자).
//     배경은 theme-color 몫이라, 라이트인데 black 이면 「밝은 바 + 흰 글자」가 되어 시계·배터리가
//     안 읽힌다. 그걸 막는 게 이 줄의 값어치다 — 실기기 확인 완료(2026-09-06, 라이트로 켰을 때
//     잘 읽힘). 런타임 전환이 안 되는 것과는 별개로, 「켤 때」는 제 몫을 한다.
//     둘 다 불투명이라 웹 뷰포트 높이(--sbcut 62pt)는 안 건드린다(black-translucent 만 바꾼다).
window.setThemeChrome = function(t){
  var d = document.documentElement;
  // 상태 표시줄(노치 띠) 색 = 바탕색 --ink 와 같은 값 (토큰을 못 읽는 시점이라 리터럴). 상단 셸도 같은 색이라 한 층으로 보인다.
  var bar = (t === 'light') ? '#f6f5f2' : '#1c1c1e';   // = --ink
  d.setAttribute('data-theme', t);
  d.style.colorScheme = (t === 'light') ? 'light' : 'dark';
  // 설치된 앱(standalone)의 상태 표시줄 띠는 theme-color 가 아니라 «문서(html) 배경색»으로 칠해진다 — 시뮬레이터로 확인(2026-09-11).
  // body 가 화면 전체를 ink 로 덮으니 html 배경은 띠와 오버스크롤에만 보인다 → 셸 색으로. (콜드 런치 흰 화면 방지 역할은 그대로)
  d.style.background = bar;
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.content = bar;
  var barMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (barMeta) barMeta.content = (t === 'light') ? 'default' : 'black';
};
// 화면이 그려지기 전에 정한다. 나중에 바꾸면 어두운 화면이 한 번 번쩍인다.
(function(){
  var t = 'dark';
  try { if (localStorage.getItem('theme') === 'light') t = 'light'; } catch(e){}
  window.setThemeChrome(t);
})();
// 전에 이 기기에서 로그인했으면 잠금 화면을 아예 그리지 않는다 (앱 열 때마다 키패드가 번쩍이지 않게).
// 그 사이(Auth SDK 로드 + 명단 수신, ~1초)는 아래 .splash 스플래시가 화면을 덮는다.
// 보안이 아니라 깜빡임 방지용 — 실제 차단은 Firebase 규칙이 한다. 표식만 조작해도 명단은 못 읽는다.
// 로그인이 아닌 것으로 밝혀지면 아래 IIFE 가 이 속성을 지우고 잠금을 띄운다.
(function(){
  try { if (localStorage.getItem('ix-authed') === '1') document.documentElement.setAttribute('data-authed','1'); } catch(e){}
})();
// 홈 화면 앱(standalone)에서는 iOS 가 상태바 높이만큼 웹 영역을 「위에서」 잘라낸다.
// 그래서 웹 영역의 한가운데는 기기 화면 한가운데보다 그 절반만큼 아래다 (아이폰 17 기준 31pt).
// 잘린 만큼을 아래 여백으로 돌려주면 스플래시가 실제 화면 한가운데로 온다.
// 기기에서 읽는 값이라 기종이 달라도 맞는다. 사파리는 아래 툴바까지 빠져 값이 커지므로 제외.
// 재실행 경로에 따라 이 스크립트가 도는 순간 innerHeight 가 아직 상태바 제외 전(cut=0)일
// 때가 있다(실기기 확인) — 한 번만 재면 보정이 통째로 빠져 ~31pt 아래로 처진다. 그래서 화면이
// 다시 보일 때마다 몇 차례 다시 잰다. 반대로 콜드 런치 직후엔 잠깐 과대값이 잡히기도 해서,
// 「마지막 값」이 아니라 「처음 유효했던 값」으로 고정한다 — 고정 뒤의 재측정은 전부 무시된다.
var sbcutLocked = false;
function applySbcut(){
  try {
    if (navigator.standalone !== true || sbcutLocked) return;
    var cut = Math.round(screen.height - window.innerHeight);
    if (cut > 0 && cut < 120){
      document.documentElement.style.setProperty('--sbcut', cut + 'px');
      sbcutLocked = true;
    } else {
      document.documentElement.style.setProperty('--sbcut', '0px');
    }
  } catch(e){}
}
applySbcut();
function remeasureSbcut(){ [0, 60, 200, 500].forEach(function(t){ setTimeout(applySbcut, t); }); }
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') remeasureSbcut(); });
window.addEventListener('pageshow', remeasureSbcut);
</script>

<title>익순이</title>
<style>
  :root{
    /* 둥글기 두 단계 — «판»은 18(--radius), 그 판 «안의 면»은 12.
       판 = 시트·추가패널·확인창·룰렛·QR 카드(236px 정사각).  안의 면 = .wnet·.plat 카드·룰렛 칩·작은 버튼.
       누르는 알약(하단바·세그먼트·닫기)은 999. (전엔 「카드 18」이라 적혀 있었지만 실제 카드는 12다 — 2026-09-21 정정) */
    --radius:18px;   /* «판»의 둥글기 — 시트·추가패널·카드·확인창·룰렛·QR 카드가 전부 이 하나를 쓴다.
                        (알약은 999, 칩·작은 상자는 8, 누르는 사각 버튼·여러 줄 입력칸(textarea)은 12 — 그 셋은 역할이 달라
                         토큰을 안 둔다.) ※위 줄의 「입력칸」은 한 줄 입력(검색·이름·룰렛 = 999px 15곳)을 말한다. 같은 말이
                         두 줄에서 다른 것을 가리켜 모순처럼 읽혔다(2026-09-16 정리) — 코드는 처음부터 이 둘로 나뉘어 있었다. */
    /* 움직임 — 곡선 하나, 시간 3단계 (2026-09-12 통일). 눌림 120 · 상태(색·회전·체크) 150 · 이동(시트·창·서랍·토스트·썸·페이드) 200.
       예외 셋: 잠금 흔들림(.32s, 피드백)·확인 중 맥동(.9s 반복)·스플래시 하트(.45s, easeOutQuad —
       --ease 로는 «보이는 성장»이 40ms 뿐이라 번쩍인다). 룰렛은 놀이라 제 곡선. */
    --ease:cubic-bezier(.2,.8,.2,1);
    /* «고른» 곡선 — 처음과 끝이 느리고 가운데가 빠르다. 두 군데에 쓴다: 창이 «나갈» 때, 그리고 «어둠막» 양쪽 방향.
       --ease 는 앞쪽에 몰려 있어 닫을 때 쓰면
       27ms 에 반이 사라지고 79ms 에 거의 다 사라진다 — 200ms 중 120ms 가 «안 보이는 시간»이라 툭 꺼져 보였다.
       대칭 곡선이면 100ms 에 반, 155ms 에 거의 — 사라지는 과정이 고르게 보인다(2026-09-18).
       값은 번개 타격에 쓰던 것과 같다 — 곡선 종류를 늘리지 않으려고 그대로 썼다.
       ★어둠막에도 이 곡선을 쓴다(깔릴 때·걷힐 때 둘 다). --ease 로 깔면 첫 프레임에 30%·둘째에 60% 가 차서
         화면 «전체»가 두 프레임 만에 어두워진다 — 오너 「화면 전체가 휙 바뀌는 느낌」(2026-09-19).
         고른 곡선이면 한 프레임 최대 낙폭이 8.2 → 2.2 로 줄고 190ms 에 걸쳐 깔린다(밝기 실측).
       ★잠금·스플래시는 «창»이 아니라 화면 덮개라 여기서 뺐다. 걷히는 건 빠를수록 좋다. */
    --easeEven:cubic-bezier(.45,0,.55,1);
    --tPress:.12s;  --tState:.15s;  --tMove:.2s;
    /* 판이 «불투명해지는» 시간 = 이동 시간의 1/4(50ms). 독립된 네 번째 단계가 아니라 --tMove 에서 나온 값이다
       (세 단계 사다리는 그대로 셋). 들어올 때만 쓴다 — 나갈 때는 --tMove.
       ★절반(100ms)으로 뒀더니 «첫 프레임»이 40% 밖에 안 차서, 서랍 위에 룰렛창이 뜰 때 서랍 글자가 창을 뚫고 보였다
         (오너 2026-09-19 「잔상」). 1/4 로 줄이니 첫 프레임부터 깨끗하다 — 페이드를 아주 없앤 것과 눈으로 구분이 안 된다.
       판이 반투명한 동안엔 뒤 내용이 판을 뚫고 보인다(오너 「잔상」, 2026-09-19).
       어둠막은 --tMove 로 천천히 깔리고, 판만 먼저 불투명해진다. 자리 잡는 움직임도 --tMove 그대로.
       ★나갈 때도 이 값을 쓰면 판이 100ms 만에 사라져 예전의 「툭 꺼짐」이 되살아난다 — 넣지 말 것. */
    --tFade:calc(var(--tMove) / 4);
    /* ── 「등장」 규칙 — 무엇이 어디서 오는가로 정한다. 새 오버레이를 만들면 이 넷 중 하나를 고를 것 ──
       ① 바닥에서 오는 «큰 판»  : 24px 올라오며 페이드   (시트 .sheet · 추가/수정 패널 .panel.asSheet)
       ② 바닥에서 오는 «작은 알약»: 8px 올라오며 페이드   (토스트 .toast · 업데이트 알약 @keyframes pillIn)
       ③ 가운데에서 오는 것      : scale(.96)→1 + 페이드 (확인창 .dialog · 룰렛 .rlt — 올라올 바닥이 없다)
       ④ 가장자리에서 오는 것    : 제 폭만큼 밀려 들어옴  (서랍 .drawer, translateX -101%→0)
       붙어 있는 것(행 ⋯ 메뉴)은 이동 없이 페이드만(fadeIn) — 이미 그 자리에 속한 것이라 움직일 이유가 없다.
       ★겹쳐 뜨는 것은 «무엇이든» --tFade 에 불투명해진다(시트·확인창·룰렛창·예약추가·토스트·업데이트 알약·행 메뉴).
         반투명한 동안엔 뒤가 비치기 때문이다. 자리 잡는 움직임과 어둠만 --tMove 로 천천히 간다.
       시간은 전부 --tMove. 곡선은 «방향»을 탄다 — 들어올 때 --ease, 나갈 때 --easeEven(위 주석). 거리는 요소 크기에 맞춘다.
       ★예외 둘(둘 다 일부러) — 행 ⋯ 메뉴: 행 안에 끼어 있어 사라질 때 DOM 에서 빠진다(자리가 같이 줄어든다).
         퇴장을 페이드로 하려면 높이까지 접어야 하는데, 접기 애니메이션은 2026-09-12 에 버렸다. 그래서 등장만 있다(0.15초).
         업데이트 알약: 한 번 뜨면 새로고침할 때까지 안 내려간다 — 퇴장 경로 자체가 없다. */
    /* 바탕 */
    /* ★ 바탕 N4 #1c1c1e (2026-09-12 확정, 애플 secondarySystemBackground 계열 중성 회색). 면·선·눌림은 바탕에서
       +7/+14/+22/+10/+45/+20/+32 로 파생 — 면은 선이 아니라 «밝기»로만 구분 (ink < panel < panel2 < btn < btnPress).
       경위: 원래 청회색 #0f1319 → 순검정·클로드·스포티파이·구글·중성 N1~N7·찬 기운 C1~C10 을 나란히 비교, 중성이
       판독 동률·오래 보기·층 분리·캐스트에서 우위(오너 확정). 회색족(text·dim·off·ph·line)은 전부 같은 미세 청색
       기울기(OKLCh h≈286, C≤.008)라 한 가족. 상태 3색은 L .65~.81 · C .10~.13 으로 밝기·채도 폭을 맞춘 무채 바탕용
       세트: 금(강조)·세이지 초록(방문)·연빨강(취소). 2026-09-12 항목별 색 점검에서 다크 토큰은 손댈 곳 없음. */
    --ink:#1c1c1e;      --panel:#232325;    --panel2:#2a2a2c;
    --line:#323234;     --press:#262628;   --keyDn:#49494b;   /* 키패드 눌림 — --press 보다 확실히 밝게 */
    --text:#f2f3f5;     --dim:#a0a0a5;      --off:#78787d;
    --ph:#878789;
    /* 보조 버튼 = 테두리 없는 «면». 입력칸(선)과 버튼(면)이 한눈에 갈린다.
       눌림은 면이 한 단 밝아진다(--press 는 이 면과 거의 같아 안 보여서 따로 둔다). */
    --btn:#303032;      --btnPress:#3c3c3e;  --btnWarn:#3a2a2c;  --btnWarnPress:#4a3336;
    --scrim:rgba(0,0,0,.62);   --scrimLite:rgba(0,0,0,.5);
    /* 강조 — 다크 금색 · 라이트 테라코타. 칠·글자·큰 숫자 한 값 */
    --wait:#e8b757;
    /* 마크가 앉는 판은 «--ink» 다. 한 값으로 세 자리가 각자 맞는다 —
       스플래시·잠금은 바탕이 --ink 라 판이 사라져 누끼가 되고, 서랍은 --panel 위라 은은히 보인다.
       2026-09-15: 어두운 판을 «고정»으로 깔았다가(라이트에서 순백 위 순먹) 오너 반려 →
       판을 아예 없앴더니 이번엔 서랍 판까지 사라졌다. 결국 옛 규칙(--ink)이 옳았다.
       크림 위 금색은 윤곽 대비 1.70:1 이지만 검은 눈·입·초록 체크·볼터치·하트가 «안쪽에서»
       대비를 만들어 형태가 읽힌다 — 윤곽 수치만 보고 판을 깔았던 게 틀렸다.
       홈 화면 PNG 는 늘 #1c1c1e 판 — 아이콘은 테마를 못 따라간다.
       (옛 --markEye 토큰은 마크 색이 벡터에 구워지며 쓰임이 사라졌다.) */
        --onWait:#241a05;   --waitHover:#f0c46e;   --field:#202022;   /* 클로드 fill-brand-hover · fill-field */   --mark:#463a13;
    /* 방문 — 초록 (상태 색은 체크 원 하나에만 쓴다) */
    --go:#5fb08a;       --goTx:var(--go);      --onGo:#08241a;
    /* 취소·경고 — 붉은색 */
    --warn:#c9736a;
    /* 테스트판 표시 전용 빨강. --warn(취소·「지금」 시간대)과 «일부러 다른 값»이다 — 같은 색이면
       「테스트」가 경고나 지금 시간대로 읽힌다. 앱 아이콘의 TEST 띠(#e5484d)와 같은 계열이되,
       바탕 위 글자로 쓰므로 대비를 맞춰 한 눈금 올렸다(#e5484d 는 4.35 로 AA 미달). */
    --test:#ea555a;   /* --ink 위 4.82:1 */
    /* 초기화 버튼 글자 — --btnWarn 면 위에서도, 그 위로 --warn 이 42% 차올라도 읽힌다. --onWait·--onGo 와 같은 작명 */
    --onWarn:#e0aca6;
    /* 붙여넣기 오류 (줄 강조 + 안내문) */
    --errRow:rgba(201,115,106,.16);   --errTx:#e0a49d;
  }
  /* ★ 라이트 L3 (2026-09-12 확정 · 2026-09-13 강조색 교체): 따뜻한 회백 #f6f5f2(베이지 아님) +
     클로드 clay 강조 #d8714f — 면·글자 한 값(면 위 글자는 --onWait). 다크 금색과 같은 따뜻한 가족.
     이전 파랑(#2a5bd7) 강조와 베이지 시범은 폐기. */
  html[data-theme="light"]{
    /* 면 층 간격을 다크와 같은 지각 밝기(OKLab ΔL)로 맞춤 — 선 .085 · 칩 .05 · 버튼 .08 · 눌림 .14.
       전엔 라이트가 다크의 절반 간격이라 구분선·칩·눌림이 희미했다. */
    --ink:#f6f5f2;      --panel:#ffffff;    --panel2:#e9e7e2;
    --line:#dad7d1;     --press:#e8e6e1;   --keyDn:#c9c5bd;
    --text:#1d1913;     --dim:#6b665f;   /* 글자·스크림·그림자도 회색족과 같은 따뜻한 기울기(h≈78) — 남색 잔재 #161a20 정리 */      --off:#8a857d;
    /* 입력 힌트 — 흰 칸 위 2.97:1 로 비텍스트 최소선(3.0)에도 못 미쳤다(2026-09-13 전수 점검).
       회색 사다리 순서(text .216 < dim .513 < off .619 < ph)는 지키면서 3.30:1 까지만 진하게. */
    --ph:#7a7671;   /* 흰 입력칸 위 3.30:1 → 4.51:1. 안내 글자도 «무엇을 적어야 하는지»를 말하는 글이라
                        본문 기준(4.5)을 지킨다 — 팔레트 15짝 중 여기만 미달이었다(2026-09-21).
                        따뜻함은 그대로(같은 R:G:B 비율에서 4.5 를 넘는 가장 밝은 값). */
    /* 흰 시트 위에도, 연회색 바탕(--ink) 위에도 보이게 한 단 진하게 */
    --btn:#e2dfd9;      --btnPress:#d3cfc8;  --btnWarn:#fbe6e3;  --btnWarnPress:#f5d2cd;
    --scrim:rgba(29,25,19,.44); --scrimLite:rgba(29,25,19,.34);
    /* 강조 한 값(--wait)으로 채움·큰 숫자·아이콘을 다 쓴다. 작은 글자엔 강조색을 안 쓰는 규칙은 다크와 같다. */
    /* 2026-09-13 강조색 교체 — claude.ai 라이트 토큰을 직접 읽어 clay(#d97757) 계열로 옮겼다.
       이전 #b5541e 의 문제는 밝기만이 아니라 색상이었다: 45.8° 로 7° 노란쪽이라 주황이 아니라 «갈색»으로 읽혔다.
       밝기를 올리려면 «흰 버튼 글자»가 걸림돌이다 — 흰 글자 4.5 를 지키려면 L 이 .582 위로 못 올라가
       지금(.559)과 사실상 같아진다. 그래서 다크와 같은 언어로 통일했다: «밝은 강조 면 + 어두운 글자».
       이제 두 테마가 같은 규칙이다(다크 금색 #e8b757 + #241a05 / 라이트 clay #d8714f + #39180d).
       L .559 → .661 로 실제로 밝아지면서, 종이 위 그래픽 대비 3.01 을 지키는 상한이기도 하다. */
    --wait:#d8714f;
    /* ★ 강조는 «한 값»이다 — 면이든 글자든 --wait 하나. (2026-09-13 오너 확정: 「일관성을 위해 글자 색도
       클로드 주황으로」.) 한때 글자용 --waitTx(#bd4d21)를 따로 뒀다가 폐기 — 같은 「시간」 표시가
       카드에선 밝은 주황, 명단 머리글에선 진한 주황으로 갈려 두 색이 됐다.
       대가는 정직하게 적어 둔다: 「지금」 시간대 머리글(.gtime 17px/800)이 종이 위 3.01:1 로,
       보통 글자 기준 4.5 에 못 미친다(큰 글자 기준 3.0 은 넘지만 17px 는 18.66px 문턱에 1.66 모자람).
       판단 근거 — ① 20px 인 카드 시각·퇴근 타이머·룰렛 결과는 큰 글자라 3.28:1 로 충족 ② 「지금」이라는
       뜻은 색 말고 왼쪽 3px 포인트색 레일(.group.now .ghead::before)이 이미 따로 지고 있어
       색이 유일한 단서가 아니다 ③ 이 대비를 4.5 로 올리려면 강조색을 L .566 아래로 내려야 해서
       교체 전 갈색(#b5541e)으로 되돌아간다. 색을 다시 나누려면 이 세 가지를 먼저 다시 볼 것. */
    /* 강조 눌림은 «밝아진다» — 다크(#e8b757→#f0c46e, ΔL .047)와 같은 단차, 클로드 fill-brand-hover 와도 같은 방향.
       어두운 글자를 얹으므로 밝아질수록 대비가 오른다(4.88 → 5.87). 회색 버튼의 눌림(라이트는 어두워짐)과는 별개 규칙. */
    --onWait:#39180d;   --waitHover:#e58261;   --field:#ffffff;    /* --field = 클로드 fill-field(light) */   --mark:#f7d8cb;   /* --mark = 클로드 bg-tint-orange */
    --go:#2f9c6e;       --goTx:#1a7250;     --onGo:#ffffff;   /* 칩(--panel2) 위 4.9:1 */
    --warn:#b43f36;
    --onWarn:#7a2a20;
    --test:#c9333a;   /* --ink 위 4.79:1 — 다크와 같은 자리, 밝은 바탕이라 반대로 내렸다 */
    --errRow:rgba(192,72,60,.12);   --errTx:#9e4438;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  /* 상태 표시줄 띠·오버스크롤·body·상단 셸 전부 --ink 한 색. 어느 층이 띠를 칠하는지 기록이 엇갈렸는데(html 인라인 / body / 첫 화면 면)
     셋 다 같은 값이라 어느 쪽이든 같은 색이 나온다. html 인라인 배경은 head 의 setThemeChrome 이 같은 리터럴로 칠한다. */
  /* 앱 셸 구조 — body 는 화면 전체를 덮는 고정 틀. 절대 크기가 안 변한다.
     키보드는 그 위에 얹혀 올라오고(일반 앱처럼 뒤가 비침), 스크롤은 .wrap 안에서만.
     하단 알약 바는 position:fixed 로 떠 있고 명단이 그 밑으로 지나간다. */
  html{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    position:fixed;inset:0;
    overscroll-behavior:none;
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
    font-size:16px;
    line-height:1.4;   /* 문서 기본값(대부분의 요소가 제 값으로 덮는다) — 줄높이 사다리는 «글 블록»에 적용되는 규칙이고 이건 그 밑바탕이다 */
    display:flex;flex-direction:column;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;        /* 두 번 탭 확대 방지 */
    -webkit-text-size-adjust:100%;
    /* 탭이 잦은 매장용 앱 — 길게 눌러도 텍스트 선택·복사·조회 팝업이 안 뜨게 한다.
       입력칸과 Wi-Fi 정보만 예외로 선택을 허용한다(아래). */
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
  }
  input, textarea{ -webkit-user-select:text;user-select:text }
  .wnet .v{ -webkit-user-select:text;user-select:text;-webkit-touch-callout:default }
  /* 키보드가 올라오면 하단 바를 숨긴다 (어차피 키보드 뒤라 못 쓴다).
     상단 헤더는 늘 유지 — 숨겼다 되살리면 화면이 튄다. */
  body.keyboard-open > .foot{display:none}
  /* 붙여넣기 화면(명단이 비었을 때)은 카드 하나짜리 폼이다. 명단 관리 화면과 달리
     '고정'하지 않는다 — .wrap 이 (--kb 만큼 여유를 두고) 정상 스크롤되게 두고,
     openPaste 에서 scrollIntoView 로 부드럽게 이동한다. 키보드가 올라오면 iOS 가
     .wrap 을 네이티브 관성으로 스크롤해 입력칸을 드러낸다 (1.4.0 방식, iOS 에 맡김).
     입력칸 높이는 taFixedH 로 열 때 한 번만 정한다 (오류가 떠도 안 움직임 = 버튼 씹힘 방지). */
  body.paste-open #list{ display:none }        /* 붙여넣기 땐 명단이 비어 있다 */
  /* 예시 문구는 .hl 오버레이에 그린다 (iOS textarea 여러 줄 placeholder 버그 회피) */
  .hl .ln.ph{ color:var(--ph); -webkit-text-fill-color:var(--ph) }
  .wrap{
    flex:1 1 auto;min-height:0;
    width:100%;max-width:640px;margin:0 auto;
    /* 키보드가 올라오면 그만큼 아래 여백 → 아무 입력칸이나 키보드 위로 스크롤 가능.
       iOS 는 이 .wrap 을 스스로 스크롤해 포커스 칸을 드러내고, 화면 전체를 밀지 않는다. */
    /* 아래: 끝까지 내리면 마지막 명단이 알약 바 위 30 에 선다(아이폰 설정 앱과 동일). 노치 유무와 무관. */
    padding:0 16px calc(max(10px, env(safe-area-inset-bottom) - 6px) + 78px + var(--kb, 0px));   /* 알약 48 + 30 — 아이폰 설정 앱 실측: 마지막 항목과 검색 알약 사이 30 */
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  /* 유리 상단 셸 높이만큼 명단을 내리는 스페이서. .wrap 의 padding-top 으로 두면 안 된다 —
     크롬은 sticky 의 top 을 스크롤 상자의 «패딩을 뺀» 안쪽 기준으로 재서 머리글이 --topH 만큼 더 내려가 붙는다(확인함). */
  .wrap::before{content:"";display:block;height:var(--topH, 140px)}   /* 쉴 때 카드 밑→첫 시간바 = 8 = 도킹(sticky top) 때와 같은 값. 18 이었을 땐 여백+헤더가 62px 짜리 「높은 칸」으로 보였다(오너 2026-09-11) */
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* header */
  /* 상단 셸 — 떠 있는 유리 판(하단바와 같은 재질). 명단은 그 밑으로 지나가고(.wrap::before 스페이서),
     붙는 시간대 머리글은 셸 바로 아래에 붙는다(.ghead top). 높이는 JS 가 재서 --topH 로 넣는다
     (카드 내용·검색창·업데이트 띠에 따라 변한다). 2026-09-11 오너 위임 후 4안 비교 → 채택. */
  .shell{
    position:absolute;top:0;left:0;right:0;z-index:20;
  }
  /* 판 아래 «녹는 띠»는 두지 않는다 — 도킹된 시간바 위에 겹쳐 왼쪽 금색 막대 윗부분을 흐리게 만들었다(오너, 2026-09-11).
     시간바는 판에 딱 붙어 도킹하고, 밀려 나갈 땐 다음 시간바가 그 자리를 바로 이어받아 띠 없이도 자연스럽다. */
  header{
    background:var(--ink);   /* 날짜 줄(+상태 표시줄 밑) — 바탕색, 불투명 */
    /* 아래 10 = 카드 밑 «판의 일부»(불투명). 붙는 시간바는 이 밑면(--topH)에 도킹하고, 밀려 나가는 시간바는 판 뒤로 사라진다.
       이 10 을 명단 쪽 여백으로 두면 밀려 나가는 시간바 조각(금색 막대·선)이 카드 밑 틈에 보였다(오너 스크린샷, 2026-09-11). */
    padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;   /* 위 8 · 줄 40 · 8 · 카드 · 8 · 시간바 — 간격 토큰 8 로 한 리듬. 4 는 날짜 17 과 함께 답답했고 12 는 처졌다(2026-09-11). 카드 밑 8 = 도킹했을 때 카드와 시간바 사이 */
    /* 선·띠 없음 — 시간바가 판에 딱 붙어 도킹하므로 밀려 나갈 땐 다음 시간바가 자리를 이어받는다(선/그림자/흐림 비교 후, 2026-09-11). */
  }
  .toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;position:relative}
  /* 날짜는 줄의 «제목» — 화면 가운데(iOS 내비게이션 바 문법). 왼쪽 메뉴 아이콘·오른쪽 진행도 하나씩이라 균형이 맞는다.
     2026-09-11 오너 결정: 검색을 빼고 진행도를 남김(검색은 안 쓰고, 진행도는 곁눈으로 보는 숫자). */
  .toprow .date{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:60%}
  .nav{display:flex;align-items:center;gap:0;margin-left:-10px;min-width:0}
  .nav button{
    width:40px;height:40px;flex:0 0 auto;padding:0;
    display:grid;place-items:center;
    background:none;border:0;color:var(--dim);
    line-height:0;cursor:pointer;border-radius:12px;
  }
  .nav button svg{display:block}
  /* ── 누름 규칙 (앱 공통) ──
     ① 면 있는 버튼 → 면이 --press (채운 금색은 --waitHover)   ② 면 없는 글자·아이콘 → 흐려짐
     ③ 체크 원 → 원이 눌려 들어감.   누르면 즉시, 떼면 .12s 에 돌아온다(:active 에서만 transition 끔). */
  .nav button, .more{transition:opacity var(--tPress) var(--ease)}
  .nav button:active, .more:active, .nav button.dn, .more.dn{opacity:.4;transition:none}
  .date{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:17px;color:var(--text);font-weight:600;letter-spacing:.01em;   /* 17/600 = iOS 내비 제목. 15 는 사다리에서 날짜만 쓰던 단계 → 활자 사다리 20/17/14/13 (2026-09-11) */
  }
  .date .wday{color:inherit}   /* 「(금)」 — 괄호가 이미 보조라는 뜻이라 색까지 옅게 하면 이중 표시. 가운데 제목은 한 색으로(2026-09-11) */
  .dayprog{
    display:flex;align-items:center;line-height:1;
    font-size:13px;font-weight:800;color:var(--text);
    padding:0;   /* 칩 면 없음 — 시간바의 「2/9」와 같은 꼴. 오른쪽 끝이 본문 끝(토글·칩과 같은 선)에 맞는다 */
  }
  .tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  /* 검색 버튼은 상단에 없다(오너: 한 번도 안 씀) — 서랍의 「이름 검색」이 대신. */
  /* 헤더 아이콘 버튼(메뉴)은 보이는 크기가 40 인데 손가락 기준 권장치는 44 다.
     보이는 크기·눌림 배경은 그대로 두고 «닿는 범위»만 투명하게 2px 씩 넓힌다 — 겉모습 무변화.
     ★점검 도구가 getBoundingClientRect 만 보면 이 버튼을 «40×40 미달»로 잘못 잡는다. ::after 로
       넓힌 범위를 같이 세야 한다 — 2026-09-21 에 그걸 놓쳐 같은 규칙을 한 번 더 덧댔다가 걷어냈다. */
  .nav button{position:relative}
  .nav button::after{content:"";position:absolute;inset:-2px}
  /* 실사용이 아닌 곳(테스트·로컬·복사본)에서만 뜨는 빨간 경고 배지.
     실DB 격리는 computeDev 라우팅이 담당 — 이건 "실사용 아님" 을 못 놓치게 하는 표시. */
  /* 테스트판 표시 — 날짜 뒤에 «글자»로 붙는다(2026-09-16). 알약이었는데 그건 정보를 조작처럼
     보이게 했다(앱 규칙: 정보는 글자, 조작만 알약). 가운뎃점은 성격이 다른 두 값을 잇는 이 앱의
     어휘 그대로다(「방문 2 · 취소 1」·「연결됨 · …」). 굵기 700 = 날짜(600)보다 한 단 — 800 은
     시각·머리글 자리라 안 쓴다. 자리를 안 먹고 날짜의 가운데 정렬도 그대로다. */
  .devtag{color:var(--test);font-weight:700;margin-left:6px}
  /* 연결 끊김 — 날짜 줄 오른쪽, «진행도(2/7) 자리를 대신» 쓴다. 글은 늘 「연결 안 됨」 하나다.
     ★둘을 나란히 두지 않는다. 진행도 뒤에 두면 뜰 때마다 진행도가 밀리고, 앞에 둬도 줄이
       길어져 가운데 날짜 쪽으로 자란다. 왼쪽도 (그때 거기 있던) 테스트 표시와 나란히 서면
       날짜를 덮었다. 그래서 «한 자리에 하나»로 정리했다 — 끊기면 진행도가 접히고 이것이 그 자리에 선다.
     ★자리 문제만이 아니다. 끊긴 동안의 진행도는 «틀릴 수 있는 숫자»다 — 다른 폰에서 체크한
       것이 안 들어오니까. 숨기는 쪽이 더 정확하다(오너 2026-09-15: 「분수가 그렇게 중요한
       정보는 아니니까」). 연결되면 그 자리로 되돌아온다.
     ★꼴은 «맨 글자». 후보를 다 그려 보고 앱의 시각 어휘에 비춰 골랐다 —
       채운 빨강 칩은 그때 테스트 표시가 입고 있던 옷이라 테스트 사이트에서 빨간 칩이 둘이 됐고,
       (그 표시는 2026-09-16 에 날짜 뒤 «글자»로 바뀌었다 — .devtag 주석 참고)
       연한 면 칩은 삭제·초기화 «위험 버튼»의 옷이며(「이 꼴 하나뿐」), 테두리는 버튼·입력칸의
       것이다(「입력칸만 선을 갖는다」). 규칙도 «정보는 글자, 조작만 알약»이다.
     ★점(.dot.stale)도 붙여 봤다가 뺐다. 이건 진행도 «자리를 물려받는» 것이라, 그 칸에 원래
       서 있던 꼴(맨 글자, 면도 점도 없음)을 그대로 쓰는 게 맞다 — 바뀌는 건 내용과 색뿐이다.
       서랍의 점은 거기 남는다. 거긴 초록/빨강 두 상태를 «구분»하는 일이 있고 여긴 없다.
     ★대기 건수를 붙였다가 뺐고(칩이 길어져 가운데 날짜를 덮었다), 띠·토스트까지 갔다가
       전부 되돌렸다 — 끊길 일 자체가 드문데 장치가 과했다. 상태는 이것 하나. */

  .offtag{
    display:none;align-items:center;flex:0 0 auto;
    color:var(--warn);font-size:13px;font-weight:700;white-space:nowrap;line-height:1.2;
  }
  html[data-off] .offtag{display:inline-flex}
  html[data-off] .dayprog{display:none}   /* 한 자리에 하나 — 끊기면 진행도는 접힌다 */
  .dot{width:6px;height:6px;border-radius:50%;background:var(--go);opacity:.9}
  .dot.stale{background:var(--warn)}

  /* 상단 요약 — 「16:00  7팀」 한 줄(같은 크기 두 덩어리, 금/흰 색으로 구분) + 그 아래 인원 구성(맨 글자) */
  /* 메인 박스 = 불투명 둥근 카드(--panel2) + 림 8% — 하단 알약 바와 같은 림 처리. 위아래가 같은 «물건»이 된다. */
  .lead{
    /* 아래 여백 0 — 셸 높이(--topH)가 카드 밑면과 같아져 붙는 시간바가 카드에 딱 붙는다.
       여백을 두면 그 띠로 지나가는 시간대 글자가 비쳐 보였다(오너 영상, 2026-09-11). 쉴 때 간격은 .wrap::before 가 준다. */
    display:block;margin:8px 0 0;padding:14px 12px;border-radius:var(--radius);   /* 세로 14 — 구성 줄이 5종까지 늘면 12 는 답답했다(2026-09-12). 가로 12 는 안 글자 28 열 */   /* 테두리 16 = 메뉴·진행도 열, 안 글자 28 = 알약 좌우·⋯ 아이콘 열 (2026-09-11 일관성 점검) */
    background:var(--panel2);   /* 불투명 카드 — 상단 전체가 안 비친다 */
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent);
  }
  html[data-theme="light"] .lead{background:var(--panel);box-shadow:inset 0 0 0 1px color-mix(in srgb, #ffffff 85%, transparent), 0 4px 16px rgba(29,25,19,.08)}
  .leadrow{display:flex;align-items:center;gap:0;min-height:34px}
  .slottime{font-size:20px;font-weight:800;color:var(--wait);letter-spacing:-.02em}
  /* 시각(금색)과 팀 수(흰색)는 색이 이미 가르므로 사이 「·」 없이 간격만 (오너 2026-09-11 「14:00·3팀 표기 맞나」 → 점 제거) */
  .leadmain{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-left:10px}
  /* 끝난 상태 = 「남은 예약 없음」 하나뿐이다(2026-09-16). 여기 있던 퇴근 타이머(.cdmode/.cdlab/.cd)와
     인사말은 곰 말풍선으로 옮겼고, 쓰는 데가 없어져 규칙도 같이 지웠다.
     ★이 문구는 2026-09-12 에 한 번 뺐던 것이다 — 그땐 옆에 퇴근 카운트가 있어 군더더기였다.
       카운트가 곰에게 가면서 주 줄이 비어 되돌렸다. 카드를 다시 손댈 땐 이 내력을 먼저 볼 것.
     ★말투는 ① 명사형. 카드 주 줄은 원래 「7팀」 같은 상태 표시고, 예전의
       「오늘도 고생하셨습니다」만 ③ 문장이라 혼자 튀었다. 그 말은 이제 곰이 한다. */
  .leadmain.done{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-left:0}   /* 상태 설명 — 숫자(20)보다 한 단계 아래, 사다리의 17 */
  /* 전체 / 대기 토글 — 처리된(방문·취소) 행을 숨겨 「아직 체크할 것」만 본다.
     트랙 + 선택칸. 금색은 「지금」·주동작 몫이라 선택은 밝은 글자로만. */
  .viewseg{margin-left:auto;flex:0 0 auto;align-self:center}   /* 두 칸 같은 너비·썸은 공용 .seg 규칙 */   /* 모양은 공용 .seg (서랍 테마·Wi-Fi 토글과 같은 부품) */
  /* 인원 요약(구성 글자 or 「방문 n·취소 n」)은 요약 줄 아래 */
  .leadsub{font-size:14px;font-weight:600;color:var(--dim);display:block;margin-top:8px}   /* 구성 줄(14)과 같은 단계·간격 */
  .leadsub:empty{display:none}
  .leadsub .pc{white-space:nowrap}
  /* 카드의 방문·취소 내역도 맨 글자 — 상태색은 체크 원 하나에만 쓴다(시간바 초록 분수와 함께 2026-09-12 정리) */
  .leadsub .pcsep{color:var(--off)}
  /* 대기 팀의 「인원 구성」 — 테이블 미리 빼는 데 쓰는 핵심 정보라 낱개 「N명」을 눈으로 합산하지 않게 앱이 모아 보여준다.
     «정보는 글자, 조작만 알약»: 칩(채움)으로 그렸더니 옆 토글과 같은 옷이라 눌리는 버튼처럼 보였다(2026-09-11) → 맨 글자.
     보통 3~4종, 많아야 5종 — 5종(각 ≈52px)+간격 14 가 아이폰 카드 안폭 338 에 한 줄로 들어간다 */
  .leadsub.comp{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
  /* 인원·팀수 둘 다 주 정보(오너: 동급) — 전부 밝게 700. 「5인」만 흐리면 테이블 준비의 핵심 숫자가 가라앉는다(2026-09-11).
     포인트 색은 작은 글자엔 안 쓴다(라이트 대비). */
  .leadsub.comp .pc{font-weight:700;color:var(--text)}
  .leadsub.comp .pc b{font-weight:700;margin-left:3px}

  /* 새 버전 알림 — 하단 알약 바 «위에 떠 있는» 금색 알약(내용 폭·높이 40·바 위 8). 명단 칸을 잡아먹지 않는다(오너 2026-09-11 — 카드 밑 인라인은 명단을 밀었다).
     금색 채움 = 주동작 버튼 언어(추가·저장). 문구 「새 버전으로 업데이트」 — 버튼은 한 행위(예약 추가·명단 복사와 같은 명사구). 「·」은 정보 나열 기호라 버튼엔 안 쓴다. 누르면 새로 불러온다. 보이는 동안 body.upd-on 으로 명단 아래 여백·토스트를 48 올린다. */
  .foot .updbar{
    pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:7px;
    width:max-content;max-width:520px;margin:0 auto 8px;height:40px;padding:0 18px;border-radius:999px;   /* 알림이지 툴바가 아니다 — 토스트처럼 내용 폭·40 */
    background:var(--wait);color:var(--onWait);border:0;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    animation:pillIn var(--tMove) var(--ease);
  }
  html[data-theme="light"] .foot .updbar{box-shadow:0 8px 28px rgba(29,25,19,.16)}
  body.upd-on .wrap{padding-bottom:calc(max(10px, env(safe-area-inset-bottom) - 6px) + 78px + 48px + var(--kb, 0px))}
  body.upd-on .toast{bottom:calc(max(10px, env(safe-area-inset-bottom) - 6px) + 48px + 12px + 48px + var(--kb, 0px))}
  .foot .updbar:active, .foot .updbar.dn{background:var(--waitHover)}   /* 특이성 0,3,0 — .foot button:active(0,2,1)를 이겨야 금색 눌림이 산다 */

  /* search */
  /* 검색 띠 — 셸의 일부라 불투명(--ink). 투명이면 카드와 도킹된 시간바 사이 띠로 명단이 비쳐 지나갔다(오너 스크린샷 2026-09-11).
     위 8(카드 밑) · 아래 8(도킹 시간바 위) = 「시간바 앞 여백 8」. 선은 없다 — 시간바 밑선이 곧 경계 */
  .searchbar{
    position:relative;z-index:19;
    padding:0 16px 8px;background:var(--ink);
  }
  .searchbar input{
    width:100%;background:var(--field);color:var(--text);   /* 입력칸 바탕은 전부 --field */
    border:1px solid var(--line);border-radius:999px;
    padding:11px 86px 11px 52px;font-family:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;
  }
  #qBack{left:16px}    /* 알약 안쪽 16 — 둥근 끝에 붙지 않게. 공통 꼴은 아래 .searchbar button */
  #qClear{right:16px}
  .qcount{
    position:absolute;right:52px;top:calc(50% - 4px);transform:translateY(-50%);
    font-size:13px;font-weight:600;color:var(--dim);
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .qcount.zero{color:var(--warn)}
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar input:focus{outline:0;border-color:color-mix(in srgb, var(--text) 30%, transparent)}   /* 금색 링은 큰 금색 버튼처럼 보였다(오너) — 금색은 「지금」의 색. 포커스는 커서·키보드가 말한다 */
  .searchbar input::-webkit-search-cancel-button{display:none}
  .searchbar button{
    position:absolute;top:calc(50% - 4px);transform:translateY(-50%);
    width:36px;height:36px;border:0;border-radius:12px;
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .searchbar button svg{display:block}
  .searchbar button:active, .searchbar button.dn{opacity:.4}   /* 면 없는 아이콘 = 흐려짐 (누름 규칙 ②) */
  mark{background:var(--mark);color:var(--text);-webkit-text-fill-color:var(--text);border-radius:3px;padding:0 1px}

  /* time group — 시간대 머리글 + 그 명단 (2026-09-11 오너 확정: 「5시 버전 + 다듬기」).
     선 규칙: 전폭 선 = 구역 경계(상단바 아래·시간바 아래·하단바 위) / 들여쓴 선 = 행 사이.
     머리글은 «자기 명단»에 붙는다 — 위는 넓게(앞 명단과 떨어짐), 아래는 선 하나.
     가운데 관통선·캡슐·박스는 여섯 안을 실제 앱에서 4가지 상태로 비교한 끝에 모두 탈락 —
     접힌 시간대가 표처럼 촘촘히 쌓이는 이 구조가 «영업 중 가장 오래 보는 화면»에서 제일 정돈됐다. */
  /* 시간대 사이 여백(8px)은 «앞 시간대 안쪽»의 빈 요소로 둔다 — margin 으로 두면 붙은 머리글이 다음 머리글이
     닿기 여백만큼 전에 먼저 밀려나 두 머리글 사이에 빈 틈이 생긴다(오너 지적, 2026-09-11). 안쪽 내용이면 붙는
     범위에 포함돼 다음 머리글이 닿는 순간 밀려난다(padding 은 안 됨 — 붙는 범위가 내용 상자까지라 더 일찍 밀려남).
     접힌 시간대는 여백 없이 선으로만 잇는다. 멈춰 있을 때 배치는 margin 방식과 픽셀까지 같다. */
  /* 접기/펼치기는 즉시 — 높이·transform 애니메이션 둘 다 실기기에서 매끄럽지 않았다(오너, 2026-09-11). */
  /* ★.group 에 display:contents 를 줘 봤다가 되돌렸다(2026-09-15). 상자를 없애면 시간바가
     밀리지 않고 «덮여» 잘림이 0 이 되지만, 그 요소의 getBoundingClientRect 가 빈 상자가 돼
     크기를 재는 코드가 조용히 0 을 받는다. 얻는 것(아이폰 연락처·설정도 똑같이 밀린다)보다
     남길 함정이 크다는 판단(오너). 밀려 올라가는 잘림은 sticky 의 표준 동작으로 둔다. */
  .group::after{content:"";display:block;height:8px}   /* 끝선→다음 시간바 8 = 카드→첫 시간바와 같은 값(「시간바 앞 여백은 어디서나 8」). 끝선이 생긴 뒤 18 은 죽은 띠로 보였다(2026-09-11) */
  .group.shut::after{height:0}
  .group:last-child::after{height:0}   /* 마지막 시간대 뒤엔 여백 없음 — 끝까지 내리면 마지막 명단이 알약 바 위 30 에 선다(.wrap 아래 여백) */

  .ghead{
    position:sticky;top:var(--topH, 140px);z-index:10;   /* 상단 셸에 딱 붙어 도킹 */
    background:var(--ink);
    display:flex;align-items:center;gap:8px;
    width:calc(100% + 32px);margin:0 -16px;padding:12px 16px 11px;   /* 높이 44 = 애플 최소 누름 크기. 좌우 16 = 메뉴·진행도와 같은 열 */
    border:0;border-bottom:1px solid var(--line);
    font:inherit;color:inherit;text-align:left;cursor:pointer;
  }
  /* 위 선은 긋지 않는다 — 붙은 머리글 아래로 다음 머리글이 올라올 때 두 선 사이에 빈 틈이 생겨 어색(오너 지적, 2026-09-11).
     선 색은 행 사이·상단 경계와 같은 --line — 머리글만 진하면 위쪽 경계가 흐려 첫 시간대가 더 높아 보인다. */
  .ghead:active, .ghead.dn{background:var(--press)}
  /* ★머리글 밑 «흐림 띠»는 두지 않는다. 아래로 흘러 들어가는 명단이 «탁» 부딪히지 않게
     8px 그라데이션을 깔았었는데(2026-09-11), 그 띠에 걸친 행이 뿌옇게 날아가 «글자가 비친다»로
     보였다(오너 영상 2026-09-15). 흐림은 «반쯤 지워진 글자»와 구별되지 않는다 — 명단은
     또렷하거나 없거나 둘 중 하나여야 한다. 머리글 밑선(border-bottom)이 경계를 이미 긋는다. */
  .chev{
    color:var(--dim);flex:0 0 auto;
    display:grid;place-items:center;width:12px;height:12px;line-height:0;
    transform:rotate(90deg);   /* 접기는 즉시라 전환 없음 */
  }
  .chev svg{display:block;width:12px;height:12px}
  .group.shut .chev{transform:rotate(0)}
  /* 밝기 3단계로 「언제」를 말한다 — 지금 = 금색 / 앞으로 = 흰색 / 다 끝남 = 회색.
     17px 은 «큰 글씨» 대비 기준 밖이라 지금 색은 --wait. */
  .gtime{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--text)}
  .gmeta{margin-left:auto;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .gbreak{font-size:13px;font-weight:600;color:var(--dim)}   /* 옆 「n/n」과 같은 단계(13) — 활자 사다리 25(잠금·스플래시)/20/17/16(입력칸)/14/13, 15·12 는 2026-09-12 정리 */
  .gmeta b{font-size:13px;font-weight:800;color:var(--text)}
  /* 「지금」 = 금색 시각 + 왼쪽 가장자리 3px 막대 (2026-09-11 오너: 「막대 같은 건 괜찮은 것 같다」).
     밑줄·점·띠·선 색 강조는 전부 반려됐고, 막대만 통과. 여섯 꼴(들임·굵기·둥글기·안쪽 배치) 비교 끝에
     «칸 가장자리» — 머리글 높이 전체(선에서 선까지), 둥글기 없음. 떠 있는 표식이 아니라 행의 한 변이라
     헤어라인 표 체계와 같은 기하를 쓴다. 붙어 있을 때도 같이 따라간다. */
  .group.now .gtime{color:var(--wait)}
  .group.now .ghead::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--wait);
  }
  .group.done .gtime{color:var(--dim)}

  /* row — 카드도 슬래브도 레일도 없음. 바탕 위에 «들여쓴» 헤어라인으로만 나뉜 「명단」
     (체크 칸 54px 다음부터 그어 이름줄에 맞춘다). 상태는 체크 원 하나로만. */
  .row{
    position:relative;
    display:flex;align-items:stretch;gap:0;
  }
  .row + .row::before{
    content:"";position:absolute;left:54px;right:0;top:-1px;height:1px;
    background:var(--line);
  }
  /* 시간대 끝선 — 마지막 행 밑에 시간바 밑선과 같은 «끝까지 닿는» 1px. 행 사이는 들여쓴 선, 목록 끝만 전폭
     (애플 뮤직 목록과 같은 규칙, 오너 2026-09-11). 열린·접힌 시간대 모두 «전폭 선 하나»로 끝난다. */
  /* 시간대 끝선은 뺐다 — 시간바 밑선과 8px 간격으로 겹쳐 «선이 많고 시간바가 두 선 사이 중앙이 아니다»(오너 2026-09-11) */
  /* 눌리는 곳은 여기뿐. 왼쪽 54칸 × 56 이라 손가락에 넉넉하다.
     누름은 칸(네모)이 아니라 «원»이 받는다 — 면 없는 목록에서 네모가 번쩍이면 유령 박스처럼 보인다. */
  .main{
    width:54px;flex:0 0 auto;display:grid;place-items:center;
    min-height:56px;cursor:pointer;padding:0;
    background:none;border:0;
    color:inherit;font:inherit;
  }
  .main:active .check, .main.dn .check{transform:scale(.84);border-color:var(--dim);transition:none}
  .info{
    flex:1;min-width:0;display:flex;align-items:center;gap:10px;
    padding:13px 12px 13px 4px;
  }
  /* min-width:0 이 없으면 긴 이름이 있을 때 행이 화면 밖으로 넘친다 */
  .rbody{flex:1;min-width:0;display:flex;flex-direction:column}
  .rtop{display:flex;align-items:stretch;min-width:0}
  /* 체크 = 동그라미. 카드 없는 평평한 목록엔 채운 «사각형»이 어색해서 원으로.
     대기 = 얇은 테두리 / 방문 = 초록 채움 + 흰 체크 (미리 알림·투두앱 관습). */
  .check{
    width:24px;height:24px;border-radius:50%;flex:0 0 auto;
    border:2px solid var(--off);
    display:grid;place-items:center;line-height:0;color:transparent;
    transition:transform var(--tPress) var(--ease),background var(--tState) var(--ease),border-color var(--tState) var(--ease);
  }
  .check svg{display:block}
  /* 직접 체크한 순간에만 — 채워지며 탁 튄다 (이 앱의 핵심 동작에 손맛). 로컬 체크만 이 클래스가 붙는다.
     다른 폰 변경·최초 로딩은 통째 render 라 여기 안 옴. reduced-motion 에선 아래 블록이 죽인다. */
  @keyframes checkpop{ 0%{transform:scale(.8)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .check.pop{animation:checkpop var(--tMove) var(--ease)}   /* 0.55→1.16 은 «요동»으로 느껴졌다(오너) → 살짝만 튄다 */
  /* 누르는 요소에는 직접 지정한다. body 에만 걸면 아이폰에서 두 번 탭 판정이 남는다 */
  .main, .more, .ghead, .foot button, .menu button, .nav button{
    touch-action:manipulation;
  }
  /* stretch 로 두어야 이름이 칸 폭에 맞춰 «...» 로 줄어든다.
     flex-start 면 글자 길이만큼 늘어나 인원칸이 화면 밖으로 밀려난다 */
  .who{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
  /* 메모는 이름 아래 보조 정보 — 금색(경보처럼 보임)에서 낮춰 조용하게.
     ★앞에 작은 점을 뒀었는데 뺐다(2026-09-18). 메모는 이미 이름과 세 단계 떨어져 있다 — 크기 17→13, 굵기 700→600,
       색 --text→--dim. 점은 같은 일을 하는 네 번째 표시였고, 정작 «줄이 안 맞는» 원인이었다: 첫 줄만 점만큼 들여써지고
       둘째 줄부터는 맨 왼쪽에서 시작해 왼쪽 모서리가 들쭉날쭉했다. 점을 빼니 이름과 한 기준선으로 맞는다.
     ★줄바꿈은 어절 단위로. break-all 은 「알레르/기(땅콩)」처럼 낱말 가운데를 잘랐다.
       긴 낱말 하나가 칸보다 넓을 때만 overflow-wrap 이 강제로 끊는다. */
  .memo{
    margin-top:2px;font-size:13px;font-weight:600;line-height:1.35;
    color:var(--dim);text-align:left;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .row.arrived .memo, .row.cancelled .memo{color:var(--off)}
  .erow.memorow{margin-top:6px}
  #addPanel h2{margin-bottom:12px}
  .name{
    transition:color var(--tState) var(--ease),-webkit-text-fill-color var(--tState) var(--ease);   /* 체크 직후 이름이 «띡» 흐려지지 않게 */
    display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;   /* 17 = iOS 목록 본문·시간바 시각과 같은 단계(굵기 700 vs 800 으로 위계). 18 은 시간바보다 커져 뒤집힘, 16 은 사다리의 외톨이였다(시뮬레이터 비교, 2026-09-11) */
    color:var(--text);-webkit-text-fill-color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  /* 인원 — 맨 글자. «정보는 글자, 조작만 알약»(카드 구성 줄과 같은 원칙, 2026-09-11). 알약으로 그리면 옆 ⋯ 보다 더 눌리는 것처럼 보였다 */
  .pax{
    height:24px;display:inline-flex;align-items:center;
    font-size:14px;font-weight:700;color:var(--text);flex:0 0 auto;
  }
  .more{
    width:42px;flex:0 0 auto;border:0;
    background:none;color:var(--dim);cursor:pointer;
    display:grid;place-items:center;line-height:0;padding:0;
  }
  .more svg{display:block;width:16px;height:16px}   /* 알약 바 아이콘과 같은 단계(16) */

  /* 방문/취소 — 상태 색은 «원 하나에만». 행을 칠하지도, 태그를 붙이지도 않는다
     (원 안의 ✓/✕ 가 이미 같은 말). 처리된 행은 글자가 같이 가라앉을 뿐 크기·높이는 그대로
     — 이름 열이 들쭉날쭉하지 않게. 줄여서 공간을 아끼는 건 「대기」 보기가 맡는다. */
  .row.arrived .check{background:var(--go);border-color:var(--go);color:var(--onGo);-webkit-text-fill-color:var(--onGo)}
  .row.arrived .name{color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:600}
  .row.arrived .pax, .row.cancelled .pax{color:var(--dim);-webkit-text-fill-color:var(--dim)}
  /* 취소 이름은 방문 이름과 같은 회색 — --off 는 16px 에서 3.7:1(라이트 3.3)로 읽기 기준 미달(2026-09-11 점검).
     «취소»는 빨간 ✕ 가 말한다 — 취소선은 뺐다(상태는 원 하나에만, 선을 줄인다. 오너 2026-09-11). */
  .row.cancelled .name{color:var(--dim);-webkit-text-fill-color:var(--dim);font-weight:600}
  .row.cancelled .check{border-color:var(--warn);color:var(--warn)}
  /* 「대기」 보기에서 방금 처리한 행 — 결과(채워진 원)를 잠깐 보여준 뒤 스르륵 빠진다 */
  /* 나가는 것 = 퇴장 곡선. --ease 로는 27ms 만에 반이 사라져 «툭» 꺼졌다(2026-09-19).
     ★높이도 «같이» 줄인다. 2026-09-12 엔 「흐려지기만」으로 뒀었는데 — 높이를 접으면 목록이 매 프레임
       다시 배치돼 렉처럼 보인다는 이유였다 — 그 대가가 실기기에서 드러났다: 다 흐려진 뒤 빈 칸이 90ms
       남아 있다가 툭 닫혀, 한 동작이 아니라 «두 동작»으로 보였다(오너 2026-09-20 「사라지고 딜레이가
       있으면서 칸이 사라지는 느낌」). 한 줄만 접는 것이라 재배치는 그 시간대 안에서 끝난다 —
       오히려 더 매끄럽다 — 실기기 실측 최장 프레임 간격이 51ms(툭 닫히던 판) → 34ms 로 줄었다.
       높이 값은 JS 가 픽셀로 박아 준다(auto 는 전환이 안 된다). */
  .row.leaving{
    opacity:0;overflow:hidden;
    transition:opacity var(--tMove) var(--easeEven), height var(--tMove) var(--easeEven);
  }


  .erow{display:flex;gap:6px}
  .erow label{
    display:flex;flex-direction:column;gap:4px;
    font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dim);
  }
  .erow label.grow{flex:1;min-width:0}
  .erow input, .erow select{
    background:var(--field);color:var(--text);   /* 클로드 fill-field + ring(--line) */
    border:1px solid var(--line);border-radius:999px;
    padding:10px 14px;font-family:inherit;font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;width:100%;min-width:0;height:48px;
    -webkit-appearance:none;appearance:none;
  }
  /* 입력칸 포커스 = 테두리만 살짝 밝게(검색창과 같은 규칙, 금색 링 없음) */
  .erow input:focus, .erow select:focus{outline:0;border-color:color-mix(in srgb, var(--text) 30%, transparent)}
  .erow select{
    text-align:center;text-align-last:center;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 18px) 22px, calc(100% - 13px) 22px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:28px;
  }
  /* ⋯ 행 메뉴 — 앱의 보조 버튼(면만)을 «작게» 넷. 새 부품을 만들지 않는다. 행 안의 작은 버튼 = 높이 40.
     목록 폭 그대로(좌우 여백 대칭). 이름 열(54px)에서 시작하면 왼쪽만 비어 오른쪽으로 쏠려 보였다. */
  .menu{display:flex;gap:6px;margin:0 0 10px}   /* 밑 10 = 원래 레이아웃. 스크롤 「최소 이동」은 스크롤 쪽(roomScroll)에서만 다룬다 — 여백을 줄여 맞추려던 건 잘못(2026-09-11) */
  .menu button{
    flex:1;height:40px;border:0;border-radius:999px;background:var(--btn);cursor:pointer;
    color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
  }
  .menu button:active, .menu button.dn{background:var(--btnPress)}
  /* 삭제는 확인 없이 바로 지워진다 — 파괴적인 «실행» 버튼은 앱 어디서나 붉은 면(초기화 확인과 같은 꼴) */
  .menu .del{background:var(--btnWarn);color:var(--onWarn)}
  .menu .del:active, .menu .del.dn{background:var(--btnWarnPress)}

  /* 바텀시트 (예약 추가) — --kb 만큼 위로 올려 키보드에 안 가리게 한다 */
  .panel.asSheet{
    position:fixed;left:50%;bottom:0;
    transform:translateX(-50%) translateY(calc(-1 * var(--kb, 0px)));
    transition:transform var(--tMove) var(--ease),opacity var(--tFade) var(--ease),visibility 0s;
    z-index:71;width:100%;max-width:520px;margin:0;
    border-radius:var(--radius) var(--radius) 0 0;
    display:flex;flex-direction:column;
    max-height:calc(100dvh - var(--kb, 0px) - 8px);overflow-y:auto;
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
  }
  .panel.asSheet.kb{ padding-bottom:14px }
  .panelScrim{position:fixed;inset:0;z-index:70}
  .panel{scroll-margin-top:var(--topH, 140px);}
  .panel{
    background:var(--panel);border-radius:var(--radius);
    padding:16px;margin-top:10px;overflow:hidden;
  }
  .panel h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .panel p{margin:0 0 10px;font-size:13px;color:var(--dim);line-height:1.5}

  /* 명단 붙여넣기 — 명단이 비었을 때의 화면. .panel 카드 모양 그대로, 내용만큼만 크다.
     입력칸 높이는 창을 열 때 JS 가 한 번 고정하고 키보드와 무관하게 유지한다.
     경고문이 뜨면 입력칸을 그만큼만 줄여 등록 버튼 위치가 안 변한다 (버튼 씹힘 방지). */

  /* .tawrap 은 높이 고정 + overflow:hidden 인 '틀'이다 (스크롤러 아님). 그 안에서 <textarea>
     가 내부 스크롤을 갖고, .hl(빨간줄 레이어)은 textarea.scrollTop 에 맞춰 안쪽 .hlmove 를
     transform 으로 따라 움직인다. 명단이 길든 짧든 textarea 의 '외부' 크기가 항상 273px 로
     같아서 → iOS 의 키보드 포커스 처리(Visual Viewport pan)가 두 경우 동일하게 동작한다. */
  .tawrap{
    position:relative;height:273px;overflow:hidden;
    border:1px solid var(--line);border-radius:12px;
    background:var(--field);   /* 다른 입력칸과 같은 바탕 */
  }
  .tawrap:focus-within{outline:0;border-color:color-mix(in srgb, var(--text) 30%, transparent)}
  .tawrap textarea, .hl{
    font-family:inherit;font-size:16px;line-height:1.65;   /* 줄높이 사다리(1.2/1.35/1.5/1.6) 예외 — textarea 와 그 위에 겹치는 빨간줄 레이어(.hl)가 «같은 줄에» 놓여야 해서 둘이 한 값을 공유한다. 붙여넣기 명단은 한 줄이 길어 1.65 가 읽기 편했다. */
    font-variant-numeric:tabular-nums;
    border:0;
    letter-spacing:0;
    white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;
  }
  textarea{
    position:absolute;inset:0;z-index:1;box-sizing:border-box;
    padding:11px;
    resize:none;
    overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:transparent;color:var(--text);
    -webkit-appearance:none;appearance:none;
  }
  .hl{
    position:absolute;inset:0;z-index:0;overflow:hidden;
    color:transparent;-webkit-text-fill-color:transparent;
    pointer-events:none;
  }
  .hlmove{padding:11px 0;will-change:transform}
  .hl .ln{display:block;padding:0 11px}
  .hl .ln.err{
    background:var(--errRow);
    box-shadow:inset 3px 0 0 var(--warn);
  }
  /* 오류 안내는 위 안내문이 빨갛게 바뀌는 것뿐. 레이아웃은 전혀 안 움직인다 */
  #pasteHint.bad{ color:var(--errTx);font-weight:700 }

  /* ── 큰 버튼 (시트·팝업·폼 공통) — 높이 48 · 17px/600 · 알약(999) ──
     주동작 = 금색 채움 / 보조 = --btn 면(테두리 없음) / 위험 = --btnWarn 면 + 붉은 글자. 이 꼴 하나뿐.
     (.btn · .dbtn button · .sheetClose · .sheetNever · .sheetCopy 가 전부 이 값을 쓴다) */
  .btns{display:flex;gap:8px;margin-top:14px}
  /* 버튼 = 알약(999). 메인의 알약 바·토글과 같은 꼴 — 앱의 모든 «누르는 면»은 알약, «입력하는 칸»도 알약(검색창과 같은 꼴), 카드·시트만 18 (2026-09-11).
     48 높이 버튼 글자 17/600(iOS 시트·알림 버튼), 40 높이 버튼 글자 13/600(알약 바와 같은 단계) */
  .btn{
    flex:1;height:48px;padding:0;border-radius:999px;border:0;
    font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  }
  .btn.primary{background:var(--wait);color:var(--onWait)}
  .btn.ghost{background:var(--btn);color:var(--text)}
  .btn.primary:active, .btn.primary.dn{background:var(--waitHover)}   /* 클로드 fill-brand → fill-brand-hover */
  .btn.ghost:active, .btn.ghost.dn{background:var(--btnPress)}

  /* footer — 떠 있는 유리 알약 바 (2026-09-11 오너: 「리얼 아이폰처럼」). 명단은 바 «아래로» 지나가고(.wrap 아래 여백),
     바는 반투명 판 + 뒤 흐림이라 지나가는 명단이 비친다. 안은 세 항목 같은 글자색 — 가운데 칠·색 강조는 반려
     («명단 복사를 추가보다 많이 쓴다»는 강조하라는 뜻이 아니었다). 키보드가 올라오면 통째로 숨는다(위 규칙). */
  .foot{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    /* 아이폰 뮤직·설정의 알약 바 실측(iOS 26, 393pt 폰): 높이 47, 바닥에서 28, 좌우 28 → 그대로 맞춤(2026-09-11). 노치 없는 폰은 바닥 10 */
    padding:0 28px max(10px, calc(env(safe-area-inset-bottom) - 6px));
    pointer-events:none;                        /* 알약 밖 여백은 명단을 그대로 누르게 */
  }
  .foot.empty .inner{display:none}   /* 명단 없는 날 — 바만 숨고 업데이트 알림은 남는다 */
  .foot .inner{
    pointer-events:auto;max-width:520px;margin:0 auto;
    border-radius:999px;padding:4px;   /* 4 + 40 + 4 = 48 */
    background:color-mix(in srgb, var(--panel2) 62%, transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
    /* 림 1px 8% 한 겹 — 위 메인 카드(.lead)와 같은 가장자리 처리. 윗줄 하이라이트는 뺐다(빛나는 느낌 = 오너 반려) */
    box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent);
  }
  html[data-theme="light"] .foot .inner{
    background:color-mix(in srgb, #ffffff 62%, transparent);
    box-shadow:0 8px 28px rgba(29,25,19,.16), inset 0 0 0 1px color-mix(in srgb, #ffffff 85%, transparent);
  }
  .frow{display:flex;gap:4px}
  .foot button{
    flex:1;height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;position:relative;
    transition:background var(--tPress) var(--ease);
  }
  .foot button svg{width:16px;height:16px;display:block}   /* 글자 13·아이콘 16·간격 6 — 아이폰 칸(108px) 대비 내용 62~64% = 황금비. 14/18 은 68~70% 로 꽉 차 보였다(오너) */
  /* 누름 = 칸이 밝아짐(토글 썸과 같은 언어). 글자·아이콘이 흐려지는 공통 규칙은 여기선 쓰지 않는다 — 면이 있는 알약 안이라 면으로 반응 */
  .foot button:active, .foot button.dn{background:var(--btnPress);opacity:1;transition:none}
  .foot button:disabled{opacity:.4;pointer-events:none}   /* 클로드 opacity-disabled .4 */   /* 접을 시간대가 없을 때(대기 모드·전부 처리) — 자리는 지키고 꺼 둔다 */

  .empty{text-align:center;color:var(--dim);font-size:13px;padding:36px 10px;line-height:1.6;white-space:pre-line}
  .empty b{display:block;color:var(--text);font-weight:700}   /* 빈 화면의 유일한 글 — 크기는 그대로 두고 색·굵기로만 세운다 */
  /* ---------- 메뉴 서랍 ---------- */
  .drawerScrim{
    position:fixed;inset:0;z-index:60;background:var(--scrimLite);
    opacity:1;transition:opacity var(--tMove) var(--easeEven);   /* 어둠은 깔릴 때도 고르게 */
  }
  /* 전역 .hide는 display:none이라 페이드가 안 된다 — 서랍 막은 따로 둔다 */
  .drawerScrim.off{opacity:0;pointer-events:none;transition:opacity var(--tMove) var(--easeEven)}   /* 닫히는 쪽 곡선 */
  .drawer{
    position:fixed;top:0;left:0;bottom:0;z-index:61;
    width:min(68vw, 258px);
    background:var(--panel);
    padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px);
    transform:translateX(-101%);transition:transform var(--tMove) var(--easeEven);   /* 기본이 «닫힌» 상태 = 퇴장 곡선 */
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);transition:transform var(--tMove) var(--ease)}   /* 들어올 때는 감속 */
  .dwtitle{display:flex;align-items:center;gap:11px;padding:0 16px 16px}
  .dwico{   /* 판 = --ink. 서랍은 --panel 위라 은은히 보이고(다크 1.08·라이트 1.09),
               스플래시·잠금은 바탕이 --ink 라 같은 값이 곧 «판 없음»이 된다 — 색 하나로 셋이 각자 맞다. */
    width:36px;height:36px;flex:0 0 auto;border-radius:8px;display:block;
    background:var(--ink);
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
  }
  .dwnames{display:flex;flex-direction:column;gap:2px;min-width:0}
  .dwname{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .dwsubtitle{font-size:13px;font-weight:600;color:var(--dim)}
  .dwsep{height:1px;background:var(--line);margin:10px 16px}
  .dwitem{
    display:flex;align-items:center;gap:8px;
    padding:13px 16px;border:0;background:none;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:600;text-align:left;   /* 14 = FAQ 질문과 같은 «패널 안 누르는 줄». 17 은 제목(익순이)과 같아져 위계가 무너졌다(2026-09-12) */
  }
  .dwitem:active, .dwitem.dn{background:var(--press)}
  /* 위험한 동작(명단 초기화) — 붉게. 실행 자체는 여전히 「길게 눌러」 확인을 거친다 */
  .dwitem.danger{color:var(--warn)}
  /* 세그먼트 토글 — 테마 다크/라이트, Wi-Fi 본관/별관 공용.
     강조색(--wait)은 두 테마 모두 「켜짐」으로 읽힌다. .wide 는 시트 안에서 꽉 차게. */
  /* 고르기(선택)는 «누르기(동작)»와 달라 보여야 한다 — 금색 채움이면 「저장」 같은 주동작 버튼으로 읽힌다.
     상단 「전체 / 대기」·서랍 테마·Wi-Fi 본관/별관이 전부 이 한 부품: 오목한 트랙 + 고른 칸만 면·밝은 글자. */
  /* iOS 세그먼트 꼴(2026-09-11 오너 채택): 트랙은 바탕색으로 «파이고», 선택 칸은 밝은 썸 + 그림자.
     썸은 ::before 하나 — 누르면 선택 칸 자리로 «미끄러진다»(오너 요청 애니메이션). 두 칸이 같은 너비(grid 1fr)라야 썸 폭 계산이 맞는다.
     썸 폭 = 50% − 3px (패딩 2·틈 2 보정), 2번째 칸으로는 썸 폭 + 틈 2 만큼 이동. reduced-motion 은 전역 규칙이 트랜지션을 끈다. */
  .seg{
    display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative;
    gap:2px;padding:2px;background:var(--ink);border-radius:999px;   /* 알약 언어(2026-09-11) */
  }
  /* 라이트: 트랙 --ink(회백)가 흰 카드와 1.05:1 이라 트랙이 사라지고 썸만 떠 보였다(시뮬레이터, 2026-09-11) → 한 단계 어두운 면 */
  html[data-theme="light"] .seg{background:var(--panel2)}
  .seg::before{
    content:"";position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 3px);
    border-radius:999px;background:var(--btnPress);box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition:transform var(--tMove) var(--ease);
  }
  .seg.alt::before{transform:translateX(calc(100% + 2px))}   /* .alt = 2번째 칸 선택 — 아래 세그먼트 감시 스크립트가 붙인다(:has 는 가상 요소에 불안정) */
  .seg button{
    position:relative;                /* 썸(::before) 위에 글자가 오게 */
    height:30px;padding:0 14px;border-radius:999px;
    border:0;background:transparent;
    /* 미선택 글자는 --dim — --off 는 트랙 위 대비 미달(2026-09-11). 선택 칸은 썸+밝은 글자라 구분 유지 */
    color:var(--dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    transition:color var(--tState) var(--ease), opacity var(--tPress) var(--ease);
  }
  .seg button:active, .seg button.dn{opacity:.4;transition:none}
  .seg button[aria-pressed="true"]{color:var(--text)}   /* 선택 표시는 «aria-pressed 하나»로 통일(2026-09-16).
                                                            예전엔 .on 과 둘이 섞여 CSS·썸 스크립트가 매번 갈라졌고,
                                                            .on 쪽(테마·Wi-Fi)은 화면 낭독기에 선택 상태를 아예 안 알렸다. */
  /* 시트 안에 통째로 깔리는 고르개 — 높이 34. 줄 안에 끼는 세그(30)보다 한 단 크되 글자는 «13 그대로».
     ★40/14 였는데 기록에만 34/13 을 따로 줬더니 같은 부품이 시트마다 다른 활자를 쓰게 됐다.
       이 앱의 활자 사다리는 17 · 14 · 13 이고 «고르개 글자»는 어디서나 13 하나면 된다(2026-09-21).
       높이만 자리에 따라 30 / 34 로 갈린다. */
  .seg.wide{display:grid;margin:-2px 0 14px}
  .seg.wide button{height:34px;font-size:13px}
  .recseg.wide{margin:-2px 0 6px}   /* 기록은 밑이 목록이라 Wi-Fi(14)만큼 안 띄운다 — 첫 머리글이 제 여백 15 를 갖고 있다 */
  .dwtheme{display:flex;align-items:center;gap:10px;padding:6px 16px 2px}
  .dwthlab{font-size:13px;font-weight:600;color:var(--dim)}
  .dwtheme .seg{margin-left:auto}
  .dwsep.push{margin-top:auto}
  .dwfoot{
    padding:12px 16px 0;
    font-size:13px;font-weight:600;color:var(--dim);
    display:flex;align-items:center;gap:6px;
  }
  .dwfoot.off{color:var(--warn)}

  /* ---------- 안내 시트 ---------- */
  .sheetScrim{
    position:fixed;inset:0;z-index:70;
    display:flex;align-items:flex-end;justify-content:center;
  }
  /* 잠금화면(300) 위로 올린다 — 설치 안내는 로그인 전에 보여야 하는 것이라 잠금보다 앞이다.
     조건은 .lock 의 표시 조건과 정확히 짝(html[data-authed="1"] .lock{display:none}) */
  html:not([data-authed="1"]) .sheetScrim{ z-index:310 }
  /* 메인 앱셸처럼 — 제목·버튼은 고정, 가운데(#sheetBody)만 세로 스크롤.
     긴 FAQ·명단에서도 제목·닫기가 안 사라지고 좌우 스크롤도 안 생긴다. */
  .sheet{
    width:100%;max-width:520px;
    background:var(--panel);
    border-radius:var(--radius) var(--radius) 0 0;
    padding:20px 0 calc(env(safe-area-inset-bottom) + 16px);
    max-height:82vh;overflow:hidden;
    display:flex;flex-direction:column;
  }
  /* 좌우 여백은 .sheet 가 아니라 안쪽 요소에 준다 — #sheetBody 가 시트 가장자리까지
     닿아, 스크롤바가 (내용 사이가 아니라) 시트 모서리에 붙는다. 내용은 좌우 대칭 18px. */
  .sheet h3{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin:0 16px 8px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  #sheetBody{
    flex:1 1 auto;min-height:0;min-width:0;padding:0 16px;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .sheetBtns{flex:0 0 auto;display:flex;gap:8px;margin:8px 16px 0}  /* 위 8px = 스크롤 목록과 버튼이 안 붙게 */
  .sheetBtns .sheetClose, .sheetBtns .sheetNever, .sheetBtns .sheetCopy{flex:1}
  .faq{padding-bottom:8px}  /* margin 아님 — 스크롤 끝에서 margin-bottom 은 iOS 에서 안 보임 */
  .qa{border-bottom:1px solid var(--line)}
  .qa:last-child{border-bottom:0}
  .qa .q{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:14px 0;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--text);
    text-align:left;letter-spacing:-.02em;line-height:1.35;
  }
  /* 첫 질문을 제목에 붙이는 건 «묶음을 통째로 끌어올려서» 한다. 질문 자체의 위 여백을 6 으로 줄이면
     그 질문만 위 6 · 아래 14 가 되어, 누를 때 칠이 글자 위로 바짝 붙는다(2026-09-21 전면 점검).
     기록의 머리글 밑 줄에서 고친 것과 같은 패턴 — 여백은 «줄»이 온전히 갖고, 위치는 바깥이 옮긴다. */
  .qa:first-child{margin-top:-8px}
  .qa .q:active, .qa .q.dn{background:var(--press)}   /* 시간대 헤더(.ghead)와 같은 접기 토글 눌림 */
  .qa .qchev{margin-left:auto;flex:0 0 auto;color:var(--off);transition:transform var(--tState) var(--ease)}
  .qa.open .qchev{transform:rotate(90deg);color:var(--text)}   /* 열림 표시는 회전으로 충분 — 금색은 「지금·주동작」에만 */
  .qa .a{
    display:none;padding:0 0 15px;
    font-size:13px;line-height:1.6;color:var(--dim);white-space:pre-line;
  }
  .qa.open .a{display:block}
  .qa .a em{font-style:normal;color:var(--text);font-weight:600}

  /* ── 다 처리한 화면 — 곰이 말을 건다 ──
     규칙: «처리할 게 없을 때만 곰이 나온다». 일하는 화면엔 그림이 하나도 없다(정보는 글자).
     이 자리는 대기 모드에서 그날 대기가 전부 없어졌을 때만 나오므로 하루 한 번이다.
     ★자리는 «스플래시 곰과 똑같이» 잡는다 — 저녁에 앱을 열면 스플래시가 걷히면서 곰이
       그 자리에 그대로 남아 두 화면이 이어진다. 어떻게 맞췄는지는 아래 .donebear 주석에.
     ★하트는 여기서 «움직이지 않는다». 태어나는 건 스플래시 애니메이션의 몫이고, 여기선
       다 끝냈다는 표시로만 달려 있다. 반복(6초 주기)도 시험했다 — 이 화면이 퇴근까지 몇 시간
       떠 있어 계속 깜빡였다. 반려(2026-09-16).
     말풍선은 시트·확인창과 같은 재질(--panel2 · --radius · 글자색 8% 림) — 새 꼴을 안 만든다. */
  .empty.bear{padding:0}   /* .empty 의 위아래 36 을 뺀다 — 곰은 흐름 밖에서 제 자리를 잡는다 */
  .donebear{
    /* ★스플래시와 «똑같은 규칙»로 자리를 잡는다 — 화면 전체에 깔고 가운데 정렬, 아래 여백은
       --sbcut. 셸 높이(--topH)·안전영역이 식에서 통째로 빠져, 두 곰이 계산이 아니라 «구조»로
       같은 자리에 선다. 전에는 본문 영역 한가운데를 잡고 여백으로 끌어올렸는데, 아무리 맞춰도
       0.8px 이 남아 스플래시가 걷힐 때 곰이 미세하게 움직였다(오너 2026-09-16).
       ★가운데에 세우는 것은 «곰 상자 하나»다(.dbwrap). 말풍선까지 같이 세우면 글자 줄 높이가
       기기 배율마다 다르게 떨어져 곰이 0.45px 씩 흔들린다(3배 시뮬 실측). 말풍선은 흐름에서
       빼서 곰 밑에 매단다 — 이제 곰 자리는 글자와 무관하다.
       ★위 여백은 스플래시 락업 속이 다른 몫만 메운다(스플래시는 마크 밑에 이름이 붙어 그만큼
       위로 밀린다). 화면 크기·기기와 무관한 상수다.
       ★흐름에서 빠지므로 이 칸은 높이가 0 — 스크롤은 애초에 생기지 않는다.
       ★pointer-events 를 끊는다: 화면을 덮지만 그리기만 하고 아래 조작을 막지 않는다. */
    position:fixed;left:0;right:0;top:0;bottom:0;
    display:flex;align-items:center;justify-content:center;
    padding:0 16px;
    /* 28.62 = 스플래시에서 마크 밑에 [간격 13 + 이름 25] 가 붙어 마크가 위로 밀리는 몫(그 절반이
       14.31). 아래 여백을 주면 그 절반만큼 올라가므로 두 배로 적는다. 글자가 아니라 상자 치수에서
       나온 값이라 기기·배율과 무관한 상수다(393×852·375×667·3배 시뮬 모두 차이 0.00 확인). */
    padding-bottom:calc(var(--sbcut, 0px) + 28.62px);
    pointer-events:none;
  }
  .dbwrap{position:relative;width:125px}   /* 곰 상자 = 가운데 정렬의 유일한 기준 */
  /* ★액자는 «곰 기준»(0 0 100 100) — 잠금·서랍과 같은 틀이다. 스플래시 액자(-3.25 … 111.80)를
     쓰면 하트 자리까지 폭에 들어가 곰이 작아지고(120 지정 → 실제 80) 4px 왼쪽으로 치우친다(실측).
     하트는 상자 오른쪽 밖으로 나가므로 overflow 를 열어 둔다. */
  /* 폭 125 = 곰 그림 94px — 스플래시 곰과 같은 크기(오너 2026-09-16).
     곰 그림은 액자의 75.45% 를 차지하므로 상자 값과 그림 값이 다르다: 스플래시는 상자 140 에
     액자 111.8 이라 그림이 94, 여기는 상자 125 에 액자 100 이라 그림이 94 로 같아진다. */
  /* ★가로도 스플래시와 같은 자리. 스플래시 액자는 오른쪽에 하트 자리를 비워 둬서(-3.25 … 111.80)
     곰이 액자 «안»에서 왼쪽으로 치우쳐 선다 — 화면 한가운데 기준 -4.60px. 여기 액자는 곰 기준이라
     -1.27px 뿐이라 3.33px 이 어긋났다(실측: 두 액자를 같은 폭에 나란히 놓고 곰 잉크만 잼).
     밑의 말풍선·워드마크는 둘 다 가운데라, 옮겨야 «곰과 글자의 관계»까지 스플래시와 같아진다. */
  .donebear .mk{width:125px;height:auto;display:block;overflow:visible;transform:translateX(-3.33px)}
  .donebear .say{
    position:absolute;top:100%;left:50%;transform:translateX(-50%);
    width:max-content;max-width:78vw;
    background:var(--panel2);border-radius:var(--radius);
    /* ★margin 12 → 6.8 (오너 2026-09-16). 곰 그림 밑에서 꼬리 끝까지 17.2px 이었는데, 꼬리가
       곰에서 떠 있어 말풍선이 «곰 것»이 아니라 그냥 아래 놓인 상자처럼 보였다. 12px 이면 꼬리가
       곰에서 나온 것으로 읽히면서 두 모양이 서로 안 눌린다(8px 은 앞발·초록 체크와 뭉친다).
       ※상자 값(6.8) ≠ 보이는 값(12) — 액자 아래 12.2px 이 빈칸이다. 마크 크기를 바꾸면 다시 잴 것.
       ※스플래시의 곰→이름 18.1px 과는 일부러 다르다. 워드마크는 떨어져야 하고 꼬리는 붙어야 한다. */
    padding:11px 16px;margin-top:6.8px;
    font-size:14px;font-weight:700;color:var(--text);line-height:1.35;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent);
  }
  .donebear .say::before{
    content:"";position:absolute;left:50%;top:-7px;transform:translateX(-50%);
    border-left:8px solid transparent;border-right:8px solid transparent;
    border-bottom:8px solid var(--panel2);
  }
  /* 설치 안내 — 기기별 카드 */
  /* 기기 카드 — 면만. 왼쪽 색 띠는 뺐다(본 명단에서도 없앤 장식). 기기 구분은 제목 색이 한다. */
  .plat{
    background:var(--panel2);border-radius:12px;
    /* 가로 13 = .wnet 과 같은 값. 14 였는데, 바로 위에 붙는 링크 카드(.wnet, 왼쪽 13)와 1px 어긋나
       두 카드의 글 시작점이 29 / 30 으로 달랐다(2026-09-21). 8 = 형제 카드끼리의 간격. */
    padding:13px 13px 11px;margin:0 0 8px;
  }
  .plat:last-child{margin-bottom:0}   /* 마지막 카드 밑 여백 안 쌓임 */
  .plat .ph{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .plat .pn{font-size:14px;font-weight:700;letter-spacing:-.02em}   /* 700 — 같은 14 인 FAQ 질문과 같은 굵기. 800 은 17 짜리 제목에만 쓰는 값인데 여기만 14/800 이었다(2026-09-21) */
  /* 사이 10 — 같은 시트의 .wnet(라벨↔값)과 같은 값. 9 였는데 한 시트 안에서 같은 성격의 간격이
     9 와 10 으로 갈려 있었다(2026-09-21 전수 조사). 위 .plat .ph 의 gap 은 자식이 하나라 쓰이지 않는다. */
  .step{
    display:flex;align-items:center;gap:10px;min-height:32px;
    padding:3px 0;font-size:13px;color:var(--dim);line-height:1.35;
  }
  .step .n{
    width:17px;height:17px;flex:0 0 auto;border-radius:50%;
    background:var(--line);color:var(--text);
    font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;   /* 활자 사다리 예외 — 17px 원 안의 단계 숫자(글이 아니라 표식). 사다리 밖 값은 여기와 .bkback 의 「‹」 둘뿐이다 */
  }
  .step b{color:var(--text);font-weight:700}
  .key{
    display:inline-grid;place-items:center;
    width:26px;height:26px;margin:0 1px;
    border:1px solid var(--line);border-radius:8px;background:var(--ink);
    color:var(--text);line-height:0;vertical-align:-0.30em;
    /* middle 이 아닌 이유: middle 은 «라틴 x-height 의 절반» 을 기준으로 삼는다.
       한글은 x-height 보다 위아래로 넓어서, 같은 줄의 한글 잉크 중심보다 칸이 1.6px 내려앉았다.
       -0.30em 은 그 중심에 맞춘 값(오차 0.11px). px 이 아니라 em 이라 줄 글자 크기를 따라간다. */
  }
  .key svg{display:block}
  /* 시트 안 «한 줄 안내» — 제목 밑이든 덩이 사이든 이 하나를 쓴다.
     .about(14) 과 갈라져 있었다: 설치 안내는 13, 만든 곳의 후원 줄은 14 로 같은 일을 다른 크기로 했다.
     .about 은 «그 시트의 내용 자체»(익순이란?의 소개 문단)라 14 로 남는다 — 역할이 다르다. */
  .sheetNote{font-size:13px;line-height:1.6;color:var(--dim);margin:0 0 14px}
  .sheetNote.sec{margin-top:18px}   /* 한 시트 안에서 다음 덩이를 여는 줄 — 위로 한 칸 띄운다 */
  /* 변경 내역 */
  /* 여백 12 — 옆 탭(지난 명단 .bkrow)과 같은 값. 원래는 9 였는데 그땐 둘이 «다른 시트»에 있어
     나란히 볼 일이 없었다. 한 시트에서 고르개로 오가니 6px 차이가 «한쪽만 빽빽하게» 보인다. */
  .lgrow{
    display:flex;align-items:baseline;gap:10px;padding:12px 0;
    border-top:1px solid var(--line);font-size:14px;
  }
  .lgrow:first-child{border-top:0}   /* 맨 윗줄엔 선을 겹치지 않는다. ★위 여백은 줄이고 아래는 그대로 두지 말 것 — 그 줄만 리듬이 깨진다 */
  /* 폭 자동 — 로그 시각은 늘 «HH:MM»(logAdd 가 pad 해서 넣는다)이라 자동이어도 줄줄이 가지런하다.
     42 고정이었을 땐 41 짜리 글자 뒤에 1px 이 남아 시각↔글 틈이 11px 이 됐고, 지난 명단 탭(10px)과
     한 픽셀 어긋났다. 두 탭 모두 gap 10 만으로 틈을 만든다. */
  .lgt{flex:0 0 auto;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .lgk{flex:0 0 auto;min-width:62px;font-weight:700;color:var(--text)}   /* 폭 고정 — 「자동 취소」가 있어도 내용 열이 한 줄로 선다 */
  .lgk.go{color:var(--goTx)}
  .lgk.off{color:var(--warn)}
  .lgs{flex:1;min-width:0;color:var(--dim);font-size:13px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 시트 안의 «없습니다 / 못 불러왔습니다» 줄 — 13/400 으로 .sheetNote 와 같은 활자를 쓴다.
     14 였는데, 같은 시트 안에서 안내는 13(.sheetNote) 인데 빈 상태만 14 라 한 시트에 설명 활자가 둘이었다.
     (본문 .about 14 는 그대로 — 그건 «안내»가 아니라 「익순이란?」의 내용 자체다. 2026-09-21) */
  /* margin:0 은 «있어야 한다» — 제 여백은 padding 으로 다 갖고 있고, 브라우저 기본 margin(13×2=26px)은
     평소엔 부모 밖으로 접혀 안 보이다가 부모에 overflow 가 붙는 순간 높이에 더해진다.
     기록에서 높이를 0.2s 로 움직일 때 그 26px 이 끝에서 «되튐»으로 보였다(2026-09-21). */
  .sheetMsg{margin:0;font-size:13px;line-height:1.6;color:var(--dim);padding:6px 0 14px}

  /* 「지난 명단」 시트 — 목록은 「최근 변경 내역」(.lgrow) 처럼 한 줄(시각·요약·›), 행을 누르면 상세. */
  .bklist{padding-top:2px}   /* 다른 시트처럼 제목 밑 선 없이 — 8px 뒤 바로 내용 */
  /* 한 줄 = 한 시점. 시각과 «몇 명짜리 명단인가» 둘뿐이다.
     ★이 화면은 통계를 보는 곳이 아니라 «명단을 되살리는» 곳이다 (FAQ: 「지난 명단에서 원하는
       시점의 명단을 복사해 다시 등록하면 됩니다」). 고를 때 필요한 건 «언제»와 «몇 명»이고,
       방문·취소 수는 고르는 데 쓰이지 않는다 — 그건 들어가서 볼 일이다.
     ★2026-09-15 에 예약·방문·취소 세 열짜리 표로 만들어 봤다가 되돌렸다. 열 이름·0 자리의 「–」
       까지 붙어 한 줄에 여섯 덩어리가 됐고, 「저녁이 어떻게 찼는가」는 이 화면이 맡을 일이
       아니었다(오너: 「너무 난잡하다」). 색(방문 초록·취소 빨강)도 그때 같이 뺐다 — 숫자가
       하나뿐이면 구분할 것이 없다. */
  .bkrow{
    display:flex;align-items:center;gap:10px;position:relative;
    padding:12px 0;border-top:1px solid var(--line);cursor:pointer;
    min-height:44px;   /* 여백 12+12 에 글자 19 라 43px 이었다 — 손가락 기준(44)에 1px 모자랐다.
                          앱의 누르는 줄 중 여기만 미달이었다(2026-09-21 실측). 여백을 키우지 않고
                          최소 높이로 받친다 — align-items:center 라 위아래가 그대로 대칭이고,
                          눌림 칠(::after inset:0 -16px)도 늘어난 높이를 그대로 덮는다. */
  }
  /* ★눌림 칠은 시트 «끝에서 끝까지» 간다. 이 줄만 본문 여백(16) 안에 갇혀 네모가 가운데 떠 보였다 —
     앱의 다른 누르는 줄(.ghead·.dwitem·.qa .q)은 전부 제 여백을 안에 품고 있어 끝까지 칠해진다.
     칠은 ::after 로 내보내고 구분선은 글자에 맞춰 안쪽(16)에 남긴다 — iOS 목록이 하는 그대로다.
     ★-16px 은 #sheetBody 의 좌우 여백과 같은 값. 그 여백을 고치면 여기도 같이 고쳐야 한다. */
  .bkrow::after{content:"";position:absolute;inset:0 -16px;background:transparent}
  .bkrow > span{position:relative;z-index:1}   /* 글자가 칠 위로 */
  .bkrow:active::after, .bkrow.dn::after{background:var(--press)}
  /* ★폭은 «자동»이다. 고정(42)으로 바꿔 봤다가 되돌렸다(2026-09-21) —
     「요약 시작점을 한 줄로 세운다」는 이득은 «오늘 줄과 어제 줄 사이»에만 생기는데 그 둘은 머리글과
     구분선으로 이미 갈라져 있어 세로줄을 맞출 이유가 없다. 대신 짧은 라벨(9/20, 31.7px)은 남는 자리만큼
     틈이 벌어져 «그 줄만 성글게» 보였다(실측 틈 11.0 → 20.3px, 오너가 실기기에서 잡아냄).
     자동 폭이면 틈이 늘 11px 이고, 줄이 여럿인 「오늘」 안에서는 라벨이 다 「HH:MM」이라 어차피 가지런하다.
     (「어제」는 한 줄뿐이다 — 아래 KEEP_DAYS 주석 참고.) */
  .bkt{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  /* 요약은 시각 «바로 뒤»에 붙는다 — 오른쪽 끝으로 밀면 문구 길이가 행마다 달라(「17명 · 방문 14」
     vs 「9명」) 시작점이 들쭉날쭉해진다. 왼쪽에 뭉치면 늘 같은 자리에서 읽기 시작한다.
     상세(.bkvrow)에서 인원을 이름 뒤에 붙인 것과 같은 규칙이다. */
  /* 굵기 600 — 시각(700)과 색만 다르면 위계가 약하다. 형제 화면 「변경 내역」도
     종류(.lgk 700)와 요약(.lgs 400·13)을 굵기로 갈라 놓는다. */
  .bkn{font-size:14px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bkchev{flex:0 0 auto;margin-left:auto;color:var(--off);display:flex;align-items:center}  /* FAQ 화살표와 같은 아이콘 */
  /* 구역 라벨(오늘/어제) */
  /* 아래 여백을 라벨이 아니라 «줄»이 갖는다. 예전엔 라벨 7 + 줄 4 로 나눠 가졌는데, 그러면
     머리글 바로 밑 줄만 위 여백 4 · 아래 12 로 «눌림 칠이 위아래로 안 맞았다»(오너 2026-09-21).
     지금은 모든 줄이 12/12 라 칠이 어느 줄에서나 글자를 가운데 두고 같은 높이로 선다.
     라벨↔줄 간격은 11 → 12 로 1px 만 달라진다. */
  .bkgroup{
    font-size:13px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--dim);
    padding:15px 0 0;border-top:1px solid var(--line);margin-top:4px;
  }
  .bkgroup + .bkrow{border-top:0}  /* 라벨 밑엔 구분선을 겹쳐 긋지 않는다 */
  .bklist > .bkgroup:first-child{border-top:0;margin-top:0;padding-top:6px}  /* 첫 라벨: 제목과 숨 쉴 틈 */
  /* 상세: 그 시점 명단을 읽기 전용으로 (본 화면처럼 시간대로 묶고 방문·취소 색 구분) */
  .bkback{  /* 목록으로 — 화살표만. 제목 글자와 어울리게 (같은 색, 제목 높이에 맞춘 크기) */
    flex:0 0 auto;display:inline-flex;align-items:center;position:relative;
    margin-left:-2px;padding:3px 5px 3px 0;
    color:var(--text);cursor:pointer;line-height:1;
  }
  .bkback::before{content:"‹";font-size:23px;font-weight:400;position:relative;top:-1px}   /* 활자 사다리 예외 — 글자가 아니라 «아이콘»으로 쓰는 글리프. 크기는 제목(17)과 나란히 보이게 맞춘 값 */
  /* 보이는 건 화살표 그대로 — 누르는 영역만 넓힌다 (레이아웃·헤더 높이 영향 없음).
     엄지가 왼쪽·위로 빗나가기 쉬워 그쪽을 더 준다. 오른쪽은 제목 글자 안 먹게 조금만. */
  .bkback::after{content:"";position:absolute;inset:-11px -4px -8px -11px}
  .bkback:active, .bkback.dn{opacity:.4}
  /* 하단 버튼 위 공백은 margin 이 아니라 padding — 스크롤 컨테이너(#sheetBody) 안에서
     마지막 자식의 margin-bottom 은 iOS 에서 스크롤 끝까지 안 보인다. */
  .bkvlist{padding:0 0 7px}
  /* 시간대 머리글 — 본 명단 시간바의 축소판: 굵은 시각 + 오른쪽 방문·취소 수 + «아래» 전폭 선.
     머리글은 자기 명단에 붙는다(위 넓게, 아래 선). */
  .bkvt{
    display:flex;align-items:baseline;gap:8px;
    font-size:17px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--text);   /* 시간바(.gtime)와 같은 단계 */
    padding:16px 0 7px;border-bottom:1px solid var(--line);margin-bottom:3px;
  }
  /* 첫 머리글만 제목에 붙인다. ★값은 7 — 이 화면이 쓰는 유일한 작은 여백이다(머리글 아래 7 · 행 7 · 목록 끝 7).
     예전엔 .bkvlist 가 2, 이 줄이 4 를 나눠 가져 한 가지 일에 값이 둘이었고, 6 으로 합쳤더니 이번엔 7 과 1px 갈렸다.
     하나로 모으면 이 화면의 여백은 «7 과 머리글 위 16» 둘뿐이다. */
  .bkvt:first-child{padding-top:7px}
  .bkvm{margin-left:auto;font-size:13px;font-weight:600;color:var(--dim)}
  /* 읽기 전용 행 — 상태 표시 · 이름 · 오른쪽 인원.
     원(체크박스)은 안 그린다 — 읽기 전용인데 빈 원이 있으면 「눌러야 하나」로 보인다.
     방문 ✓ 초록 / 취소 ✕ 빨강 표시만, 대기는 빈칸(이름 열은 그대로 맞춰 둔다). */
  /* ★인원은 본 화면처럼 행 끝으로 밀지 않고 «이름 바로 뒤»에 붙인다. 본 화면은 행 끝에 ⋯ 단추가
       있어 오른쪽 가장자리가 붙잡혀 있는데 여기엔 그게 없어서, 인원 하나가 건너편에 혼자 떠
       한 줄 안에 내용 90px · 빈칸 270px 이 됐다 (오너 2026-09-15 「가운데가 엄청 비어 있다」).
       오른쪽에 남는 자리는 이제 «여백»이지 «구멍»이 아니다.
     ★메모는 여태 안 그렸다. 백업 스냅샷은 항목을 통째로 담으므로(memo 포함) 가진 정보를
       안 보여준 것이었다 — 본 화면 .memo 와 같은 꼴(13 · --dim)로 되살린다. */
  .bkvrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:14px;line-height:1.35}   /* 8 — 이 화면의 다른 사이 간격(.bkvt·.bkvl1)과 같은 값. 9 는 여기서만 쓰이던 어중간한 값이었다(2026-09-21 전수 조사) */
  .bkvrow .ck{width:14px;height:14px;flex:0 0 auto;display:grid;place-items:center;line-height:0;color:transparent;margin-top:2px}
  .bkvrow .ck svg{display:block}
  .bkvrow.go .ck{color:var(--goTx)}
  .bkvrow.off .ck{color:var(--warn)}
  /* 이름은 늘지 않는다(flex:0 1) — 인원이 이름 바로 뒤에 붙고, 남는 자리는 오른쪽 «여백»이 된다.
     굵기는 본 화면과 같은 규칙: 대기 700 · 처리된 행 600 + --dim (.row.arrived .name 과 짝). */
  .bkvrow .nm{flex:0 1 auto;min-width:0;color:var(--text);font-weight:700;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bkvrow .px{flex:0 0 auto;color:var(--text);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  /* 메모 — 본 화면 .memo 와 같은 꼴(13 · --dim · 앞의 점은 2026-09-18 에 둘 다 뺐다). 백업 스냅샷은 항목을 통째로 담아
     메모까지 들어 있는데 여태 안 그렸다. 복사 양식에도 메모를 실으면서(reportText) 같이 되살렸다.
     ★화면과 붙여넣기가 이제 같은 것을 담는다 — 한쪽에만 있으면 「보이는데 못 가져가는」 게 된다. */
  .bkvbody{flex:1;min-width:0;display:flex;flex-direction:column}
  .bkvl1{display:flex;align-items:baseline;gap:8px;min-width:0}
  .bkvmemo{margin-top:2px;font-size:13px;font-weight:600;line-height:1.35;color:var(--dim);word-break:keep-all;overflow-wrap:anywhere}
  .bkvrow.go .bkvmemo, .bkvrow.off .bkvmemo{color:var(--off)}   /* 본 화면 .row.arrived .memo 와 같게 */
  /* 처리된 행은 이름도 인원도 같이 가라앉는다 — 본 화면 .row.arrived/.cancelled 와 같은 규칙.
     ★취소 이름은 --off 에 취소선이었다. 본 화면은 2026-09-11 에 그 둘을 이미 버렸는데
       (「--off 는 3.7:1 로 읽기 기준 미달」 · 「상태는 원 하나에만, 선을 줄인다」 — 오너)
       이 시트만 옛 규칙이 남아 있었다. 글자가 14px 이라 대비는 오히려 더 나빴다. 2026-09-15. */
  .bkvrow.go .nm, .bkvrow.off .nm, .bkvrow.go .px, .bkvrow.off .px{color:var(--dim);font-weight:600}
  /* 시트 기본 하단바(닫기) 오른쪽에 그 시트의 주동작 버튼을 하나 더 붙인다
     (지금은 지난 명단 상세의 「명단 복사」). 닫기와 크기·모양은 같고 색만 포인트색. */
  .errline{margin-top:10px;color:var(--off);text-decoration:underline;cursor:pointer}
  .errline:active{opacity:.5}
  .sheetBtns .sheetCopy{background:var(--wait);color:var(--onWait);font-weight:700}
  .sheetBtns .sheetCopy:active, .sheetBtns .sheetCopy.dn{background:var(--waitHover)}

  /* Wi-Fi 안내 — 본관/별관 토글은 공용 .seg.wide (위쪽) */
  /* QR 은 어두운 배경에서 못 읽으니 테마와 무관하게 흰 바탕 */
  .qrcard{
    background:#fff;border-radius:var(--radius);padding:16px;margin:0 auto 16px;
    width:236px;box-sizing:border-box;
  }
  .qrcard svg{display:block;width:100%;height:auto}
  /* ★높이를 못 박는다(54 = 32px 복사 버튼 + 위아래 11). 안 그러면 버튼이 있는 줄만 8px 높아져
     세 줄 중 하나가 도드라진다(만든 곳·후원에서 45.8 / 45.8 / 54 로 드러남, 2026-09-21).
     버튼을 줄이는 쪽은 안 된다 — 32 는 누르는 영역 48 을 만드는 값이다. */
  .wnet{
    display:flex;align-items:center;gap:10px;padding:11px 13px;min-height:54px;
    background:var(--panel2);border-radius:12px;
  }
  .wnet + .wnet{margin-top:8px}   /* 카드 사이만 — 마지막 카드 밑엔 여백 안 쌓임 */
  /* 둥근 복사 버튼이 붙는 줄 — 오른쪽 여백만 13 → 8px. 둥근 버튼은 제 여백을 가진 것처럼 보여
     다른 줄과 같은 13px 을 주면 가장자리에서 멀어 보인다. 설치 안내에만 있던 값을 규칙으로 뽑았다. */
  .wnet.cpy{padding-right:8px}
  /* 설치 안내의 주소 칸 — Wi-Fi 칸과 같은 모양. 값은 읽는 게 아니라 복사하는 것이라 조금 작게 */
  .wnet.urlrow{margin-bottom:16px}   /* 16 = 구역이 바뀔 때의 간격(Wi-Fi 의 QR 카드 밑과 같은 값). 14 였다 */
  .wnet.urlrow .k{flex:0 0 auto}   /* 한 줄뿐이라 Wi-Fi 처럼 라벨 폭을 맞출 대상이 없다 */
  .wnet .v.url{font-size:13px;font-weight:600;letter-spacing:.01em}
  .urlcopy{
    flex:0 0 auto;position:relative;
    width:32px;height:32px;padding:0;display:grid;place-items:center;
    background:var(--btn);border:0;border-radius:999px;
    color:var(--text);cursor:pointer;   /* 보조 버튼 — 금색은 「지금·주동작」에만 */
  }
  .urlcopy svg{display:block}
  /* 보이는 건 32px 그대로 — 누르는 영역만 넓힌다 (.bkback 과 같은 방식) */
  .urlcopy::after{content:"";position:absolute;inset:-8px}
  .urlcopy:active, .urlcopy.dn{background:var(--btnPress)}
  .wnet .k{font-size:13px;font-weight:700;color:var(--dim);flex:0 0 52px}
  .wnet .v{font-size:17px;font-weight:700;color:var(--text);flex:1;min-width:0;word-break:break-all}
  .about{font-size:14px;line-height:1.6;color:var(--dim);margin:0 0 12px}
  .about b{color:var(--text);font-weight:700}
  .credit{
    border-top:1px solid var(--line);padding-top:12px;margin:16px 0 0;   /* 밑 0 — 2 를 남겨 두면 이 시트만 마지막 내용↔닫기 간격이 12 가 된다(다른 시트는 10) */
    font-size:13px;line-height:1.6;color:var(--dim);letter-spacing:.01em;
  }
  /* .wnet 줄 안의 «누를 수 있는 값». 표시는 오른쪽 화살표(.bkchev)가 맡는다 —
     ★밑줄을 썼다가 뺐다(2026-09-21). 색을 못 쓰니(작은 글자엔 강조색 금지) 밑줄로 냈던 건데,
       밑줄은 앱 통틀어 숨은 「문제 기록」 줄 하나뿐이라 오히려 이 줄만 튀었고, 13px 에선 도메인의
       점들과 엉켜 지저분했다. 「누르면 넘어간다」는 지난 명단 줄이 쓰는 꺾쇠가 이미 앱의 말이다.
       다만 여기 화살표는 «비스듬히 밖으로» 나간다 — 앱 안으로 들어가는 › 와 구분해야 한다.
     ★target=_blank 가 필수다. 홈 화면 앱에서 같은 창에 열면 «앱 창 자체»가 홈페이지로 바뀌어
       돌아오려면 뒤로 가기를 찾아야 한다. _blank 면 사파리로 넘어가고 앱은 뒤에 그대로 남는다. */
  .site{
    /* 줄 «높이»를 따라 늘어난다(align-self:stretch). 고정 여백으로 맞춰 두면 .wnet 의 높이가 바뀔 때
       누르는 영역만 뒤처진다 — 실제로 줄이 45.8→54 가 됐을 때 링크만 45.8 로 남았다(2026-09-21). */
    display:flex;align-items:center;align-self:stretch;flex:1;min-width:0;gap:10px;
    padding:11px 0;margin:-11px 0;   /* .wnet 의 위아래 여백과 같은 값 — 줄을 꽉 채우되 넘치지는 않는다 */
    color:var(--text);text-decoration:none;-webkit-tap-highlight-color:transparent;
  }
  .site .addr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site:active{opacity:.5}
  .sheetClose, .sheetNever{   /* 닫기 · 다시 보지 않기 — 같은 보조 버튼 */
    height:48px;padding:0;margin-top:2px;border-radius:999px;
    border:0;background:var(--btn);
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  }
  .sheetClose:active, .sheetClose.dn, .sheetNever:active, .sheetNever.dn{background:var(--btnPress)}

  /* ---------- 잠금 화면 (공유 비밀번호) ----------
     네이티브 키보드를 안 쓴다 — 직접 만든 숫자 키패드. iOS 는 입력칸에 포커스가 가면
     비주얼 뷰포트를 밀어 올리는데(position:fixed 도 같이 딸려 올라감) CSS 로는 못 막는다.
     키패드로 바꾸면 그 원인 자체가 없어져 화면이 완전히 정적이다.
     토스트(200)보다 위. 로그인 상태를 알기 전까지, 그리고 로그인 안 됐을 때 앱 전체를 덮는다. */
  .lock{
    /* 높이를 svh(주소창이 펼쳐진 기준의 '작은 뷰포트')로 고정한다.
       inset:0 이면 사파리 주소창이 접힐 때 높이가 변하고, 가운데 정렬이라
       그 절반만큼 내용이 위로 튄다. svh 는 그 변화에 안 흔들린다.
       (홈 화면 앱 모드엔 주소창이 없어 원래 안 튀지만, 브라우저로 열 때를 위해.) */
    position:fixed;top:0;left:0;right:0;z-index:300;
    height:100vh;height:100svh;
    /* 잠금·스플래시도 --ink — 띠는 «앱을 여는 순간 맨 위에 있던 면»의 색을 붙잡는다는 기록(시뮬레이터 2026-09-11)이 있어 첫 화면 면도 같은 색 */
    background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    /* safe-area-inset 을 쓰지 않는다 — 내용이 세로 가운데 정렬이고 위아래로 180px 넘게
       남아서 노치/홈바에 닿을 일이 없는데, env() 가 뒤늦게 0 → 실제값으로 풀리면
       가운데가 그만큼 밀려 실행 직후 화면이 한 번 움직인다. 고정값이면 첫 프레임부터 확정. */
    padding:20px 24px;
  }
  /* 해제될 때 --tMove 페이드(--ease). 화면 전체를 덮는 잠금·스플래시는 transform 없이 페이드만.
     .2s 는 그 사이 boot() 이 명단을 받아 첫 로그인의 빈 화면을 가리는 시간도 겸한다. */
  .lock{transition:opacity var(--tMove) var(--ease)}
  .lock.out{opacity:0;pointer-events:none}
  html[data-authed="1"] .lock{display:none}   /* 재실행 시 깜빡임 방지 (위 head 스크립트) — 그 사이는 .splash 가 덮는다 */
  /* 잠금화면은 스플래시와 일부러 다르게 둔다 — 스플래시는 앱을 열 때 한 번 스치는 브랜드
     화면이지만, 잠금은 하루에 여러 번 보는 기능 화면(PIN 패드 헤더)이라 다른 시트 제목들과
     같은 시스템 폰트·굵기를 쓰는 게 실제 UI 와 더 잘 붙는다.
     아이콘은 «타일 비율 그대로»(viewBox 0 0 100 100) 두되 PNG 가 아니라 인라인 마크를 쓴다 —
     2026-09-13 오너 지적: PNG 는 어두운 바탕이 구워져 있어 라이트 테마에서 혼자 다크 타일로 떴다.
     타일 바탕을 --ink 로 칠하니 잠금 화면(바탕도 --ink)에선 타일이 사라져 마크만 뜨고,
     라이트에선 종이색 타일 + 클레이 얼굴이 된다. 모서리는 iOS 타일 곡률(변의 22.4%). */
  .lockico{width:56px;height:56px;border-radius:12.5px;background:var(--ink);display:block}   /* 판 = --ink → 잠금 바탕과 같은 값이라 사라진다. 규칙은 .dwico 와 하나. */
  /* 14 → 8: 같은 수치인데 새 마크가 더 벌어져 보인다 — 옛 얼굴은 금색 덩어리 하나라 밑변이 «선»으로
     끝나 바닥이 분명했는데, 새 곰은 초록 체크로 덩어리가 갈라지고 밑변이 둥근 앞발로 흐려지며
     하트가 무게를 위로 끌어올린다. bbox 간격은 오히려 1px 줄었는데도 체감은 늘었다(오너 지적 2026-09-14).
     타일 아래 여백 5.6 + 글꼴 위 여백 5.3 = 10.9px 가 이미 깔려 있어, CSS 로 적는 값은 «보이는 것보다 훨씬 작다».
     5 로 두면 보이는 간격 15.9px — 옛 마크(솔리드 얼굴, 보이는 29.7)와 같은 붙임새다.
     9 였을 때 22.7px 로 여전히 떠 보인다는 지적을 받았다(2026-09-15). 0 에 가까운 수치가 «맞다». */
  .lockname{margin-top:5px;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
  .locksub{margin-top:3px;font-size:13px;color:var(--dim)}
  /* 입력한 자릿수 표시 */
  .lockdots{display:flex;gap:14px;margin-top:26px;height:12px;align-items:center}
  .lockdots i{
    width:12px;height:12px;border-radius:50%;
    border:1.5px solid var(--off);background-color:transparent;
    transition:background-color var(--tPress) var(--ease), border-color var(--tPress) var(--ease);
  }
  /* 글자용 포인트 토큰 — 다크는 --wait 와 같은 값, 라이트는 테라코타 */
  .lockdots i.on{background-color:var(--wait);border-color:var(--wait)}
  .lock.bad .lockdots{animation:lockshake .32s}
  @keyframes lockshake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)}   60%{transform:translateX(-4px)} 80%{transform:translateX(2px)}
  }
  /* 높이를 '고정'한다 — min-height 면 문구가 뜰 때 1px 늘어 점·키패드가 밀린다.
     문구는 한 줄에 들어가는 길이로만 쓴다(320px 기준 14자 이하). */
  .lockmsg{margin-top:12px;font-size:13px;line-height:18px;height:18px;
           color:var(--warn);text-align:center;white-space:nowrap}
  /* 숫자 키패드 — 원형은 이 앱에서 단계 번호(.step .n)와 같은 결 */
  .lockpad{
    display:grid;grid-template-columns:repeat(3, 64px);gap:18px 22px;
    margin-top:22px;
  }
  .lockkey{
    width:64px;height:64px;border-radius:50%;padding:0;
    /* 앱의 보조 버튼과 같은 «면만»(--btn, 테두리 없음). 입력칸만 선을 갖는다는 규칙. */
    border:1px solid transparent;background:var(--btn);
    color:var(--text);font-family:inherit;font-size:25px;font-weight:600;
    font-variant-numeric:tabular-nums;cursor:pointer;
    display:grid;place-items:center;
  }
  /* 눌림 표시. :active 만 쓰면 탭이 100ms 안팎이라 실기기에서 거의 안 보인다 —
     JS 가 .dn 을 최소 130ms 유지해 준다(:active 는 마우스/보조 입력용 폴백).
     색은 중립(--keyDn) — 금색은 앱에서 「주동작/선택됨」 뜻이라 숫자키엔 안 쓴다.
     --press 는 실기기에서 거의 안 보여 한 단계 더 밝은 값을 따로 뒀다. */
  .lockkey.dn, .lockkey:active{
    background:var(--keyDn);border-color:var(--keyDn);
  }
  .lockkey.blank{border:0;background:none;pointer-events:none}
  /* 지우기 — 버튼으로 안 감싼다. 숫자 키패드의 공통 관습(아이폰 잠금·전화 다이얼러·
     안드로이드 PIN 모두 지우기만 아이콘으로 둔다).
     눌림도 면을 만들지 않는다 — 평소 면이 없는데 누를 때만 원이 생기면 그 순간 숫자키처럼
     보여 정체가 흔들린다. 대신 아이콘 자체가 밝아진다(--dim → --text).
     ※ .lockkey.dn 이 앞에 있어 배경을 칠하므로 여기서 다시 none 으로 눌러둔다 */
  .lockkey.act{border:0;background:none;color:var(--dim)}
  .lockkey.act.dn, .lockkey.act:active{background:none;color:var(--text)}
  /* 지울 게 없을 때 — opacity 대신 앱의 3단계 위계 토큰을 그대로 쓴다.
     --off(가장 흐림) → --dim(평소) → --text(눌림). opacity .3 은 대비 1.6:1 이라
     키가 사라진 것처럼 보이다 첫 입력에 툭 나타났다. */
  .lockkey.act:disabled{color:var(--off)}
  .lockkey svg{display:block}
  /* 확인 중(.busy) — 키패드를 흐리게 하지 않고 입력만 막는다.
     45% dim 은 "작동 중"이 아니라 "멈췄다"로 읽혔다. */
  .lock.busy .lockpad{pointer-events:none}
  /* 대신 검사 대상인 점이 천천히 숨쉬어 진행 중임을 알린다(인증 왕복 ≈0.7s ≒ 한 호흡).
     .checking 은 마지막 점의 채움 전환(.12s)이 끝난 뒤에 붙는다 — 겹치면 그 점만 따로
     깜빡이는 것처럼 보인다 (submitPin 참고). reduced-motion 은 아래 전역 규칙이 끈다. */
  .lock.checking .lockdots i.on{animation:lockpulse .9s ease-in-out infinite}
  @keyframes lockpulse{50%{opacity:.3}}

  /* ---------- 스플래시 (앱 로딩) ----------
     재로그인 상태(data-authed)로 앱을 열면 명단이 뜨기 전 ~1초가 빈다 — 그 사이를 앱 아이콘·이름으로 덮는다.
     그 상태에선 첫 프레임부터 떠 있고, app IIFE 의 첫 render() 가 .out 로 --tMove 페이드시켜 걷는다

     접속을 빠르게 하지는 않는다 — 빈 화면을 브랜드 화면으로 바꿀 뿐, 고정 지연 없이 준비되면 사라진다. */
  /* 스플래시 워드마크(익순이) 전용 서체 — 카페24 써라운드(Cafe24 Ssurround), 상업적 임베드 자유

     서브셋 — 2KB, 로딩 지연 없음. 스플래시 전용이라 본문 폰트 스택은 안 바뀐다(잠금화면은
     시스템 폰트 그대로 — 근거는 위 .lockico 주석 참고).
