  // "1530" "15:30" "15시30분" "15.30" → "15:30"
  function normTime(v){
    var s = String(v).replace(/\s/g,'');
    var m = s.match(/^(\d{1,2})[:.시]?(\d{1,2})?분?$/);
    if (!m) return null;
    var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (m[2] === undefined && s.length === 4){ h = +s.slice(0,2); mi = +s.slice(2); }
    if (h > 23 || mi > 59) return null;
    return pad(h) + ':' + pad(mi);
  }

  function uniqueId(time, name, pax, skipId){
    var base = time + '|' + name + '|' + pax, n = 0, id;
    do { n++; id = base + '|' + n; }
    while (state.items.some(function(x){ return x.id === id && x.id !== skipId; }));
    return id;
  }

  function applyEdit(id, timeV, nameV, paxV, memoV){
    var it = find(id);
    if (!it) return;
    var originalTime = it.time;
    var time = normTime(timeV);
    var name = String(nameV).replace(/\s+/g,' ').trim();
    var pax = parseInt(paxV, 10);
    if (!time){ toast('시간을 확인해 주세요'); return; }
    if (!name){ toast('이름을 입력해 주세요'); return; }
    if (!(pax > 0)){ toast('인원을 확인해 주세요'); return; }

    var memo = String(memoV == null ? (it.memo || '') : memoV).replace(/\s+/g,' ').trim();

    if (time === it.time && name === it.name && pax === it.pax && memo === (it.memo || '')){
      keepSlotOpenForId(it.id);
      if (deferKeyboardEditClose(it.id, it.id)) return;
      editing = null; lastEditControlId = null; render(); return;
    }

    // 시간이 바뀌면 옮겨간 시간대의 맨 뒤로
    var timeMoved = time !== it.time;
    if (timeMoved){
      var maxSeq = 0;
      state.items.forEach(function(x){ if ((x.seq||0) > maxSeq) maxSeq = x.seq||0; });
      it.seq = maxSeq + 1;
    }

    var memoOnly = (time === it.time && name === it.name && pax === it.pax);
    logAdd(memoOnly ? '메모' : '수정',
      memoOnly ? (it.time + ' ' + it.name + (memo ? ' · ' + memo : ' · 메모 지움'))
               : (it.time + ' ' + it.name + ' → ' + time + ' ' + name + ' ' + pax + '명'));
    it.time = time; it.name = name; it.pax = pax; it.memo = memo;
    it.id = uniqueId(time, name, pax, id);
    touched[originalTime] = Date.now();
    touched[time] = Date.now();
    armSlotCollapse(originalTime);
    if (time !== originalTime) armSlotCollapse(time);
    state.items.sort(sortItems);
    state.rosterTs = Date.now();
    var deferredClose = deferKeyboardEditClose(id, it.id, timeMoved);
    if (deferredClose){
      save();
      toast('수정됨');
      return;
    }
    editing = null;
    lastEditControlId = null;
    render();
    if (timeMoved && !keyboardOpen) ensureVisible(it.id);
    save();
    toast('수정됨');
  }

  function find(id){
    for (var i=0;i<state.items.length;i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  // 변경 내역 — 무슨 일이 있었는지만 남긴다 (되돌리기는 없다)
  var LOG_SHOW = 10;
  var LOG_KEEP = 40;
  var LOG_SCOPE = /-dev(\/|$)/.test(location.pathname) ? 'dev' : 'prod';
  var LOG_CACHE_KEY = 'ix-log-cache-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_KEY = 'ix-log-outbox-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_PREFIX = LOG_OUTBOX_KEY + ':';
  var LOG_ID_PATTERN = /^[A-Za-z0-9_-]{8,80}$/;

  function readLogStore(key){
    try {
      var value = JSON.parse(localStorage.getItem(key) || '{}');
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    } catch(e){ return {}; }
  }
  function writeLogStore(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  function removeLogStore(key){
    try { localStorage.removeItem(key); return true; }
    catch(e){ return false; }
  }
  function validLogDate(ds){
    var m = String(ds || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return false;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
  }
  function cleanLogEntry(r, requireId){
    if (!r || typeof r !== 'object') return null;
    var at = Number(r.at);
    if (!isFinite(at) || at <= 0 || typeof r.t !== 'string' || typeof r.k !== 'string') return null;
    var id = r.id == null || r.id === '' ? '' : String(r.id);
    if ((requireId && !id) || (id && !LOG_ID_PATTERN.test(id))) return null;
    var clean = {
      at: at,
      t: r.t.slice(0, 16),
      k: r.k.slice(0, 40),
      s: (r.s == null ? '' : String(r.s)).slice(0, 500)
    };
    if (id) clean.id = id;
    return clean;
  }
  function cleanOutboxItem(id, item){
    if (!LOG_ID_PATTERN.test(id) || !item || !validLogDate(item.date)
        || item.date < shiftDate(bizDate(), -KEEP_DAYS) || item.date > bizDate()) return null;
    var entry = cleanLogEntry(item.entry, true);
    if (!entry || entry.id !== id) return null;
    return { date: item.date, entry: entry };
  }
  function readLogOutbox(){
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++){
        var key = localStorage.key(i);
        if (!key || key.indexOf(LOG_OUTBOX_PREFIX) !== 0) continue;
        var id = key.slice(LOG_OUTBOX_PREFIX.length), item = null;
        try { item = cleanOutboxItem(id, JSON.parse(localStorage.getItem(key) || 'null')); } catch(e){}
        if (item) out[id] = item;
        else if (removeLogStore(key)) i--;
      }
      // v1.3.12 시험판의 한 덩어리 outbox가 남아 있으면 안전한 항목만 한 건씩 옮긴다.
      var legacy = readLogStore(LOG_OUTBOX_KEY);
      var remaining = {};
      Object.keys(legacy).forEach(function(id){
        var item = cleanOutboxItem(id, legacy[id]);
        if (!item || out[id]) return;
        if (writeLogStore(LOG_OUTBOX_PREFIX + id, item)) out[id] = item;
        else remaining[id] = item;
      });
      if (Object.keys(remaining).length) writeLogStore(LOG_OUTBOX_KEY, remaining);
      else removeLogStore(LOG_OUTBOX_KEY);
    } catch(e){}
    return out;
  }
  function cleanLogCache(raw){
    var out = {};
    Object.keys(raw || {}).forEach(function(ds){
      if (!validLogDate(ds)) return;
      var rows = mergeLogRows([raw[ds]], LOG_KEEP);
      if (rows.length) out[ds] = rows;
    });
    return out;
  }

  var logCache = cleanLogCache(readLogStore(LOG_CACHE_KEY));
  var logOutbox = readLogOutbox();
  var logFlushActive = false;
  var logRetryTimer = null;
  var logRetryDelay = 3000;
  var logRetryAttempts = 0;
  var logUnwatch = null;
  var logWatchSerial = 0;

  function logEventId(){
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch(e){}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)
      + '-' + Math.random().toString(36).slice(2, 8);
  }
  function logIdentity(r){
    return r && r.id ? 'id:' + r.id
      : 'legacy:' + ((r && r.at) || 0) + '|' + ((r && r.k) || '') + '|' + ((r && r.s) || '');
  }
  function mergeLogRows(groups, limit){
    var seen = {}, all = [];
    (groups || []).forEach(function(rows){
      (Array.isArray(rows) ? rows : []).forEach(function(r){
        var clean = cleanLogEntry(r, false);
        if (!clean) return;
        var id = logIdentity(clean);
        if (seen[id]) return;
        seen[id] = 1;
        all.push(clean);
      });
    });
    all.sort(function(a, b){
      var byTime = (b.at || 0) - (a.at || 0);
      if (byTime) return byTime;
      var ai = logIdentity(a), bi = logIdentity(b);
      return ai < bi ? 1 : ai > bi ? -1 : 0;
    });
    return all.slice(0, limit);
  }
  function pendingLogRows(ds){
    return Object.keys(logOutbox).map(function(id){ return logOutbox[id]; })
      .filter(function(item){ return item && item.date === ds && item.entry; })
      .map(function(item){ return item.entry; });
  }
  function rememberLogRows(ds, rows){
    logCache[ds] = mergeLogRows([rows, logCache[ds], pendingLogRows(ds)], LOG_KEEP);
    writeLogStore(LOG_CACHE_KEY, logCache);
  }
  function persistLogOutboxItem(id, item){
    return !!cleanOutboxItem(id, item) && writeLogStore(LOG_OUTBOX_PREFIX + id, item);
  }
  function removeLogOutboxItem(id, expected){
    if (!expected || logOutbox[id] === expected){
      delete logOutbox[id];
      removeLogStore(LOG_OUTBOX_PREFIX + id);
    }
  }
  function warnLogPersistence(){
    setTimeout(function(){ toast('변경 내역을 이 기기에 저장하지 못했습니다'); }, 0);
  }
  function scheduleLogRetry(){
    if (logRetryTimer || !Object.keys(logOutbox).length || document.hidden || !online
        || logRetryAttempts >= 5) return;
    var wait = logRetryDelay;
    logRetryDelay = Math.min(logRetryDelay * 2, 60000);
    logRetryAttempts++;
    logRetryTimer = setTimeout(function(){
      logRetryTimer = null;
      flushLogOutbox();
    }, wait);
  }
  function wakeLogOutbox(){
    if (logRetryTimer){ clearTimeout(logRetryTimer); logRetryTimer = null; }
    logRetryDelay = 3000;
    logRetryAttempts = 0;
    flushLogOutbox();
  }
  function flushLogOutbox(){
    if (logFlushActive || !hasStore() || !fb().logSet) return;
    var ids = Object.keys(logOutbox);
    if (!ids.length) return;
    logFlushActive = true;
    var succeeded = 0;
    Promise.all(ids.map(function(id){
      var original = logOutbox[id];
      var item = cleanOutboxItem(id, original);
      var limit = shiftDate(bizDate(), -KEEP_DAYS);
      if (!item || item.date < limit){
        removeLogOutboxItem(id, original);
        return Promise.resolve();
      }
      return Promise.resolve().then(function(){
        return fb().logSet(item.date, id, item.entry);
      }).then(function(){
        removeLogOutboxItem(id, original);
        succeeded++;
      }).catch(function(){});
    })).then(function(){
      logFlushActive = false;
      if (succeeded){ logRetryDelay = 3000; logRetryAttempts = 0; }
      if (Object.keys(logOutbox).length) scheduleLogRetry();
    }).catch(function(){
      logFlushActive = false;
      scheduleLogRetry();
    });
  }
  function purgeOldLocalLogs(limit){
    var cacheChanged = false, outboxChanged = false;
    Object.keys(logCache).forEach(function(ds){
      if (!validLogDate(ds) || ds < limit || ds > bizDate()){
        delete logCache[ds]; cacheChanged = true;
      }
    });
    Object.keys(logOutbox).forEach(function(id){
      var item = logOutbox[id];
      if (!cleanOutboxItem(id, item) || item.date < limit){
        removeLogOutboxItem(id, item); outboxChanged = true;
      }
    });
    if (cacheChanged) writeLogStore(LOG_CACHE_KEY, logCache);
    if (outboxChanged) removeLogStore(LOG_OUTBOX_KEY);
  }

  function logAdd(kind, what){
    if (dayGap(viewDate) !== 0) return;      // 오늘 명단만 기록한다
    var d = new Date();
    var entry = cleanLogEntry({
      id: logEventId(),
      at: Date.now(),
      t: pad(d.getHours()) + ':' + pad(d.getMinutes()),
      k: kind,
      s: what || ''
    }, true);
    var item = { date: viewDate, entry: entry };
    logOutbox[entry.id] = item;
    var durable = persistLogOutboxItem(entry.id, item);
    if (!durable){
      removeLogStore(LOG_CACHE_KEY);             // 로그 캐시만 비워 공간을 만든 뒤 한 번 더
      durable = persistLogOutboxItem(entry.id, item);
    }
    rememberLogRows(viewDate, [entry]);
    if (!durable) warnLogPersistence();
    logRetryDelay = 3000;
    logRetryAttempts = 0;
    flushLogOutbox();
  }

  function logRows(fetched){
    return mergeLogRows([fetched, logCache[viewDate], pendingLogRows(viewDate)], LOG_SHOW);
  }

  function stopLogWatch(){
    logWatchSerial++;
    if (logUnwatch){
      try { logUnwatch(); } catch(e){}
      logUnwatch = null;
    }
  }
  function startLogWatch(forDate){
    stopLogWatch();
    if (!hasStore()) return;
    var api = fb();
    var serial = ++logWatchSerial;
    function apply(rows){
      if (serial !== logWatchSerial || viewDate !== forDate
          || sheetScrim.classList.contains('hide')
          || document.getElementById('sheetTitle').textContent !== '최근 변경 내역') return;
      rememberLogRows(forDate, rows || []);
      document.getElementById('sheetBody').innerHTML = logHtml(logRows(rows || []));
    }
    function failed(){
      if (serial === logWatchSerial && !sheetScrim.classList.contains('hide')){
        toast('변경 내역 동기화 실패 — 다시 연결되면 자동으로 재시도합니다');
      }
    }
    if (api.logWatch){
      try { logUnwatch = api.logWatch(forDate, apply, failed) || null; }
      catch(e){ failed(); }
      return;
    }
    if (api.logGet) api.logGet(forDate).then(apply).catch(failed);
  }

  window.addEventListener('storage', function(e){
    if (!e.key || e.key.indexOf(LOG_OUTBOX_PREFIX) !== 0) return;
    var id = e.key.slice(LOG_OUTBOX_PREFIX.length);
    if (!e.newValue){ delete logOutbox[id]; return; }
    var item = null;
    try { item = cleanOutboxItem(id, JSON.parse(e.newValue)); } catch(error){}
    if (!item){ removeLogStore(e.key); return; }
    logOutbox[id] = item;
    rememberLogRows(item.date, [item.entry]);
    wakeLogOutbox();
  });

  function logHtml(rows){
    if (!rows.length) return '<p class="lgempty">변경 내역이 없습니다.</p>';
    return rows.map(function(r){
      var cls = r.k === '방문' ? ' go'
              : (r.k === '취소' || r.k === '자동 취소' || r.k === '삭제' || r.k === '명단 초기화') ? ' off' : '';
      return '<div class="lgrow"><span class="lgt">' + esc(r.t) + '</span>'
        + '<span class="lgk' + cls + '">' + esc(r.k) + '</span>'
        + '<span class="lgs">' + esc(r.s || '') + '</span></div>';
    }).join('');
  }

  function toggle(id){
    var it = find(id);
    if (!it) return;
    setStatus(id, it.status === 'arrived' ? 'pending' : 'arrived');
  }
  // 바뀐 행과 그 시간대 머리글만 손본다. 요소를 새로 만들지 않고 내용만 고친다.
  // 실패하면 false 를 돌려주고 호출한 쪽이 통째로 다시 그린다.
  function patchStatus(it){
    var row = null, groups = document.querySelectorAll('.row');
    for (var i = 0; i < groups.length; i++){
      if (groups[i].getAttribute('data-id') === it.id){ row = groups[i]; break; }
    }
    if (!row) return false;

    row.className = 'row ' + it.status;
    var chk = row.querySelector('.check');
    if (chk) chk.innerHTML = it.status === 'arrived' ? ICON_GO
                           : it.status === 'cancelled' ? ICON_OFF : '';
    var stale = document.querySelectorAll('#list .menu');
    for (var si = 0; si < stale.length; si++){
      if (stale[si].parentNode) stale[si].parentNode.removeChild(stale[si]);
    }
    var info = row.querySelector('.info');
    var old = info.querySelector('.tag');
    if (old) old.parentNode.removeChild(old);
    var html = statusTag(it.status);
    if (html){
      var box = document.createElement('div');
      box.innerHTML = html;
      info.insertBefore(box.firstChild, info.querySelector('.pax'));
    }

    // 시간대 머리글 숫자
    var wrap = row.closest('.group');
    if (wrap && state){
      var mine = state.items.filter(function(x){ return x.time === it.time; });
      var came = mine.filter(function(x){ return x.status === 'arrived'; }).length;
      var off  = mine.filter(function(x){ return x.status === 'cancelled'; }).length;
      var pend = mine.length - came - off;
      var man = collapsed[it.time];
      if (man && man.done !== (pend === 0)) delete collapsed[it.time];
      var meta = wrap.querySelector('.gmeta');
      if (meta){
        meta.innerHTML = '<b>' + (came + off) + '/' + mine.length + '</b>'
          + '<span class="gbreak">방문 ' + came + (off ? ' · 취소 ' + off : '') + '</span>';
      }
      wrap.setAttribute('data-time', it.time);
    }
    repaintNow();
    paintHead();
    return true;
  }

  // 시간대 접기 / 펼치기
  function toggleSlot(time){
    if (pendingKeyboardEditClose) return;
    if (!state) return;
    var mine = state.items.filter(function(x){ return x.time === time; });
    if (!mine.length) return;
    var editDraft = null;
    var editedRow = editing && rowForId(editing);
    if (editedRow){
      editDraft = ['e-hour','e-min','e-name','e-pax','e-memo'].map(function(fieldId){
        var field = editedRow.querySelector('#' + fieldId);
        return field ? field.value : null;
      });
    }
    var wrap = document.querySelector('.group[data-time="' + time + '"]');
    var willShut = !(wrap && wrap.classList.contains('shut'));
    if (willShut){        // 접을 때는 그 시간대에서 열려 있던 수정 폼·메뉴를 닫는다
      var inHere = function(id){ return mine.some(function(x){ return x.id === id; }); };
      if (editing && inHere(editing)) editing = null;
      if (openMenu && inHere(openMenu)) openMenu = null;
    }
    openMenu = null;
    var pend = mine.filter(function(x){ return x.status === 'pending'; }).length;
    setCollapsed(time, willShut, pend === 0);
    render();
    if (editing && editDraft){
      var restoredRow = rowForId(editing);
      if (restoredRow){
        ['e-hour','e-min','e-name','e-pax','e-memo'].forEach(function(fieldId, index){
          var field = restoredRow.querySelector('#' + fieldId);
          if (field && editDraft[index] !== null) field.value = editDraft[index];
        });
      }
    }
    if (!willShut) scrollIntoRoom(document.querySelector('.group[data-time="' + time + '"]'));
  }

  // 「지금 시간대」가 어디인지 다시 계산해서 시간대 색과 왼쪽 막대를 맞춘다
  function repaintNow(){
    if (!state) return;
    var all = state.items.slice().sort(sortItems);
    var gs = [], gi = {};
    all.forEach(function(it){
      if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({ time: it.time, items: [] }); }
      gs[gi[it.time]].items.push(it);
    });
    var now = nowMin(), nowTime = null;
    if (dayGap(viewDate) === 0){
      for (var i = 0; i < gs.length; i++){
        if (!slotLive(gs[i].time, now)) continue;
        if (gs[i].items.some(function(x){ return x.status === 'pending'; })){ nowTime = gs[i].time; break; }
      }
    }
    gs.forEach(function(g){
      var w = document.querySelector('.group[data-time="' + g.time + '"]');
      if (!w) return;
      var pend = g.items.some(function(x){ return x.status === 'pending'; });
      var shut = w.classList.contains('shut');
      w.className = 'group' + (g.time === nowTime ? ' now' : (pend ? '' : ' done')) + (shut ? ' shut' : '');
    });
  }

  function setStatus(id, st, auto){
    var it = find(id);
    if (!it) return;
    if (it.status !== st){
      logAdd(auto ? '자동 취소'
           : st === 'arrived' ? '방문'
           : st === 'cancelled' ? '취소' : '체크 해제', it.time + ' ' + it.name);
    }
    it.status = st;
    it.ts = Date.now();
    keepSlotOpenForId(id);
    openMenu = null;
    var patched = patchStatus(it);
    if (!patched){
      if (interactionActive()) backgroundRenderPending = true;
      else render();
    } else if (backgroundRenderPending && !interactionActive()) render();
    save();
    if (st === 'arrived') toast(it.name + ' 방문 체크');
  }

  /* ---------- 명단 등록 ---------- */
  var badBox = document.getElementById('badBox');
  var hl = document.getElementById('hl');
  var taEl = document.getElementById('ta');
  var marking = false;   // 오류 표시 중인지

  function esc(t){
    return t.replace(/[<>&]/g, function(c){ return { '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]; });
  }
  // 입력칸 높이는 내용·키보드와 무관하게 한 번만 고정한다.
  // 원래 높이보다 43px 낮춰 등록 버튼과 보조 바 경계를 맞춘다.
  // 등록 버튼이 늘 같은 자리에 있고, 키보드가 올라올 자리도 남는다.
  // 넘치는 줄은 안에서 스크롤하고, 오류 표시 오버레이도 같이 따라가야 줄이 안 어긋난다.
  var taFixedH = 0;
  function pasteTextareaBaseHeight(vh){
    return Math.max(217, Math.min(Math.round(vh * 0.46) - 43, 377));
  }
  function taBaseHeight(){
    if (taFixedH) return taFixedH;
    var vh = window.innerHeight || 700;
    taFixedH = pasteTextareaBaseHeight(vh);
    return taFixedH;
  }
  function autoGrow(){
    var h = taBaseHeight();
    taEl.style.height = h + 'px';
    taEl.style.overflowY = (taEl.scrollHeight > h + 2) ? 'auto' : 'hidden';
    hl.scrollTop = taEl.scrollTop;
  }
  function clearBad(){
    marking = false;
    // 자리는 비워둔 채로. 오류 표시가 사라지며 버튼이 튀어오르면 고치는 중에 잘못 눌린다.
    badBox.classList.add('off');
    hl.innerHTML = '';
    syncLoop(false);
  }

  // 7) 아이폰은 관성 스크롤 중에 scroll 이벤트를 띄엄띄엄 준다.
  // 오류 표시가 켜져 있는 동안에는 매 프레임 입력칸 스크롤을 따라간다.
  var syncRaf = 0;
  function syncLoop(on){
    if (!on){ cancelAnimationFrame(syncRaf); syncRaf = 0; return; }
    if (syncRaf) return;
    (function step(){
      if (!marking){ syncRaf = 0; return; }
      if (hl.scrollTop !== taEl.scrollTop) hl.scrollTop = taEl.scrollTop;
      syncRaf = requestAnimationFrame(step);
    })();
  }
  // 지금 커서가 있는 줄 번호 (1부터)
  function caretLine(){
    var pos = taEl.selectionStart;
    if (pos === null || pos === undefined) return -1;
    return String(taEl.value).slice(0, pos).split(/\r?\n/).length;
  }
  function paintBad(bad, skipLine){
    var nos = {};
    bad.forEach(function(b){ if (b.no !== skipLine) nos[b.no] = true; });
    hl.innerHTML = String(taEl.value).split(/\r?\n/).map(function(line, i){
      var t = esc(line) || ' ';
      return '<span class="ln' + (nos[i+1] ? ' err' : '') + '">' + t + '</span>';
    }).join('');
    hl.scrollTop = taEl.scrollTop;   // 다시 그리면 스크롤이 풀린다 — 입력칸에 맞춘다
  }
  function showBad(bad){
    marking = true;
    paintBad(bad, -1);
    badBox.textContent = '표시된 줄을 양식에 맞게 고쳐 주세요';
    badBox.classList.remove('off', 'gone');
    syncLoop(true);
    autoGrow();

  // 우리가 이미 처리한 탭이므로 뒤따르는 click 은 버린다.
  function takeGhostClick(e){
    if (!ghostClick) return;
    if (Date.now() > ghostClick.until){ ghostClick = null; return; }
    if (Math.abs(e.clientX - ghostClick.x) > SLOP ||
        Math.abs(e.clientY - ghostClick.y) > SLOP) return;
    ghostClick = null;             // 같은 손가락에서 뒤따라온 click 한 번만 버린다

    if (Date.now() - t.at > HOLD) return;                                              // 오래 눌렀으면 취소

  (function swipeClose(){
    var x0 = 0, y0 = 0, dx = 0, w = 0, axis = null, dragging = false;
    drawer.addEventListener('touchstart', function(e){
      if (!drawer.classList.contains('open') || e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      dx = 0; axis = null; dragging = true; w = drawer.offsetWidth || 1;
      drawer.style.transition = 'none';
    }, { passive: true });
    drawer.addEventListener('touchmove', function(e){
      if (!dragging) return;
      var mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if (!axis){
        if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
        axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
        if (axis === 'y'){ endDrag(false); return; }
      }
      dx = Math.min(0, mx);                       // 오른쪽으로는 안 끌린다
      drawer.style.transform = 'translateX(' + dx + 'px)';
      drawerScrim.style.opacity = String(Math.max(0, 1 + dx / w));
    }, { passive: true });
    function endDrag(commit){
      dragging = false; axis = null;
      drawer.style.transition = '';
      if (commit) closeDrawer();
      drawer.style.transform = '';
      drawerScrim.style.opacity = '';
    }
    drawer.addEventListener('touchend', function(){
      if (dragging) endDrag(dx < -Math.min(70, w * 0.3));
    });
    drawer.addEventListener('touchcancel', function(){ if (dragging) endDrag(false); });
  })();

  function reportText(){
    if (!state || !state.items.length) return '';
    var prev = null, out = [];
    state.items.slice().sort(sortItems).forEach(function(it){
      if (prev !== null && it.time !== prev) out.push('');
      prev = it.time;
      var tail = it.status === 'arrived' ? ' 방문'
               : it.status === 'cancelled' ? ' 취소' : '';
      out.push(it.time + ' ' + it.name + ' ' + it.pax + '명' + tail);
    });
    return out.join('\n');
  }

  function fetchTag(){
    if (!window.fetch) return Promise.resolve(null);

        return r.headers.get('etag') || r.headers.get('last-modified') || null;

      .catch(function(){ return null; });
  }

  // 새로 불러도 잃을 게 없는 상태인가
  function safeToReload(){
    if (document.hidden || !online) return false;
    if (typingNow() || dirty || saving || openMenu) return false;
    if (Date.now() - lastTouchAt < 20000) return false;   // 방금 만졌으면 기다린다
    var busy = ['pastePanel', 'addPanel', 'panelScrim', 'sheetScrim', 'scrim'].some(function(id){
      var el = document.getElementById(id);
      return el && !el.classList.contains('hide');
    });
    if (busy) return false;
    if (drawer.classList.contains('open')) return false;
    if (!document.getElementById('searchbar').classList.contains('hide')) return false;
    return true;
  }

  function checkUpdate(){
    return fetchTag().then(function(tag){
      if (!tag) return false;
      if (!buildTag){ buildTag = tag; return false; }
      if (tag === buildTag) return false;
      if (!safeToReload()) return true;          // 새 판은 있는데 지금은 때가 아니다
      doReload();
      return true;
    });
  }
  fetchTag().then(function(tag){ buildTag = tag; });

  // 화면으로 돌아오면 한 번 확인 (실시간 수신은 watchRemote가 담당)
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) return;
    wakeLogOutbox();
    if (vv){
      // 키보드가 열린 채 복귀했을 수 있으므로 현재 높이로 다시 판정한다.
      // 줄어든 화면을 새 기준 높이로 저장하면 이후에도 키보드를 놓치게 된다.
      kbFit();
    } else {
      cancelKeyboardClose();
      keyboardOpen = false;
      keyboardBaseH = visibleViewportH();
      document.documentElement.style.setProperty('--kb', '0px');
      document.body.classList.remove('keyboard-bars-free');
      document.body.classList.remove('keyboard-open');
      addPanel.classList.remove('kb');
    }
    fitHeight();     // 화면 높이가 달라졌을 수 있다
    // 백그라운드에 있는 동안 날짜가 넘어갔을 수 있다.
    // 먼저 확인하지 않으면 어제 명단을 「오늘」로 띄운 채 체크하게 된다.
    if (rolloverIfNeeded()) return;
    if (!state) return;
    sync();          // 즉시 최신 상태 확인
    watchRemote();   // 백그라운드에서 끊겼을 수 있으니 실시간 수신도 다시 건다
    // 3초 안에 연결이 안 돌아오면 소켓을 강제로 다시 붙인다
    setTimeout(function(){
      if (!online && hasStore() && fb().reconnect){ fb().reconnect(); watchRemote(); }
    }, 3000);
  });

  // 영업일이 바뀌었으면 오늘로 옮겨가고 명단을 다시 불러온다.
  // 옮겨갔으면 true. (불러오는 중이라 호출한 쪽은 더 할 일이 없다)
  var lastBiz = bizDate();
  function rolloverIfNeeded(){
    var b = bizDate();
    if (b === lastBiz) return false;
    var wasToday = (viewDate === lastBiz);   // 오늘을 보고 있었나
    lastBiz = b;
    purgeOld();
    // 어제·내일을 일부러 보고 있었다면 그대로 둔다. 보던 화면을 뺏지 않는다.
    if (!wasToday){ renderDrawerDays(); renderWhenIdle(); return false; }
    viewDate = b;
    resetDateScopedUi();
    boot();
    // 하루가 바뀌는 이 순간이 화면을 새로 띄우기에 가장 안전하다.
    // 마침 누가 쓰고 있으면 미루고, 1분 간격으로 몇 번만 다시 본다.
    var tries = 0;
    (function attempt(){
      setTimeout(function(){
        checkUpdate().then(function(pending){
          if (pending && ++tries < 5) attempt();   // 새 판은 있는데 때가 아니었다
        });
      }, tries === 0 ? 1500 : 60000);
    })();
    return true;
  }

  // 시간대 자동 전환 + 날짜 넘어감 확인
  // 예약 시각에서 20분이 지나도 체크가 없으면 취소로 넘긴다.
  // 노쇼도 취소로 처리하는 운영이라 직원이 어차피 누를 것을 대신 눌러주는 셈이다.
  function autoCancel(){
    if (!state || dayGap(viewDate) !== 0) return false;   // 오늘 명단에서만
    var now = nowMin(), hit = [];
    state.items.forEach(function(it){
      if (it.status !== 'pending') return;
      var late = now - (slotMin(it.time) + AUTO_CANCEL_MIN);
      // 20분이 되는 그 순간에만 처리한다. 이미 지나간 시간대는 사람이 판단할 몫.
      // (저녁에 하루치 명단을 한꺼번에 넣어도 낮 시간대가 무더기로 취소되지 않는다)
      if (late >= 0 && late < AUTO_CANCEL_WINDOW) hit.push(it);
    });
    if (!hit.length) return false;
    hit.forEach(function(it){
      logAdd('자동 취소', it.time + ' ' + it.name);
      it.status = 'cancelled';
      it.ts = Date.now();
    });
    save();
    return true;
  }

  var lastPaint = '';
  setInterval(function(){
    if (editing || openMenu) return;
    if (rolloverIfNeeded()) return;
    var changed = autoCancel();
    // 화면에 나올 내용이 그대로면 다시 그리지 않는다 (시간대 표시는 분 단위면 충분하다)
    var sig = JSON.stringify(state) + '|' + viewDate + '|' + Math.floor(nowMin());
    if (!changed && sig === lastPaint) return;
    lastPaint = sig;
    render();
  }, 5000);

  // Firebase 모듈이 먼저 준비되면 바로, 아니면 준비 신호를 기다린다
  if (window.__fb) boot();
  else {
    window.addEventListener('fb-ready', boot, { once: true });
    setTimeout(function(){ if (!state) boot(); }, 4000);  // 로딩 실패 시에도 화면은 뜨게
  }
})();
</script>
