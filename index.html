    if (action === 'delete'){
      if (!canWrite()){ openMenu = null; closeRowMenu(); render(); return; }
      logAdd('삭제', it.time + ' ' + it.name);
      state.items = state.items.filter(function(x){ return x.id !== id; });

  function rowEl(it){

  // ⋯ 메뉴 (방문·취소·수정·삭제). rowEl 이 통째로 그릴 때도, tapMore 가 그 행에만 붙일 때도 쓴다.
  function buildMenu(id){
    var menu = document.createElement('div');
    menu.className = 'menu';
    function btn(label, action, status){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('data-list-action', action);
      if (status) b.setAttribute('data-status', status);
      if (action === 'delete') b.className = 'del';
      b.addEventListener('click', function(e){
        if (takeGhostClick(e)) return;
        e.stopPropagation();
        runMenuAction(id, action, status);
      });
      return b;
    }
    menu.appendChild(btn('방문', 'status', 'arrived'));
    menu.appendChild(btn('취소', 'status', 'cancelled'));
    menu.appendChild(btn('수정', 'edit'));
    menu.appendChild(btn('삭제', 'delete'));
    return menu;
  }
  // 열려 있는 ⋯ 메뉴 DOM 제거 (보통 하나지만 안전하게 전부)
  function closeRowMenu(){
    var ms = document.querySelectorAll('#list .menu');
    for (var i = 0; i < ms.length; i++) if (ms[i].parentNode) ms[i].parentNode.removeChild(ms[i]);
  }
  // 그 행에만 메뉴를 붙인다 (통째 render 안 함). 가려졌으면 같은 tick 에 스크롤 → 한 번에 나타남.
  function openRowMenu(id){
    closeRowMenu();
    var row = rowForId(id);
    if (!row){ render(); return; }   // 그 행이 DOM 에 없으면(접힌 시간대 등) 안전하게 통째로
    row.querySelector('.rbody').appendChild(buildMenu(id));
    // 아래로만 — 메뉴가 알약에 걸릴 때 행 상자(메뉴·밑 여백·구분선)가 보이는 만큼만. 위에 반쯤 가린 행은 메뉴가 그 아래 온전히 보이므로 안 움직인다(오너 2026-09-11: 최소 이동).
    roomScroll(row, true, true);
  }

  // "1530" "15:30" "15시30분" "15.30" → "15:30"
  function normTime(v){
    var s = String(v).replace(/\s/g,'');
    var m = s.match(/^(\d{1,2})[:.시]?(\d{1,2})?분?$/);
    if (!m) return null;
    var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (m[2] === undefined && s.length === 4){ h = +s.slice(0,2); mi = +s.slice(2); }
    if (h > 23 || mi > 59) return null;
    return pad(h) + ':' + pad(mi);
  }

  function uniqueId(time, name, pax, skipId){
    var base = time + '|' + name + '|' + pax, n = 0, id;
    do { n++; id = base + '|' + n; }
    while (state.items.some(function(x){ return x.id === id && x.id !== skipId; }));
    return id;
  }

  // 명단 맨 뒤로 보낼 때 쓸 다음 순번
  function nextSeq(){
    var m = 0;
    state.items.forEach(function(x){ if ((x.seq || 0) > m) m = x.seq || 0; });
    return m + 1;
  }

  // 돌려주는 값: 창을 닫아도 되면 true (저장·변경 없음·이미 사라진 예약), 입력을 고쳐야 하면 false
  function applyEdit(id, timeV, nameV, paxV, memoV){
    var it = find(id);
    if (!it){ toast('이미 삭제된 예약입니다'); return true; }
    var originalTime = it.time;
    var time = normTime(timeV);
    var name = String(nameV).replace(/\s+/g,' ').trim();
    var pax = parseInt(paxV, 10);
    if (!time){ toast('시간을 확인해 주세요'); return false; }
    if (!name){ toast('이름을 입력해 주세요'); return false; }
    if (!(pax > 0)){ toast('인원을 확인해 주세요'); return false; }

    var memo = String(memoV == null ? (it.memo || '') : memoV).replace(/\s+/g,' ').trim();

    if (time === it.time && name === it.name && pax === it.pax && memo === (it.memo || '')) return true;   // 바뀐 게 없다

    // 시간이 바뀌면 옮겨간 시간대의 맨 뒤로
    var timeMoved = time !== it.time;
    if (timeMoved) it.seq = nextSeq();

    var memoOnly = (time === it.time && name === it.name && pax === it.pax);
    logAdd(memoOnly ? '메모' : '수정',
      memoOnly ? (it.time + ' ' + it.name + (memo ? ' · ' + memo : ' · 메모 지움'))
               : (it.time + ' ' + it.name + ' → ' + time + ' ' + name + ' ' + pax + '명'));
    var oldId = it.id;
    it.time = time; it.name = name; it.pax = pax; it.memo = memo;
    it.id = uniqueId(time, name, pax, id);
    it.ts = stampTs(it);
    // 시각을 옮겼으면 «지켜본 적 있나»를 다시 판단한다. 지난 시각으로 옮기면 사람 몫이 되고,
    // 미래로 옮기면 다시 앱 몫이다 — 안 지우면 한 번 붙은 면제가 영영 남는다.
    if (timeMoved){ if (lateEntry(time, nowMin())) it.noAuto = 1; else delete it.noAuto; }
    touched[originalTime] = serverNow();
    touched[time] = serverNow();
    armSlotCollapse(originalTime);
    if (timeMoved) armSlotCollapse(time);
    state.items.sort(sortItems);
    render();
    if (timeMoved) revealAfterClose(it.id);   // 자리가 달라졌으니 시트가 걷힌 뒤 그 행을 보여준다
    if (it.id === oldId) writeItem(oldId, { memo: it.memo, ts: it.ts });   // 메모만 바뀜 (id 유지)
    else wqBatch(function(){ delItem(oldId); putItem(it); });              // 시각·이름·인원 바뀜 = 다른 노드 (둘을 한 번에)
    toast(it.time + ' ' + it.name + ' 수정됨');
    return true;
  }

  function find(id){
    for (var i=0;i<state.items.length;i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  // 변경 내역 — 무슨 일이 있었는지만 남긴다 (되돌리기는 없다)
  var LOG_SHOW = 10;
  var LOG_KEEP = 40;
  var LOG_SCOPE = IS_DEV ? 'dev' : 'prod';
  var LOG_CACHE_KEY = 'ix-log-cache-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_KEY = 'ix-log-outbox-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_PREFIX = LOG_OUTBOX_KEY + ':';
  var LOG_ID_PATTERN = /^[A-Za-z0-9_-]{8,80}$/;

  function readLogStore(key){
    try {
      var value = JSON.parse(localStorage.getItem(key) || '{}');
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    } catch(e){ return {}; }
  }
  function writeLogStore(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  function removeLogStore(key){
    try { localStorage.removeItem(key); return true; }
    catch(e){ return false; }
  }
  function validLogDate(ds){
    var m = String(ds || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return false;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
  }
  function cleanLogEntry(r, requireId){
    if (!r || typeof r !== 'object') return null;
    var at = Number(r.at);
    if (!isFinite(at) || at <= 0 || typeof r.t !== 'string' || typeof r.k !== 'string') return null;
    var id = r.id == null || r.id === '' ? '' : String(r.id);
    if ((requireId && !id) || (id && !LOG_ID_PATTERN.test(id))) return null;
    var clean = {
      at: at,
      t: r.t.slice(0, 16),
      k: r.k.slice(0, 40),
      s: (r.s == null ? '' : String(r.s)).slice(0, 500)
    };
    if (id) clean.id = id;
    return clean;
  }
  function cleanOutboxItem(id, item){
    // 변경 내역은 오늘 것만 유지 → 어제 이전으로 밀린 로그는 버린다 (어차피 화면에 안 뜸).
    if (!LOG_ID_PATTERN.test(id) || !item || !validLogDate(item.date) || item.date !== bizDate()) return null;
    var entry = cleanLogEntry(item.entry, true);
    if (!entry || entry.id !== id) return null;
    return { date: item.date, entry: entry };
  }
  function readLogOutbox(){
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++){
        var key = localStorage.key(i);
        if (!key || key.indexOf(LOG_OUTBOX_PREFIX) !== 0) continue;
        var id = key.slice(LOG_OUTBOX_PREFIX.length), item = null;
        try { item = cleanOutboxItem(id, JSON.parse(localStorage.getItem(key) || 'null')); } catch(e){}
        if (item) out[id] = item;
        else if (removeLogStore(key)) i--;
      }
    } catch(e){}
    return out;
  }
  function cleanLogCache(raw){
    var out = {};
    Object.keys(raw || {}).forEach(function(ds){
      if (!validLogDate(ds)) return;
      var rows = mergeLogRows([raw[ds]], LOG_KEEP);
      if (rows.length) out[ds] = rows;
    });
    return out;
  }

  var logCache = cleanLogCache(readLogStore(LOG_CACHE_KEY));
  var logOutbox = readLogOutbox();
  var logFlushActive = false;
  var logRetryTimer = null;
  var logRetryDelay = 3000;
  var logRetryAttempts = 0;
  var logUnwatch = null;
  var logWatchSerial = 0;

  function logEventId(){
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch(e){}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)
      + '-' + Math.random().toString(36).slice(2, 8);
  }
  // 같은 실제 이벤트(예: 한 예약의 자동 취소)를 여러 기기가 각각 기록해도 한 줄이 되도록,
  // 그 이벤트를 규정하는 문자열에서 결정적인 id 를 만든다. 두 기기가 같은 id 로 write → 덮임.
  function logKeyId(keyStr){
    var a = 5381, b = 52711;
    for (var i = 0; i < keyStr.length; i++){
      var c = keyStr.charCodeAt(i);
      a = (Math.imul(a, 33) ^ c) >>> 0;
      b = (Math.imul(b, 63689) ^ c) >>> 0;
    }
    function f(n){ return ('0000000' + n.toString(36)).slice(-7); }
    return 'ev' + f(a) + f(b);                 // 16자, LOG_ID_PATTERN 통과
  }
  function logIdentity(r){
    return r && r.id ? 'id:' + r.id
      : 'legacy:' + ((r && r.at) || 0) + '|' + ((r && r.k) || '') + '|' + ((r && r.s) || '');
  }
  function mergeLogRows(groups, limit){
    var seen = {}, all = [];
    (groups || []).forEach(function(rows){
      (Array.isArray(rows) ? rows : []).forEach(function(r){
        var clean = cleanLogEntry(r, false);
        if (!clean) return;
        var id = logIdentity(clean);
        if (seen[id]) return;
        seen[id] = 1;
        all.push(clean);
      });
    });
    all.sort(function(a, b){
      var byTime = (b.at || 0) - (a.at || 0);
      if (byTime) return byTime;
      var ai = logIdentity(a), bi = logIdentity(b);
      return ai < bi ? 1 : ai > bi ? -1 : 0;
    });
    return all.slice(0, limit);
  }
  function pendingLogRows(ds){
    return Object.keys(logOutbox).map(function(id){ return logOutbox[id]; })
      .filter(function(item){ return item && item.date === ds && item.entry; })
      .map(function(item){ return item.entry; });
  }
  function rememberLogRows(ds, rows){
    logCache[ds] = mergeLogRows([rows, logCache[ds], pendingLogRows(ds)], LOG_KEEP);
    writeLogStore(LOG_CACHE_KEY, logCache);
  }
  function persistLogOutboxItem(id, item){
    return !!cleanOutboxItem(id, item) && writeLogStore(LOG_OUTBOX_PREFIX + id, item);
  }
  function removeLogOutboxItem(id, expected){
    if (!expected || logOutbox[id] === expected){
      delete logOutbox[id];
      removeLogStore(LOG_OUTBOX_PREFIX + id);
    }
  }
  function warnLogPersistence(){
    setTimeout(function(){ toast('변경 내역 저장 실패 — 다시 시도합니다'); }, 0);
  }
  function scheduleLogRetry(){
    if (logRetryTimer || !Object.keys(logOutbox).length || document.hidden || !online
        || logRetryAttempts >= 5) return;
    var wait = logRetryDelay;
    logRetryDelay = Math.min(logRetryDelay * 2, 60000);
    logRetryAttempts++;
    logRetryTimer = setTimeout(function(){
      logRetryTimer = null;
      flushLogOutbox();
    }, wait);
  }
  function wakeLogOutbox(){
    if (logRetryTimer){ clearTimeout(logRetryTimer); logRetryTimer = null; }
    logRetryDelay = 3000;
    logRetryAttempts = 0;
    flushLogOutbox();
  }
  function flushLogOutbox(){
    if (logFlushActive || !hasStore() || !fb().logSet) return;
    var ids = Object.keys(logOutbox);
    if (!ids.length) return;
    logFlushActive = true;
    var succeeded = 0;
    Promise.all(ids.map(function(id){
      var original = logOutbox[id];
      var item = cleanOutboxItem(id, original);   // 오늘 것이 아니면 null
      if (!item){
        removeLogOutboxItem(id, original);
        return Promise.resolve();
      }
      return Promise.resolve().then(function(){
        return fb().logSet(item.date, id, item.entry);
      }).then(function(){
        removeLogOutboxItem(id, original);
        succeeded++;
      }).catch(function(){});
    })).then(function(){
      logFlushActive = false;
      if (succeeded){ logRetryDelay = 3000; logRetryAttempts = 0; }
      if (Object.keys(logOutbox).length) scheduleLogRetry();
    }).catch(function(){
      logFlushActive = false;
      scheduleLogRetry();
    });
  }
  function purgeOldLocalLogs(limit){
    var cacheChanged = false;
    Object.keys(logCache).forEach(function(ds){
      if (!validLogDate(ds) || ds < limit || ds > bizDate()){
        delete logCache[ds]; cacheChanged = true;
      }
    });
    Object.keys(logOutbox).forEach(function(id){
      var item = logOutbox[id];
      if (!cleanOutboxItem(id, item) || item.date < limit){
        removeLogOutboxItem(id, item);   // 개별 키 삭제까지 여기서 처리
      }
    });
    if (cacheChanged) writeLogStore(LOG_CACHE_KEY, logCache);
  }

  // key 를 주면 그 이벤트의 id 가 결정적이 된다 (여러 기기의 중복 기록이 한 줄로 합쳐짐).
  // 안 주면 랜덤 id — 동시 중복이 있을 수 없는 이벤트(예약 추가·삭제·메모·명단 등록 등)용.
  function logAdd(kind, what, key){
    var sn = serverNow(), p = kstParts(sn);   // 서버 시계 — 폰마다 시각이 달라도 로그 순서·표시 일관
    var entry = cleanLogEntry({
      id: key ? logKeyId(key) : logEventId(),
      at: sn,
      t: pad(p.h) + ':' + pad(p.min),
      k: kind,
      s: what || ''
    }, true);
    var item = { date: viewDate, entry: entry };
    logOutbox[entry.id] = item;
    var durable = persistLogOutboxItem(entry.id, item);
    if (!durable){

    logRetryAttempts = 0;
    flushLogOutbox();
  }

  function logRows(fetched, limit){

  }
  /* 같은 사람·같은 종류가 잇달아 찍힌 것은 «보여 줄 때» 한 줄로 합친다 (최신 것만 남긴다).
     ★쓸 때도 2분 «칸»으로 묶고는 있지만, 그 칸의 경계가 «홀수 분 정각»에 고정돼 있어서
       30초 차로 눌러도 칸을 걸치면 줄이 갈렸다 — 10:38 과 10:39 에 각각 「방문·체크 해제」가
       쌓인 것이 그 경우다(오너 2026-09-21). 두 직원이 2초 차로 같은 행을 눌러도 같은 일이 난다.
     ★서버 기록은 손대지 않는다. 지우는 게 아니라 «겹쳐 보이는 것만» 접는 것이라,
       「18시에 왔다가 21시에 다시 체크」 같은 이력은 창(2분) 밖이면 그대로 두 줄로 남는다.
     ★합친 뒤에 LOG_SHOW 로 자른다 — 먼저 자르면 연타한 줄이 열 칸을 다 먹어 옛 사건이 밀려난다. */
  var LOG_SAME_MS = 120000;
  function dedupeLogRows(rows){
    var out = [], last = {};
    (rows || []).forEach(function(r){          // rows 는 최신순

      if (prev && Math.abs((prev.at || 0) - (r.at || 0)) <= LOG_SAME_MS) return;
      last[k] = r;
      out.push(r);

    return out;

  function stopLogWatch(){

    }
  }
  function startLogWatch(forDate){
    stopLogWatch();

    var api = fb();
    var serial = ++logWatchSerial;
    function apply(rows){
      if (serial !== logWatchSerial || viewDate !== forDate
          || sheetScrim.classList.contains('hide') || !recTitled()) return;
      rememberLogRows(forDate, rows || []);
      recRefresh();   // 시트를 통째 다시 그리지 않는다 — 세그먼트가 새로 태어나면 썸이 «미끄러지지» 않는다
    }
    function failed(){
      if (serial === logWatchSerial && !sheetScrim.classList.contains('hide')){
        // 끊긴 것은 「연결 안 됨」 표시가 이미 말하고 있다 — 같은 조건을 두 번 말하지 않는다.
        // (변경 내역은 끊겨도 로컬 것을 보여주므로 여기서 조용히 멈추는 게 맞다. 2026-09-15)

    var item = null;
    try { item = cleanOutboxItem(id, JSON.parse(e.newValue)); } catch(error){}

  // 「16:00 정약용」처럼 변경 내용 앞엔 예약 시각이 붙는다. 그 시각만 떼어 본다(없으면 null).
  function logSlotOf(r){
    var m = /^(\d{1,2}:\d{2})\s+(.+)$/.exec(r && r.s || '');
    return m ? { slot: m[1], rest: m[2] } : null;
  }
  /* 한 순간에 무더기로 일어난 일은 «한 줄»로 접는다.
     시간대가 지나면 남은 팀이 전부 «동시에» 자동 취소되는데, 그게 열 줄로 펴지면
     기록 화면이 통째로 그 한 사건으로 덮인다 — 실제로 10줄 중 7줄이 16:15 자동 취소였다
     (오너 2026-09-20 「정보가 너무 많다」). 한 사건은 한 줄이라야 옆의 방문·추가가 보인다.
     접는 조건은 «셋이 모두 같을 때»뿐이다: 일어난 시각 · 종류 · 대상 예약의 시간대.
     하나라도 다르면 각자 선다 — 접느라 사실을 뭉개지 않는다. */
  function foldLogRows(rows){
    var out = [];
    (rows || []).forEach(function(r){
      var p = logSlotOf(r), last = out[out.length - 1];
      if (last && p && last.slot && last.k === r.k && last.t === r.t && last.slot === p.slot){
        // ★같은 이름은 두 번 담지 않는다. 같은 분(t 는 HH:MM)에 같은 사람·같은 종류가 두 번 찍히면
        //   「임동현 · 임동현」이 됐다. 지금은 앞단 dedupeLogRows 가 걸러 내지만, 그 창을 줄이거나
        //   끄면 바로 드러나는 자리라 여기서도 막아 둔다.
        if (last.names.indexOf(p.rest) < 0) last.names.push(p.rest);
        return;
      }
      out.push({ at: r.at || 0, t: r.t, k: r.k, slot: p ? p.slot : '', names: [p ? p.rest : (r.s || '')] });

  // 접힌 무더기 한 줄. 이름은 둘까지만 쓰고 나머지는 수로 — 줄이 길어지면 접은 뜻이 없다.
  // 줄 모양은 원래 「최근 변경 내역」 그대로다 — 시각 · 종류(굵게·상태색) · 내용(흐리게).
  // 달라진 건 «무더기를 한 줄로 접는다»는 것뿐(foldLogRows).
  function logRowHtml(g){

    var rest = g.names.length - 2;
    var body = (g.slot ? g.slot + ' ' : '') + g.names.slice(0, 2).join(' · ')
             + (rest > 0 ? ' 외 ' + rest + '팀' : '');
    return '<div class="lgrow"><span class="lgt">' + esc(g.t) + '</span>'
      + '<span class="lgk' + cls + '">' + esc(g.k) + '</span>'

  }

  function toggle(id){

  // 채워진 원을 LEAVE_MS 동안 보여준 뒤 흐려지며 빠진다. 그 사이 다시 누르면(체크 해제) 그대로 남는다.
  /* CSS 의 시간 토큰을 JS 가 «읽어서» 쓴다. 예전엔 210·130 처럼 베껴 적어 뒀는데,

     (행이 덜 사라진 채 지워지거나, 잠금 화면이 번쩍인다). 값을 두 군데 적지 않는다. +10 은 전환이
     확실히 끝난 뒤를 잡기 위한 여유 한 프레임 — 그 의도가 숫자에 드러나게 남겨 둔다. (2026-09-21) */
  var MS = (function(){

      if (!isFinite(n)) return dflt;
      return t.slice(-2) === 'ms' ? n : n * 1000;   // '.2s' → 200 · '1000ms' → 1000
    }
    return { move: v('--tMove', 200), press: v('--tPress', 120), state: v('--tState', 150) };
  })();
  var LEAVE_MS = 2500;   // 900 → 1300 → 3000 → 2500 (오너 2026-09-20). 흐려지는 0.2초를 더해 눈에서 사라지기까지 2.7초
  function cancelLeave(id){
    if (leaveTimers[id]){ clearTimeout(leaveTimers[id]); delete leaveTimers[id]; }
    delete leavingNow[id];
    var row = rowForId(id);
    if (row && row.style.height) row.style.height = '';   // 접다 말고 되살아난 행 (체크 해제)
  }

  function scheduleLeave(id){
    cancelLeave(id);
    leaveTimers[id] = setTimeout(function(){
      if (viewMode !== 'pending'){ cancelLeave(id); return; }   // 그새 「전체」로 갔으면 남는다
      leavingNow[id] = true;
      var row = rowForId(id);
      if (row){
        // 지금 높이를 «픽셀로» 박아 둔 뒤에야 0 으로 가는 것이 전환이 된다 (auto → 0 은 전환이 안 걸린다).

        row.style.height = '0px';              // 흐려짐과 «같은» 0.2초 동안 칸이 닫힌다
      }

  }

  function patchStatus(it){

    if (chk){

      chk.classList.remove('pop');

  function esc(t){

  // 표시 중일 때는 입력할 때마다 다시 검사한다.
  // 그 줄이 실제로 양식에 맞아야만 빨간 표시가 사라진다 —
  // 커서가 있는 줄이라고 봐주지 않는다. (오타를 다 고쳐야 지워진다)
  var recheckTimer = null;
  function recheck(){
    if (!marking) return;
    var bad = parse(taEl.value).bad;
    if (!bad.length){ clearBad(); return; }
    paintBad(bad, -1);
  }
  taEl.addEventListener('input', function(){
    fixTaHeight();
    renderHl();                      // 비었으면 예시, 내용 있으면 지움
    clearTimeout(recheckTimer);
    recheckTimer = setTimeout(recheck, 180);
  });
  // 붙여넣은 자리에 커서를 그대로 둔다. 화면(페이지)은 움직이지 않는다.
  taEl.addEventListener('paste', function(){
    setTimeout(function(){
      fixTaHeight();
      renderHl();
      syncHl();
    }, 0);
  });
  taEl.addEventListener('blur', function(){
    clearTimeout(recheckTimer);
    recheck();
  });

  function applyPaste(text){
    // 끊긴 동안엔 등록하지 않는다 — 이건 «서버 명단을 이걸로 바꿔라» 라서, 서버에 무엇이
    // 있는지 모르는 상태로 보내면 남의 명단을 지운다. 낱개 변경과 달리 합칠 수가 없다.
    // connReady 가 아니라 canWrite 를 본다 — ① listKnown 까지 봐야 «온라인인데 명단을 아직
    // 못 받은» 경우가 막힌다. 지금은 붙여넣기 창이 그 상태에서 열리지 않지만, 진입점이 하나
    // 늘면 그때 구멍이 된다. 쓰기는 예외 없이 canWrite 하나로 판단한다.
    if (!canWrite()) return false;
    var fresh = parse(text);
    if (fresh.bad.length){ showBad(fresh.bad); return false; }
    clearBad();
    if (!fresh.length){ toast('등록할 예약이 없습니다'); return false; }
    logAdd('명단 등록', fresh.length + '건');
    var ts = serverNow(), nm = nowMin();   // 통째 교체 — 앞 값이 없는 새 항목들이다
    fresh.forEach(function(it){
      it.ts = ts;
      if (lateEntry(it.time, nm)) it.noAuto = 1;   // 등록할 때 이미 지나 있던 것 → 사람 몫
    });
    state = { date: viewDate, items: fresh.sort(sortItems) };
    render();
    replaceItems(state.items);   // items 서브트리 통째 교체
    toast('명단 등록됨 · ' + fresh.length + '건');
    return true;
  }

  /* ---------- UI 연결 ---------- */
  var panel = document.getElementById('pastePanel');
  var panelScrim = document.getElementById('panelScrim');
  // 예약 추가 막을 탭했을 때: 키보드가 떠 있었으면 「키보드 닫기」로만 쓰고 창은 안 닫는다.
  // 한 번의 헛터치로 쓰던 내용이 날아가지 않게 — 창을 닫으려면 키보드 내려간 뒤 한 번 더
  // 누르거나 「취소」. 키보드 여부는 touchstart 에서 미리 잡는다: iOS 는 click 이 오기 전에
  // 이미 입력칸을 blur 시켜 키보드를 내리므로, click 시점의 activeElement 로는 판별 못 한다.
  var scrimTapHadKb = false;
  panelScrim.addEventListener('touchstart', function(){
    scrimTapHadKb = document.body.classList.contains('keyboard-open');
  }, { passive: true });
  panelScrim.addEventListener('click', function(){
    var ap = document.getElementById('addPanel');
    if (ap.classList.contains('hide')) return;
    var hadKb = scrimTapHadKb || document.body.classList.contains('keyboard-open');
    scrimTapHadKb = false;
    if (hadKb) return;                 // 이 탭은 키보드만 내렸다 — 창은 그대로
    // 데스크톱 등 포커스가 유지되는 환경: 입력칸이 아직 살아 있으면 그것부터 푼다
    var a = document.activeElement;
    if (a && ap.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')){ a.blur(); return; }
    closeAdd();
  });
  // 예약 추가 창이 떠 있는 동안 손가락 끌기를 막는다.
  //   아이폰은 키보드가 올라와 있으면 「화면 자체」를 위아래로 끌 수 있게 해 준다.
  //   이건 페이지 스크롤이 아니라 브라우저가 자기 창을 옮기는 것이라 overflow 로는 안 막힌다.
  //   남은 수단은 touchmove 를 직접 취소하는 것뿐이다(passive:false 여야 취소된다).
  //   단, 창 안에 진짜로 스크롤돼야 하는 칸이 있으면 그건 살려 둔다.
  document.addEventListener('touchmove', function(e){
    var ap = document.getElementById('addPanel');
    if (!ap || ap.classList.contains('hide')) return;
    for (var n = e.target; n && n !== document.body; n = n.parentElement){
      var oy = getComputedStyle(n).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 1) return;
    }
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  // 명단이 비었을 때의 전체 화면 폼. 한 건 추가는 「예약 추가」 폼이 맡는다.
  function openPaste(silent){
    // 명단이 아예 없을 땐 돌아갈 화면이 없으므로 취소 버튼을 숨긴다
    var hasItems = !!(state && state.items && state.items.length);
    document.getElementById('cancelPaste').classList.toggle('hide', !hasItems);
    taEl.value = '';
    taFixedH = 0;                 // 창을 열 때 한 번만 계산
    clearBad();
    fixTaHeight();
    panel.classList.remove('hide');
    document.body.classList.add('paste-open');
    if (silent) return;
    // .wrap 을 카드로 부드럽게 스크롤 → 키보드가 올라와도 iOS 가 이어서 자연스럽게 조정
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(function(){ taEl.focus(); }, 200);
  }
  function closePaste(){
    // 입력칸을 «보이는 동안» 손으로 푼다. 숨기기(.hide = display:none)만 해도 크롬은 blur·
    // focusout 을 띄우는 걸 확인했지만(2026-09-16), 이 앱이 실제로 도는 건 iOS 웹킷이고
    // 여기 걸린 focusout → remeasureViewport 가 못 돌면 --kb 와 .keyboard-open 이 키보드
    // 높이째 남아 하단 바가 사라진 채 목록 아래가 빈다. 엔진 차이에 기대지 않고 순서를 정해 둔다.
    if (document.activeElement === taEl) taEl.blur();
    panel.classList.add('hide');
    document.body.classList.remove('paste-open');
    if (wrapEl) wrapEl.scrollTop = 0;
  }

  /* ---------- 예약 추가 ---------- */
  var addPanel = document.getElementById('addPanel');
  var aHour = document.getElementById('a-hour');
  var aMin  = document.getElementById('a-min');
  var aName = document.getElementById('a-name');
  var aPax  = document.getElementById('a-pax');
  var aMemo = document.getElementById('a-memo');

  var addTitle = document.getElementById('addTitle');
  var addOkBtn = document.getElementById('addOk');
  // 같은 시트를 「예약 추가」와 「예약 수정」이 같이 쓴다. 수정 중이면 그 예약 id.
  var sheetEditId = null;
  // 선택지는 열 때마다 새로 채운다 — 수정에서 끼워 넣은 비표준 값(영업시간 밖·5분 단위 아님·13명+)이
  // 다음 「추가」에 남지 않게.
  function fillAddOpts(){
    aHour.innerHTML = hourOptions();
    var m = '';
    for (var j = 0; j < 60; j += 5) m += '<option value="' + pad(j) + '">' + pad(j) + '</option>';
    aMin.innerHTML = m;
    var pp = '';
    for (var k = 1; k <= 12; k++) pp += '<option value="' + k + '">' + k + '명</option>';
    aPax.innerHTML = pp;
  }
  fillAddOpts();
  function ensureOpt(sel, v, label, atEnd){
    if ([].some.call(sel.options, function(o){ return o.value === String(v); })) return;
    var o = document.createElement('option');
    o.value = v; o.textContent = label || v;
    if (atEnd) sel.appendChild(o); else sel.insertBefore(o, sel.firstChild);
  }

  function openEdit(id){
    var it = find(id);
    if (!it) return;
    if (!panel.classList.contains('hide')) closePaste();
    fillAddOpts();
    var h = it.time.slice(0,2), m = it.time.slice(3,5);
    ensureOpt(aHour, h); ensureOpt(aMin, m);
    if (it.pax > 12) ensureOpt(aPax, it.pax, it.pax + '명', true);
    aHour.value = h; aMin.value = m; aPax.value = String(it.pax);
    aName.value = it.name; aMemo.value = it.memo || '';
    sheetEditId = id;
    addTitle.textContent = '예약 수정';
    addOkBtn.textContent = '저장';
    addPanel.classList.remove('hide');
    panelScrim.classList.remove('hide');
    backOpen('add', hideAdd);
  }

  // ★끊기면 «명단을 바꾸는 행위»는 전부 막는다 — 체크·추가·수정·삭제·등록·초기화 모두.
  //   허용되는 건 명단을 안 바꾸는 것뿐이다: 보기·검색·전체/대기·접기·복사·테마·룰렛·FAQ.
  //   판단 근거(오너 2026-09-15): 한국에서 끊길 일이 드물어 막는 값이 거의 0인데, 열어 두면
  //   폰마다 다른 명단을 들고 일하는 시간이 생긴다. 체크도 겹치면 이기고 지는 판정이 필요한데
  //   그 판정 기준(ts)이 폰 시계라 시계가 틀어진 폰이 이길 수 있다.
  //   ★같이 멈춰야 하는 것 — 자동 취소(autoCancel). 체크를 막아 둔 채 자동 취소만 돌면
  //     «끊겨서 체크를 못 한 사이 15분이 지나» 실제로 온 손님이 취소로 찍힌다.
  //     AUTO_CANCEL_WINDOW 창을 건너뛰면 뒤늦게 훑지 않는다 — 예약은 대기로 남고
  //     연결된 뒤 직원이 체크하면 된다.
  //   listKnown 도 여전히 필요하다: 명단을 본 적 없으면 무엇이 있는지 모른다.
  function canWrite(){
    if (!listKnown){ toast(navigator.onLine === false ? MSG_OFF : '명단을 아직 불러오지 못했습니다'); return false; }
    if (!connReady()){ toast(MSG_OFF); return false; }
    return true;
  }
  function openAdd(){
    if (!canWrite()) return;
    if (!panel.classList.contains('hide')) closePaste();
    fillAddOpts();
    sheetEditId = null;
    addTitle.textContent = '예약 추가';
    addOkBtn.textContent = '추가';
    // 기본값 — 정각 기준. 상단 시간이 넘어가는 규칙(정각 11분)과 같이 움직인다. (KST · 서버 시계)
    var p = nowParts(), hh = p.h;
    if (p.min >= GRACE_ON_HOUR) hh += 1;
    if (hh < HOUR_MIN) hh = HOUR_MIN;
    if (hh > HOUR_MAX) hh = HOUR_MAX;
    aHour.value = pad(hh); aMin.value = '00';
    aName.value = ''; aMemo.value = ''; aPax.value = '2';
    addPanel.classList.remove('hide');
    panelScrim.classList.remove('hide');
    backOpen('add', hideAdd);
    // 자동 포커스 안 함 — 수정 폼과 동일하게. (iOS 는 어차피 프로그램 포커스로 키보드를 안 올림)
  }
  function hideAdd(){
    addPanel.classList.add('hide');
    panelScrim.classList.add('hide');   // 막은 이 시트 전용 — 조건 없이 걷는다(붙여넣기 카드가 켜져 있으면 막이 남아 갇히던 버그, 2026-09-12)
    sheetEditId = null;
  }
  function closeAdd(){ hideAdd(); backDone(); }

  function addOne(){
    if (sheetEditId){                 // 수정 모드 — 입력이 틀렸으면 창을 그대로 둔다
      var eid = sheetEditId;
      if (applyEdit(eid, aHour.value + ':' + aMin.value, aName.value, aPax.value, aMemo.value)) closeAdd();
      return;
    }
    var name = aName.value.replace(/\s+/g,' ').trim();
    if (!name){ toast('이름을 입력해 주세요'); aName.focus(); return; }
    var time = aHour.value + ':' + aMin.value;
    var pax = parseInt(aPax.value, 10);
    var memo = aMemo.value.replace(/\s+/g,' ').trim();
    if (!state) state = { date: viewDate, items: [] };
    var item = {
      id: uniqueId(time, name, pax), time: time, name: name, pax: pax,
      memo: memo, status: 'pending', ts: serverNow(), seq: nextSeq()   // 새 항목 — 앞 값 없음
    };
    if (lateEntry(time, nowMin())) item.noAuto = 1;   // 이미 지난 시각으로 넣은 예약 → 사람 몫
    state.items.push(item);
    state.items.sort(sortItems);
    logAdd('추가', time + ' ' + name + ' ' + pax + '명');
    delete collapsed[time];        // 방금 넣은 예약은 보이게
    closeAdd();
    render();
    putItem(item);                 // 새 예약 노드 하나 추가
    toast(time + ' ' + name + ' 추가됨');
  }
  document.getElementById('addOk').addEventListener('click', addOne);
  document.getElementById('addNo').addEventListener('click', closeAdd);
  aName.addEventListener('keydown', function(e){ if (e.key === 'Enter') aMemo.focus(); });
  aMemo.addEventListener('keydown', function(e){ if (e.key === 'Enter') addOne(); });

  /* ---------- 키보드 ---------- */
  // body 는 화면 전체 크기로 고정 (CSS position:fixed inset:0). 키보드는 그 위에 얹힌다.
  // JS 가 하는 일은 딱 둘: (1) --kb = 키보드가 가리는 높이 → .wrap 아래 여백 + 시트 올림
  //                        (2) 키보드 열림 감지 → body.keyboard-open (하단 바 숨김)
  var vv = window.visualViewport;
  var keyboardOpen = false;

  function textKeyboardTarget(el){
    return !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
  }
  function visibleViewportH(){
    return vv ? Math.round(vv.height) : Math.round(window.innerHeight || 0);
  }

  var KB_MIN = 90;                       // 이보다 크게 줄면 키보드로 본다
  var kbBaseH = visibleViewportH();      // 키보드가 없을 때의 기준 높이

  function applyViewport(){
    var h = visibleViewportH();
    // 키보드가 가리는 원(raw) 높이 — 아래 pendingReveal(키보드 다 내려감) 판정에 쓴다
    var kb = Math.max(0, Math.round((window.innerHeight || 0) - h));

    // 키보드 열림 = visualViewport 높이가 KB_MIN 이상 줄어든 상태.
    //  · 새로 "열림"이 되려면 입력칸이 실제로 포커스돼 있어야 한다 — 백그라운드에서
    //    복귀할 때 iOS 가 잠깐 낮은 높이를 보고해도(전환 애니메이션) 하단 바가
    //    사라지지 않게. (2주에 두 번 "복귀 후 하단 바 없음" 신고 → 이게 원인)
    //  · 이미 열려 있었으면 높이 감소만으로 유지 — 저장 시 입력칸이 DOM 에서
    //    사라져도 키보드 내려가는 애니메이션 동안은 "열림"을 지켜, 레이아웃이
    //    두 번 튀지 않게 한다.
    var shrunk = (kbBaseH - h) > KB_MIN;
    var open = shrunk && (keyboardOpen || textKeyboardTarget(document.activeElement));
    // 바텀시트 올림·토스트 위치용 — 실제 키보드일 때만. 복귀 시 iOS 의 잘못된
    // 낮은 높이가 .wrap 아래를 밀지 않게 (하단 바는 위 open 가드가 지킨다).
    document.documentElement.style.setProperty('--kb', (open ? kb : 0) + 'px');
    if (open !== keyboardOpen){
      keyboardOpen = open;
      document.body.classList.toggle('keyboard-open', open);
      if (addPanel) addPanel.classList.toggle('kb', open);
    }
    // 수정으로 자리가 바뀐 예약 — 키보드가 완전히 내려앉아(--kb 0) 레이아웃이 멈춘 뒤 딱 한 번
    // 보여준다. 전환 시점(KB_MIN)은 아직 키보드가 90px 남아 흔들린다.
    if (!open && kb === 0 && pendingReveal){
      var pr = pendingReveal; pendingReveal = null;
      requestAnimationFrame(function(){ roomScroll(rowForId(pr), true); });
    }
    // 키보드가 없을 때의 안정된 높이를 기준으로 유지 (아이폰이 늦게 늘려줘도 따라감)
    if (!open) kbBaseH = Math.max(kbBaseH, h);

    // 키보드가 올라와 있을 때 iOS 가 .wrap 을 유효 범위 밖으로 스크롤해두는 경우가 있다
    // (화면이 과하게 올라감 → 손으로 스크롤해야 풀림). 매번 유효 범위로 되돌린다.
    // scrollTop 을 코드로 set 하면 iOS 도 다시 클램프한다 (손 스크롤과 같은 효과).
    if (open && wrapEl){
      var maxST = wrapEl.scrollHeight - wrapEl.clientHeight;
      if (wrapEl.scrollTop > maxST + 1) wrapEl.scrollTop = Math.max(0, maxST);
    }
  }

  if (vv){
    vv.addEventListener('resize', applyViewport);
    vv.addEventListener('scroll', applyViewport);
  }
  window.addEventListener('resize', applyViewport);
  // 회전도 키보드 전환처럼 뷰포트 갱신이 늦을 수 있다 — 같은 사다리(40·140·320·600ms)로 잰다.
  window.addEventListener('orientationchange', function(){ remeasureViewport(); });
  // 키보드가 뜨고 내려갈 때 visualViewport 갱신이 아이폰 앱 모드에서 늦거나 빠질 수 있어
  // 포커스 전환 직후 몇 번 더 강제로 잰다. applyViewport 는 여러 번 불러도 무해하다.
  function remeasureViewport(){ [40, 140, 320, 600].forEach(function(t){ setTimeout(applyViewport, t); }); }
  document.addEventListener('focusin', function(e){
    if (textKeyboardTarget(e.target)) remeasureViewport();
  });
  document.addEventListener('focusout', remeasureViewport);
  applyViewport();

  /* ---------- 뒤로가기 ---------- */
  // 안드로이드는 뒤로가기 버튼을 누르면 앱이 그대로 꺼진다. 그래서 서랍·시트·팝업을 열 때
  // 가짜 방문 기록을 하나 심어, 그 버튼이 앱을 끄는 대신 열린 것부터 닫게 만든다.
  //
  // 아이폰에는 그 버튼이 없다. 대신 화면 끝 쓸기가 있는데, 기록이 있으면 iOS 가

  // 닫는 길은 이미 다 있다: 서랍은 왼쪽으로 끌기, 팝업은 취소 버튼과 막 바깥 탭.
  var HAS_BACK_KEY = /Android/i.test(navigator.userAgent || '');

  // 덮어쓰는 것으로 충분했다 — 갈아타기는 앞의 것이 닫히니까. 그런데 검색은 닫히지 않고 밑에
  // 깔린다: 검색 위에 서랍을 열었다 닫으면 검색의 닫는 길이 사라져, 다음 뒤로가기가 검색을
  // 닫는 대신 앱을 꺼 버렸다(2026-09-12). 이제 밑에 깔린 것이 그대로 남는다.

  var backStack = [], backPushed = false;

  // 누가 어떤 길로 닫았든(버튼·막 탭·render 가 대신 닫음) 스택이 저절로 맞춰진다.
  function ovVisible(id){ var el = document.getElementById(id); return !!el && !el.classList.contains('hide'); }
  var OV_OPEN = {
    search:   function(){ return ovVisible('searchbar'); },
    drawer:   function(){ var el = document.getElementById('drawer'); return !!el && el.classList.contains('open'); },
    sheet:    function(){ return ovVisible('sheetScrim'); },
    add:      function(){ return ovVisible('addPanel'); },
    dialog:   function(){ return ovVisible('scrim'); },
    roulette: function(){ return ovVisible('rltScrim'); }
  };
  function backLive(){                           // 닫힌 것들을 걷어내고 남은 개수를 준다
    backStack = backStack.filter(function(e){ return OV_OPEN[e.key](); });
    return backStack.length;
  }
  function backOpen(key, fn){
    backLive();
    for (var i = 0; i < backStack.length; i++){    // 같은 것을 다시 열었으면 닫는 길만 갱신
      if (backStack[i].key === key){ backStack[i].close = fn; return; }
    }
    backStack.push({ key: key, close: fn });
    if (HAS_BACK_KEY && !backPushed){ try { history.pushState({ ov: 1 }, ''); backPushed = true; } catch(e){} }
  }

    if (!backPushed) return;
    backPushed = false;

    if (backLive() && HAS_BACK_KEY){ try { history.pushState({ ov: 1 }, ''); backPushed = true; } catch(e){} }

  // 두 방식 모두 같은 창(#scrim/.dialog)·같은 취소/실행 배치를 쓴다 — 상호작용만 다르다.
  function confirmDlg(title, onYes, opts){
    opts = opts || {};
    var yes  = document.getElementById('dlgYes');
    var no   = document.getElementById('dlgNo');
    var note = document.getElementById('dlgNote');
    var hold = !!opts.hold;
    document.getElementById('dlgTitle').textContent = title;
    yes.querySelector('.ht').textContent = opts.yes || '확인';
    note.textContent = opts.note || '';
    note.classList.toggle('hide', !opts.note);
    yes.classList.toggle('holdmode', hold);
    scrim.classList.remove('hide');

    var timer = null;
    function stop(){                          // 손을 떼거나 버튼 밖으로 나가면 처음으로
      if (timer){ clearTimeout(timer); timer = null; }
      yes.classList.remove('hold');
    }
    function fire(){
      if (hold){ try { navigator.vibrate && navigator.vibrate(15); } catch(e){} }
      done(); onYes();
    }
    function hide(){
      stop();
      scrim.classList.add('hide');
      no.onclick = scrim.onclick = yes.onclick = null;
      yes.onpointerdown = yes.onpointermove = yes.onpointerup = null;
      yes.onpointercancel = yes.oncontextmenu = yes.onkeydown = yes.onkeyup = null;
    }
    function done(){ hide(); backDone(); }
    backOpen('dialog', hide);

    if (hold){
      var begin = function(){
        stop();
        yes.classList.add('hold');
        timer = setTimeout(function(){ timer = null; fire(); }, HOLD_MS);
      };
      yes.onpointerdown = function(e){ if (!e.button) begin(); };
      yes.onpointermove = function(e){        // 누른 채 버튼 밖으로 밀면 취소 — 빠져나갈 길
        if (!timer) return;
        var r = yes.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right ||
            e.clientY < r.top  || e.clientY > r.bottom) stop();
      };
      yes.onpointerup = yes.onpointercancel = stop;
      yes.oncontextmenu = function(e){ e.preventDefault(); };   // 길게 누를 때 뜨는 iOS 메뉴 차단

        if ((e.key === ' ' || e.key === 'Enter') && !timer && !e.repeat){ e.preventDefault(); begin(); }
      };
      yes.onkeyup = function(e){ if (e.key === ' ' || e.key === 'Enter') stop(); };

      yes.onclick = fire;
    }
    no.onclick  = done;

  }

    if (!ghostClick) return;

    e.stopPropagation();

      kind: action ? 'menu' : (m.classList.contains('more') ? 'more' : 'main'),
      action: action,
      status: m.getAttribute('data-status'),
      x: e.clientX, y: e.clientY, at: Date.now(), pid: e.pointerId

    function setResult(name){
      result.textContent = '';
      var sp = document.createElement('span'), inner = document.createElement('span');
      sp.className = 'rltnm'; inner.className = 'rltnmin';
      inner.textContent = name;
      sp.appendChild(inner);
      result.appendChild(sp);
      result.appendChild(document.createTextNode('\u00A0당첨!'));   // 줄바꿈 없는 공백 — 결과 줄이 flex 라 보통 공백은 조각 앞에서 지워진다

    }

    function spin(){
      if (spinning) return;

        result.classList.add('won');

      //   전엔 흐린 「돌리기」로 남아, 평범한 당첨(곧장 밝은 「다시」)과 달라 번개가 올 걸 미리 알려 버렸다(2026-09-17).

    inp.addEventListener('input', function(){ if (!spinning) reset(); });

               : it.status === 'cancelled' ? ' 취소' : '';
      // 메모는 «복구용»에만 맨 뒤 괄호로 붙인다 — parse() 가 tail 끝의 (…) 를 이미 메모로 떼어내므로
      // 이 꼴이 곧 왕복이다(복사 → 붙여넣기 하면 메모까지 그대로 돌아온다). 읽을 줄만 알고 쓸 줄을
      // 몰라서 「지난 명단」으로 복구하면 메모가 전부 사라지던 걸 이걸로 막는다. 2026-09-15.
      out.push(it.time + ' ' + it.name + ' ' + it.pax + '명' + tail
               + (withMemo && it.memo ? ' (' + it.memo + ')' : ''));
    });
    return out.join('\n');
  }

  function copyText(txt, okMsg){
    if (!txt){ toast('명단이 없습니다'); return; }
    var done = function(){ toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
    } else {
      fallbackCopy(txt, done);
    }
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    copyText(reportText(), '명단 복사됨 · ' + (state ? state.items.length : 0) + '건');
  });

  function fallbackCopy(txt, done){
    var t = document.createElement('textarea');
    t.value = txt;
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t);
    t.focus(); t.select(); t.setSelectionRange(0, txt.length);
    try { document.execCommand('copy'); done(); }
    catch(e){ toast('복사 실패 — 다시 시도해 주세요'); }
    document.body.removeChild(t);
  }

  var toastTimer;
  // 끊겼을 때 «말을 거는» 문장은 이것 하나뿐 — 상수로 묶어 흩어지다 갈라지는 길을 막는다.
  var MSG_OFF = '인터넷이 연결되지 않았습니다';
  /* 말투 — 세 갈래로 쓴다 (2026-09-15 전수 정리).
       ① 상시 라벨(화면에 붙박이는 표시) : 명사형      「연결됨」 「연결 안 됨」
       ② 끝났다는 통보(토스트)          : -됨         「명단 등록됨」 「복사됨」 「업데이트됨」
       ③ 말을 거는 문장(안내·거절)       : -습니다/-주세요 「명단이 없습니다」 「이름을 입력해 주세요」
     ④ 곰이 하는 말(말풍선 안)      : -어요       「퇴근까지 … 남았어요!」 「오늘 하루 고생하셨어요!」
        풍선 모양이 「이건 곰이 하는 말」이라고 이미 알려 주므로 앱 목소리와 달라도 안 어긋난다.
        ★풍선 밖에서는 절대 쓰지 않는다 — 그러면 말투가 넷으로 흩어진다.
     새 문구를 넣을 땐 넷 중 어디인지부터 정할 것. 「인터넷이 연결되지 않았습니다」는 ③이고,
     헤더의 「연결 안 됨」은 ①이라 달라 보이는 게 맞다 — 역할이 다르지 어긋난 게 아니다. */
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1600);
  }

  /* ---------- 시작 ---------- */
  var BOOT_WAIT = 8000;   // boot() 의 첫 명단 읽기 제한 시간 (아래 설명)
  function boot(){
    if (hasStore() && fb().onConnected && !boot._watched){
      boot._watched = true;
      fb().onConnected(function(ok){
        setSync(ok);
        // 연결됨 = 서버 시계 확보 → 부팅 때 미룬 정리 재시도.
        // sync() 로 명단도 다시 읽는다 — 끊긴 사이 다른 기기가 바꾼 것을 우리는 못 봤고,
        // onValue 는 값이 그대로면 재연결에 다시 울리지 않을 수 있어 «붙었다»만으로는
        // 화면이 최신이라고 볼 수 없다. 이게 끝나야 listFresh 가 서고 자동 취소가 재개된다.
        // (첫 연결은 boot() 이 이미 읽는 중이라 제외 — listKnown 으로 가른다.)
        if (ok){ wakeLogOutbox(); wqWake(); purgeOld(); if (listKnown) sync(); }
      });
    }
    setSync(hasStore());
    purgeOld();
    wakeLogOutbox();
    wqWake();
    var ticket = loadTicket();
    if (!hasStore()){ stageBackgroundState(state || { date: ticket.date, items: [] }); return; }
    // 첫 명단 읽기에 시간 제한을 둔다. 아이폰이 백그라운드에서 오래 얼렸다 깨우면 Firebase
    // 소켓과 그 내부 타이머까지 멈춰 있다가 엉켜, get() 이 응답도 거부도 없이 영영 매달릴 수
    // 있다 (→ 백지 화면). 그 경우 BOOT_WAIT 뒤 캐시/빈 명단으로 화면부터 띄우고 소켓을
    // 되살린다. 실시간 수신(watchRemote)이 붙으면 곧 실제 데이터로 채워진다.
    var got = fb().itemsGet(ticket.date);
    got.catch(function(){});   // 시간 초과 뒤 뒤늦게 거부돼도 「미처리 거부」 경고가 안 뜨게
    // 기기가 «인터넷 없음»이라고 말하면 BOOT_WAIT(8초)를 다 기다릴 이유가 없다 — 어차피 못 받는다.
    // onLine 이 false 면 진짜로 끊긴 것이고(true 는 보장이 아니라 여기선 줄이는 데만 쓴다),
    // 오프라인에서 스플래시가 8초 버티다 검은 화면이 되던 걸 막는다. 2026-09-15.
    var bootWait = (navigator.onLine === false) ? 600 : BOOT_WAIT;
    Promise.race([
      got,
      new Promise(function(_, rej){ setTimeout(rej, bootWait, new Error('boot timeout')); })
    ]).then(function(res){
      if (!ticketCurrent(ticket)) return;
      listKnown = true;                                     // 서버를 실제로 읽었다
      listFresh = true;
      stageBackgroundState(itemsToState(ticket.date, res));
      watchRemote();   // 즉시 fire → applyRemoteItems 가 필요시 구 형식 변환도 한다
      maybeInstallHint();   // 중복 방지는 maybeInstallHint 안에서 한다
    }).catch(function(){
      if (!ticketCurrent(ticket)) return;
      stageBackgroundState((state && state.date === ticket.date) ? state : { date: ticket.date, items: [] });   // 날짜가 넘어간 뒤면 어제 명단을 오늘로 올리지 않는다
      watchRemote();
      if (hasStore() && fb().reconnect) fb().reconnect();
    });
  }

  /* ---------- 오류 기록 ----------
     빈 catch 가 서른 곳 넘게 있고(대개는 localStorage 가 막힌 기기처럼 «정상인 실패»다)
     전역 포착이 없어서, 정작 진짜 오류가 나도 아무 데도 안 남았다. 화면에는 아무것도 안 띄운다
     — 손님 앞에서 쓰는 앱이라 오류창이 뜨는 게 더 나쁘다. 마지막 다섯 건만 조용히 적어 두고,
     서랍 「익순이란?」 맨 아래에서만 보인다(있을 때만). 2026-09-15. */
  var ERR_KEY = 'ix-err';
  function errLog(kind, msg, where){
    try {
      var a = JSON.parse(localStorage.getItem(ERR_KEY) || '[]');
      var ep = kstParts(serverNow());   // 활동 기록(logAdd)과 같은 자 — KST·서버 시계
      a.push({ t: pad(ep.mon + 1) + '-' + pad(ep.day) + ' ' + pad(ep.h) + ':' + pad(ep.min) + ':' + pad(ep.s),
               k: kind, m: String(msg || '').slice(0, 200), w: String(where || '').slice(0, 120) });
      localStorage.setItem(ERR_KEY, JSON.stringify(a.slice(-5)));
    } catch(e){}
  }
  function errList(){
    try { return JSON.parse(localStorage.getItem(ERR_KEY) || '[]'); } catch(e){ return []; }
  }
  window.addEventListener('error', function(e){
    errLog('오류', e && e.message, (e && e.filename ? '' : '') + ':' + (e && e.lineno));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason;
    var m = String((r && (r.message || r.code)) || r || '');
    /* 앱이 백그라운드로 내려가면 진행 중이던 저장·요청이 라이브러리 쪽에서 끊기며 거부된다
       (「Database is closing/hidden」 — 파이어베이스 세션 저장소가 화면이 숨을 때 닫는 것).
       돌아오면 스스로 다시 붙으므로 사람이 할 일이 없는데, 「문제 기록」에 쌓여 오너가
       «앱에 문제가 있나» 걱정하게 만들었다(2026-09-19 두 건, 같은 초에 나란히).
       이 줄은 «내가 볼 진짜 문제»를 모으는 곳이라 중단 잡음은 안 담는다.
       ★오류(uncaught)는 그대로 남긴다 — 그건 숨어서 나도 진짜 문제다. */
    if (document.hidden || /closing|hidden|offline|interrupt|abort/i.test(m)) return;
    errLog('약속', m, '');
  });

  /* ---------- 오프라인 실행(서비스워커) ----------
     하는 일은 하나 — «인터넷이 없어도 앱이 열리게». 예전엔 마지막으로 연 지 10분이 지나면
     (GitHub Pages 가 index.html 을 max-age=600 으로 준다) 껍데기를 받을 데가 없어 오류 화면이
     떴다. 오프라인 쓰기 큐까지 만들어 놓고 정작 «끊긴 채로 켜는 것»은 안 됐던 것.
     낡을 위험은 sw.js 안에서 «화면은 네트워크 먼저»로 막는다 — 거기 주석 참고.

     ★비상 탈출: 주소 뒤에 ?nosw 를 붙여 한 번 열면 서비스워커를 지우고 저장본도 비운다.
       서비스워커가 앱을 망가뜨리는 건 흔한 사고라, 앱을 지웠다 깔지 않고도 되돌릴 길을 둔다. */
  (function(){
    if (!('serviceWorker' in navigator)) return;
    var kill = /[?&]nosw\b/.test(location.search);
    if (kill){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
      if (window.caches && caches.keys) caches.keys().then(function(ks){
        ks.forEach(function(k){ caches.delete(k); });
      }).catch(function(){});
      toast('오프라인 저장 꺼짐');
      return;
    }
    // 등록은 화면이 다 뜬 뒤에 — 첫 그림을 늦추지 않는다.
    // updateViaCache:'none' 이 중요하다. 이게 없으면 sw.js 자체가 10분 캐시에 걸려
    // 고친 서비스워커가 늦게 반영된다.
    window.addEventListener('load', function(){
      setTimeout(function(){
        try {
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .catch(function(err){ errLog('SW', err && err.message, 'register'); });
        } catch(e){ errLog('SW', e && e.message, 'register'); }
      }, 1200);
    });
  })();

  /* ---------- 새 버전 알림 ---------- */
  // 파일이 새로 올라갔는지 HEAD 요청으로 확인한다. 바뀌었으면 헤더 아래에
  // 하단에 「새 버전으로 업데이트」 알약을 띄운다 — 그걸 눌러야 새로 뜬다. 저절로는 안 바뀜.
  // 확인 시점: 앱으로 돌아올 때 · 켜 둔 채면 5분마다. (둘이 자정 케이스도 덮는다)
  var buildTag = null;          // 지금 화면이 만들어질 때의 파일 표식
  var updShown = false;
  var updTimer = null;
  var updBar = document.getElementById('updBar');
  // 알림 띠 자체가 「업데이트」 버튼 — 누르면 새로 불러온다 (옛 하단 새로고침 버튼의 유일한 잔여 역할).
  if (updBar) updBar.addEventListener('click', function(){ doUpdate(); });

  function fetchTag(){
    if (!window.fetch) return Promise.resolve(null);
    return fetch(location.href, { method: 'HEAD', cache: 'no-store' })
      .then(function(r){
        if (!r.ok) return null;
        return r.headers.get('etag') || r.headers.get('last-modified') || null;
      })
      .catch(function(){ return null; });
  }

  function flagUpdate(){
    if (updShown) return;
    updShown = true;
    if (updTimer){ clearInterval(updTimer); updTimer = null; }   // 찾았으니 그만 확인
    if (updBar){ updBar.classList.remove('hide'); document.body.classList.add('upd-on'); }
  }

  // 「업데이트」 버튼으로 새로 뜬 직후면 한 번만 확인해 준다 (앱 껐다 켠 경우엔 표식이
  // 없어서 안 뜬다 — 매번 뜨는 잔소리 방지).
  try {
    if (sessionStorage.getItem('ix-updated')){
      sessionStorage.removeItem('ix-updated');
      setTimeout(function(){ toast('업데이트됨'); }, 700);
    }
  } catch(e){}

  function checkUpdate(){
    if (updShown) return Promise.resolve(false);   // 이미 알렸으면 더 안 물어본다
    return fetchTag().then(function(tag){
      if (!tag) return false;
      if (!buildTag){ buildTag = tag; return false; }
      if (tag === buildTag) return false;
      flagUpdate();
      return true;
    });
  }
  fetchTag().then(function(tag){ buildTag = tag; });

  // 폰을 켜 둔 채로 두는 매장이라, 앱을 다시 열지 않아도 알아채게 5분마다 확인한다.
  // HEAD 요청 하나(헤더만) — 12번/시간, 무시할 만한 양. 화면 꺼져 있으면 건너뛴다.
  updTimer = setInterval(function(){ if (!document.hidden) checkUpdate(); }, 300000);

  // 화면으로 돌아오면 한 번 확인 (실시간 수신은 watchRemote가 담당)
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) return;
    wakeLogOutbox();
    wqWake();
    // 백그라운드에 있는 동안 새 버전이 배포됐을 수 있다 — 확인해서 있으면
    // 알림 띠를 띄운다. 명단이 없어도(붙여넣기 화면) 확인한다.
    // 연결이 늦게 붙는 경우가 있어 한 번 더.
    checkUpdate();
    setTimeout(checkUpdate, 3000);   // 재연결 사다리 첫 칸과 같은 간격
    // 화면 높이가 달라졌을 수 있다 (키보드가 열린 채 복귀했을 수도).
    // applyViewport 가 현재 visualViewport 로 --kb 와 keyboard-open 을 다시 잡는다.
    // iOS 복귀 애니메이션 동안 높이 보고가 흔들려서, 한 번이 아니라 여러 번 잰다
    // (40·140·320·600ms) — "복귀 후 하단 바 사라짐" 방지.
    applyViewport();
    remeasureViewport();
    // 백그라운드에 있는 동안 날짜가 넘어갔을 수 있다.
    // 먼저 확인하지 않으면 어제 명단을 「오늘」로 띄운 채 체크하게 된다.
    if (rolloverIfNeeded()) return;
    // 얼었다 깨어나 첫 명단조차 못 받은 채였다면(state 없음) 처음부터 다시 부른다.
    // boot() 은 BOOT_WAIT 제한이 있어 소켓이 죽어 있어도 곧 캐시로 화면을 띄운다.
    if (!state){ boot(); return; }
    sync();          // 즉시 최신 상태 확인
    watchRemote();   // 백그라운드에서 끊겼을 수 있으니 실시간 수신도 다시 건다
    // 복귀 직후엔 소켓이 죽어 있는 게 흔하다. 3초 뒤 아직 안 붙어 있으면 강제로 다시 붙이고,
    // 그래도 안 되면 한 번 더(8초) — 첫 reconnect 도 얼어붙은 상태에서 못 나갈 수 있다.
    [3000, 8000].forEach(function(t){
      setTimeout(function(){
        if (!online && hasStore() && fb().reconnect){ fb().reconnect(); watchRemote(); sync(); }
      }, t);
    });
  });

  // 영업일이 바뀌었으면 오늘로 옮겨가고 명단을 다시 불러온다.
  // 옮겨갔으면 true. (불러오는 중이라 호출한 쪽은 더 할 일이 없다)
  var lastBiz = bizDate();
  function rolloverIfNeeded(){
    var b = bizDate();
    if (b === lastBiz) return false;
    lastBiz = b;
    lastPurgeAt = 0;   // 날짜가 바뀌었으니 10분 스로틀 무시하고 반드시 한 번 정리
    // 어제 백업은 자정에 바로 없앤다 (purgeOld 의 '가장 최근 날짜는 안 지움' 가드가
    // 오늘 첫 백업 전까지 어제 것을 살려두므로, 여기서 명시적으로 지운다).
    if (fb().backupDelDate) fb().backupDelDate(shiftDate(b, -1)).catch(function(){});
    purgeOld();
    viewDate = b;
    resetDateScopedUi();
    boot();
    return true;
  }

  // 시간대 자동 전환 + 날짜 넘어감 확인
  // 예약 시각에서 15분이 지나도 체크가 없으면 취소로 넘긴다.
  // 노쇼도 취소로 처리하는 운영이라 직원이 어차피 누를 것을 대신 눌러주는 셈이다.
  // 이 예약이 지금(now, 분 단위) 자동취소 대상인가.
  // 대기 상태 + 예약시각 + AUTO_CANCEL_MIN 이 지난 창 안. 지나간 시간대는 사람 몫이라 제외.
  // 등록하는 순간 이미 «예약 시각 +15분»이 지나 있었나. 그런 예약은 앱이 «대기»로 지켜본
  // 적이 없다 — 그 사이에 손님이 왔는지 앱은 모른다. 지나간 시간대를 사람 몫으로 두는 것과
  // 같은 이유다. 판단은 등록하는 기기가 한 번만 하고 항목에 실어 보낸다(모든 기기가 같은
  // 답을 보게, 그리고 기기 시계 차이로 답이 갈리지 않게). 2026-09-15.
  function lateEntry(time, now){ return now >= slotMin(time) + AUTO_CANCEL_MIN; }
  function autoCancelDue(it, now){
    if (!it || it.status !== 'pending' || it.noAuto) return false;
    var late = now - (slotMin(it.time) + AUTO_CANCEL_MIN);
    return late >= 0 && late < AUTO_CANCEL_WINDOW;
  }
  function autoCancel(){
    if (!state) return false;
    // ★끊긴 동안은 돌지 않는다 — 직원이 체크를 못 하는 사이 15분이 지나면 실제로 온 손님이
    //   취소로 찍힌다. 창(WINDOW)을 건너뛰면 뒤늦게 훑지 않으니 대기로 남는다.
    // ★붙은 직후도 아직이다 — 소켓만 붙고 명단은 옛 것일 수 있다. 그 상태로 돌면
    //   «끊긴 사이 다른 기기가 한 방문 체크»를 대기로 착각해 취소로 덮는다.
    if (!connReady() || !listFresh) return false;
    var now = nowMin(), hit = [];
    // (저녁에 하루치 명단을 한꺼번에 넣어도 낮 시간대가 무더기로 취소되지 않는다)
    state.items.forEach(function(it){ if (autoCancelDue(it, now)) hit.push(it); });
    if (!hit.length) return false;
    hit.forEach(function(it){
      // 한 예약(=시각·이름)의 자동 취소는 하루에 딱 한 번뿐이다. 그 시각·이름으로 로그 id 를
      // 묶는다 → 여러 기기가 겹쳐 써도, 병합 왕복으로 한 기기가 다시 취소해도 늘 같은 자리 =
      // 한 줄. (예약 id 는 편집·개별추가로 기기마다 달라질 수 있어 이름 기준이 더 안전하다.)
      var label = it.time + ' ' + it.name;
      logAdd('자동 취소', label, 'ac:' + label);
      var ts = stampTs(it);
      it.status = 'cancelled';
      it.ts = ts;
      writeItem(it.id, { status: 'cancelled', ts: ts });
    });
    return true;
  }

  // ---------- 셀프테스트 모드 ----------
  // 주소에 ?selftest 가 있으면 앱을 띄우지 않고, 실제 배포되는 순수 함수들을 노출한 뒤
  // selftest.js 가 단언 검사를 돌려 결과를 화면에 뿌린다. 평소엔 이 블록을 그냥 지나간다.
  if (/[?&]selftest\b/.test(location.search)) {
    if (splashEl) splashEl.classList.add('hide');   // 결과 화면을 가리지 않게
    window.__ixTest = {
      parse: parse, normTime: normTime, sortItems: sortItems,
      pad: pad, ymd: ymd, parseYmd: parseYmd, shiftDate: shiftDate, dayGap: dayGap, bizDate: bizDate,
      tallyStatus: tallyStatus, dayTally: dayTally,
      slotMin: slotMin, slotLive: slotLive, nowMin: nowMin, groupByTime: groupByTime, liveNowTime: liveNowTime,
      esc: esc, hourOptions: hourOptions,
      validLogDate: validLogDate, cleanLogEntry: cleanLogEntry, logIdentity: logIdentity,
      logKeyId: logKeyId, mergeLogRows: mergeLogRows, dedupeLogRows: dedupeLogRows, foldLogRows: foldLogRows,
      reportText: reportText, uniqueId: uniqueId, nextSeq: nextSeq, isCollapsed: isCollapsed,
      rltSteps: rltSteps, twistPick: twistPick, wqEntry: wqEntry, computeDev: computeDev, autoCancelDue: autoCancelDue,
      stalePurgeDates: stalePurgeDates, kstParts: kstParts, lateEntry: lateEntry, stampTs: stampTs,
      consts: { COLLAPSE_DELAY: COLLAPSE_DELAY, AUTO_CANCEL_MIN: AUTO_CANCEL_MIN,
                AUTO_CANCEL_WINDOW: AUTO_CANCEL_WINDOW,
                GRACE_ON_HOUR: GRACE_ON_HOUR, GRACE_OFF_HOUR: GRACE_OFF_HOUR,
                HOUR_MIN: HOUR_MIN, HOUR_MAX: HOUR_MAX, KEEP_DAYS: KEEP_DAYS,
                RLT_BASE: RLT_BASE, RLT_STEP_CAP: RLT_STEP_CAP },
      // 상태에 기대는 함수를 검사할 때 쓰는 세터
      setState: function(s){ state = s; },
      setViewDate: function(d){ viewDate = d; },
      setCollapsed: function(c){ collapsed = c || {}; },
      setTouched: function(t){ touched = t || {}; },
      MS: MS,
      safariFallbackNeeded: safariFallbackNeeded
    };
    var st = document.createElement('script');
    st.src = 'selftest.js';
    document.head.appendChild(st);
    return;
  }

  var tickSig = '', tickMin = -1;
  setInterval(function(){
    if (rolloverIfNeeded()) return;
    var changed = autoCancel();   // ⋯ 메뉴가 열려 있어도 자동취소는 돈다(창을 놓치지 않게) — 그리기만 미룬다
    maybeHourlyBackup();   // autoCancel 반영된 상태를 :20 백업이 잡게 — 순서 보장
    // 명단 내용이 바뀌었으면(자동취소 포함) 통째로 다시 그린다.
    // itemsSig 는 화면에 영향 주는 필드만 본다 — ts 만 바뀐 쓰기로는 안 그린다.
    var sig = (state ? itemsSig(state.items) : '') + '|' + viewDate;
    if (changed || sig !== tickSig){
      tickSig = sig; tickMin = Math.floor(nowMin());
      if (interactionActive()) backgroundRenderPending = true;   // 메뉴·체크 중이면 닫힐 때 그린다
      else render();
      return;
    }
    if (openMenu) return;
    // 시간만 흘렀으면 「지금 시간대」와 상단 요약만 손본다 (통째 render 안 함)
    var m = Math.floor(nowMin());
    if (m === tickMin) return;
    tickMin = m;
    repaintNow();
    paintHead();
  }, 5000);

  /* ---------- 잠금 화면 (공유 비밀번호) ----------
     기본은 '잠김'. 로그인 상태가 확인돼야 잠금이 풀리고 boot() 이 돈다.
     세션은 기기에 저장되므로 기기당 한 번만 입력하면 되고, 그 뒤엔 오프라인으로 켜도 통과한다.
     ※ 실제 보안은 Firebase 규칙이 담당한다 — 이 화면은 그 앞의 문일 뿐.
     ※ 실사용에 배포할 땐 순서 주의: 앱을 먼저 올리고 매장 폰들을 로그인시킨 뒤에 규칙을 조인다.
        (규칙을 먼저 조이면 잠금 화면 없는 구버전 앱이 명단을 못 읽는다.) */
  var lockEl   = document.getElementById('lock');
  var lockDots = document.getElementById('lockDots');
  var lockMsg  = document.getElementById('lockMsg');
  var lockDel  = document.getElementById('lockDel');
  var booted   = false;
  var PIN_LEN  = 6;          // 비밀번호 자릿수. 길이를 바꾸면 여기만 고치면 된다.
  var pin      = '';

  for (var i = 0; i < PIN_LEN; i++) lockDots.appendChild(document.createElement('i'));
  var dots = lockDots.children;

  function paintPin(){
    for (var i = 0; i < PIN_LEN; i++) dots[i].classList.toggle('on', i < pin.length);
    lockDel.disabled = pin.length === 0;
  }
  function clearPin(){ pin = ''; paintPin(); }

  // 걷어내기 지연 타이머는 반드시 붙잡아 둔다 — 이게 도는 210ms 사이에 로그아웃/세션만료로
  // 잠금이 다시 떠야 하면(lockShow), 이 타이머가 나중에 터져 잠금을 도로 숨기고 data-authed 를
  // 되살려 「로그아웃했는데 앱이 열려 있는」 상태가 된다. lockShow 에서 취소한다.
  var unlockTimer = null;
  function unlock(){
    try { localStorage.setItem('ix-authed', '1'); } catch(e){}
    // boot() 을 먼저 돌린다 — 페이드가 도는 .2s 동안 명단을 받아와 빈 화면을 안 보여준다.
    // try 로 감싸는 이유: boot() 이 던지면 아래 걷어내기가 실행되지 않아 잠금에 갇힌다.
    if (!booted){ booted = true; try { boot(); } catch(e){} }
    lockEl.classList.add('out');
    clearTimeout(unlockTimer);
    unlockTimer = setTimeout(function(){
      unlockTimer = null;
      lockEl.classList.add('hide');
      lockEl.classList.remove('out');
      // data-authed 는 맨 마지막에 — 먼저 걸면 CSS 가 즉시 display:none 으로 만들어 페이드가 죽는다
      document.documentElement.setAttribute('data-authed', '1');
    }, MS.move + 10);
  }
  function lockShow(msg){
    if (unlockTimer){ clearTimeout(unlockTimer); unlockTimer = null; }   // 위 경합 차단
    cdStop();                            // 잠금 밑에서 1초 타이머가 돌 이유 없음
    try { localStorage.removeItem('ix-authed'); } catch(e){}
    document.documentElement.removeAttribute('data-authed');   // 표식을 지워야 잠금이 실제로 보인다
    clearPin();                          // 키패드는 늘 빈 상태로 나타난다 (finish 는 성공 시 안 비우므로 여기서)
    lockEl.classList.remove('hide', 'out', 'busy', 'checking', 'bad');
    lockMsg.textContent = msg || '';
  }
  function lockFail(msg){
    lockMsg.textContent = msg;
    lockEl.classList.remove('bad');
    void lockEl.offsetWidth;              // 애니메이션 재시작
    lockEl.classList.add('bad');
    clearPin();
  }

  function submitPin(){
    lockEl.classList.add('busy');           // 키패드 즉시 잠금
    lockMsg.textContent = '';
    var settled = false, timer = null;
    // 「검사 중」 맥동은 마지막 점이 채워지는 전환(.12s)이 끝난 뒤에 건다.
    // 전환과 맥동이 겹치면 그 점 하나만 따로 깜빡이는 것처럼 보인다.
    var pulseT = setTimeout(function(){ if (!settled) lockEl.classList.add('checking'); }, 140);
    function finish(msg){
      if (settled) return;                 // 응답과 시한이 겹쳐도 한 번만
      settled = true;
      clearTimeout(timer); clearTimeout(pulseT);
      lockEl.classList.remove('busy', 'checking');
      // 성공이면 점을 비우지 않는다 — 채워진 채로 unlock() 의 페이드에 녹아 사라진다 (아이폰 방식).
      // 따로 비우면 전환이 시작되는 그 순간과 겹쳐 어차피 안 보이고, 어정쩡하게만 남는다.
      if (msg) lockFail(msg);              // 실패는 lockFail 안에서 흔들고 clearPin 한다
    }
    // 응답이 영영 안 오면(매장 와이파이가 끊기는 등) 키패드가 잠긴 채 갇힌다.
    // 앱을 강제 종료하는 것 말고 빠져나갈 길이 없으므로 시한을 둔다.
    timer = setTimeout(function(){ finish(MSG_OFF); }, 12000);
    // 기기가 «인터넷 없음»이라고 말하면 물어볼 것도 없다 — 「검사 중」 맥동을 띄웠다가
    // 실패로 끝내지 말고 바로 알린다. (비밀번호는 서버에서만 확인할 수 있어서, 저장된
    // 로그인이 없는 기기는 오프라인에서 들어올 방법이 없다 — 그게 맞다.) 2026-09-15.
    if (navigator.onLine === false){ finish(MSG_OFF); return; }
    window.__fb.signIn(pin).then(function(){
      finish(null);
    }).catch(function(err){
      var c = (err && err.code) || '';
      finish(c === 'auth/network-request-failed' ? MSG_OFF
           : c === 'auth/too-many-requests'      ? '잠시 뒤 다시 시도해 주세요'
           : '비밀번호가 맞지 않습니다');
    });
  }
  // busy(확인 중) / out(잠금 걷히는 중)에는 입력을 받지 않는다 —
  // 화면 탭은 .lock.out{pointer-events:none} 이 막지만 물리 키보드는 여기서 막는다.
  // 인터넷이 돌아오면 남은 안내를 지운다 — 안 그러면 연결됐는데도 그대로 떠 있다.
  window.addEventListener('online', function(){
    if (lockMsg && lockMsg.textContent === MSG_OFF) lockMsg.textContent = '';
  });
  function pinLocked(){ return lockEl.classList.contains('busy') || lockEl.classList.contains('out'); }
  function pinPush(d){
    if (pinLocked() || pin.length >= PIN_LEN) return;
    lockEl.classList.remove('bad');
    lockMsg.textContent = '';
    pin += d;
    paintPin();
    if (pin.length === PIN_LEN) submitPin();   // 다 채우면 바로 확인 — 별도 버튼 없음
  }
  function pinPop(){
    if (pinLocked() || !pin) return;
    pin = pin.slice(0, -1);
    paintPin();
  }

  // 눌림 보정(앱 전체) — 실기기 탭은 100ms 안팎이라 :active 만으론 눌린 표시가 거의 안 보인다.
  // pointerdown 에 .dn 을 붙이고, 손을 떼도 최소 130ms 는 유지한다. CSS 의 모든 :active 규칙엔 .dn 짝이 있다.
  // (키패드는 아래 자기 보정을 쓴다 — 여기서 제외)
  (function(){
    var SEL = 'button:not(.lockkey), .bkrow, .bkback';   // 나머지 누르는 것들은 전부 <button>. .bkrow·.bkback 만 div/span
    var cur = null, since = 0, timer = null;
    function release(){
      if (!cur) return;
      var left = 130 - (Date.now() - since);
      var el = cur; cur = null;
      if (left > 0) timer = setTimeout(function(){ el.classList.remove('dn'); }, left);
      else el.classList.remove('dn');
    }
    document.addEventListener('pointerdown', function(e){
      var el = e.target.closest && e.target.closest(SEL);
      if (!el || el.disabled) return;
      if (timer){ clearTimeout(timer); timer = null; }
      if (cur) cur.classList.remove('dn');
      cur = el; since = Date.now(); el.classList.add('dn');
    }, true);
    ['pointerup','pointercancel'].forEach(function(ev){ document.addEventListener(ev, release, true); });
    document.addEventListener('pointerleave', release, true);
  })();

  // 눌린 표시를 최소 130ms 유지한다 — 손가락이 스치듯 닿으면 :active 가 너무 짧아 안 보인다
  (function(){
    var pad = document.getElementById('lockPad');
    var dnTimer = null, dnKey = null;
    function press(b){
      if (!b || b.classList.contains('blank') || b.disabled) return;
      if (dnTimer){ clearTimeout(dnTimer); if (dnKey) dnKey.classList.remove('dn'); }
      b.classList.add('dn'); dnKey = b;
      dnTimer = setTimeout(function(){
        b.classList.remove('dn'); dnTimer = null; dnKey = null;
      }, MS.press + 10);
    }
    pad.addEventListener('pointerdown', function(e){
      var b = e.target.closest && e.target.closest('.lockkey');
      press(b);
    });
  })();

  document.getElementById('lockPad').addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.lockkey');
    if (!b) return;
    if (b === lockDel) pinPop();
    else if (b.dataset.d != null) pinPush(b.dataset.d);
  });
  // 물리 키보드(맥·블루투스)로도 칠 수 있게 — 잠겨 있을 때만 듣는다
  document.addEventListener('keydown', function(e){
    // .hide 만 보면 안 된다 — 재실행 기기는 html[data-authed] CSS 로 숨겨져 있고
    // .hide 는 authWatch 응답 뒤에야 붙는다. 실제로 그려지는지를 기준으로 판단한다.
    // (offsetParent 는 못 쓴다 — position:fixed 요소는 항상 null 이라 늘 무시돼 버린다.)
    if (getComputedStyle(lockEl).display === 'none') return;
    if (e.key >= '0' && e.key <= '9'){ pinPush(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace'){ pinPop(); e.preventDefault(); }
  });
  paintPin();

  // 전에 이 기기에서 로그인했다면 인증 응답(≈370ms)을 기다리지 않고 앱을 먼저 띄운다.
  // 잠금은 어차피 head 스크립트의 data-authed 로 이미 숨겨져 있고, Firebase SDK 가
  // 토큰이 준비될 때까지 DB 요청 순서를 알아서 맞춰 준다. 인증이 아니라고 밝혀지면
  // 아래 authWatch 가 잠금을 되돌리고, 다시 로그인하면 화면을 새로 불러 깨끗이 복구한다.
  var staleBoot = false;
  function lockStart(){
    if (!window.__fb || !window.__fb.authWatch){   // Auth 를 못 불러왔을 때
      lockShow(navigator.onLine === false ? MSG_OFF : '앱을 다시 열어 주세요');
      return;
    }
    if (document.documentElement.getAttribute('data-authed') === '1' && !booted){
      booted = true; boot();
    }
    window.__fb.authWatch(function(signedIn){
      if (signedIn){
        // 로그아웃했다 다시 로그인한 경우(staleBoot). 페이지를 새로 띄우지 않고,
        // booted 를 풀어 unlock() 안에서 boot() 이 다시 돌게 한다 — 새 명단을 받아
        // 잠금만 부드럽게 걷힌다. (예전엔 location.reload() 라 로그인 뒤 잠금화면이 한 번 더 번쩍였다.)
        if (staleBoot){ staleBoot = false; booted = false; }
        unlock();
      } else {
        if (booted) staleBoot = true;                  // 표식만 믿고 띄웠는데 실제론 로그인 아님
        // 오프라인이면 «비번을 치기 전에» 알린다 — 네 자리 다 누른 뒤에 알려주면 헛수고다.
        lockShow(navigator.onLine === false ? MSG_OFF : '');
        // 설치 안내는 「로그인하기 전에」 봐야 한다. 아이폰은 사파리와 홈 화면 앱의 저장소가
        // 완전히 분리돼 있어서, 사파리에서 먼저 로그인하면 앱을 설치한 뒤 비번을 또 넣어야 한다.
        // 여기서 권해야 「설치 → 앱에서 한 번만 로그인」 순서가 된다.
        maybeInstallHint();
      }
    });
  }

  // Firebase 모듈이 먼저 준비되면 바로, 아니면 준비 신호를 기다린다
  // Firebase 모듈을 끝내 못 받은 경우. 오프라인이면 15초를 버틸 이유가 없고, 「다시 열어
  // 주세요」는 사실도 아니다(다시 열어도 인터넷이 없으면 똑같다). 2026-09-15.
  function fbGaveUp(){
    if (window.__fb) return;
    lockShow(navigator.onLine === false ? MSG_OFF : '앱을 다시 열어 주세요');
  }
  if (window.__fb) lockStart();
  else {
    window.addEventListener('fb-ready', lockStart, { once: true });
    setTimeout(fbGaveUp, navigator.onLine === false ? 4000 : 15000);
  }

})();
</script>
<script>
// 상단 셸 높이 → --topH (명단 padding-top · 붙는 시간대 머리글 top). 카드 내용·검색창·업데이트 띠에 따라 변하므로 관찰한다.
(function(){
  var sh = document.getElementById('topShell');
  if (!sh) return;
  // ★올림이 아니라 «내림». 셸 높이는 소수(예: 211.67px)인데 올리면(212) 시간바가 셸이 칠한
  //   자리보다 0.33px 아래에 붙는다 → 3배 화면에서 딱 1픽셀이 비어, 그 줄로 행 글자의 밑동이
  //   비쳤다(오너 스크린샷에서 밝은 줄이 y=638 한 줄, 2026-09-15). 내리면 시간바가 셸과
  //   살짝 겹쳐 붙어 틈이 생길 수 없다 — 겹치는 건 시간바 위쪽 여백(12px)이라 안 보인다.
  function set(){ document.documentElement.style.setProperty('--topH', Math.floor(sh.getBoundingClientRect().height) + 'px'); }
  set();
  if (window.ResizeObserver) new ResizeObserver(set).observe(sh);
  // 카드 내용이 나중에 그려지거나 검색창·업데이트 띠가 켜지는 건 DOM 변화 — 크기 관찰이 늦는 환경을 대비해 이것도 본다
  if (window.MutationObserver) new MutationObserver(set).observe(sh, { childList:true, subtree:true, attributes:true, characterData:true });
  window.addEventListener('resize', set);
})();
</script>
<script>
// 세그먼트 썸: 2번째 칸이 aria-pressed=true 면 .seg 에 .alt — 썸이 그 칸으로 미끄러진다. 모든 .seg 공용.
(function(){
  function sync(seg){ var b = seg.querySelectorAll('button'); if (b.length < 2) return;
    var on = b[1].getAttribute('aria-pressed') === 'true';
    seg.classList.toggle('alt', on); }
  function all(){ document.querySelectorAll('.seg').forEach(sync); }
  if (window.MutationObserver) new MutationObserver(all).observe(document.body, { subtree:true, childList:true, attributes:true, attributeFilter:['aria-pressed'] });
  all();
})();
</script>
</body>
