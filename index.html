<script type="module">
// ---------- Firebase 연결 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, get, set, update, remove, onValue, off, goOffline, goOnline }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA62A2jtIE77DgOcJ17Jb6S9gH4oTeNeKw",
  authDomain: "ikseon-reserve.firebaseapp.com",
  databaseURL: "https://ikseon-reserve-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ikseon-reserve",
  storageBucket: "ikseon-reserve.firebasestorage.app",
  messagingSenderId: "456621961785",
  appId: "1:456621961785:web:a2ba82fb70d6f198b5d3e8"
};

const db = getDatabase(initializeApp(firebaseConfig));
// dev/prod 판정 — 실제 배포 주소일 때만 prod, 그 외 전부 dev(roster-dev).
// 실배포: songtudy.github.io/reserve/   테스트: songtudy.github.io/reserve-dev/
// localhost·파일·미리보기·폴더 복사본·남의 fork = 전부 dev. 실명단을 건드리지 않는다.
// (아래 IIFE 의 computeDev 와 같은 판정 — 둘 다 고쳐야 함)
const DEV = !(location.hostname === 'songtudy.github.io'
  && /^\/reserve(\/|$)/.test(location.pathname));
const ROOT = DEV ? 'roster-dev' : 'roster';
// Firebase 규칙이 허용하는 명단 영역 안에 변경 내역 전용 가지를 둔다.
const LOGROOT = ROOT + '/__logs__';
// 예약 id 를 Firebase 키로 (id 엔 ':' '|' 가, 이름엔 '.' 이 들어갈 수 있어 해시한다)
const k32 = s => {
  let a = 5381, b = 52711;
  for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); a = (Math.imul(a,33) ^ c) >>> 0; b = (Math.imul(b,63689) ^ c) >>> 0; }
  const f = n => ('0000000' + n.toString(36)).slice(-7);
  return 'k' + f(a) + f(b);
};
const ipath = (ds, id) => ROOT + '/' + ds + '/items/' + k32(id);
const itemsRef = ds => ref(db, ROOT + '/' + ds + '/items');

// Firebase 서버 시계와 이 기기 시계의 차이(ms). "지금 몇 시/며칠이냐" 를 이 값으로 보정한다
// (serverNow = Date.now() + __skewMs). 기기 시계가 틀려도 자동취소·자정넘어감·지금시간대·백업이
// 서버 시계를 따르게. 서버 시계는 구글 인프라(NTP)라 실제 시각과 사실상 일치한다.
let __skewMs = 0, __skewKnown = false;
onValue(ref(db, '.info/serverTimeOffset'), s => { __skewMs = Number(s.val()) || 0; __skewKnown = true; });

window.__fb = {
  serverSkew: () => __skewMs,
  serverSkewKnown: () => __skewKnown,
  // ---- 명단: 예약별 노드 (roster/<날짜>/items/<해시>) ----
  // 읽기는 구 형식(items 가 배열)도 그대로 처리된다. legacy=true 면 앱이 1회 변환해 쓴다.
  itemsGet: ds => get(itemsRef(ds)).then(s => {
    const v = s.exists() ? s.val() : null;
    return { items: v ? Object.values(v) : [], legacy: Array.isArray(v) };
  }),
  itemsWatch: (ds, cb) => {
    const r = itemsRef(ds);
    const h = onValue(r, s => {
      const v = s.exists() ? s.val() : null;
      cb({ items: v ? Object.values(v) : [], legacy: Array.isArray(v) });
    });
    return () => off(r, 'value', h);
  },
  itemDel: (ds, id) => remove(ref(db, ipath(ds, id))),
  // 한 예약 노드를 반영한다 (오프라인 쓰기 큐 재생용). 현재 값을 get 으로 확인하고 조건부로 쓴다.
  //  - data: patch(부분 필드) 또는 item(통짜, create=true)
  //  - minTs: 서버 값이 이보다 새 것이면 건드리지 않는다 (오래된 큐가 최신 값 못 덮게)
  //  - create: true 면 없을 때 새로 만든다(예약 추가). false(patch) 면 삭제된 노드는 되살리지 않는다.
  // patch 는 update() 로 지정한 필드만 서버에서 병합 → 다른 기기가 딴 필드를 동시에 바꿔도 안 날린다.
  // (트랜잭션은 cold 캐시에서 null 로 오판해 patch 를 통째로 잃으므로 쓰지 않는다.)
  // 반환 true = 반영됐거나 더는 필요 없음 → 큐에서 제거.
  itemMerge: (ds, id, data, minTs, create) => {
    var r = ref(db, ipath(ds, id));
    return get(r).then(s => {
      if (!s.exists()) return create ? set(r, data).then(() => true) : true;
      if ((s.val().ts || 0) >= (minTs || 0)) return true;       // 서버가 더/같이 최신 → 유지
      return (create ? set(r, data) : update(r, data)).then(() => true);
    });
  },
  // items 서브트리 통째 교체 (붙여넣기·명단 초기화 = 의도적 리셋). arr 비면 노드 삭제.
  itemsReplace: (ds, arr) => set(itemsRef(ds), (arr && arr.length) ? arr.reduce((o, it) => (o[k32(it.id)] = it, o), {}) : null),
  // 오래된 날짜 정리용 (날짜 노드 목록·삭제)
  dayList: () => get(ref(db, ROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  dayRemove: ds => remove(ref(db, ROOT + '/' + ds)),
  // 명단 백업 — roster/__backup__/<날짜>/<키> = {at, n, items:[...]}
  // 무료 요금제라 Firebase 자동 백업이 없어서 앱이 스스로 스냅샷을 남긴다.
  backupPut: (ds, key, data) => set(ref(db, ROOT + '/__backup__/' + ds + '/' + key), data),
  // 이 시간 슬롯 백업이 이미 있나 — at 필드 하나만 읽는다 (덮어쓰기 전 확인용).
  backupHas: (ds, key) => get(ref(db, ROOT + '/__backup__/' + ds + '/' + key + '/at')).then(s => s.exists()),
  backupList: ds => get(ref(db, ROOT + '/__backup__/' + ds)).then(s => s.exists() ? s.val() : {}),
  backupDates: () => get(ref(db, ROOT + '/__backup__')).then(s => s.exists() ? Object.keys(s.val()) : []),
  backupDelDate: ds => remove(ref(db, ROOT + '/__backup__/' + ds)),
  // 변경 내역 — 날짜별로 따로 쌓는다. id 를 앱이 정하므로(logSet) 같은 이벤트를 여러 대가
  // 써도 같은 자리에 덮여 한 줄로 합쳐진다 (상태 변경 이벤트는 id 가 결정적).
  logSet: (ds, id, entry) => set(ref(db, LOGROOT + '/' + ds + '/' + id), entry),
  logGet: ds => get(ref(db, LOGROOT + '/' + ds)).then(s => s.exists() ? Object.values(s.val()) : []),
  logWatch: (ds, cb, fail) => { const r = ref(db, LOGROOT + '/' + ds); const h = onValue(r, s => cb(s.exists() ? Object.values(s.val()) : []), fail); return () => off(r, 'value', h); },
  logList: () => get(ref(db, LOGROOT)).then(s => s.exists() ? Object.keys(s.val()) : []),
  logRemove: ds => remove(ref(db, LOGROOT + '/' + ds)),
  // Firebase가 알려주는 실제 연결 상태
  onConnected: cb => onValue(ref(db, '.info/connected'), s => cb(s.val() === true)),
  // 연결이 죽었을 때 소켓을 끊었다 다시 붙인다
  reconnect: () => { try { goOffline(db); } catch(e){} setTimeout(() => { try { goOnline(db); } catch(e){} }, 150); }
};
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
(function(){
  'use strict';

  // dev/prod 판정 — 실제 배포(songtudy.github.io/reserve/) 일 때만 prod, 그 외 전부 dev.
  // 모듈 스크립트의 DEV 와 반드시 같은 판정 (둘 다 고쳐야 함). localStorage 스코프만 여기서 분리.
  function computeDev(host, path){
    return !(host === 'songtudy.github.io' && /^\/reserve(\/|$)/.test(path));
  }
  var IS_DEV = computeDev(location.hostname, location.pathname);
  var DAY_ROLLOVER = 0; // 자정에 날짜가 바뀐다 (마감이 자정을 넘기면 이 값을 올릴 것)
  var wrapEl = document.querySelector('.wrap');   // 명단 스크롤 영역 (앱 셸의 유일한 스크롤러)
  var state = null;      // {date, items:[]}
  var openMenu = null;
  var editing = null;
  var collapsed = {}; // 시간대별 수동 접기 상태 (미설정이면 자동)
  var touched = {};   // 시간대별 마지막 체크 시각
  var collapseTimers = {};
  var COLLAPSE_DELAY = 5000;
  var query = '';
  var backgroundRenderPending = false;
  var deferredState = null;

  function interactionActive(){ return !!(editing || openMenu); }
  function renderWhenIdle(){
    if (interactionActive()){
      backgroundRenderPending = true;
      return false;
    }
    backgroundRenderPending = false;
    render();
    return true;
  }
  function stageBackgroundState(next){
    if (interactionActive()){
      deferredState = next;   // 서버 최신 전체 상태 → 최신 것으로 덮으면 된다
      backgroundRenderPending = true;
      return false;
    }
    state = next;
    renderWhenIdle();
    return true;
  }
  function discardEditing(){
    if (!editing) return false;
    var id = editing;
    keepSlotOpenForId(id);
    var row = rowForId(id);
    var active = document.activeElement;
    if (row && active && row.contains(active) && active.blur) active.blur();
    editing = null;
    openMenu = null;
    return true;
  }

  // 접힘 규칙은 하나뿐이다 — 대기 중인 팀이 있으면 펼침, 없으면 접힘.
  // 시계는 관여하지 않는다. 보고 있는데 시간이 지났다는 이유로 접히면 곤란하니까.
  // 손으로 접거나 편 것은 그대로 두되, 대기 여부가 바뀌면 기본 규칙으로 돌아간다.
  // collapsed[time] = { v: 접힘여부, done: 그때 대기가 비어 있었나 }
  // 그 시간대가 마지막으로 바뀐 시각 — 내 손(touched)이든, 다른 폰의 체크든, 자동취소든.
  // (항목 ts 는 상태를 바꾼 폰의 시계라 기기 간 오차가 있지만 5초 유예가 흡수한다)
  function slotChangedAt(time){
    var t = touched[time] || 0;
    if (state) state.items.forEach(function(x){ if (x.time === time && (x.ts || 0) > t) t = x.ts; });
    return t;
  }
  function armSlotCollapse(time){
    if (!time) return;
    if (collapseTimers[time]) clearTimeout(collapseTimers[time]);
    var wait = Math.max(0, COLLAPSE_DELAY + 100 - (Date.now() - slotChangedAt(time)));
    collapseTimers[time] = setTimeout(function(){
      delete collapseTimers[time];
      if (!slotHasWork(time)) renderWhenIdle();
    }, wait);
  }
  function keepSlotOpenForId(id){
    var it = id && find(id);
    if (it){
      touched[it.time] = Date.now();
      armSlotCollapse(it.time);
    }
  }
  function slotHasWork(time){
    return [editing, openMenu].some(function(id){
      var it = id && find(id);
      return !!it && it.time === time;
    });
  }
  function isCollapsed(time, pendCount){
    var done = (pendCount === 0);
    if (done && slotHasWork(time)) return false;
    var o = collapsed[time];
    if (o){
      if (o.done === done) return o.v;   // 대기 상태가 그대로면 손으로 정한 대로
      delete collapsed[time];            // 대기가 생기거나 사라지면 기본 규칙으로
    }
    if (!done) return false;
    // 마지막 하나를 체크한 직후에는 손가락 밑에서 사라지지 않게 5초 둔다 (어느 폰이든)
    return Date.now() - slotChangedAt(time) > COLLAPSE_DELAY;
  }
  function setCollapsed(time, v, done){ collapsed[time] = { v: v, done: done }; }

  /* ---------- 날짜 · 시간 ---------- */
  var KEEP_DAYS = 1; // roster 는 오늘+어제만 (어제만 「지난 명단」에 보임). 로그·백업은 오늘만.

  var WEEKDAYS = ['일','월','화','수','목','금','토'];
  function pad(n){ return (n<10?'0':'') + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  // "2026-08-29" → 그 날 자정의 Date (로컬)
  function parseYmd(ds){ var p = ds.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

  // "지금" 을 Firebase 서버 시계로 보정한 epoch(ms). 서버 시계를 아직 모르면 기기 시계 그대로.
  //  → 자동취소·자정넘어감·지금시간대·백업시간대·로그시각 이 전부 이걸 쓴다.
  //  → ts(충돌 해결용)·경과시간 타이머·롱프레스 등은 기기 Date.now() 그대로 (아래 설명).
  function serverNow(){
    return Date.now() + (typeof fb === 'function' && fb() && fb().serverSkew ? fb().serverSkew() : 0);
  }
  // epoch(ms) → 한국시간(KST=UTC+9, 서머타임 없음) 벽시계 조각.
  // getUTC* 로 읽으므로 기기의 '시간대' 설정이 틀려 있어도(시각이 아니라 지역) 영향 없음.
  function kstParts(ms){
    var d = new Date(ms + 9 * 3600 * 1000);
    return { y: d.getUTCFullYear(), mon: d.getUTCMonth(), day: d.getUTCDate(),
             h: d.getUTCHours(), min: d.getUTCMinutes(), s: d.getUTCSeconds(), ms: d.getUTCMilliseconds() };
  }
  function nowParts(){ return kstParts(serverNow()); }

  // 오늘의 영업일 (KST). DAY_ROLLOVER=0 이라 자정에 넘어간다.
  // (마감이 자정을 넘기게 되면 그 시각으로 올려 그때까지는 전날로 잡는다)
  function bizDate(){
    var sn = serverNow(), t = sn + 9 * 3600 * 1000;
    if (kstParts(sn).h < DAY_ROLLOVER) t -= 86400000;   // 마감이 자정 넘길 때만 (지금은 DAY_ROLLOVER=0)
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function shiftDate(ds, n){
    var d = parseYmd(ds);
    d.setDate(d.getDate() + n);
    return ymd(d);
  }
  function dayGap(ds){ // ds 가 오늘(bizDate)로부터 며칠 떨어져 있나 (음수 = 과거)
    return Math.round((parseYmd(ds).getTime() - parseYmd(bizDate()).getTime()) / 86400000);
  }

  // viewDate 는 늘 오늘(bizDate). 날짜 전환 UI 없음 — 지난 날은 「지난 명단」 시트에서 읽기만.
  var viewDate = bizDate();

  // '9월 3일 (수)' 한 조각. 오늘밖에 없으니 '· 오늘' 같은 꼬리표는 안 붙인다.
  function prettyDate(ds){
    var p = (ds || viewDate).split('-');
    var w = WEEKDAYS[parseYmd(ds || viewDate).getDay()];
    return (+p[1]) + '월 ' + (+p[2]) + '일 (' + w + ')';
  }
  function paintDate(){
    document.getElementById('dateLabel').textContent = prettyDate();
  }

  // 순수: 날짜 키 목록에서 '지워도 되는' 것만 고른다.
  //  - 날짜 형식(YYYY-MM-DD)이 아닌 키는 무시(안 지움)
  //  - '가장 최근 날짜' 는 절대 안 지운다 (누군가의 '오늘' 일 수 있으므로 — 시계 오류 방어)
  //  - limit 보다 오래됐거나, futureLimit 이 주어졌는데 그보다 미래면 지움
  function stalePurgeDates(keys, limit, futureLimit){
    var ds = (keys || []).filter(function(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort();
    var newest = ds[ds.length - 1];
    return ds.filter(function(k){
      return k !== newest && (k < limit || (futureLimit && k > futureLimit));
    });
  }
  // 오래된 날짜 정리
  var lastPurgeAt = 0;
  function purgeOld(){
    var limit = shiftDate(bizDate(), -KEEP_DAYS);   // bizDate 는 서버 시계 기준
    purgeOldLocalLogs(limit);   // 이 기기 로컬 캐시만 — 다른 기기엔 영향 없음
    wqPurge();
    if (!hasStore()) return;
    // ↓ 여기서부터는 서버(모든 기기 공용) 데이터를 지운다. 세 겹으로 막는다:
    //  (1) 서버 시계를 아직 모르면(부팅 직후) 지우지 않는다 — bizDate 가 아직 기기 시계라서.
    //      연결되면 onConnected 에서 purgeOld 를 다시 부르므로 이때 미뤄도 곧 처리된다.
    //  (2) 서버 시계를 알아도 '가장 최근 날짜' 는 절대 안 지운다 (stalePurgeDates) — 어떤 버그든 방어.
    //  (3) 10분 내 이미 서버 정리를 했으면 건너뛴다 — 재연결이 잦아도 큰 읽기를 반복하지 않게.
    if (fb().serverSkewKnown && !fb().serverSkewKnown()) return;
    if (Date.now() - lastPurgeAt < 10 * 60000) return;
    lastPurgeAt = Date.now();
    fb().dayList().then(function(keys){
      stalePurgeDates(keys, limit).forEach(function(ds){ fb().dayRemove(ds).catch(function(){}); });
    }).catch(function(){});
    if (fb().logList){
      // 변경 내역은 「오늘」만 화면에 뜬다 → 어제 것은 안 보이는 죽은 데이터. 오늘 것만 남긴다.
      fb().logList().then(function(keys){
        stalePurgeDates(keys, bizDate(), bizDate()).forEach(function(ds){ fb().logRemove(ds).catch(function(){}); });
      }).catch(function(){});
    }
    if (fb().backupDates){
      // 백업은 오늘 것만. 자정 넘어가면 rolloverIfNeeded 가 어제 것을 바로 지우고,
      // 여기서는 놓친 경우까지 훑는다 (stalePurgeDates 가 '가장 최근 날짜' 는 남기므로,
      // 오늘 첫 백업 전이면 어제 것이 잠깐 남을 수 있다 — rollover 쪽이 이미 처리).
      fb().backupDates().then(function(keys){
        stalePurgeDates(keys, bizDate()).forEach(function(ds){ fb().backupDelDate(ds).catch(function(){}); });
      }).catch(function(){});
    }
  }

  /* ---------- 파싱 ---------- */
  function parse(text){
    var lines = String(text).split(/\r?\n/);
    var out = [], bad = [], seen = {};
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/\s+/g,' ').trim();
      if (!line) continue;
      var m = line.match(/^(\d{1,2})\s*[:.시]\s*(\d{1,2})?\s*분?\s+(.+?)\s+(\d+)\s*명\s*(.*)$/);
      if (!m){ bad.push({ no: i+1, text: line }); continue; }
      var time = pad(+m[1]) + ':' + pad(+(m[2]||0));
      var name = m[3].trim();
      var pax  = parseInt(m[4],10);
      var tail = (m[5]||'').trim();
      var memo = '';
      var mm2 = tail.match(/^(.*?)\s*\((.+)\)$/);   // 뒤에 붙은 (메모)
      if (mm2){ tail = mm2[1].trim(); memo = mm2[2].trim(); }
      var status = 'pending';
      if (tail === '취소') status = 'cancelled';
      else if (tail === '방문') status = 'arrived';
      else if (tail){ bad.push({ no: i+1, text: line }); continue; }  // 뒤에 붙은 알 수 없는 말
      var hh = +m[1], mm = +(m[2]||0);
      if (hh > 23 || mm > 59 || pax < 1){ bad.push({ no: i+1, text: line }); continue; }
      var base = time + '|' + name + '|' + pax;
      seen[base] = (seen[base]||0) + 1;
      out.push({ id: base + '|' + seen[base], time:time, name:name, pax:pax, memo:memo, status:status, ts:0, seq: out.length });
    }
    out.bad = bad;
    return out;
  }

  function sortItems(a,b){
    if (a.time !== b.time) return a.time < b.time ? -1 : 1;
    return (a.seq||0) - (b.seq||0);
  }

  // 지금 상태에서 그 시간대에 속한 예약들.
  function itemsAt(time){
    return state ? state.items.filter(function(x){ return x.time === time; }) : [];
  }
  // 예약을 시간대별로 묶는다 (입력은 이미 sortItems 로 정렬돼 있어야 한다).
  function groupByTime(items){
    var gs = [], gi = {};
    (items || []).forEach(function(it){
      if (gi[it.time] === undefined){ gi[it.time] = gs.length; gs.push({ time: it.time, items: [] }); }
      gs[gi[it.time]].items.push(it);
    });
    return gs;
  }
  // 「지금 시간대」 — 아직 안 지났고(slotLive) 대기 팀이 남은 첫 시간대.
  function liveNowTime(groups){
    var now = nowMin();
    for (var i = 0; i < groups.length; i++){
      if (!slotLive(groups[i].time, now)) continue;
      if (groups[i].items.some(function(x){ return x.status === 'pending'; })) return groups[i].time;
    }
    return null;
  }

  /* ---------- 저장소 (Firebase Realtime Database) ---------- */
  function fb(){ return window.__fb; }
  function hasStore(){ return !!fb(); }

  /* 명단은 예약별 노드(roster/<날짜>/items/<해시>)로 저장한다. 각 변경은 그 노드 하나만
     즉시 쓴다 — 두 기기가 다른 예약을 동시에 바꿔도 서로 안 겹치고, 같은 예약이면
     itemMerge 가 get→조건부 update() 로 필드 단위로 합친다(트랜잭션 아님 — 콜드 캐시에서
     abort). 하루치를 통째로 읽고-합치고-덮어쓰던 merge/rosterTs/staging 은 없앴다. */
  var unwatch = null;
  var rosterLoadEpoch = 0;
  function loadTicket(){ return { epoch: ++rosterLoadEpoch, date: viewDate }; }
  function ticketCurrent(ticket){
    return ticket.epoch === rosterLoadEpoch && ticket.date === viewDate;
  }
  function stopWatch(){
    if (unwatch){ unwatch(); unwatch = null; }
  }
  function itemsToState(ds, res){
    var arr = (res.items || []).filter(function(it){ return it && it.id && it.time; });
    return { date: ds, items: arr.slice().sort(sortItems) };
  }
  var migratedDates = {};   // 구→신 형식 변환은 날짜당 한 번만 시도
  // 화면에 영향 주는 필드만으로 비교 (ts 는 쓸 때마다 바뀌고 표시엔 무관 → 제외)
  function itemsSig(items){
    return (items || []).map(function(it){
      return [it.id, it.time, it.name, it.pax, it.memo || '', it.status, it.seq || 0].join('');
    }).join('');
  }
  function applyRemoteItems(ds, res){
    if (ds !== viewDate) return;
    var next = itemsToState(ds, res);
    // 구 형식(items 가 배열)이면 신 형식(해시 키 객체)으로 1회 변환해 둔다.
    if (res.legacy && next.items.length && hasStore() && !migratedDates[ds]){
      migratedDates[ds] = 1;
      fb().itemsReplace(ds, next.items).catch(function(){ migratedDates[ds] = 0; });
    }
    // 서버가 기준. 단 두 가지는 내 쪽을 유지한다:
    //  1) 서버에도 있는 항목인데 내가 방금 바꾼 게 더 최신(ts 비교)
    //  2) 아직 서버로 못 간 내 변경 — 큐(wqMap)에 put 이면 화면에 유지, del 이면 화면에서 뺀다.
    //     (왕복 사이에 다른 기기 변경이 끼어들어도, 방금 추가/삭제한 예약이 깜빡이지 않게)
    if (state && state.date === ds){
      var srv = {}; next.items.forEach(function(it){ srv[it.id] = it; });
      state.items.forEach(function(loc){
        var s = srv[loc.id];
        var q = wqMap[wqk(ds, loc.id)];
        if (s && (loc.ts || 0) > (s.ts || 0)) srv[loc.id] = loc;
        else if (!s && q && q.op === 'put') srv[loc.id] = loc;
      });
      Object.keys(wqMap).forEach(function(k){
        var q = wqMap[k];
        if (q && q.date === ds && q.op === 'del') delete srv[q.id];
      });
      next.items = Object.keys(srv).map(function(k){ return srv[k]; }).sort(sortItems);
    }
    if (state && state.date === ds && itemsSig(next.items) === itemsSig(state.items)) return;
    stageBackgroundState(next);
  }
  function watchRemote(){
    stopWatch();
    if (!hasStore()) return;
    var watchDate = viewDate;
    unwatch = fb().itemsWatch(watchDate, function(res){
      if (watchDate !== viewDate) return;
      applyRemoteItems(watchDate, res);
    });
  }
  function sync(){
    var syncDate = viewDate;
    if (!hasStore()) return Promise.resolve();
    return fb().itemsGet(syncDate).then(function(res){
      applyRemoteItems(syncDate, res);
    }).catch(function(){});
  }

  /* ---------- 오프라인 쓰기 큐 (예약 노드) ----------
     Firebase RTDB 웹 SDK 는 오프라인 쓰기를 메모리에만 큐잉 → 새로고침·앱 종료를 못 버틴다.
     예약 변경(방문·취소·메모·추가·삭제)을 localStorage 에도 남겨, 다시 떴을 때 서버보다
     새 것만(ts 비교) 재적용한다. 붙여넣기·초기화 같은 통짜 교체는 큐에 넣지 않고 큐만 비운다.
     변경 내역 log 는 별도 아웃박스가 담당하고 재적용 시 다시 기록하지 않으므로,
     여러 기기가 겹쳐도 「최근 변경 내역」이 중복되지 않는다. */
  var WQ_KEY = 'ix-wq-v1:' + (IS_DEV ? 'dev' : 'prod');
  var WQ_OP_TIMEOUT = 10000;
  var WQ_MAX_IDLE_RETRY = 20;   // 이만큼 연속으로 한 건도 못 보내면 자동 재시도만 멈춘다.
  var wqMap = wqRead();          // 큐는 그대로 둔다 — 앱 복귀·재연결·새 변경 때 wqWake 가 다시 시도한다.
  var wqTimer = null, wqDelay = 3000, wqBusy = false, wqIdleFails = 0;

  function wqRead(){
    try {
      var v = JSON.parse(localStorage.getItem(WQ_KEY) || '{}');
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } catch(e){ return {}; }
  }
  function wqSave(){
    try {
      if (Object.keys(wqMap).length) localStorage.setItem(WQ_KEY, JSON.stringify(wqMap));
      else localStorage.removeItem(WQ_KEY);
    } catch(e){
      try { localStorage.removeItem(LOG_CACHE_KEY); localStorage.setItem(WQ_KEY, JSON.stringify(wqMap)); }
      catch(e2){}
    }
  }
  function wqk(date, id){ return date + '|' + id; }
  function wqMerge(a, b){ var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; }

  // prev(없으면 null)에 새 변경을 얹은 큐 엔트리 (순수 — 저장·전송 안 함).
  // 객체는 항상 복사해 담는다 (state.items 의 항목과 참조를 공유하지 않게).
  function wqEntry(prev, date, id, op, payload){
    var ts = (payload && payload.ts) || Date.now();
    var pts = Math.max(ts, (prev && prev.ts) || 0);
    if (op === 'del') return { date: date, id: id, op: 'del', ts: ts };
    if (op === 'put') return { date: date, id: id, op: 'put', item: wqMerge(payload.item, {}), ts: pts };
    var patch = payload.patch;                              // op === 'patch'
    if (prev && prev.op === 'del') return prev;             // 삭제가 걸려 있으면 삭제 유지 (put 만 덮음)
    if (prev && prev.op === 'patch')
      return { date: date, id: id, op: 'patch', patch: wqMerge(prev.patch, patch), ts: pts };
    if (prev && prev.op === 'put')
      return { date: date, id: id, op: 'put', item: wqMerge(prev.item, patch), ts: pts };
    return { date: date, id: id, op: 'patch', patch: wqMerge(patch, {}), ts: ts };
  }
  function wqPush(id, op, payload){
    var date = viewDate, k = wqk(date, id);
    wqMap[k] = wqEntry(wqMap[k] || null, date, id, op, payload);
    wqSave();
    wqIdleFails = 0;   // 새 변경 = 지금은 보낼 수 있다고 보고 재시도를 다시 연다
    wqFlush();
  }
  function wqValid(e){
    // 큐는 늘 오늘 것만 만든다. 자정 직전 오프라인 쓰기가 자정 직후 올라오는 경우까지
    // (어제로) 받아주되, 그보다 오래됐거나 미래면 버린다.
    return e && /^\d{4}-\d{2}-\d{2}$/.test(e.date)
      && e.date >= shiftDate(bizDate(), -1)
      && e.date <= bizDate();
  }
  function wqPurge(){
    var changed = false;
    Object.keys(wqMap).forEach(function(k){ if (!wqValid(wqMap[k])){ delete wqMap[k]; changed = true; } });
    if (changed) wqSave();
  }
  function wqClearDate(date){
    var changed = false;
    Object.keys(wqMap).forEach(function(k){ if (wqMap[k] && wqMap[k].date === date){ delete wqMap[k]; changed = true; } });
    if (changed) wqSave();
  }
  function wqSchedule(){
    if (wqTimer || !hasStore() || !Object.keys(wqMap).length) return;
    var wait = wqDelay;
    wqDelay = Math.min(wqDelay * 2, 60000);
    wqTimer = setTimeout(function(){ wqTimer = null; wqFlush(); }, wait);
  }
  function wqWake(){
    if (wqTimer){ clearTimeout(wqTimer); wqTimer = null; }
    wqDelay = 3000;
    wqIdleFails = 0;   // 앱 복귀·재연결·다른 탭 변경 — 다시 보낼 만한 계기가 생겼다
    wqFlush();
  }
  function wqOnce(p){          // 각 쓰기에 시한을 둬 오프라인에서 매달리지 않게
    return new Promise(function(res){
      var t = setTimeout(function(){ res(false); }, WQ_OP_TIMEOUT);
      p.then(function(v){ clearTimeout(t); res(v !== false); }, function(){ clearTimeout(t); res(false); });
    });
  }
  function wqFlush(){
    if (wqBusy || !hasStore() || window.__ixTest) return;
    var keys = Object.keys(wqMap);
    if (!keys.length) return;
    wqBusy = true;
    var okCount = 0;
    Promise.all(keys.map(function(k){
      var e = wqMap[k];
      if (!wqValid(e)){ delete wqMap[k]; return Promise.resolve(); }
      var call;
      try {
        call = e.op === 'del' ? wqOnce(fb().itemDel(e.date, e.id).then(function(){ return true; }))
             : e.op === 'put' ? wqOnce(fb().itemMerge(e.date, e.id, e.item, e.ts, true))
             :                  wqOnce(fb().itemMerge(e.date, e.id, e.patch, e.ts, false));
      } catch(err){ return Promise.resolve(); }   // 큐 막힘 방지 — 다음 flush 에서 재시도
      return call.then(function(applied){
        if (!applied) return;
        okCount++;
        // 보내는 사이 같은 예약에 새 변경이 얹혔으면(wqEntry 가 새 객체 반환) 그건 다음 flush 로.
        if (wqMap[k] === e) delete wqMap[k];
      });
    })).then(done, done);   // Promise.all 은 여기서 거부되지 않지만(각 항목이 늘 resolve), 대비해 같은 마무리
    function done(){
      wqBusy = false;
      wqSave();
      var left = Object.keys(wqMap).length;
      if (okCount){ wqDelay = 3000; wqIdleFails = 0; }   // 하나라도 나갔으면 정상으로 본다
      else if (left) wqIdleFails++;                      // 한 건도 못 보냄 = 연속 실패 누적
      // 큐가 남았고 아직 포기 문턱 전이면 백오프 재시도를 건다.
      // 문턱을 넘으면 타이머만 멈춘다 — 큐는 유지되고 wqWake(복귀·재연결·새 변경)가 다시 연다.
      if (left && wqIdleFails < WQ_MAX_IDLE_RETRY) wqSchedule();
    }
  }

  // 다른 탭이 큐에 얹었을 수 있다. 큐는 키 하나에 map 전체라, 통째로 갈아치우면 두 탭이
  // 거의 동시에 얹을 때 한쪽이 사라질 수 있다 → 들어온 것을 병합만 한다(ts 큰 쪽 우선).
  // 다른 탭이 지운 항목은 우리한테 남지만, 재전송해도 itemMerge 가 ts 로 걸러 무해하다.
  window.addEventListener('storage', function(e){
    if (e.key !== WQ_KEY || wqBusy) return;
    var incoming = wqRead(), touched = false;
    Object.keys(incoming).forEach(function(k){
      var mine = wqMap[k], theirs = incoming[k];
      if (!mine || (theirs.ts || 0) >= (mine.ts || 0)){ wqMap[k] = theirs; touched = true; }
    });
    if (touched){ wqSave(); wqWake(); }
  });

  // 한 예약 노드에 부분 변경(상태·메모 등)을 반영한다. 실제 전송은 큐가 맡는다.
  function writeItem(id, patch){ wqPush(id, 'patch', { patch: patch, ts: patch && patch.ts }); }
  // 예약 하나를 통째로 쓴다 (새 예약 추가).
  function putItem(item){ wqPush(item.id, 'put', { item: item, ts: item.ts }); }
  function delItem(id){ wqPush(id, 'del', { ts: Date.now() }); }
  // 명단을 통째로 새로 쓴다 (붙여넣기·초기화). 개별 대기분은 이 교체가 덮으니 큐에서 버린다.
  function replaceItems(arr){
    wqClearDate(viewDate);
    if (!hasStore()) return;
    var ds = viewDate;
    fb().itemsReplace(ds, arr).catch(function(){});
  }

  /* ---------- 명단 백업 ----------
     roster/__backup__/<날짜>/<키> 에 명단 스냅샷을 남긴다. 매시간 :20 (자동취소 :15 뒤).
     한 시간 슬롯(h12..h19)은 한 번 만들어지면 안 건드린다 — 첫 저장이 그 시간의 기록.
     앱을 껐다 켜거나 다른 폰이 붙어도, 있던 스냅샷을 지금 상태로 덮어쓰지 않는다.
     하루 최대 8개. 자정 넘어가면 rolloverIfNeeded 가 어제 백업을 지운다 (오늘 것만 유지).
     되돌리기는 없다 — 「지난 명단」에서 그 시점 명단을 단톡방 양식으로 복사해 붙여넣으면 된다. */
  var BACKUP_MAX_TRIES = 3;                                        // 한 시간 안에서 재시도(확인·쓰기) 한도
  var backupState = { hour: -1, tries: 0, triesHour: -1 };         // hour = 이번 세션에서 처리 끝난 시간

  function doBackup(key, done){
    if (!connReady() || !state || !state.items.length){ if (done) done(false); return; }
    var ds = viewDate;
    var snap = {
      at: serverNow(),   // 어느 폰이 남겼든 시트에 같은 시각으로 보이게
      n: state.items.length,
      items: state.items.map(function(it){ return wqMerge(it, {}); })
    };
    // wqOnce = 10초 시한. 오프라인에서 set() 프로미스가 매달려 콜백이 안 풀리는 걸 막는다.
    wqOnce(fb().backupPut(ds, key, snap).then(function(){ return true; })).then(function(ok){
      if (done) done(ok);
    });
  }
  // 5초 인터벌에서 autoCancel 다음에 부른다
  function maybeHourlyBackup(){
    if (!connReady() || !state || !state.items.length) return;  // 빈 명단은 백업 안 함
    var p = nowParts(), h = p.h;                            // KST · 서버 시계
    if (h < 12 || h > 19 || p.min < 20) return;             // 영업 12~19시대, 매시 :20 이후 한 번
    if (backupState.hour === h) return;                     // 이 시간엔 이미 처리(서버 확인 중 포함)
    if (backupState.triesHour !== h){ backupState.tries = 0; backupState.triesHour = h; }  // 새 시간 = 카운터 리셋
    backupState.hour = h;                                   // 확인 끝날 때까지 재진입 막기
    // 이 시간 백업이 서버에 이미 있으면 그대로 둔다. 없을 때만 새로 만든다.
    fb().backupHas(viewDate, 'h' + h).then(function(exists){
      if (exists) return;                                   // 이미 있음 → 이 시간 끝
      doBackup('h' + h, function(ok){
        if (ok) return;
        // 쓰기 실패 — 이 시간 안에서 BACKUP_MAX_TRIES 번까지만 재시도 (hour=-1 → 다음 틱).
        if (++backupState.tries < BACKUP_MAX_TRIES) backupState.hour = -1;
      });
    }).catch(function(){
      // 확인 실패 — 마찬가지로 몇 번만 다시 (계속 실패해도 5초마다 무한히 두드리지 않게).
      if (++backupState.tries < BACKUP_MAX_TRIES) backupState.hour = -1;
    });
  }
  // 백업은 오늘 것만 보관하므로(purgeOld) 시각만 보인다. at 은 serverNow() 라 KST 로 읽는다.
  function backupWhen(at){
    var p = kstParts(at);
    return pad(p.h) + ':' + pad(p.min);
  }

  // 연결 표시는 Firebase가 알려주는 실제 상태만 반영한다.
  // 개별 읽기·쓰기 실패로는 켜지 않는다 — 잠깐 끊겼다 붙는 동안 계속 떠 있게 되므로.
  var online = false;
  function connReady(){ return online && hasStore(); }
  // 서랍 하단의 연결 표시 한 줄. setSync·openDrawer 가 부른다.
  function paintConn(){
    var cf = document.getElementById('dwConn');
    if (!cf) return;
    var ready = connReady();
    cf.className = 'dwfoot' + (ready ? '' : ' off');
    cf.innerHTML = '<span class="dot' + (ready ? '' : ' stale') + '"></span>'
      + (ready ? '연결됨' : '연결 안 됨');
  }
  function setSync(ok){
    if (ok !== undefined) online = ok;
    var d = document.documentElement;
    if (connReady()) d.removeAttribute('data-off');
    else d.setAttribute('data-off', '');
    paintConn();
  }

  /* ---------- 렌더 ---------- */
  // 상단 시간이 다음으로 넘어가는 기준
  //  - 정각(00분) 예약: 11분 지나면
  //  - 비정각 예약   : 그 시각이 되면 (5초)
  // 어느 쪽이든 그 시간대를 다 체크하면 그 즉시 넘어간다.
  var GRACE_ON_HOUR = 11, GRACE_OFF_HOUR = 5/60;
  var AUTO_CANCEL_MIN = 15;    // 예약 시각에서 이만큼 지나도 체크가 없으면 취소 (직원 :10 컷의 백스톱)
  var AUTO_CANCEL_WINDOW = 1;  // 그 순간에만 한 번. 지나간 시간대를 뒤늦게 훑지 않는다

  // 예약 시간 선택 범위 — 예약 추가·수정 폼 공용. (영업 11:45–21:00, 예약 12–19시,
  // 변경으로 20시까지 받을 수 있음). 범위 밖의 기존 예약은 수정 폼이 그 값을 따로 넣어준다.
  var HOUR_MIN = 12, HOUR_MAX = 20;
  function hourOptions(){
    var s = '';
    for (var h = HOUR_MIN; h <= HOUR_MAX; h++) s += '<option value="' + pad(h) + '">' + pad(h) + '</option>';
    return s;
  }

  // 지금이 그 날의 몇 분째인가 (KST, 서버 시계 기준). 자동취소·지금시간대 판정에 쓴다.
  function nowMin(){
    var p = nowParts();
    return p.h * 60 + p.min + p.s / 60 + p.ms / 60000;
  }
  function slotMin(hm){
    var p = hm.split(':');
    return (+p[0])*60 + (+p[1]);
  }
  function slotLive(hm, now){
    var m = slotMin(hm);
    var grace = (m % 60 === 0) ? GRACE_ON_HOUR : GRACE_OFF_HOUR;
    return now < m + grace;
  }

  // 방문·취소·대기 팀 수를 센다. 여러 곳에서 같은 계산을 한다.
  function tallyStatus(items){
    var came = 0, off = 0;
    (items || []).forEach(function(x){
      if (x.status === 'arrived') came++;
      else if (x.status === 'cancelled') off++;
    });
    return { came: came, off: off, pend: (items ? items.length : 0) - came - off, total: items ? items.length : 0 };
  }

  // 하루가 끝났을 때 방문 / 취소가 각각 몇 팀이었는지.
  // 「17/17」만으로는 몇 팀이 실제로 왔는지 알 수 없다.
  function dayTally(items){
    var t = tallyStatus(items);
    var out = ['<span class="pc tally-go">방문 ' + t.came + '</span>'];
    if (t.off) out.push('<span class="pc tally-off">취소 ' + t.off + '</span>');
    return out.join('<span class="pcsep"> · </span>');
  }
  // 시간대 머리글의 「n/n · 방문 n · 취소 n」 — render 와 patchStatus 가 같이 쓴다.
  function slotMetaHtml(items){
    var t = tallyStatus(items);
    return '<b>' + (t.came + t.off) + '/' + t.total + '</b>'
      + '<span class="gbreak">방문 ' + t.came + (t.off ? ' · 취소 ' + t.off : '') + '</span>';
  }

  // 상단 요약과 진행도만 다시 그린다 (목록은 건드리지 않는다)
  function paintHead(){
    paintDate();
    var all = state ? state.items.slice().sort(sortItems) : [];
    var gs = groupByTime(all);
    var nowTime = liveNowTime(gs);
    var slotPend = [];
    if (nowTime){
      gs.forEach(function(g){
        if (g.time === nowTime) slotPend = g.items.filter(function(x){ return x.status === 'pending'; });
      });
    }
    var leadRow = document.querySelector('.lead');
    var st = document.getElementById('slotTime');
    var lb = document.querySelector('.slotlab');
    var lm = document.getElementById('leadMain');
    var ls = document.getElementById('leadSub');

    if (slotPend.length){
      st.textContent = nowTime;
      lb.textContent = '예약';
      lm.className = 'leadmain num';
      lm.textContent = slotPend.length + '팀';
      var byPax = {};
      slotPend.forEach(function(x){ byPax[x.pax] = (byPax[x.pax] || 0) + 1; });
      ls.className = 'leadsub num';
      ls.innerHTML = Object.keys(byPax).map(Number).sort(function(a, b){ return a - b; })
        .map(function(p){ return '<span class="pc">' + p + '인 ' + byPax[p] + '팀</span>'; })
        .join('<span class="pcsep"> · </span>');
    } else {
      st.textContent = ''; lb.textContent = '';
      lm.className = 'leadmain num done';
      lm.textContent = all.length ? '남은 예약 없음' : '';
      ls.className = 'leadsub num tally';
      ls.innerHTML = all.length ? dayTally(all) : '';
    }
    if (leadRow) leadRow.classList.toggle('hide', !st.textContent && !lm.textContent);

    var t = tallyStatus(all), done = t.came + t.off;
    var dp = document.getElementById('dayProg');
    dp.textContent = done + '/' + all.length;
    dp.className = 'dayprog num' + (all.length ? '' : ' hide')
      + (all.length && done === all.length ? ' full' : '');
  }

  function render(){
    if (!interactionActive() && deferredState){
      state = deferredState;
      deferredState = null;
    }
    backgroundRenderPending = !!deferredState;
    var list = document.getElementById('list');   // 날짜 라벨은 아래 paintHead() 가 그린다
    var all = state ? state.items.slice().sort(sortItems) : [];
    var q = (query || '').trim().toLowerCase();
    var items = q
      ? all.filter(function(it){ return it.name.toLowerCase().indexOf(q) !== -1; })
      : all;

    var qc = document.getElementById('qCount');
    if (q){
      qc.classList.remove('hide');
      qc.className = 'qcount' + (items.length ? '' : ' zero');
      qc.textContent = items.length + '건';
    } else {
      qc.classList.add('hide');
    }

    // 시간대 묶기 — 표시용(groups)은 검색 결과, 계산용(allGroups)은 전체
    var groups = groupByTime(items);
    var allGroups = q ? groupByTime(all) : groups;
    var nowTime = liveNowTime(allGroups);

    paintHead();

    // 명단이 없으면 하단 메뉴와 검색은 할 일이 없다
    var allCount = all.length;
    var footEl = document.querySelector('.foot');
    if (footEl) footEl.classList.toggle('hide', !allCount);
    searchBtn.classList.toggle('off', !allCount);
    if (!allCount && !searchbar.classList.contains('hide')) closeSearch(false);

    // 목록
    list.innerHTML = '';
    var em = document.getElementById('emptyMsg');
    if (!items.length){
      if (q){
        em.classList.remove('hide');
        em.textContent = '「' + query.trim() + '」 검색 결과가 없습니다';
      } else {
        em.classList.add('hide');
        if (state && panel.classList.contains('hide')) openPaste(true);
        document.body.classList.toggle('paste-open', !panel.classList.contains('hide'));
      }
      return;
    }
    em.classList.add('hide');

    // 다른 기기에서 명단이 들어오면 이쪽 붙여넣기 창은 닫는다.
    // 단, 내가 직접 입력하던 중이면 건드리지 않는다.
    if (!panel.classList.contains('hide') && !taEl.value.trim()) closePaste();

    var openCount = 0;
    groups.forEach(function(g){
      var pendN = tallyStatus(g.items).pend;
      var shut = q ? false : isCollapsed(g.time, pendN);
      // 완료됐는데 아직 5초 유예 중이면, 유예가 끝나는 시점에 접히도록 타이머를 걸어둔다.
      // (직접 체크한 폰은 keepSlotOpenForId 가 이미 걸었고, 다른 폰·자동취소는 여기서 건다)
      if (!q && !pendN && !shut && !collapseTimers[g.time] && !slotHasWork(g.time)
          && Date.now() - slotChangedAt(g.time) <= COLLAPSE_DELAY){
        armSlotCollapse(g.time);
      }

      var sec = document.createElement('section');
      sec.className = 'group' + (g.time === nowTime ? ' now' : (pendN ? '' : ' done')) + (shut ? ' shut' : '');
      sec.setAttribute('data-time', g.time);

      var head = document.createElement('button');
      head.className = 'ghead';
      head.type = 'button';
      head.innerHTML = '<span class="chev"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg></span>'
        + '<span class="gtime num">' + g.time + '</span>'
        + '<span class="gline"></span>'
        + '<span class="gmeta num">' + slotMetaHtml(g.items) + '</span>';
      head.setAttribute('data-time', g.time);
      head.addEventListener('click', function(e){
        if (takeGhostClick(e)) return;
        toggleSlot(g.time);
      });
      sec.appendChild(head);

      if (!shut) g.items.forEach(function(it){ sec.appendChild(rowEl(it)); });
      list.appendChild(sec);
      openCount += shut ? 0 : 1;
    });

    var foldBtnEl = document.getElementById('foldBtn');
    if (foldBtnEl) foldBtnEl.textContent = openCount ? '전체 접기' : '전체 펼치기';

    // paste-open 은 붙여넣기 화면 여부. 창 상태와 어긋나 헤더가 계속 숨는 걸 막는다.
    document.body.classList.toggle('paste-open', !panel.classList.contains('hide'));
  }

  // 명단은 .wrap 안에서만 스크롤된다. 대상이 스크롤러 밖으로 벗어나 있으면 최소한으로
  // 스크롤해 보이게 한다. (상·하단 바는 스크롤러 밖이라 높이를 손으로 뺄 필요가 없다.)
  // 기본은 동기(즉시) — render() 직후 같은 tick 에 부르면 브라우저가 한 번만 그려
  // 중간에 엉뚱한 스크롤 위치가 프레임에 안 보인다.
  // smooth=true 는 사용자가 ⋯·수정·시간대펼치기로 가려진 걸 여는 경우 — 부드럽게 미끄러진다.
  // 단, 이동이 짧으면(SMOOTH_MIN 미만) 즉시로 처리한다. 몇십 px 를 부드럽게 굴리면 render 직후
  // 프레임과 겹쳐 오히려 버벅여 보인다 (특히 sticky 헤더에 살짝 가린 행).
  var SMOOTH_MIN = 44;
  function roomScroll(el, smooth){
    if (!el || !wrapEl) return;
    var er = el.getBoundingClientRect();
    var wr = wrapEl.getBoundingClientRect();
    // .ghead 는 sticky(top:0)라 스크롤러 위쪽 한 줄을 늘 덮는다. 그만큼 여유를 둔다
    var group = el.closest && el.closest('.group');
    var gh = group && group.querySelector('.ghead');
    var isGroup = el.classList && el.classList.contains('group');
    var pad = (gh && !isGroup ? gh.offsetHeight : 0);
    var topEdge = wr.top + pad + 8;
    var bottomEdge = wr.bottom - 10;
    var move = 0;
    if (er.height > bottomEdge - topEdge || er.top < topEdge) move = er.top - topEdge;
    else if (er.bottom > bottomEdge) move = er.bottom - bottomEdge;
    if (Math.abs(move) <= 1) return;
    if (smooth && Math.abs(move) >= SMOOTH_MIN && wrapEl.scrollTo) wrapEl.scrollTo({ top: wrapEl.scrollTop + move, behavior: 'smooth' });
    else wrapEl.scrollTop += move;
  }

  function rowForId(id){
    var rows = document.querySelectorAll('.row');
    for (var i = 0; i < rows.length; i++){
      if (rows[i].getAttribute('data-id') === id) return rows[i];
    }
    return null;
  }

  // Android 계열이 사라진 메뉴 버튼의 포커스를 첫 입력칸으로 넘기지 않게 한다.
  function neutralFocusEdit(id){
    var active = document.activeElement;
    if (active && active.blur) active.blur();
    requestAnimationFrame(function(){
      var row = rowForId(id);
      var form = row && row.querySelector('.edit');
      if (!form) return;
      form.setAttribute('tabindex', '-1');
      try { form.focus({ preventScroll: true }); }
      catch(e){ form.focus(); }
    });
  }

  // ⋯·수정을 눌러 가려져 있던 행을 열 때 — 부드럽게 스크롤해 보여준다.
  function ensureVisible(id){
    roomScroll(rowForId(id), true);
  }

  // 수정 폼이 닫힌 뒤 스크롤을 딱 한 번 맞춘다. 호출한 쪽이 이미 알맞은 시점까지 미뤄
  // 놓으므로(rAF 또는 키보드 완전히 내려간 뒤) 여기선 바로 옮긴다.
  //  - reveal=true  (시간이 바뀌어 다른 자리로 이동): 무조건 그 행을 화면에 보여준다.
  //  - reveal=false (제자리 수정): 폼이 접히며 .wrap 이 줄어 그 행(과 아래)이 하단 바에
  //    가릴 수 있어, 명단 끝 근처면 마지막 행을 바 위로 올리고 아니면 그 행을 맞춘다.
  var pendingClose = null;
  function scrollAfterClose(o){
    if (!wrapEl || !o) return;
    var el = rowForId(o.id);
    if (!o.reveal && el){
      var rows = wrapEl.querySelectorAll('.row');
      var idx = [].indexOf.call(rows, el);
      var maxST = wrapEl.scrollHeight - wrapEl.clientHeight;
      // 폼이 접히며 아래 내용이 하단 바에 가릴 수 있는 건 목록 끝쪽 행을 고쳤을 때뿐이다.
      // 위·가운데 행이면 그 행만 맞춘다 — 끝 행으로 스크롤하면 첫 행이 시간 머리글 뒤로 숨는다.
      if (idx >= rows.length - 2 && maxST > 0 && maxST - wrapEl.scrollTop < wrapEl.clientHeight){
        el = rows[rows.length - 1];
      }
    }
    if (el) roomScroll(el);
  }
  // 폼을 닫는 모든 경로에서 호출: 키보드가 올라와 있으면 완전히 내려앉은 뒤로 미룬다
  // (applyViewport 가 --kb 0 을 보는 시점), 아니면 바로.
  function afterEditClose(id, reveal){
    var o = { id: id, reveal: !!reveal };
    if (!keyboardOpen){ requestAnimationFrame(function(){ scrollAfterClose(o); }); return; }
    pendingClose = o;
    // --kb 0 시점을 놓쳤을 때의 백스톱 (그때는 이미 실행돼 pendingClose 가 비어 no-op)
    setTimeout(function(){ if (pendingClose === o){ pendingClose = null; scrollAfterClose(o); } }, 700);
  }

  // 수정 폼을 닫으며 다시 그릴 때, 그 행이 화면에서 제자리에 있도록 스크롤을 보정한다.
  // 폼(높이 큼) → 행(작음)으로 접히면서 아래 내용이 위로 튀는 걸 막는다.
  function renderAnchored(id){
    var row = rowForId(id);
    var before = (row && wrapEl) ? row.getBoundingClientRect().top : null;
    render();
    if (before == null || !wrapEl) return;
    var after = rowForId(id);
    if (!after) return;
    var delta = after.getBoundingClientRect().top - before;
    if (Math.abs(delta) > 1) wrapEl.scrollTop += delta;
  }

  var ICON_GO = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"'
    + ' stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>';
  var ICON_OFF = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"'
    + ' stroke-width="3.4" stroke-linecap="round"><path d="M7 7 L17 17M17 7 L7 17"/></svg>';
  // 세 점 — 가로(⋯)는 행 메뉴 버튼, 세로(⋮)는 설치 안내. 같은 모양으로.
  function dots3(vertical){
    var c = vertical
      ? '<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>'
      : '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>';
    return '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">' + c + '</svg>';
  }
  function statusTag(st){
    return st === 'arrived' ? '<span class="tag arrived">방문</span>'
         : st === 'cancelled' ? '<span class="tag cancelled">취소</span>' : '';
  }

  function tapMore(id){
    keepSlotOpenForId(id);
    if (editing === id){               // 같은 행이면 저장하지 않고 접는다
      editing = null; openMenu = null; renderAnchored(id); afterEditClose(id);
      return;
    }
    if (editing){                       // 다른 행의 수정 폼 닫기 = 폼 DOM 을 제거해야 하니 통째로 그린다
      keepSlotOpenForId(editing);
      editing = null;
      openMenu = (openMenu === id) ? null : id;
      render();
      if (openMenu) ensureVisible(id);
      return;
    }
    // 수정 중이 아니면 메뉴 토글은 그 행만 손댄다 (통째 render 안 함)
    if (openMenu && openMenu !== id) keepSlotOpenForId(openMenu);
    openMenu = (openMenu === id) ? null : id;
    if (openMenu){
      openRowMenu(id);
    } else {
      closeRowMenu();
      if (deferredState && !interactionActive()) render();   // 메뉴 닫히면 밀려 있던 서버 상태 반영
    }
  }

  function runMenuAction(id, action, status){
    var it = find(id);
    if (!it) return;
    keepSlotOpenForId(id);
    if (action === 'status'){
      setStatus(id, status);
      return;
    }
    if (action === 'edit'){
      if (typeof searchbar !== 'undefined' && !searchbar.classList.contains('hide')){
        closeSearch(false);
        backDone();
      }
      pendingClose = null;   // 이전 폼 닫힘 보정이 남아 새 편집을 튀게 하지 않도록
      editing = id; openMenu = null; render();
      neutralFocusEdit(id);
      ensureVisible(id);
      return;
    }
    if (action === 'delete'){
      logAdd('삭제', it.time + ' ' + it.name);
      state.items = state.items.filter(function(x){ return x.id !== id; });
      openMenu = null; render();
      delItem(id);
      toast(it.time + ' ' + it.name + ' 삭제됨');
    }
  }

  function rowEl(it){
    var row = document.createElement('div');
    row.setAttribute('data-id', it.id);
    row.className = 'row ' + it.status;

    var body = document.createElement('div');
    body.className = 'rbody';

    var top = document.createElement('div');
    top.className = 'rtop';

    // 방문 체크는 왼쪽 체크 칸에서만 된다.
    // 행 전체가 버튼이면 목록을 훑다가 잘못 눌리는 일이 생긴다.
    var mark = it.status === 'arrived' ? ICON_GO
             : it.status === 'cancelled' ? ICON_OFF : '';
    var tag = statusTag(it.status);
    var main = document.createElement('button');
    main.className = 'main';
    main.type = 'button';
    main.setAttribute('aria-label', it.name + ' 방문 체크');
    main.innerHTML = '<span class="check">' + mark + '</span>';

    var info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = '<span class="who"><span class="name"></span>'
      +   (it.memo ? '<span class="memo"></span>' : '') + '</span>'
      + tag
      + '<span class="pax num">' + it.pax + '명</span>';
    var memoEl = info.querySelector('.memo');
    if (memoEl) memoEl.textContent = it.memo;
    var nameEl = info.querySelector('.name');
    var qq = (query||'').trim().toLowerCase();
    var hit = qq ? it.name.toLowerCase().indexOf(qq) : -1;
    if (hit >= 0){
      nameEl.appendChild(document.createTextNode(it.name.slice(0, hit)));
      var mk = document.createElement('mark');
      mk.textContent = it.name.slice(hit, hit + qq.length);
      nameEl.appendChild(mk);
      nameEl.appendChild(document.createTextNode(it.name.slice(hit + qq.length)));
    } else {
      nameEl.textContent = it.name;
    }

    var more = document.createElement('button');
    more.className = 'more';
    more.type = 'button';
    more.setAttribute('aria-label', it.name + ' 메뉴');
    more.innerHTML = dots3(false);

    top.appendChild(main); top.appendChild(info); top.appendChild(more);
    body.appendChild(top);

    if (editing === it.id){
      var form = document.createElement('div');
      form.className = 'edit';
      form.setAttribute('tabindex', '-1');
      var paxOpts = '';
      for (var pn = 1; pn <= 12; pn++) paxOpts += '<option value="' + pn + '">' + pn + '명</option>';
      var hOpts = hourOptions();
      var mOpts = '';
      for (var mm = 0; mm < 60; mm += 5) mOpts += '<option value="' + pad(mm) + '">' + pad(mm) + '</option>';
      form.innerHTML = '<div class="erow">'
        + '<label>시<select id="e-hour">' + hOpts + '</select></label>'
        + '<label>분<select id="e-min">' + mOpts + '</select></label>'
        + '<label class="grow">이름<input type="text" id="e-name"></label>'
        + '<label>인원<select id="e-pax">' + paxOpts + '</select></label>'
        + '</div>'
        + '<div class="erow memorow">'
        + '<label class="grow">메모<input type="text" id="e-memo" autocomplete="off" placeholder="창가석 요청, 인플루언서 …"></label>'
        + '</div>'
        + '<div class="ebtn"><button type="button" id="e-ok">저장</button>'
        + '<button type="button" id="e-no">취소</button></div>';
      body.appendChild(form);
      // 영업시간 밖이거나 5분 단위가 아닌 예약이면 그 값도 목록에 넣어준다
      var curH = it.time.slice(0,2), curM = it.time.slice(3,5);
      var hSel = form.querySelector('#e-hour'), mSel = form.querySelector('#e-min');
      function ensureOpt(sel, v){
        if ([].some.call(sel.options, function(o){ return o.value === v; })) return;
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        sel.insertBefore(o, sel.firstChild);
      }
      ensureOpt(hSel, curH); ensureOpt(mSel, curM);
      hSel.value = curH; mSel.value = curM;
      form.querySelector('#e-name').value = it.name;
      form.querySelector('#e-memo').value = it.memo || '';
      var paxSel = form.querySelector('#e-pax');
      if (it.pax > 12){
        var extra = document.createElement('option');
        extra.value = it.pax; extra.textContent = it.pax + '명';
        paxSel.appendChild(extra);
      }
      paxSel.value = it.pax;
      form.addEventListener('click', function(e){ e.stopPropagation(); });
      form.querySelector('#e-no').addEventListener('click', function(){
        keepSlotOpenForId(it.id);
        var anchor = editing;
        editing = null; renderAnchored(anchor); afterEditClose(anchor);
      });
      form.querySelector('#e-ok').addEventListener('click', function(){
        applyEdit(it.id,
          form.querySelector('#e-hour').value + ':' + form.querySelector('#e-min').value,
          form.querySelector('#e-name').value,
          form.querySelector('#e-pax').value,
          form.querySelector('#e-memo').value);
      });
      form.querySelector('#e-name').addEventListener('keydown', function(e){
        if (e.key === 'Enter') form.querySelector('#e-ok').click();
      });
      form.querySelector('#e-memo').addEventListener('keydown', function(e){
        if (e.key === 'Enter') form.querySelector('#e-ok').click();
      });
    } else if (openMenu === it.id){
      body.appendChild(buildMenu(it.id));
    }

    row.appendChild(body);
    return row;
  }

  // ⋯ 메뉴 (방문·취소·수정·삭제). rowEl 이 통째로 그릴 때도, tapMore 가 그 행에만 붙일 때도 쓴다.
  function buildMenu(id){
    var menu = document.createElement('div');
    menu.className = 'menu';
    function btn(label, action, status){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('data-list-action', action);
      if (status) b.setAttribute('data-status', status);
      if (action === 'delete') b.className = 'del';
      b.addEventListener('click', function(e){
        if (takeGhostClick(e)) return;
        e.stopPropagation();
        runMenuAction(id, action, status);
      });
      return b;
    }
    menu.appendChild(btn('방문', 'status', 'arrived'));
    menu.appendChild(btn('취소', 'status', 'cancelled'));
    menu.appendChild(btn('수정', 'edit'));
    menu.appendChild(btn('삭제', 'delete'));
    return menu;
  }
  // 열려 있는 ⋯ 메뉴 DOM 제거 (보통 하나지만 안전하게 전부)
  function closeRowMenu(){
    var ms = document.querySelectorAll('#list .menu');
    for (var i = 0; i < ms.length; i++) if (ms[i].parentNode) ms[i].parentNode.removeChild(ms[i]);
  }
  // 그 행에만 메뉴를 붙인다 (통째 render 안 함). 가려졌으면 같은 tick 에 스크롤 → 한 번에 나타남.
  function openRowMenu(id){
    closeRowMenu();
    var row = rowForId(id);
    if (!row){ render(); return; }   // 그 행이 DOM 에 없으면(접힌 시간대 등) 안전하게 통째로
    row.querySelector('.rbody').appendChild(buildMenu(id));
    roomScroll(row, true);
  }

  // "1530" "15:30" "15시30분" "15.30" → "15:30"
  function normTime(v){
    var s = String(v).replace(/\s/g,'');
    var m = s.match(/^(\d{1,2})[:.시]?(\d{1,2})?분?$/);
    if (!m) return null;
    var h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
    if (m[2] === undefined && s.length === 4){ h = +s.slice(0,2); mi = +s.slice(2); }
    if (h > 23 || mi > 59) return null;
    return pad(h) + ':' + pad(mi);
  }

  function uniqueId(time, name, pax, skipId){
    var base = time + '|' + name + '|' + pax, n = 0, id;
    do { n++; id = base + '|' + n; }
    while (state.items.some(function(x){ return x.id === id && x.id !== skipId; }));
    return id;
  }

  // 명단 맨 뒤로 보낼 때 쓸 다음 순번
  function nextSeq(){
    var m = 0;
    state.items.forEach(function(x){ if ((x.seq || 0) > m) m = x.seq || 0; });
    return m + 1;
  }

  function applyEdit(id, timeV, nameV, paxV, memoV){
    var it = find(id);
    if (!it) return;
    var originalTime = it.time;
    var time = normTime(timeV);
    var name = String(nameV).replace(/\s+/g,' ').trim();
    var pax = parseInt(paxV, 10);
    if (!time){ toast('시간을 확인해 주세요'); return; }
    if (!name){ toast('이름을 입력해 주세요'); return; }
    if (!(pax > 0)){ toast('인원을 확인해 주세요'); return; }

    var memo = String(memoV == null ? (it.memo || '') : memoV).replace(/\s+/g,' ').trim();

    if (time === it.time && name === it.name && pax === it.pax && memo === (it.memo || '')){
      keepSlotOpenForId(it.id);
      editing = null; render(); afterEditClose(it.id); return;
    }

    // 시간이 바뀌면 옮겨간 시간대의 맨 뒤로
    var timeMoved = time !== it.time;
    if (timeMoved) it.seq = nextSeq();

    var memoOnly = (time === it.time && name === it.name && pax === it.pax);
    logAdd(memoOnly ? '메모' : '수정',
      memoOnly ? (it.time + ' ' + it.name + (memo ? ' · ' + memo : ' · 메모 지움'))
               : (it.time + ' ' + it.name + ' → ' + time + ' ' + name + ' ' + pax + '명'));
    var oldId = it.id;
    it.time = time; it.name = name; it.pax = pax; it.memo = memo;
    it.id = uniqueId(time, name, pax, id);
    it.ts = Date.now();
    touched[originalTime] = Date.now();
    touched[time] = Date.now();
    armSlotCollapse(originalTime);
    if (timeMoved) armSlotCollapse(time);
    state.items.sort(sortItems);
    var anchor = editing;
    editing = null;
    if (timeMoved){
      render();                              // 자리가 달라지니 그냥 다시 그린다
      roomScroll(rowForId(it.id));           // 같은 프레임에 바로 그 행으로 (엉뚱한 위치가 안 보이게)
      if (keyboardOpen) afterEditClose(it.id, true);   // 키보드 내려간 뒤 레이아웃 최종 안정되면 한 번 더
    } else {
      renderAnchored(anchor);                // 제자리 수정이면 행이 안 튀게 보정
      afterEditClose(it.id);                 // 폼 접히며 하단이 바에 가리는 것 보정
    }
    if (it.id === oldId) writeItem(oldId, { memo: it.memo, ts: it.ts });   // 메모만 바뀜 (id 유지)
    else { delItem(oldId); putItem(it); }                                  // 시각·이름·인원 바뀜 = 다른 노드
    toast(it.time + ' ' + it.name + ' 수정됨');
  }

  function find(id){
    for (var i=0;i<state.items.length;i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  // 변경 내역 — 무슨 일이 있었는지만 남긴다 (되돌리기는 없다)
  var LOG_SHOW = 10;
  var LOG_KEEP = 40;
  var LOG_SCOPE = IS_DEV ? 'dev' : 'prod';
  var LOG_CACHE_KEY = 'ix-log-cache-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_KEY = 'ix-log-outbox-v1:' + LOG_SCOPE;
  var LOG_OUTBOX_PREFIX = LOG_OUTBOX_KEY + ':';
  var LOG_ID_PATTERN = /^[A-Za-z0-9_-]{8,80}$/;

  function readLogStore(key){
    try {
      var value = JSON.parse(localStorage.getItem(key) || '{}');
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    } catch(e){ return {}; }
  }
  function writeLogStore(key, value){
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e){ return false; }
  }
  function removeLogStore(key){
    try { localStorage.removeItem(key); return true; }
    catch(e){ return false; }
  }
  function validLogDate(ds){
    var m = String(ds || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return false;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
  }
  function cleanLogEntry(r, requireId){
    if (!r || typeof r !== 'object') return null;
    var at = Number(r.at);
    if (!isFinite(at) || at <= 0 || typeof r.t !== 'string' || typeof r.k !== 'string') return null;
    var id = r.id == null || r.id === '' ? '' : String(r.id);
    if ((requireId && !id) || (id && !LOG_ID_PATTERN.test(id))) return null;
    var clean = {
      at: at,
      t: r.t.slice(0, 16),
      k: r.k.slice(0, 40),
      s: (r.s == null ? '' : String(r.s)).slice(0, 500)
    };
    if (id) clean.id = id;
    return clean;
  }
  function cleanOutboxItem(id, item){
    // 변경 내역은 오늘 것만 유지 → 어제 이전으로 밀린 로그는 버린다 (어차피 화면에 안 뜸).
    if (!LOG_ID_PATTERN.test(id) || !item || !validLogDate(item.date) || item.date !== bizDate()) return null;
    var entry = cleanLogEntry(item.entry, true);
    if (!entry || entry.id !== id) return null;
    return { date: item.date, entry: entry };
  }
  function readLogOutbox(){
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++){
        var key = localStorage.key(i);
        if (!key || key.indexOf(LOG_OUTBOX_PREFIX) !== 0) continue;
        var id = key.slice(LOG_OUTBOX_PREFIX.length), item = null;
        try { item = cleanOutboxItem(id, JSON.parse(localStorage.getItem(key) || 'null')); } catch(e){}
        if (item) out[id] = item;
        else if (removeLogStore(key)) i--;
      }
    } catch(e){}
    return out;
  }
  function cleanLogCache(raw){
    var out = {};
    Object.keys(raw || {}).forEach(function(ds){
      if (!validLogDate(ds)) return;
      var rows = mergeLogRows([raw[ds]], LOG_KEEP);
      if (rows.length) out[ds] = rows;
    });
    return out;
  }

  var logCache = cleanLogCache(readLogStore(LOG_CACHE_KEY));
  var logOutbox = readLogOutbox();
  var logFlushActive = false;
  var logRetryTimer = null;
  var logRetryDelay = 3000;
  var logRetryAttempts = 0;
  var logUnwatch = null;
  var logWatchSerial = 0;

  function logEventId(){
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch(e){}
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12)
      + '-' + Math.random().toString(36).slice(2, 8);
  }
  // 같은 실제 이벤트(예: 한 예약의 자동 취소)를 여러 기기가 각각 기록해도 한 줄이 되도록,
  // 그 이벤트를 규정하는 문자열에서 결정적인 id 를 만든다. 두 기기가 같은 id 로 write → 덮임.
  function logKeyId(keyStr){
    var a = 5381, b = 52711;
    for (var i = 0; i < keyStr.length; i++){
      var c = keyStr.charCodeAt(i);
      a = (Math.imul(a, 33) ^ c) >>> 0;
      b = (Math.imul(b, 63689) ^ c) >>> 0;
    }
    function f(n){ return ('0000000' + n.toString(36)).slice(-7); }
    return 'ev' + f(a) + f(b);                 // 16자, LOG_ID_PATTERN 통과
  }
  function logIdentity(r){
    return r && r.id ? 'id:' + r.id
      : 'legacy:' + ((r && r.at) || 0) + '|' + ((r && r.k) || '') + '|' + ((r && r.s) || '');
  }
  function mergeLogRows(groups, limit){
    var seen = {}, all = [];
    (groups || []).forEach(function(rows){
      (Array.isArray(rows) ? rows : []).forEach(function(r){
        var clean = cleanLogEntry(r, false);
        if (!clean) return;
        var id = logIdentity(clean);
        if (seen[id]) return;
        seen[id] = 1;
        all.push(clean);
      });
    });
    all.sort(function(a, b){
      var byTime = (b.at || 0) - (a.at || 0);
      if (byTime) return byTime;
      var ai = logIdentity(a), bi = logIdentity(b);
      return ai < bi ? 1 : ai > bi ? -1 : 0;
    });
    return all.slice(0, limit);
  }
  function pendingLogRows(ds){
    return Object.keys(logOutbox).map(function(id){ return logOutbox[id]; })
      .filter(function(item){ return item && item.date === ds && item.entry; })
      .map(function(item){ return item.entry; });
  }
  function rememberLogRows(ds, rows){
    logCache[ds] = mergeLogRows([rows, logCache[ds], pendingLogRows(ds)], LOG_KEEP);
    writeLogStore(LOG_CACHE_KEY, logCache);
  }
  function persistLogOutboxItem(id, item){
    return !!cleanOutboxItem(id, item) && writeLogStore(LOG_OUTBOX_PREFIX + id, item);
  }
  function removeLogOutboxItem(id, expected){
    if (!expected || logOutbox[id] === expected){
      delete logOutbox[id];
      removeLogStore(LOG_OUTBOX_PREFIX + id);
    }
  }
  function warnLogPersistence(){
    setTimeout(function(){ toast('변경 내역 저장 실패'); }, 0);
  }
  function scheduleLogRetry(){
    if (logRetryTimer || !Object.keys(logOutbox).length || document.hidden || !online
        || logRetryAttempts >= 5) return;
    var wait = logRetryDelay;
    logRetryDelay = Math.min(logRetryDelay * 2, 60000);
    logRetryAttempts++;
    logRetryTimer = setTimeout(function(){
      logRetryTimer = null;
      flushLogOutbox();
    }, wait);
  }
  function wakeLogOutbox(){
    if (logRetryTimer){ clearTimeout(logRetryTimer); logRetryTimer = null; }
    logRetryDelay = 3000;
    logRetryAttempts = 0;
    flushLogOutbox();
  }
  function flushLogOutbox(){
    if (logFlushActive || !hasStore() || !fb().logSet) return;
    var ids = Object.keys(logOutbox);
    if (!ids.length) return;
    logFlushActive = true;
    var succeeded = 0;
    Promise.all(ids.map(function(id){
      var original = logOutbox[id];
      var item = cleanOutboxItem(id, original);   // 오늘 것이 아니면 null
      if (!item){
        removeLogOutboxItem(id, original);
        return Promise.resolve();
      }
      return Promise.resolve().then(function(){
        return fb().logSet(item.date, id, item.entry);
      }).then(function(){
        removeLogOutboxItem(id, original);
        succeeded++;
      }).catch(function(){});
    })).then(function(){
      logFlushActive = false;
      if (succeeded){ logRetryDelay = 3000; logRetryAttempts = 0; }
      if (Object.keys(logOutbox).length) scheduleLogRetry();
    }).catch(function(){
      logFlushActive = false;
      scheduleLogRetry();
    });
  }
  function purgeOldLocalLogs(limit){
    var cacheChanged = false;
    Object.keys(logCache).forEach(function(ds){
      if (!validLogDate(ds) || ds < limit || ds > bizDate()){
        delete logCache[ds]; cacheChanged = true;
      }
    });
    Object.keys(logOutbox).forEach(function(id){
      var item = logOutbox[id];
      if (!cleanOutboxItem(id, item) || item.date < limit){
        removeLogOutboxItem(id, item);   // 개별 키 삭제까지 여기서 처리
      }
    });
    if (cacheChanged) writeLogStore(LOG_CACHE_KEY, logCache);
  }

  // key 를 주면 그 이벤트의 id 가 결정적이 된다 (여러 기기의 중복 기록이 한 줄로 합쳐짐).
  // 안 주면 랜덤 id — 동시 중복이 있을 수 없는 이벤트(예약 추가·삭제·메모·명단 등록 등)용.
  function logAdd(kind, what, key){
    var sn = serverNow(), p = kstParts(sn);   // 서버 시계 — 폰마다 시각이 달라도 로그 순서·표시 일관
    var entry = cleanLogEntry({
      id: key ? logKeyId(key) : logEventId(),
      at: sn,
      t: pad(p.h) + ':' + pad(p.min),
      k: kind,
      s: what || ''
    }, true);
    var item = { date: viewDate, entry: entry };
    logOutbox[entry.id] = item;
    var durable = persistLogOutboxItem(entry.id, item);
    if (!durable){
      removeLogStore(LOG_CACHE_KEY);             // 로그 캐시만 비워 공간을 만든 뒤 한 번 더
      durable = persistLogOutboxItem(entry.id, item);
    }
    rememberLogRows(viewDate, [entry]);
    if (!durable) warnLogPersistence();
    logRetryDelay = 3000;
    logRetryAttempts = 0;
    flushLogOutbox();
  }

  function logRows(fetched){
    return mergeLogRows([fetched, logCache[viewDate], pendingLogRows(viewDate)], LOG_SHOW);
  }

  function stopLogWatch(){
    logWatchSerial++;
    if (logUnwatch){
      try { logUnwatch(); } catch(e){}
      logUnwatch = null;
    }
  }
  function startLogWatch(forDate){
    stopLogWatch();
    if (!hasStore()) return;
    var api = fb();
    var serial = ++logWatchSerial;
    function apply(rows){
      if (serial !== logWatchSerial || viewDate !== forDate
          || sheetScrim.classList.contains('hide')
          || document.getElementById('sheetTitle').textContent !== '최근 변경 내역') return;
      rememberLogRows(forDate, rows || []);
      document.getElementById('sheetBody').innerHTML = logHtml(logRows(rows || []));
    }
    function failed(){
      if (serial === logWatchSerial && !sheetScrim.classList.contains('hide')){
        toast('동기화 실패 — 연결되면 자동 재시도');
      }
    }
    if (api.logWatch){
      try { logUnwatch = api.logWatch(forDate, apply, failed) || null; }
      catch(e){ failed(); }
      return;
    }
    if (api.logGet) api.logGet(forDate).then(apply).catch(failed);
  }

  window.addEventListener('storage', function(e){
    if (!e.key || e.key.indexOf(LOG_OUTBOX_PREFIX) !== 0) return;
    var id = e.key.slice(LOG_OUTBOX_PREFIX.length);
    if (!e.newValue){ delete logOutbox[id]; return; }
    var item = null;
    try { item = cleanOutboxItem(id, JSON.parse(e.newValue)); } catch(error){}
    if (!item){ removeLogStore(e.key); return; }
    logOutbox[id] = item;
    rememberLogRows(item.date, [item.entry]);
    wakeLogOutbox();
  });

  function logHtml(rows){
    if (!rows.length) return '<p class="sheetMsg">변경 내역이 없습니다</p>';
    return rows.map(function(r){
      var cls = r.k === '방문' ? ' go'
              : (r.k === '취소' || r.k === '자동 취소' || r.k === '삭제' || r.k === '명단 초기화') ? ' off' : '';
      return '<div class="lgrow"><span class="lgt">' + esc(r.t) + '</span>'
        + '<span class="lgk' + cls + '">' + esc(r.k) + '</span>'
        + '<span class="lgs">' + esc(r.s || '') + '</span></div>';
    }).join('');
  }

  function toggle(id){
    var it = find(id);
    if (!it) return;
    setStatus(id, it.status === 'arrived' ? 'pending' : 'arrived');
  }
  // 바뀐 행과 그 시간대 머리글만 손본다. 요소를 새로 만들지 않고 내용만 고친다.
  // 실패하면 false 를 돌려주고 호출한 쪽이 통째로 다시 그린다.
  function patchStatus(it){
    var row = rowForId(it.id);
    if (!row) return false;

    row.className = 'row ' + it.status;
    var chk = row.querySelector('.check');
    if (chk) chk.innerHTML = it.status === 'arrived' ? ICON_GO
                           : it.status === 'cancelled' ? ICON_OFF : '';
    closeRowMenu();   // 부분 갱신이라 다른 행에 열려 있던 ⋯ 메뉴 DOM 이 남는다 — 지운다
    var info = row.querySelector('.info');
    var old = info.querySelector('.tag');
    if (old) old.parentNode.removeChild(old);
    var html = statusTag(it.status);
    if (html){
      var box = document.createElement('div');
      box.innerHTML = html;
      info.insertBefore(box.firstChild, info.querySelector('.pax'));
    }

    // 시간대 머리글 숫자
    var grp = row.closest('.group');
    if (grp && state){
      var mine = itemsAt(it.time);
      var man = collapsed[it.time];
      if (man && man.done !== (tallyStatus(mine).pend === 0)) delete collapsed[it.time];
      var meta = grp.querySelector('.gmeta');
      if (meta) meta.innerHTML = slotMetaHtml(mine);
      grp.setAttribute('data-time', it.time);
    }
    repaintNow();
    paintHead();
    return true;
  }

  var EDIT_FIELDS = ['e-hour','e-min','e-name','e-pax','e-memo'];
  function readEditDraft(row){
    return row ? EDIT_FIELDS.map(function(id){ var f = row.querySelector('#' + id); return f ? f.value : null; }) : null;
  }
  function writeEditDraft(row, draft){
    if (!row || !draft) return;
    EDIT_FIELDS.forEach(function(id, i){
      var f = row.querySelector('#' + id);
      if (f && draft[i] !== null) f.value = draft[i];
    });
  }
  function slotEl(time){ return document.querySelector('.group[data-time="' + time + '"]'); }

  // 시간대 접기 / 펼치기
  function toggleSlot(time){
    if (!state) return;
    var mine = itemsAt(time);
    if (!mine.length) return;
    var editDraft = editing ? readEditDraft(rowForId(editing)) : null;
    var grp = slotEl(time);
    var willShut = !(grp && grp.classList.contains('shut'));
    if (willShut){        // 접을 때는 그 시간대에서 열려 있던 수정 폼·메뉴를 닫는다
      var inHere = function(id){ return mine.some(function(x){ return x.id === id; }); };
      if (editing && inHere(editing)) editing = null;
      if (openMenu && inHere(openMenu)) openMenu = null;
    }
    openMenu = null;
    setCollapsed(time, willShut, tallyStatus(mine).pend === 0);
    render();
    if (editing) writeEditDraft(rowForId(editing), editDraft);
    if (!willShut) roomScroll(slotEl(time), true);   // 펼친 시간대가 길어 가려지면 부드럽게 맞춰 보여준다
  }

  // 「지금 시간대」가 어디인지 다시 계산해서 시간대 색과 왼쪽 막대를 맞춘다
  function repaintNow(){
    if (!state) return;
    var gs = groupByTime(state.items.slice().sort(sortItems));
    var nowTime = liveNowTime(gs);
    gs.forEach(function(g){
      var w = slotEl(g.time);
      if (!w) return;
      var pend = tallyStatus(g.items).pend > 0;
      var shut = w.classList.contains('shut');
      w.className = 'group' + (g.time === nowTime ? ' now' : (pend ? '' : ' done')) + (shut ? ' shut' : '');
    });
  }

  function setStatus(id, st){
    var it = find(id);
    if (!it) return;
    if (it.status !== st){
      var kind = st === 'arrived' ? '방문' : st === 'cancelled' ? '취소' : '체크 해제';
      // 두 직원이 같은 행을 동시에 눌러도 한 줄. 2분 단위로 묶어 나중의 재-토글은 별도 줄로.
      // 버킷은 '서버 시계' 기준 — 두 폰 시각이 몇 분 달라도 같은 버킷 → 같은 id → 한 줄.
      logAdd(kind, it.time + ' ' + it.name,
             'st:' + id + ':' + st + ':' + Math.round(serverNow() / 120000));
    }
    var ts = Date.now();
    it.status = st;
    it.ts = ts;
    keepSlotOpenForId(id);
    openMenu = null;
    var patched = patchStatus(it);
    if (!patched){
      if (interactionActive()) backgroundRenderPending = true;
      else render();
    } else if (backgroundRenderPending && !interactionActive()) render();
    writeItem(id, { status: st, ts: ts });
  }

  /* ---------- 명단 등록 ---------- */
  var pasteHint = document.getElementById('pasteHint');
  var HINT_OK = '양식에 맞게 붙여넣어 주세요.';
  var HINT_BAD = '표시된 줄을 양식에 맞게 고쳐 주세요.';
  var hl = document.getElementById('hl');
  var taEl = document.getElementById('ta');
  var marking = false;   // 오류 표시 중인지

  function esc(t){
    return String(t).replace(/[<>&]/g, function(c){ return { '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]; });
  }
  // 입력칸 높이는 창을 열 때 한 번만 정한다 (내용·키보드·오류와 무관).
  // → 등록 버튼이 늘 같은 자리 (버튼 씹힘 방지). 넘치는 줄은 입력칸 안에서 스크롤.
  var taFixedH = 0;
  function pasteBaseH(){
    var vh = window.innerHeight || 700;
    // 스크롤 없이 약 9.5줄(줄높이 26.4 + 안쪽 여백 22 ≈ 273). 키보드가 올라와도
    // 카드 전체가 그 위에 들어가도록. 작은 화면에선 화면 비율로 더 줄인다.
    return Math.min(273, Math.max(200, Math.round(vh * 0.46) - 43));
  }
  var twEl = taEl.parentElement;   // .tawrap = 높이 고정 틀
  // 입력칸 높이를 창 열 때 정한 값으로 고정한다 (내용이 늘어도 안 커진다 = 등록 버튼 안 밀림).
  function fixTaHeight(){
    if (!taFixedH) taFixedH = pasteBaseH();
    twEl.style.height = taFixedH + 'px';   // textarea 는 CSS 로 inset:0 → 외부 크기 항상 동일
    syncHl();
  }

  // .hl 은 textarea 위에 겹쳐 있고 스크롤을 안 한다. 안쪽 .hlmove 를 textarea.scrollTop 만큼
  // transform 으로 밀어 글자 위치를 맞춘다 (transform 은 합성 단계라 부드럽고 클램프 안 됨).
  function syncHl(){
    var m = hl.firstElementChild;
    if (m) m.style.transform = 'translateY(' + (-taEl.scrollTop) + 'px)';
  }
  var syncRaf = 0;
  function syncLoop(on){
    if (!on){ if (syncRaf) cancelAnimationFrame(syncRaf); syncRaf = 0; return; }
    if (syncRaf) return;
    (function step(){
      syncHl();
      syncRaf = marking ? requestAnimationFrame(step) : 0;
    })();
  }
  taEl.addEventListener('scroll', syncHl, { passive: true });

  // 예시 문구는 .hl 오버레이에 직접 그린다 (iOS <textarea> 여러 줄 placeholder 버그 회피).
  var PH_LINES = ['14:00 임동현 2명','15:00 김동현 4명 방문','15:00 박동현 2명','17:00 Donghyun Lee 3명 취소','19:00 송동현 5명'];
  function renderHl(){

  /* ---------- 키보드 ---------- */
  // body 는 화면 전체 크기로 고정 (CSS position:fixed inset:0). 키보드는 그 위에 얹힌다.
  // JS 가 하는 일은 딱 둘: (1) --kb = 키보드가 가리는 높이 → .wrap 아래 여백 + 시트 올림
  //                        (2) 키보드 열림 감지 → body.keyboard-open (하단 바 숨김)
  var vv = window.visualViewport;
  var keyboardOpen = false;

  function textKeyboardTarget(el){
    return !!el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT');
  }
  function visibleViewportH(){
    return vv ? Math.round(vv.height) : Math.round(window.innerHeight || 0);
  }

  var KB_MIN = 90;                       // 이보다 크게 줄면 키보드로 본다
  var kbBaseH = visibleViewportH();      // 키보드가 없을 때의 기준 높이

  function applyViewport(){
    var h = visibleViewportH();
    // 키보드가 가리는 원(raw) 높이 — 아래 pendingClose(키보드 다 내려감) 판정에 쓴다
    var kb = Math.max(0, Math.round((window.innerHeight || 0) - h));

    // 키보드 열림 = visualViewport 높이가 KB_MIN 이상 줄어든 상태.
    //  · 새로 "열림"이 되려면 입력칸이 실제로 포커스돼 있어야 한다 — 백그라운드에서
    //    복귀할 때 iOS 가 잠깐 낮은 높이를 보고해도(전환 애니메이션) 하단 바가
    //    사라지지 않게. (2주에 두 번 "복귀 후 하단 바 없음" 신고 → 이게 원인)
    //  · 이미 열려 있었으면 높이 감소만으로 유지 — 저장 시 입력칸이 DOM 에서
    //    사라져도 키보드 내려가는 애니메이션 동안은 "열림"을 지켜, 레이아웃이
    //    두 번 튀지 않게 한다.
    var shrunk = (kbBaseH - h) > KB_MIN;
    var open = shrunk && (keyboardOpen || textKeyboardTarget(document.activeElement));
    // 바텀시트 올림·토스트 위치용 — 실제 키보드일 때만. 복귀 시 iOS 의 잘못된
    // 낮은 높이가 .wrap 아래를 밀지 않게 (하단 바는 위 open 가드가 지킨다).
    document.documentElement.style.setProperty('--kb', (open ? kb : 0) + 'px');
    if (open !== keyboardOpen){
      keyboardOpen = open;
      document.body.classList.toggle('keyboard-open', open);
      if (addPanel) addPanel.classList.toggle('kb', open);
      // 폼이 아직 열려 있으면 키보드 내려간 직후 한 번 화면에 맞춘다 (즉시 — 키보드 꼬리와 안 겹치게).
      if (!open && editing) roomScroll(rowForId(editing));
    }
    // 저장/취소로 폼이 닫혔으면, 키보드가 완전히 내려앉아(--kb 0) 레이아웃이 멈춘 뒤
    // 딱 한 번 스크롤한다. 전환 시점(KB_MIN)은 아직 키보드가 90px 남아 흔들린다.
    if (!open && kb === 0 && pendingClose){
      var pc = pendingClose; pendingClose = null;
      requestAnimationFrame(function(){ scrollAfterClose(pc); });
    }
    // 키보드가 없을 때의 안정된 높이를 기준으로 유지 (아이폰이 늦게 늘려줘도 따라감)
    if (!open) kbBaseH = Math.max(kbBaseH, h);

    // 키보드가 올라와 있을 때 iOS 가 .wrap 을 유효 범위 밖으로 스크롤해두는 경우가 있다
    // (화면이 과하게 올라감 → 손으로 스크롤해야 풀림). 매번 유효 범위로 되돌린다.
    // scrollTop 을 코드로 set 하면 iOS 도 다시 클램프한다 (손 스크롤과 같은 효과).
    if (open && wrapEl){
      var maxST = wrapEl.scrollHeight - wrapEl.clientHeight;
      if (wrapEl.scrollTop > maxST + 1) wrapEl.scrollTop = Math.max(0, maxST);
    }
  }

  var scrim = document.getElementById('scrim');

  document.addEventListener('click', function(e){

  // 체크와 ⋯ 는 손을 뗄 때(pointerup) 직접 처리한다.
  // click 에 맡기면 누른 뒤 화면이 다시 그려졌을 때 브라우저가 탭을 없던 일로 만든다.
  // 대신 손가락이 밀렸으면(스크롤) 무시해서 잘못 눌리는 건 오히려 더 엄격하다.
  var SLOP = 12, HOLD = 900;
  var tapInfo = null, ghostClick = null;

  // 손 뗄 때 처리하면 브라우저가 곧이어 click 을 한 번 더 보낸다.
  // 그 사이에 화면이 바뀌면 엉뚱한 버튼(예: 삭제) 위에 손가락이 놓여 눌릴 수 있다.
  // 우리가 이미 처리한 탭이므로 뒤따르는 click 은 버린다.
  function takeGhostClick(e){
    if (!ghostClick) return;
    if (Date.now() > ghostClick.until){ ghostClick = null; return; }
    if (Math.abs(e.clientX - ghostClick.x) > SLOP ||
        Math.abs(e.clientY - ghostClick.y) > SLOP) return;
    ghostClick = null;             // 같은 손가락에서 뒤따라온 click 한 번만 버린다
    e.preventDefault();
    e.stopPropagation();
    return true;
  }
  document.addEventListener('click', function(e){

  }, true);
  var listEl = document.getElementById('list');

  listEl.addEventListener('pointerdown', function(e){
    tapInfo = null;

    if (!m) return;

      id: row.getAttribute('data-id'),
      kind: action ? 'menu' : (m.classList.contains('more') ? 'more' : 'main'),
      action: action,
      status: m.getAttribute('data-status'),
      x: e.clientX, y: e.clientY, at: Date.now(), pid: e.pointerId
    };
  });

  listEl.addEventListener('pointerup', function(e){
    var t = tapInfo; tapInfo = null;
    if (!t || e.pointerId !== t.pid) return;
    if (Math.abs(e.clientX - t.x) > SLOP || Math.abs(e.clientY - t.y) > SLOP) return;  // 밀었으면 취소
    if (Date.now() - t.at > HOLD) return;                                              // 오래 눌렀으면 취소
    ghostClick = { x: e.clientX, y: e.clientY, until: Date.now() + 600 };
    if (t.kind === 'slot'){
      toggleSlot(t.slot);
      return;
    }
    if (!find(t.id)) return;
    if (t.kind === 'menu') runMenuAction(t.id, t.action, t.status);
    else if (t.kind === 'more') tapMore(t.id);

        if (axis === 'y'){ endDrag(false); return; }

      drawerScrim.style.opacity = String(Math.max(0, 1 + dx / w));

      dragging = false; axis = null;
      drawer.style.transition = '';
      if (commit) closeDrawer();
      drawer.style.transform = '';
      drawerScrim.style.opacity = '';

  function rltSteps(n, winner, from){

    if (steps > RLT_STEP_CAP) steps -= n;   // 22칸 초과면 한 바퀴 덜 돌아 착지 (n ≤ 22 면 항상 ≥ 1)

  }

  function backupSheetHtml(map){
    var snaps = [], days = [];
    Object.keys(map || {}).forEach(function(k){
      var e = map[k];
      if (!e || !e.items || !e.items.length) return;
      (e.kind === 'day' ? days : snaps).push({ key: k, e: e });
    });
    snaps.sort(function(a, b){ return (b.e.at || 0) - (a.e.at || 0); });
    days.sort(function(a, b){ return a.key < b.key ? 1 : -1; });   // 최근 날짜 먼저
    if (!snaps.length && !days.length) return '<p class="sheetMsg">지난 명단이 없습니다</p>';
    var html = '<div class="bklist">';
    if (snaps.length){
      html += '<div class="bkgroup">오늘</div>';
      snaps.forEach(function(r){ html += bkRowHtml(r.key, backupWhen(r.e.at), r.e); });
    }
    if (days.length){
      html += '<div class="bkgroup">어제</div>';
      days.forEach(function(r){
        var d = r.key.split('-');
        html += bkRowHtml(r.key, (+d[1]) + '/' + (+d[2]), r.e);   // 라벨이 '어제' 니 행엔 날짜만

  function bkRosterHtml(items){

    return groupByTime(list.slice().sort(sortItems)).map(function(g){

  function loadPastRosters(){

      var its = (r.items || []).filter(function(it){ return it && it.id && it.time; });

      var out = {}; out[d] = { kind: 'day', date: d, at: parseYmd(d).getTime(), n: its.length, items: its };

    var slow = setTimeout(function(){ if (!settled) show('<p class="sheetMsg">불러오는 중…</p>'); }, 300);
